l_japanese:
 notification_nemo_appears_notification_name: "消えた王子"
 notification_nemo_appears_notification_desc: "[concept_princely_state]が併合され、継ぐべき国を失った若き王子が姿を消しました。東インド会社の駐在官によれば、王子は夕暮れどきに造船所へ向かったきり、戻らなかったとか。"
 nemo_events.2.t: "インディアマンの沈没"
 nemo_events.2.d: "[SCOPE.GetRootScope.GetCountry.GetAdjective]の商船が、[SCOPE.sState('nemo_coast_state_scope').GetName]沖の外洋で沈没した。生きて岸にたどり着いた者たちによれば、水平線には帆影ひとつ見えなかったのに、船が何の前触れもなく沈みはじめたという。"
 nemo_events.2.d_repeat: "ヨーロッパ行きの商船が、またしても[SCOPE.sState('nemo_coast_state_scope').GetName]沖で消息を絶った。"
 nemo_events.2.f: "「海は専制君主のものではない。だが波の上では、人は今なお不当な法を振りかざし、争い、互いに引き裂き合い——陸と変わらない惨禍に翻弄されている」\n\n—ジュール・ヴェルヌ、『#italic 海底二万里#!』"
 nemo_events.2.a: "人の心は、超自然の存在という壮大な空想に惹かれるものだ。"
 nemo_events.2.b: "我々の艦隊が通商航路を守ることを、東インド会社の取締役会に請け合おう。"
 nemo_patrol_promise_tt_a: "[GetGeographicRegion('geographic_region_india').GetName]周辺の[Concept('concept_shipping_lane','$concept_shipping_lanes|q$')]を通る[Concept('concept_supply_ship','$concept_supply_ships|q$')]を、我々の[concept_fleet]で護衛すると約束した"
 nemo_patrol_promise_tt_b: "@warning! 襲撃者が次に現れた際、護衛にあたっている[concept_fleet]がいなければ、国民の不満を招くことになる"
 nemo_events.3.t: "水に書かれた約束"
 nemo_events.3.d: "海は凪ぎ、風にも恵まれていたというのに、またしても商船団が海に呑まれた。時事に関心を寄せる人々は、責務を果たさない取締役会に激しい憤りを募らせている。"
 nemo_events.3.f: "「海の深淵は、我々にとってまったくの未知の世界だ。測深の錘さえ届かない。その遥かな深みで何が起こっているのか——海面下12マイル、あるいは15マイルもの深さに、どんな生き物が棲み、そもそも生きていられるのか…我々には推し量ることさえ難しい」\n\n—ジュール・ヴェルヌ、『#italic 海底二万里#!』"
 nemo_events.3.a: "人の定めた法には抗えても、自然の法に逆らうことはできない。"
 nemo_events.4.t: "沿岸に向けられた砲口"
 nemo_events.4.d: "長年にわたり我が国の商船隊の乗組員たちを震え上がらせてきた謎の存在が、ついに我が国の沿岸へと矛先を向け、その姿を現した。海中から浮かび上がったのは、鉄でできた異形の巨獣だった。その怪物が我が国の港に砲撃を浴びせたのだ！怪物が進んだ沿岸には煙の柱が次々と立ち上り、何マイルも離れた内陸からも見えるほどだ。"
 nemo_events.4.f: "「今こうして筆を執っているあいだも、あのときの記憶はなお鮮明で、思わず恐怖にとらわれ、息さえできなくなるような気がする」\n\n — ジュール・ヴェルヌ、『#italic 海底二万里#!』"
 nemo_events.4.a: "接近して乗り込め。可能なら、あれを無傷で拿捕するのだ。"
 nemo_events.4.b: "あれには近づくな。遠距離から砲撃して沈めろ。"
 nemo_events.4.c: "あれに差し向けられる海上戦力はない。砲声が止むのを待ち、それから被害を確認せよ。"
 nemo_unopposed_bombardment_tt: "立ちはだかる戦隊はなく、#b ノーチラス号#!は思うがままに沿岸を砲撃する"
 nemo_squadron_damage_heavy_tt: "交戦する戦隊の全艦が、接近する際の砲火の応酬によって#b 甚大な損害#!を被る"
 nemo_squadron_damage_light_tt: "交戦する戦隊は、遠距離から砲火を交えるなかで#b 多少の損害#!を被る"
 nemo_nautilus_captured_tt: "#b ノーチラス号#!は無傷で拿捕され、東インド会社の艦船名簿に名を連ねる。我が国の潜水艦隊において、その姿を模した艦船が使用可能になる"
 nemo_nautilus_sunk_tt: "#b ノーチラス号#!は船体を引き裂かれ、船長もろとも海の底へ沈む"
 nemo_nautilus_escaped_tt: "#b ノーチラス号#!は煙に紛れて波の下へと姿を消し、二度と見つかることはない"
 nemo_events.5.t: "旗もなく、国もなく"
 nemo_events.5.d: "襲撃は止んだ。インド洋の至るところに絶えず潜んでいるかに思えた脅威は去った。今はただ、凪いだ海に穏やかな波が静かに打ち寄せるばかりだ。"
 nemo_events.5.f: "「海こそがすべてだ。地球の表面の7割を覆い、その息吹は清らかで健やかだ。海は果てしない砂漠だが、そこでは誰も孤独ではない。至るところに生命の躍動を感じるからだ。海は超自然の驚異を体現する存在であり、愛と感動そのものだ。ある詩人の言葉を借りれば、まさに『生ける無限』なのだ」\n\n—ジュール・ヴェルヌ、『#italic 海底二万里#!』"
 nemo_events.5.a: "雷鳴がなければ、人は稲妻をさほど恐れはしないだろう。"
 nemo_becomes_agitator_tt: "ネモ船長が[concept_agitator]として[concept_exile]となる。"
 nemo_nautilus_ship_name: "ノーチラス号"
 ship_graphics_type_nautilus: "ノーチラス号"
 ship_graphics_type_nautilus_desc: "「#italic ノーチラス号#!に乗る者は、決して恐れにひるむことはない。船の欠陥を心配する必要もない…ひとたび海中に潜れば、そこには完璧な静寂があるのだから。どうです！これこそ理想の船ではありませんか！」\n\n—ジュール・ヴェルヌ、『#italic 海底二万里#!』"
 nemo_dies_tt: "[SCOPE.sCharacter('nemo_scope').GetFullName]が死亡する"
 nemo_shipping_losses: "襲撃者による損失"
 nemo_promised_protection: "護衛下の船団"
 nemo_broken_promise_country: "空約束"
 nemo_broken_promise_IG: "$nemo_broken_promise_country$"
 nemo_scourge_ended: "災厄の終焉"
 nemo_nautilus_captured: "ノーチラス号の拿捕"
 notification_nemo_nautilus_captured_notification_name: "ノーチラス号の拿捕"
 notification_nemo_nautilus_captured_notification_desc: "苦戦の末、強襲部隊は自沈を許さず潜水艇を制圧しました。この技術の結晶は、今や我々のものとなりました！"
 notification_nemo_nautilus_sunk_notification_name: "ノーチラス号の撃沈"
 notification_nemo_nautilus_sunk_notification_desc: "潜水艇は喫水線下を引き裂かれ、乗組員もろとも海の底へ沈みました。引き揚げられたものは何ひとつなく、陸での尋問のために連れ帰るべき生存者も、誰ひとりとしていませんでした。"
 notification_nemo_nautilus_escaped_notification_name: "ノーチラス号の逃走"
 notification_nemo_nautilus_escaped_notification_desc: "潜水艇は波の下へと潜ったまま、二度と浮かび上がってきませんでした。その行く末は誰も知りません。"
