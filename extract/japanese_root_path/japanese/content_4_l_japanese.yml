l_japanese:
 je_dynamite: "爆発的な成長を遂げる産業"
 je_dynamite_reason: "ダイナマイトは非常に危険ですが、とても役に立つ物品でもあります。いずれにせよ、産業や軍事セクターの需要に見合うよう我が国はダイナマイトの製造を増やすべきでしょう。"
 dynamite_production_modifier: "爆薬生産"
 mining_production_modifier: "採鉱産出"
 munitions_production_modifier: "弾薬生産"
