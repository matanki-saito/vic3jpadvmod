 je_shortform_building_chemical_plant_tooltip: "施設は$building_explosives_factory$です"
 je_shortform_building_mine_tooltip: "建設とはすなわち鉄、石炭、鉛、または硫黄の鉱山である"
 je_combustion_engines: "公共交通機関"
 je_combustion_engines_reason: "個人所有の交通手段がその物珍しさから人々の関心を集めています。これを受けて多くの国民が、政府は公共交通機関を犠牲にして、市民に個人の輸送手段を提供することに注力すべきだと考えるようになってきています。"
 motor_industry_production_modifier: "発動機産業生産"
 public_trasportation_modifier: "公共交通機関"
 je_elevator: "状況を向上"
 je_elevator_reason: "近年エレベーターが登場したことで、この素晴らしい新発明を少しでも多くの施設に導入しようという動きが広がっています。問題はそれを実現するほどの経済的余裕が我が国にあるかどうかです。エレベーターの建設や導入に必要となる商品の生産量が増えるように努力すべきでしょう。"
 elevator_services_production_modifier: "稼働数増加"
 elevator_goods_production_modifier: "増加した商品"
 je_mutual_funds: "公開取引"
 je_mutual_funds_reason: "新しいタイプの投資信託によって、企業は資金をこれまでより調達しやすくなります。出来る限り多くの金融街にこれらの新しい手法を活用させ、資本家のために利益を生み出させるように努めるべきです。"
 mutual_funds_pop_attaction_modifier: "上昇した支持率"
 is_production_building: "すべての非政府生産施設"
