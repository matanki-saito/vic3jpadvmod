 is_plantation_building: "農園施設"
 is_raw_industries_building: "原材料産業"
 #Journal Entry Production Events
 production_tech_events.102.t: "爆発的需要"
 production_tech_events.102.d: "より安定した[SCOPE.sGoods('explosives_goods').GetName]の開発により、爆薬の需要が上昇している。我々の生産物を確保するために、我が国の軍部と産業部門は入札合戦を繰り広げている。"
 production_tech_events.102.f: "「民生用だと？それは本当か？民間企業がダイナマイト2,000トンを何に使うんだ？」主計総監は書類を胸に抱え、落ち着かない様子で歩き回った。「ダイナマイト2,000トンがあれば砲兵隊を1年間稼働できるし、倉庫を弾薬で満たすこともできる量だ」\n\n事務官は言葉を選びながら答えた。「申し上げにくいのですが、爆薬の価格が高騰しておりまして、現在の予算では必要量のごくわずかしか購入できません」\n\nこれを聞いた主計総監は、背に腹は代えられずにこう言った。「注文して金額を教えろ。内閣に倍額を請求してやろう」"
 production_tech_events.102.a: "供給量を増やせば、すべてがうまくいく。"
 production_tech_events.102.b: "産業部門なら有効活用してくれるだろう。"
 production_tech_events.102.c: "軍部は必要量を確保すべきだ。"
 production_tech_events.103.t: "空転するエンジン"
 production_tech_events.103.d: "自動車輸送の発明と実用化により、新たな疑問が生じている。公共交通機関と個人の交通手段、どちらに焦点を当てればいいのだろう？"
 production_tech_events.103.f: "「どうして私が臭い農民と一緒にバスや列車を利用しなければならないのか。私は自分だけの輸送手段を持つべきなのだ」\n\n「国内における移動速度は一握りの金持ちの手に委ねらるべきではない。我々は貧者の存在を忘れてはならないのだ」"
 production_tech_events.103.a: "もっと自動車が必要だ！"
 production_tech_events.103.b: "もっと公共交通機関が必要だ！"
 #Journal Entry Society Events
 society_tech_events.104.t: "さらなる高みへ"
 society_tech_events.104.d: "エレベーターが登場し、日々の生活に導入されたことで、今後は増加した産業による恩恵を享受できるようになります。"
 society_tech_events.104.f: "「最上階まで登ってずっと下まで降りてくれる。エレベーターなら最上階のフロアまで簡単に行けるというのにどうして階段を10段も20段も登るんだ」\n\n「将来的には何百階建てという高層ビルが建てられるだろう。空も我々のものになるさ」"
 society_tech_events.104.a: "産業の増強を維持する。"
 society_tech_events.104.b: "市民への必需品供給を維持する。"
 society_tech_events.105.t: "相互利益"
 society_tech_events.105.d: "上場企業が増えた今、今後は次のステージを考えていく必要があります。"
 society_tech_events.105.f: "「何が問題なのかわからない。お金が増えて何が悪いんだ？もっとお金がもらえると言われたら、いらないと断るのか？」\n\n「お金が増えるのが問題ではなく、誰のお金が増えているのかが問題なんだ。金持ちがさらに裕福になっているようじゃないか」"
 society_tech_events.105.a: "これは我々の政策に影響を及ぼすかもしれない。"
 society_tech_events.105.b: "これは別の機会に使おう。"
