 #Republic of Hawaii Events/JE
 hawaii_events.1.t: "王の死"
 hawaii_events.1.d: "国王の死後、現地の企業経営者や外務大臣たちはハワイにおける影響力を高めようと躍起になっている。"
 hawaii_events.1.f: "「今のところ我々は独立を維持することが出来ているが、腹を空かせた列強が物欲しそうな目で我々を見つめ、飛びかかる瞬間を今か今かと待っているのだ。そして私はその瞬間が急速に近づいてきているのではと危惧している」"
 hawaii_events.1.a: "独立を維持するために段階を踏む必要がある。"
 hawaii_events.2.t: "我が国の地盤を固める"
 hawaii_events.2.d: "我々の強さが証明され、現地の企業経営者から信頼を勝ち取ったことで、今後は国際社会における地位向上に目を向けることができる。"
 hawaii_events.2.f: "「ハワイの支配のみを目論む連中に我々の決意を思い知らせてやった。確かに我々は強くなったが、それでもまだ森の中から出ていないのだ」"
 hawaii_events.2.a: "最悪の事態はすぐ後ろまで迫っている。"
 hawaii_events.2.b: "不誠実な連中を国外追放せよ。"
 hawaii_events.3.t: "異国のクーデター"
 hawaii_events.3.d: "[SCOPE.sCountry('hawaiian_coup').GetName]の企業経営者と大使たちによる合同勢力が統率する現地自衛団と抗議者グループが政府の乗っ取りに成功し、現在、国の併合を求めて請願を行っています。"
 hawaii_events.3.f: "「今、我々の独立と自由が危機に瀕している。我々はなすすべもなく[SCOPE.sCountry('hawaiian_coup').GetNameNoFormatting]の足元に跪き、与えられる新たな現実を受け入れるほかないのだ。我々の国家自体が人質にとられている！」"
 hawaii_events.3.a: "どんな経緯でこんなことに？"
 hawaii_events.4.t: "ハワイの領土"
 hawaii_events.4.d: "ハワイ大使の協力を得た現地の企業経営者は、地方政府に対してクーデターを起こし、他国がこの状況に乗じてなんらかの行動を起こす前に、我が国によって島国が併合されることを要求している。"
 hawaii_events.4.f: "「ハワイは太平洋の要です。今や我が国がこの島々の未来をコントロールできるようになったので、制海権も手に入れることができました。地域全体の交易活動をより一層促進されることが可能になります」"
 hawaii_events.4.a: "島々を占領せよ。ただし彼らの自治権は維持するように。"
 hawaii_events.4.b: "もし我々がしなければ他国が手を出すだろう。"
 hawaii_events.4.c: "我々はこのクーデターに関与していない。"
 hawaii_events.5.t: "追放された企業経営者"
 hawaii_events.5.d: "ハワイ政府が我々の市民を島から国外追放し、彼らの財産を押収しました。我が国はこの件に適切に対応する必要があります。"
 hawaii_events.5.f: "「我が国の市民を追放して個人事業を支配下におくとは何事か。このような土地の押収は前例がないだけではなく、容認できるものでもない。我が国はこのような屈辱を容認することができない」"
 hawaii_events.5.a: "これは彼ら自身が招いたことだ。"
 hawaii_events.5.b: "これは容認できない！"
 je_hawaii: "外国の利益"
 je_hawaii_reason: "太平洋におけるハワイの位置は環太平洋貿易にとって非常に価値の高いものだ。我々は現地企業の所有者をこちらの味方につけ、この島々を虎視眈々と狙っているであろう列強による侵攻を思いとどまらせる必要がある。"
 national_defence_modifier: "国防"
 interest_in_hawaii: "ハワイへの投資"
 interest_in_hawaii_desc: "ハワイの君主が死亡したことにより、権力への求心力が発生している今、我が国がこの島々の支配を強化する可能性が出てきた。"
 death_of_kamehameha: "国王の死"
 hawaii_interest_tt: "ハワイへの関心を表明することで、この島国の取得に繋がる可能性があります。"
 influence_hawaii_tt: "我々はハワイへの積極的な介入を行うというディシジョンを実行した。"
 je_hawaiian_interest_tt: "我々はハワイ政府に対するクーデターを開始した。あとは待つだけだ。"
 deporting_disloyal_igs: "ビジネスマンが追放された"
 influence_over_hawaii: "ハワイでの影響力"
 je_hawaiian_interest: "ハワイでの影響力行使"
 je_hawaiian_interest_reason: "最近ハワイで起きた出来事の顛末により、我が国がこの島国を確保し、この地域での影響力を高めるための突破口が開かれた。もしハワイ政府が支配を維持できないなら、我々が介入して島々を確保できるかもしれない。"
 invalid_influence_hawaii_tt: "ハワイでクーデター発生、あるいはハワイ政府がクーデターの回避に成功する。"
 hawaii_coup_happened_tt: "[SCOPE.sCountry('hawaii_scope').GetName]の政府がクーデターにより崩壊した"
 hawaii_government_secured_tt: "[SCOPE.sCountry('hawaii_scope').GetName]の政府がその地位を確保した"
 #Conscription enactment laws
 conscription_laws.1.t: "階級の補充"
 conscription_laws.1.d: "[SCOPE.gsInterestGroup('rural_folk_conscription').GetName]の構成員が[SCOPE.sLaw('current_law_scope').GetName]の導入について政府に打診している。彼らは、我々がこの法律の導入に向けた準備を完了するまでさらに多くの時間が必要であると考えている。"
 conscription_laws.1.f: "「我々全員が享受する自由に値札を貼るおつもりか？いや！彼ら労働者の育てる作物にこそ値札を貼っていただきたい。我々の自由と国家安全保障については議論の余地などなく、値札用のスペースも用意されていない。我々に必要なのは国家の存続であり、すべての人々が、その目標を達成するために必要となる準備を進めなければならないのだ」"
 conscription_laws.1.a: "法案の可決を強行する。"
 conscription_laws.1.b: "この件については時間をかけて考えよう。"
 conscription_laws.2.t: "プロによる部隊"
 conscription_laws.2.d: "我が国の職業軍人の多くが、戦時中における徴兵と常設歩兵の混在が、我が国の軍隊の質と能力に大きな影響を及ぼしているのではないかという懸念を提起している。"
 conscription_laws.2.f: "「この国のために戦い、命を懸けることを我々に期待しておられるようだが、あなた方は今までライフルを触ったこともないような農民や工場労働者と一緒に戦いたいと思いますか。軍の一部だけが状況を把握しているような環境であるのに、どうして兵士たちが協調して任務にあたることを期待できるとおっしゃるのですか？」"
 conscription_laws.2.a: "我々にはありったけの兵士が必要なのだ。"
 conscription_laws.2.b: "この件は良く検討しよう。"
 conscription_laws.3.t: "徴兵の準備不足"
 conscription_laws.3.d: "[SCOPE.gsInterestGroup('anti_conscription_ig').GetName]のリーダーである[SCOPE.sCharacter('anti_conscription_advocate').GetFullName]は、性急な[SCOPE.sLaw('current_law_scope').GetName]制定の危険性について刺激的な演説を行った。"
 conscription_laws.3.f: "「我々には備えが出来ていない。この事実を無視してはならない。足元から国が崩壊しては何の意味もないからだ。準備がままならない状態で動員命令を出した場合、新兵に対する給与が発生するだけでなく、工場労働者や農民の数も減ってしまうことになる。つまり生産量がさらに減少し、最終的には税金や歳入も減ってしまうことになるのだ。我々は一体どうやって新兵たちの給与を捻出するつもりだったのだろうか？"
 conscription_laws.3.a: "この件は政府が対処する。"
 conscription_laws.3.b: "最後までやり遂げる。"
 conscription_starting: "徴兵支援"
 keep_marching_on: "遅延なし"
 conscription_debate: "徴兵支援"
 no_slowing_down: "政府の追加歳出"
 conscription_stalled: "徴兵に遅延が発生。"
 more_soldiers: "新兵部隊"
 listen_to_the_troops: "プロの意見に耳を傾ける"
 #Decree Events
 decree_events.100.t: "産業ブーム"
 decree_events.100.d: "[SCOPE.sState('decree_manufacturing_industry').GetName]にある我が国の[SCOPE.sBuilding('manufacturing_building_production').GetName]が、産業品の生産におけるわずかな余剰を報告しています。これを州に再投資する方法を検討する必要があります。"
 decree_events.100.f: "「他にどんな証拠が必要だと言うんです？産業の進歩は目覚ましく、我々は間もなく産業革命の第二波を目の当たりにするでしょう。あらゆる都市の工場、あらゆる町の工房でね。その内国家全体が工業化されることになるでしょうな！」"
 decree_events.100.a: "さらに工業化に力を入れる。"
 decree_events.100.b: "労働者に再投資すべきだ。"
 decree_events.101.t: "功績は達成者の元へ"
 decree_events.101.d: "最近我が国が[SCOPE.sBuilding('manufacturing_building_production_politics').GetName]を踏まえて行った[SCOPE.sState('decree_manufacturing_politics').GetName]生産に対する投資によって生産量が増加しましたが、これが誰の功績であるかが話題の的になっています。"
 decree_events.101.f: "「我々のお金、工場、物資無しで、これが可能だったとでも？この取り組みに関与し、偉業を可能にした関係者の努力と苦労を国民全員に知らせようではないか」"
 decree_events.101.a: "[SCOPE.gsInterestGroup('industrialists_ig_focus').GetName]の功績だ。"
 decree_events.101.b: "これは労働者のための勝利だ。"
 decree_events.101.c: "もっと他のことに重視してくれ。"
 decree_events.102.t: "農業ブーム"
 decree_events.102.d: "[SCOPE.sState('decree_agricultural_industry').GetName]における農業開発の奨励により、我が国の[SCOPE.sBuilding('agricultural_building_production').GetName]で生産量が微増しています。これらが無駄にならないように利用法を検討する必要があります。 "
 decree_events.102.f: "「我が国民は王侯貴族のように食べることだろう！もはや我々の市民にとって飢餓は過去の物となった。この好機を活用し、我々自身だけではなく他者も（もちろん有料で）手助けしようじゃないか。我々がはるか先を歩いていることを彼らに知らしめてやろう」"
 decree_events.102.a: "さらに農業に力を入れる。"
 decree_events.102.b: "労働者こそ相応しい。"
 decree_events.103.t: "称賛に値する人物"
 decree_events.103.d: "最近我が国が[SCOPE.sBuilding('agricultural_building_production_politics').GetName]を踏まえて行った [SCOPE.sState('decree_agricultural_politics').GetName] への投資に関して、投資の強化が誰の功績であったのかが話題となっていますが、意見は真っ二つに分かれています。"
 decree_events.103.f: "「功績がどこにあるのかが最大の争点でしょう。農地の所有者でしょうか、それとも収穫の主催者でしょうか？あるいは毎日農場で働く一般市民でしょうか？彼らは額に汗して農地の水やりを行っていますよ？」"
 decree_events.103.a: "[SCOPE.gsInterestGroup('landowners_ig_focus').GetName]が称賛に相応しい。"
 decree_events.103.b: "農民が称賛に相応しい。"
 decree_events.103.c: "称賛できる他の誰かを探してくれ。"
 decree_events.104.t: "資源ブーム"
 decree_events.104.d: "[SCOPE.sState('decree_resource_industry').GetName]にある原材料産業が、我が国の[SCOPE.sBuilding('resource_building_production').GetName]における商品生産量の微増を報告しています。これにより州が利用できる備蓄量を増やすことができ、今後は州への再投資も可能になるかもしれません。"
 decree_events.104.f: "「当然この増量分は業界に再び投資する必要があります。彼らがいなければそもそも増産などなかったわけですからね」「本気で言っているのか？労働者がいなければ誰があなた方の事業を運営すると言うのか。報酬を与えるとするなら労働者だ。あなた方ではない」"
 decree_events.104.a: "さらに資源産業に力を入れる。"
 decree_events.104.b: "[SCOPE.sState('decree_resource_industry').GetName]の労働者に報奨を与えよう。"
 decree_events.105.t: "成果への評価"
 decree_events.105.d: "最近の[SCOPE.sState('decree_resource_politics').GetName]における投資の結果、原材料産業の[SCOPE.sBuilding('resource_building_production_politics').GetName]収支残高がプラスへと転じました。早速利益集団がこの投資における功績を主張しようと試みています。"
 decree_events.105.f: "「このような喜ばしい機会には、しばしば困難な作業を通じて成し遂げた進歩が語られます。あまり語られることがない話題、それは我々をこのポイントまで導いた誰かについて、そして彼らの貢献無しではこのような功績の達成が如何に困難であったかについてです。"
 decree_events.105.a: "すべての功績は[SCOPE.gsInterestGroup('industrialists_ig_focus').GetName]に相応しい。"
 decree_events.105.b: "功績は[SCOPE.gsInterestGroup('landowners_ig_focus').GetName]に相応しい。"
 decree_events.105.c: "労働者を評価すべきだ。"
 decree_events.106.t: "鬱積する連隊"
 decree_events.106.d: "[SCOPE.sState('decree_enlistment_origin').GetName]の連隊を重用しすぎたことで、隣接州である[SCOPE.sState('decree_enlistment').GetName]の連隊から敵意を向けられるようになってしまいました。彼らは、すべての連隊を平等に扱うよう求めています。"
 decree_events.106.f: "「こういった兵士は、単にローリスクハイリターンな仕事で注目を浴びたいだけのわがままな連中だ。彼らの仕事は戦うことで、戦う相手を決めるのは我々だ。このように難しい判断を下す上で兵士たちを信用するわけにはいかない」"
 decree_events.106.a: "これこそ[SCOPE.gsInterestGroup('armed_forces_ig_focus').GetName]の思う壺だ。"
 decree_events.106.b: "これら部隊の組織編成のために投資を増やすべきだ。"
 decree_events.107.t: "報われた訓練"
 decree_events.107.d: "我々の追加訓練が功を奏したようです。[SCOPE.sState('decree_elite_research').GetName]の部隊が訓練を実践し、我が国が戦争状態に陥った時に役立ちそうな新しい戦術をいくつか習得しました。"
 decree_events.107.f: "「我々の兵士は世界一です。我が国の守護者は、これまで常にスキルとプロ意識を試され、そしてこれからもそうあることでしょう。これは我々が正しいことの証明です。"
 decree_events.107.a: "このことは内密に。"
 decree_events.107.b: "さらなる演習を奨励する。"
 decree_events.107.c: "下士官の訓練を奨励する。"
 decree_events.107.e: "襲撃歩兵戦術を開発する。"
 decree_events.108.t: "暴力のエスカレート"
 decree_events.108.d: "[SCOPE.sState('decree_violent_supp').GetName]での平和的な行進は、参加者と警察が路上で衝突したことで、突如暴力的なものへと変貌しました。"
 decree_events.108.f: "「奴らを力でねじ伏せるんだ。必要であればどんな手を使ってでも。あの成金どもに身の程をわきまえさせてやれ。警察が連中の安全のために配備されていることがわからないのか？あの過激派たちの弱みを見せることはできないし、今後そうすることもない」"
 decree_events.108.a: "警察を引かせろ。"
 decree_events.108.b: "警察の采配に任せよう。"
 decree_events.109.t: "武力鎮圧が招く差別の増加"
 decree_events.109.d: "[SCOPE.sState('decree_increased_violence').GetName]の急進派は、差別を受けている[SCOPE.sCulture('violent_suppression_discriminated').GetName]の州住民から支持を集めているようだ。"
 decree_events.109.f: "「彼らがそこで抗議活動したいと言うならそうさせてあげるべきです。もし我々が彼らに服従を強制したなら事態はさらに悪化するでしょう。将来的に彼らの処遇を決める際にも、一カ所にまとまっているため対処も簡単になります」"
 decree_events.109.a: "抗議活動できる場所とそうでない場所は我々が決める。"
 decree_events.109.b: "彼らの好きな場所で抗議活動させておこう。"
