 naval_mission_type_project_power: "戦力の投射"
 naval_mission_type_project_power_desc: "[concept_fleet]に与えられる[concept_naval_mission]の一種で、[Concept('concept_strategic_region','$concept_strategic_regions$')]の沖合を航行し、[concept_involvement]を生成することが目標です。"
 naval_mission_type_port_bombardment: "港への砲撃"
 naval_mission_type_port_bombardment_desc: "[concept_fleet]に与えられる[concept_naval_mission]の一種。この海域に隣接する敵の沿岸部国家を砲撃し、荒廃を発生させます。また、[Concept('concept_coastal_building','$concept_coastal_buildings$')]にダメージを与える可能性もあります。"
 naval_mission_type_piracy: "海賊行為"
 naval_mission_type_piracy_desc: "[concept_fleet]に与えられる[concept_naval_mission]の一種。割り当てられた海域を通過する敵対国または中立国の[Concept('concept_good','$concept_goods$')]を押収します。"
 naval_mission_type_privateer: "私掠"
 naval_mission_type_privateer_desc: "[concept_fleet]に与えられる[concept_naval_mission]の一種。割り当てられた海域を通過する敵対国の[Concept('concept_good','$concept_goods$')]を押収します。"
