l_japanese:
 rlit.001.t: "ペンの決闘"
 rlit.001.d: "『#italic 北の蜜蜂#!』の保守派編集者[SCOPE.sCharacter('bulgarin_scope').GetFullName]が書簡を発表し、詩人[SCOPE.sCharacter('pushkin_scope').GetFullName]とその仲間たちを糾弾した。その矛先は、[Glossary('glossary_decembrists','デカブリスト')]とのつながり、そして彼らのサロンにはびこる「危険な外国思想への傾倒」に向けられている。"
 rlit.001.f: "その手紙は署名のないまま官房に残されていたが、『#italic 北の蜜蜂#!』のページを繰ったことのある者なら、その文体から誰の筆によるものかすぐに気づいただろう。この定期刊行物は皇帝への忠誠で知られており、官房第三部は次の号に何が掲載されるかを常に把握しているようだった。そのため、閣僚たちは、扉の脇に立つ警備士官たちに絶対的な賛同以外の何物も悟られまいと、同意の頷きを交わした。\n\n「ブルガーリンの言うことはもっともだ」と一人がつぶやき、手紙を次の者に回した。\n\n「まったくだ」と同僚がため息をついた。「文学は#italic 必ず#!政府に奉仕しなければならない。[SCOPE.sCharacter('pushkin_scope').GetLastNameNoFormatting]のような作家は危険な夢想家だ」"
 rlit.001.a: "文学は帝国に奉仕すべきものだ。[SCOPE.sCharacter('pushkin_scope').GetLastNameNoFormatting]の言動は看過できない。"
 rlit.001.b: "詩を何篇か書いたくらいで、何の害があるというのだ？"
 rlit.001.c: "仲間内で戦わせておけばいい。"
 rlit.002.t: "黒い川での決闘"
 rlit.002.d: "[SCOPE.sCharacter('pushkin_scope').GetFullName]は腹部に銃弾を受け、チョールナヤ・レチカの決闘場から運び出された。2日後、詩人は死去し、若き著名作家の[SCOPE.sCharacter('lermontov_scope').GetFullName]が激烈な哀歌『#italic 詩人の死#!』を執筆して注目を集めている。その中で彼は、自身の敬愛する人物の死の原因が国家と貴族階級にあると非難している。"
 rlit.002.f: "第三部は警戒を強めていた。[SCOPE.sCharacter('pushkin_scope').GetFullNameNoFormatting]にある[GetStateRegion('STATE_INGRIA').GetCityHubName]のアパートの周囲では、何千という弔問者が通りを埋め尽くしていた。泣く者もいれば、時代を代表する偉大な作家のあまりにも早い死に言葉をなくし、茫然としている者もいた。\n\n「我らが抱く新しい夢も潜考も、腐り落ちる秋の葉のごとく次々と朽ち果てるべし」\n\n—アレクサンドル・プーシキン"
 rlit.002.a: "彼の後世の評価を定めるのは#italic 我々#!だ。国葬を執り行え。"
 rlit.002.b: "レールモントフの哀歌を出回らせよ。"
 rlit.002.c: "危険な感傷だ！公共の場での追悼を制限せよ。"
 rlit.003.t: "現代の英雄"
 rlit.003.d: "[SCOPE.sCharacter('lermontov_scope').GetFullName]の手による原稿が、[GetStateRegion('STATE_NORTH_CAUCASUS').GetCityHubName]の将校たちの間で評判となっている。[SCOPE.sCharacter('lermontov_scope').GetLastNameNoFormatting]は、プーシキンの死を悼む哀歌を書いた罰として[GetStateRegion('STATE_NORTH_CAUCASUS').GetName]に赴任させられていたが、任地での日々をある小説の執筆に費やしていた。それは、自らの軍務、そして帝国の信仰や道徳を、等しく軽蔑する英雄が描かれた作品であった。"
 rlit.003.f: "将校は寝台に腰掛けたまま、戸口に立つ男を見上げた。そして、努めて声を低く抑えながら語りはじめる。彼は、これから口にする自分の所感が用意されたものであることを——その反逆の言葉が何週間も思い悩みながら練り上げてきたものであることを——相手に悟られたくなかったのだ。\n\n「この物語の主人公、ペチョーリンは、際立った才気を持ちながら、その知性の矛先を世界と自分自身に向けた男なんだ。これは、ある種のロシア人の精神を極めて正確に描き出した肖像だよ。私は…そうだな、多分…彼の中に自分自身を見ているんだろう。もしかすると、我々の多くが、同じような体験をするかもしれない。君もきっと…いや、わからないがね？」\n\n「『なぜ自分は生きてきたのか——何の目的で生まれてきたのか？』…何か目的があったに違いない。そして、きっと私の運命は気高いものだったはずだ。私は自分の魂に、計り知れない力が宿っているのを感じるのだから…」\n\n— ミハイル・レールモントフ"
 rlit.003.a: "我が国のコーカサス遠征を賛美する作品を彼に書かせよ。"
 rlit.003.b: "ロシア人の疎外感にも、うなずけるところはある。"
 rlit.003.c: "前線で揉まれれば、あの男も身の程を知るだろう。"
 rlit.004.t: "帝国文学賞"
 rlit.004.d: "[SCOPE.sCharacter('bulgarin_scope').GetFullName]が教育省に帝国文学賞の創設を提案した。この賞は、ツァーリへの忠誠を示し、正教信仰と[ROOT.GetCountry.GetAdjective]の国民性を重んじる作品に毎年授与されるという。"
 rlit.004.f: "教育省の講堂でブルガーリンは40分にわたって演説し、ツァーリの政府を称賛すると同時に、自らの敵とみなす者たちを激しく非難した。一方、教育省から遠く離れた場所では、厚いカーテンに閉ざされたサロンや地下室に集う「敵」たちが応酬し、彼を警察の犬だの三文文士だのと罵った。\n\n『#italic 北の蜜蜂#!』の使命は、ロシア文学を正しく導くことによって、文学がロシアの法律と同じ目的、すなわち秩序、敬虔さ、そしてロシア人民の偉大さに奉仕できると示すことにある。"
 rlit.004.a: "忠誠心ある芸術、そして[SCOPE.sCharacter('bulgarin_scope').GetLastName]は、称賛を受けて然るべきだ。"
 rlit.004.b: "どんな英雄を選ぶのかは読者の自由だ。"
 rlit.004.c: "[ROOT.GetCountry.GetNameNoFlag]は、[SCOPE.sCharacter('bulgarin_scope').GetLastNameNoFormatting]とその新聞にうんざりしている。"
 rlit.005.t: "不敬な喜劇"
 rlit.005.d: "[SCOPE.sCharacter('gogol_scope').GetFullName]の最新作は、[ROOT.GetCountry.GetAdjective]の地方のあらゆる階級の生活を大胆に描いた、挑発的な喜劇だった。第1巻が検閲を通過したのは奇跡だと、読者の誰もが思わずにいられなかった。"
 rlit.005.f: "ここ何年ものあいだ、ロシア語でこれほど滑稽で痛烈な作品は書かれていない。知識人たちは何週間にもわたって、この作品をめぐり論争を続けている。農奴制下の経済を告発する作品だと評する者もいるが、ゴーゴリ自身は、ダンテの『#italic 地獄篇#!』を身近なロシア社会に移し替えた寓話だと主張している。\n\n「ああ、ロシア、ロシアよ…その大地はどこまでも平坦で、果てしなく開けている。町々は広々とした平野に点や目印のように浮かぶばかりで、目を楽しませるものも、惑わせるものも何ひとつない。それなのに、どんな秘密が、どんな抗いがたい力が、私をこの地へと引き寄せるのだろうか？」\n\n— ニコライ・ゴーゴリ、『#italic 死せる魂#!』"
 rlit.005.a: "我が国の地主階級をこのように描くのは危険すぎる。"
 rlit.005.b: "笑って楽しむぐらいの心の余裕はあるだろう？"
 rlit.005.c: "我が[ROOT.GetCountry.GetNameNoFlag]を#italic 称賛する#!作品も書くよう彼に依頼せよ。"
 rlit.006.t: "農民の髭をたくわえた男"
 rlit.006.d: "哲学者[SCOPE.sCharacter('aksakov_scope').GetFullName]が、粗末な農民服をまとって宮廷に姿を現した。波紋を広げているのはその姿だけではない。男はまるで中世からやってきたかのような風貌をしており、一部の者は彼が[ROOT.GetCountry.GetNameNoFlag]をもその時代へ送り返そうとしているのだと考えている。"
 rlit.006.f: "彼は村落共同体こそが社会組織の最高形態であり、ピョートルはロシアが犯した最大の過ちであり、西欧化によってツァーリとナロード（人民）の絆は引き裂かれたと語る。死期が迫っているかのように急き込んで語る彼の姿を見た多くの者は、敗戦という恥辱が彼の魂の奥底を打ち砕き、結核が入り込む隙を与えたのだと信じている。\n\n国家は人民の外面的な真理である。土地はその内面的な真理なのだ。"
 rlit.006.a: "「ナロード」の思想を公式の論説に取り入れなければならない。"
 rlit.006.b: "彼の髭は見苦しい。"
 rlit.007.t: "怒りに満ちた手紙"
 rlit.007.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]のサロンで、1通の痛烈な手紙が出回っている。書いたのは自由主義の批評家、[SCOPE.sCharacter('belinsky_scope').GetFullName]だ。病の床に伏しながらも、ツァーリを、そして文壇の仲間までをも糾弾するその筆は、相変わらず火のように激しく、生気に満ちている。"
 rlit.007.f: "それは、激しい怒りを抑制の利いた筆致に込めた、ゴーゴリ宛ての見事な書簡だった。『#italic 死せる魂#!』を農奴制と専制政治への告発と受け止めた読者たちを、ゴーゴリは裏切ったのだと糾弾している。その筆で上流階級に痛撃を与えられたはずなのに、なぜ彼らが安穏と受け流せるようにしてしまったのか。作品の成功が明らかになったとき、なぜもっと大胆な姿勢を示さなかったのか。\n\n3ページ目に入ると批判はさらに激しさを増し、ツァーリを人民の父と信じ込む[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameNoFormatting]全体にまで矛先が向けられた。[SCOPE.sCharacter('belinsky_scope').GetLastNameNoFormatting]に言わせれば、ツァーリは人民の父などではなく、人民を閉じ込める#italic 看守#!にすぎないのだ。\n\n第三部は激怒しているが、死を目前にした男に、いったい何ができるというのか？彼らが手を下すより先に、結核がすべてに決着をつけてしまうだろう。"
 rlit.007.a: "病状がどうであろうと、彼の手紙は反逆文書だ。"
 rlit.007.b: "彼の命とともに、手紙も色褪せるだろう。"
 rlit.007.c: "この2人に公開討論をやらせよう。"
 rlit.008.t: "ロンドンから響く#italic 鐘#!の音"
 rlit.008.d: "内務省の机の上に、ツァーリを中傷することで悪名高い社会主義系の新聞、『#italic 鐘#!』の最新号が置かれているのが発見されたが、持ち主は名乗り出ていない。国外追放された編集者である[SCOPE.sCharacter('herzen_scope').GetFullName]との関係が露呈すれば、深刻な事態を招くだろう。"
 rlit.008.f: "[SCOPE.sCharacter('herzen_scope').GetFullNameNoFormatting]の『#italic 鐘#!』は、帝国で最も広く読まれる政治出版物となっていたが、それは全くの違法であった。長い曲折を経て読者の手元に届くその内容には、ツァーリの側近でさえ細心の注意を払うようになった。[SCOPE.sCharacter('herzen_scope').GetLastNameNoFormatting]は、国内のどの報道機関も及ばない明晰さで、農奴制と専制政治の道徳的破綻について書いていた。#italic こんなことになっているのは#!#italic 独立した国内報道機関が存在しない#!からだ、と大臣は考えていた。一方役人たちは、彼が机の上にそれを放置した間抜けであることを露呈する物証がないか、彼の机を捜していた。\n\n「自由を望むロシア人は、今すぐ自由にならねばならない。20年後でもなく、時が来たら、でもなく、自らの魂において、いかなる法律が変わるよりも前に自由にならねばならないのだ」\n\n—アレクサンドル・ゲルツェン"
 rlit.008.a: "この新聞には、改革を志す者たちにとっての知恵があるのかもしれない。"
 rlit.008.b: "『#italic 鐘#!』などロシアで鳴らしてはならない。"
 rlit.008.c: "追放された[SCOPE.sCharacter('herzen_scope').GetLastName]を、条件付き恩赦の下で帰国させよ。"
 rlit.009.t: "家庭教師の覚書"
 rlit.009.d: "高名な法学者でありツァレーヴィチの家庭教師でもある[SCOPE.sCharacter('pobedonostsev_scope').GetFullName]が、「ニヒリストの文学現象」に関する覚書を提出した。そこで[SCOPE.sCharacter('pobedonostsev_scope').GetSheHe|U]は、ニヒリズムは単なる哲学的立場ではなく、[ROOT.GetCountry.GetName]がこれ以上無視できないような法的脅威でもあると論じている。"
 rlit.009.f: "「ニヒリストは財産、家庭、国家の基盤を否定している。そのため彼らの著作もそれに応じて扱われるべきなのだ。これは文学評論家に委ねる問題ではなく、皇帝陛下の第三部が扱うべき問題だ」と、この痩せぎすの男は言うと、拳をテーブルに振り下ろした。その拍子に水の入ったカップが倒れる。話し続ける彼をよそに、こぼれた水は机上に広がり、何枚かの重要な書類を濡らさんばかりだった。\n\n補佐官は慌てて始末に回ったが、頭の片隅では、台頭しつつあるこの黒幕が、具体的にどのような対策を用意しているのかと密かに思いを巡らせていた。"
 rlit.009.a: "彼は正しい。法制度にニヒリズムが入り込む余地はない。"
 rlit.009.b: "この脅しには#italic いくばくかの#!注意が必要かもしれない。"
 rlit.009.c: "これは文学上の問題だ。ほかの問題に移ろう。"
 rlit.010.t: "セミョーノフスキー広場の処刑台"
 rlit.010.d: "魂を押し潰すような『#italic 貧しき人々#!』の著者[SCOPE.sCharacter('dostoevsky_scope').GetFullName]が、ペトラシェフスキー・サークルの会合でベリンスキーの扇動的な手紙を朗読した罪により逮捕された。処刑は夜明けに予定されており、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は[SCOPE.sCharacter('dostoevsky_scope').GetHerHim]に恩赦を与えるか否か、決断を迫られている。"
 rlit.010.f: "三人の男が杭に縛り付けられ、銃口が彼らに向けられるなか、太鼓の音が次第に大きくなっていく。その時、石畳を打つ蹄鉄の音が響いた。彼らはまだ知る由もない。ツァーリが全員を、死刑ではなく流刑に処すと決めたことを。本当にこれですべてが終わるのだろうか？\n\n「人々の中にあって人間であり続け、どのような状況に置かれても永遠に人間であり続けること、絶望せず、心を失わないこと—それこそが人生であり、人生の使命なのだ」\n\n—フョードル・ドストエフスキー"
 rlit.010.a: "[SCOPE.sCharacter('dostoevsky_scope').GetLastName]を生かすとしても、忘れ得ぬ教訓を与えねばならない。"
 rlit.010.b: "我々のやり方を考え直そう。全員に恩赦を与える。"
 rlit.010.c: "急進主義に人々の心を捉える殉教者を生み出してはならない。"
 rlit.011.t: "父と子"
 rlit.011.d: "[SCOPE.sCharacter('turgenev_scope').GetFullName]の新作小説が、たちまち[ROOT.GetCountry.GetCapital.GetCityHubName]の話題をさらった。物語の主人公は、実験や観察で確かめられないものは何ひとつ信じないニヒリストだ。このような人物描写をめぐり、[ROOT.GetCountry.GetAdjective]の[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]の一部からは激しい反発が起こる一方、残る者たちからは称賛の声が上がっている。"
 rlit.011.f: "ある評論家はこの本をロシアの若者に対する中傷と呼び、別の評論家は彼らの名誉を回復するものだと評している。作者さえも小説の反響の大きさに心底驚いているようだ。一つ確かなのは、「ニヒリスト」という言葉がロシア語に定着し、消え去ることはないということだ。\n\n「そうさ、昔はヘーゲル主義者がいて、今はニヒリストがいるってわけだ。空気もない虚無の空間で、君たちがどう生きていくか見ものだよ。ところでニコライ兄さん、ベルを鳴らしておくれ。ココアを飲む時間だ」\n\n— イワン・ツルゲーネフ"
 rlit.011.a: "ツルゲーネフはロシアの精神的価値感を裏切った。"
 rlit.011.b: "ロシアは西欧に目を向け、進歩を受け入れなければならない。"
 rlit.011.c: "架空の英雄などいなくてもニヒリズムは十分危険だというのに。"
 rlit.012.t: "#italic 何をなすべきか？#!"
 rlit.012.d: "[SCOPE.sCharacter('chernyshevsky_scope').GetFullName]はペトロパヴロフスク要塞の独房で、ある原稿を書き上げた。そこに描かれているのは、女性が自由で、労働に尊厳があり、ツァーリはおろか、神すら存在しない社会主義のユートピアだ。これほど過激な内容にもかかわらず、検閲官たちは、この原稿はあまりにも退屈かつ説教臭いため、危険にはなり得ないと判断した。"
 rlit.012.f: "「彼らは陽気に、そして和やかに暮らしている。働き、憩い、人生を楽しみ、決して考えなしというわけではないが、先へ進めば進むほど状況は良くなっていくのだという確信を抱いているのだ」\n\n—ニコライ・チェルヌイシェフスキー"
 rlit.012.a: "この本の流布を許すわけにはいかない。"
 rlit.012.b: "検閲官の判断を信頼しよう。"
 rlit.012.c: "扇動の罪で[SCOPE.sCharacter('chernyshevsky_scope').GetLastName]を[GetStateRegion('STATE_TOMSK').GetName]に追放せよ。"
 rlit.013.t: "[SCOPE.sCharacter('katkov_scope').GetLastName]と『#italic モスクワ通報#!』"
 rlit.013.d: "『#italic モスクワ通報#!』に掲載された[SCOPE.sCharacter('katkov_scope').GetFullName]の社説が、上流社会の注目を集めている。かつては自由貿易を唱える親英的な自由主義者だった[SCOPE.sCharacter('katkov_scope').GetLastName]が、激烈なナショナリズムへと「劇的な回心」を遂げたからだ。"
 rlit.013.f: "彼は『#italic モスクワ通報#!』と『#italic ロシア報知#!』の誌面を通じて、ロシアで最も過激な民族主義ジャーナリストへと変貌を遂げ、その部数は急上昇している。彼はロシアの敵——ポーランド分離主義者、ニヒリスト、自由主義者、そしてロシア人以外のあらゆるロシアの要素を愛する、外国で教育を受けた知識人たち——を次から次へと糾弾している。ゲルツェンが[SCOPE.sStateRegion('herzen_exile_state').GetCityHubName]からロシアの罪について書く一方、カトコフは[SCOPE.sStateRegion('katkov_home_state').GetCityHubName]から、ロシアの栄光と、その敵たちの堕落ぶりについて書いている。\n\n「すべての権力は神に由来する。しかしながらロシアの皇帝には、世界のほかの君主たちと一線を画す特別な意義が授けられている…ここに、ロシアと世界のあらゆる国々との深い相違の謎がある」\n\n— ミハイル・カトコフ"
 rlit.013.a: "[SCOPE.sCharacter('katkov_scope').GetLastName]は、ゲルツェンと彼の『#italic 鐘#!』に対する我々の答えだ。"
 rlit.013.b: "彼の民族主義思想は役に立つが、御しがたい。"
 rlit.013.c: "我々にはすでにブルガーリンがいる。"
 rlit.014.t: "大地の哲学者"
 rlit.014.d: "保守派の出版人[SCOPE.sCharacter('strakhov_scope').GetFullName]が署名した新しい雑誌の創刊号が[SCOPE.sStateRegion('relevant_state').GetCityHubName]に届いた。その反動的な含意にもかかわらず、この媒体の発行によって「[Glossary('glossary_pochvennichestvo','$glossary_pochvennichestvo|q$')]」が今月の流行語となっている。"
 rlit.014.f: "ロシアの知識人は自らの根と足元の土壌との繋がりを失ってたゆたい、民衆から遊離している。それはスラブ派の神秘主義でも西欧の合理主義でもない。ドストエフスキーはこれを、ロシアの知的生活における唯一の真剣な思想と呼んでいる。\n\n教養あるロシア人は風船のように#italic ナロード#!から離れて浮遊しているのだ。彼らは再び、地に足を着けることを学ばねばならない。"
 rlit.014.a: "地に足の着いたこの思想を広める媒体は、資金援助を受けるに値する。"
 rlit.014.b: "ペンを持つすべての学者に金をばらまくわけにはいかない。"
 rlit.014.c: "$glossary_pochvennichestvo$は真剣な哲学ではない。"
 rlit.015.t: "黄金時代の終焉"
 rlit.015.d: "[ROOT.GetCountry.GetAdjective]文学の「黄金時代」と称された一時代が幕を閉じた。この時代は芸術と国家の関係をめぐる問いを投げかけ、その答えは歴史に刻まれた。帝国が詩人たちをどう扱ってきたか——それが、詩人たちが帝国をどう扱うのかを決めることになる。"
 rlit.015.f: "アルプスの別荘のバルコニー。紙製の日傘の陰で、ひとりの男が出たばかりのゴーゴリの翻訳書をめくっていた。翻訳に頼らねばならないこと自体、彼には目新しいことだった。ラシーヌ、ヴォルテール、ドリール、ルソー——彼の母語は何世紀ものあいだ、文学の世界に君臨してきたのだ。フランス語は権威ある言語であり、ヨーロッパで最も自由で文明的な国の言葉だった。世界に冠たるフランスの知的伝統は、人々を王への崇拝から引き離し、人類の解放へと奮い立たせてきた。そのような知的伝統が今、「ヨーロッパの憲兵」の懐で花開いている。それはいったい何を意味するのだろうか？\n\n彼は思った。ロシアにもまだ希望があるのかもしれない、と。"
 rlit.015.a: "文学は国家の道具となった。"
 rlit.015.b: "悲しいかな、帝国はその最も偉大なる子らを殉教者にしてしまったのだ。"
 rlit.015.c: "知識人の関心は、#italic ナロード#!へと向かいつつある。"
 rlit.015.opt_d: "ロシア文学は世界のものだ。"
 rlit.015.e: "我々は、これまで築き上げてきたものと共に前進する。"
 rlit.016.t: "放蕩息子の帰還"
 rlit.016.d: "[SCOPE.sCharacter('dostoevsky_scope').GetFullName]が[GetStateRegion('STATE_TOMSK').GetName]から帰還した。政府に対する無謀で無礼な行為のため処刑寸前まで追い込まれた彼は、熱烈な[ROOT.GetCountry.GetAdjectiveNoFlag]正教徒かつ汎スラブ主義の民族主義者へとすっかり変貌していた。彼の最新作は、罪を犯した男の凄惨な破滅を描いている。"
 rlit.016.f: "彼の新作『#italic 罪と罰#!』は、ある金貸しを殺害した学生の姿を追うものだ。そして彼は法によってではなく、自らの良心に苛まれて破綻していく。これを傑作と呼ぶ者もいれば、反動的な駄作と呼ぶ者もいる。しかし、これは『#italic 死せる魂#!』以来、最も重要なロシア小説であることは間違いない。\n\n「苦難を受け入れ、それによって贖罪を成し遂げるのだ。それこそが、お前のなすべきことだ」\n\n— フョードル・ドストエフスキー"
 rlit.016.a: "彼の保守的な主張は、我々にとって実に有益だ。"
 rlit.016.b: "彼の新しい小説を出版しなければ。"
 rlit.016.c: "公の場があまりにも陰鬱さに覆われるのは、社会にとって健全ではない。"
 rlit.016.opt_d: "恩赦を受け、陰りを見せぬドストエフスキーのリベラルな言葉は、自由に紡がれる。"
 rlit.017.t: "戦争と平和"
 rlit.017.d: "[SCOPE.sCharacter('tolstoy_scope').GetFullName]伯爵はナポレオン戦争を題材とする千ページ超の小説を刊行したが、それには閣僚も元帥も皇帝も何一つ決定などしていないという歴史観が描かれていた。この作品は[ROOT.GetCountry.GetAdjective]社会で広く人気を博し、当局は、なぜこれほど反国家主義的な作家が自由に執筆を続けることを許されているのかと疑問を抱きはじめている。"
 rlit.017.f: "それは、歴史を動かす因果の本質、個人と大きな国家の情勢との関係、そしてロシア人であることの意味についての考察である。評論家たちは、この作品を称えるに足る言葉を探しあぐねている。ツァーリもこれを読み、フローベールはページを繰る手を止めることができなかった。一方トルストイ自身はすでに次の作品へと着々と歩みを進めている。彼をいかに統制するかを問う者もいるだろう。しかし、それを的外れな問いとみなし、こう問い返す者もいるかもしれない。そもそも、試みる価値などあるのか、と。\n\n「簡潔さ、善良さ、真実のないところに偉大さはない」\n\n— レフ・トルストイ"
 rlit.017.a: "ロシア軍の栄光について執筆するようトルストイに依頼せよ。"
 rlit.017.b: "この作家に干渉するな。彼はそれだけの権利を自らの手で勝ち取ったのだ。"
 rlit.017.c: "外国での出版を規制せよ。世界中を彼の読者にする必要はない。"
 rlit.018.t: "フーロフの知事たち"
 rlit.018.d: "一冊の新刊が読者の注目を集めている。[SCOPE.sCharacter('saltykov_scope').GetFullName]が架空の町フーロフの歴史を風刺的に描いたこの作品は、つい先日検閲を通過した。検閲官たちは、多くの読者と同じく、これが歴史研究なのか喜劇なのか判断できずにいるのだ。"
 rlit.018.f: "人間の脳の代わりにと、頭蓋骨にオルゴールを組み込まれた長官、政変で権力の座に就いた6人の女たち、そして火と飢えで自らの臣民を震え上がらせた男。人々は涙を流すまで笑い転げる——それはときには歓喜の涙であり、またときには現実を思い知る苦々しい涙である。\n\n「理想主義が思考を支配する暴力であるように、政治は意思を支配する暴力だ」\n\n— ミハイル・サルトィコフ＝シチェドリン"
 rlit.018.a: "誰も困らせない風刺なら、誰の脅威にもならない。"
 rlit.018.a_tt: "この「フーロフ」は、地球上のどこの話でもおかしくない。#italic そうだろう？#!"
 rlit.018.b: "ロシア統治の尊厳を傷つけた罪で、奴を起訴しろ。"
 rlit.018.c: "行政改革委員会のために、彼の洞察力を活かそう。"
 rlit.019.t: "正しき人々"
 rlit.019.d: "[SCOPE.sCharacter('leskov_scope').GetFullName]は、スラブ派と西欧派の狭間ともいえる立場から、どこにも居場所のない「善人」たちの物語を出版した。彼をあらゆる[ROOT.GetCountry.GetAdjectiveNoFormatting]作家の中で最も[ROOT.GetCountry.GetAdjective]的な存在と評する学者もいれば、それに異を唱える学者もいる。"
 rlit.019.f: "思想に執着する作家もいるが、[SCOPE.sCharacter('leskov_scope').GetFullNameNoFormatting]が求めるのは魂である。彼の描く聖愚者たちは、この世を歩みながら、優しさと人の好さで苦難を乗り越えていく。彼らはただ一筋に人間なのだ。\n\n「我が郷里にはときおり、出会ったのが遠い昔であっても、思い出せば胸が震えるような人物が現れる」\n\n— ニコライ・レスコフ"
 rlit.019.a: "まさしく、あらゆるロシア作家の中で最もロシア的な存在だ。"
 rlit.019.b: "これは政治の問題ではない。放っておけ。"
 rlit.019.c: "彼の道徳観は、我が国からのヨーロッパへの贈り物となりうる。"
 rlit.020.t: "冷凍庫"
 rlit.020.d: "[SCOPE.sCharacter('pobedonostsev_scope').GetFullName]が議会制政府を非難し、専制政治を称賛する政府覚書を回覧させている。政府関係者の間では、これにどう対応すべきか意見が分かれている。"
 rlit.020.f: "「47ページある」と、眼鏡をかけた閣僚が紙の束を指で叩きながら言った。「だが、冷酷ながら優美な点は認めざるを得ないな」\n\n別の閣僚が椅子に深く身を沈めた。「まあ、[SCOPE.sCharacter('pobedonostsev_scope').GetFirstNameNoFormatting]ならいかにも言いそうだ。『これこそが議会制という茶番の複雑なからくりであり、我らの時代を支配する偉大なる政治的虚構なのだ』」"
 rlit.020.a: "検閲と文化事業に関するすべての権限を[SCOPE.sCharacter('pobedonostsev_scope').GetLastName]に与えよ。"
 rlit.020.b: "彼を教会会議の中に留めておけ。管轄させるのは宗教行政のみだ。"
 rlit.020.c: "あの冷凍庫ときたら、これ以上何を凍らせようというのか。"
 rlit.021.t: "伯爵の破門"
 rlit.021.d: "[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]からの圧力を受け、[SCOPE.sCharacter('tolstoy_scope').GetFullName]は、自分に繋がるあらゆるもの—屋敷、小説、さらには貴族としての身分すらも捨てはじめた。[SCOPE.sCharacter('tolstoy_scope').GetLastNameNoFormatting]家の領地は大混乱に陥っている。"
 rlit.021.f: "「あのお方は裸足で歩くようになり、ご自身の畑を耕しはじめたのです。まるで普通の農民のように」と、使用人の女は声を潜めて言った。\n\n偉大な貴族が腐敗した聖職者たちを面罵したという噂は村から村へと広がり、[GetInterestGroupVariant('ig_devout',GetPlayer).GetNameNoFormatting]からの破門はすでに裏目に出ていると囁く者もある。この作家の邸宅は、徐々に民衆の巡礼地に変わっていった。\n\n「誰もが世界を変えようと思うが、誰も自分自身を変えようと思わない」\n\n—レフ・トルストイ"
 rlit.021.a: "[SCOPE.sCharacter('tolstoy_scope').GetLastName]のような異端者には、破門がふさわしい。"
 rlit.021.b: "[GetInterestGroupVariant('ig_devout',GetPlayer).GetNameNoFormatting]は、熱心が過ぎることがしばしばある。"
 rlit.021.c: "[SCOPE.sCharacter('tolstoy_scope').GetLastNameNoFormatting]には、流刑先で自分の置かれた境遇を熟考させよう。"
 rlit.022.t: "公爵の公報"
 rlit.022.d: "君主制に好意的な論調のおかげで、[SCOPE.sCharacter('meshchersky_scope').GetFullName]公爵の反動派新聞『#italic 市民#!』は、長く王室の庇護を受けてきた。しかし近頃では、最も伝統的な保守派でさえ、その影響力を疑問視するようになりつつある。"
 rlit.022.f: "「実に不愉快な男だ」と、閣僚は紙面を畳みながら溜息をついた。「誰彼かまわず中傷しているが、自分自身もどれほどの醜聞を抱えていることやら。食欲も失せるほどの偽善とはこのことだ。しかもツァーリは、毎週我々にこれを食わせることをお望みなのだぞ？」と彼は言い、首を振った。\n\n「私は彼の小説に大いに笑わせてもらっているよ」と、別の閣僚が顎ひげをかきながら言った。「それに、ドストエフスキーはしばらく『#italic 市民#!』を編集していたのではないかね？」\n\n「確かに。しかし、何十万人もの読者を必要とするものなのか？」"
 rlit.022.a: "『#italic 市民#!』は、文学における国家の声である。"
 rlit.022.b: "『#italic 市民#!』を利用するものの、発行者は支持しない。"
 rlit.022.c: "[SCOPE.sCharacter('meshchersky_scope').GetLastNameNoFormatting]の追従は、王室の面汚しだ。"
 rlit.023.t: "発行者と劇作家"
 rlit.023.d: "[SCOPE.sCharacter('chekhov_scope').GetFullName]が友人の[SCOPE.sCharacter('suvorin_scope').GetFullName]宛に出した、『#italic 新時代#!』を批判する一通の手紙が、どうやら手違いにより文壇に出回っている。保守派は同紙を擁護する公式声明を出すよう求めている。"
 rlit.023.f: "ドレフュス事件以来、大作家と有力な保守派出版人との友情は悪化の一途をたどっている。この事件では、一方が反ドレフュス派を支持したのに対し、チェーホフはゾラ側に立った。スヴォーリンはかつて自由主義者であり、ジャーナリズム活動を理由に流刑に処されたが、帰還すると別人のような変貌を遂げた。『新時代』は誰もが読んでいるが、読者はその紙面から何を読み取るのだろうか？"
 rlit.023.a: "大衆向けの保守主義は、[ROOT.GetCountry.GetNameNoFormatting]の利益となる。"
 rlit.023.b: "スヴォーリンの報道機関は利用するが、彼の過激な意見は抑えさせよ。"
 rlit.023.c: "『#italic 新時代#!』は[ROOT.GetCountry.GetNameNoFormatting]の恥だ。"
 rlit.024.t: "王は死んだ"
 rlit.024.d: "保守派言論界の王たる[SCOPE.sCharacter('katkov_scope').GetFullName]が、長年にわたる論戦に疲れ果て、この世を去った。彼の月刊誌『#italic ロシア報知#!』を誰が引き継ぐのか、多くの者が注目している。"
 rlit.024.f: "彼の死は、ロシアの保守派文筆界の中心に、誰一人として埋めることのできない空白を残した。『#italic 戦争と平和#!』、『#italic アンナ・カレーニナ#!』、『#italic カラマーゾフの兄弟#!』、『#italic 罪と罰#!』というロシア四大長編小説を掲載してきた『#italic ロシア報知#!』は、今や新たな方向を見いださねばならない。保守派の言論界はどうなるのか？純粋な反動主義か、それとも穏健化か？あるいは、国家がそれを吸収し、独立という偽りの建前に終止符を打つのか？\n\nカトコフがいなければ、ロシア文学は違ったものになっていただろう。政治的な論説と並んでトルストイやドストエフスキーの掲載を厭わなかった姿勢が、彼の評価を一筋縄ではいかないものにしている。彼は、意図せずして人類普遍の理念に奉仕した、民族主義者だったのだ。"
 rlit.024.a: "『#italic ロシア報知#!』は、強硬な反動主義者に引き継がれる。"
 rlit.024.b: "『#italic ロシア報知#!』は、穏健な反動主義者の後継者に引き継がれる。"
 rlit.024.c: "国家が『#italic ロシア報知#!』を直接買収する。"
 rlit.025.t: "三人姉妹"
 rlit.025.d: "[SCOPE.sCharacter('chekhov_scope').GetFullName]の戯曲は何年にもわたってモスクワ芸術座を満員にしてきた。最新作の『#italic 三人姉妹#!』も、初演で観客から総立ちの喝采を浴びた。 "
 rlit.025.f: "「私たちの後の時代には、人は気球に乗って空を飛び、服の流行は変わり、第六感が発見されてそれが開花するかもしれない。だが、人生は変わらない。謎に満ち、厳しく、しかし幸福な人生のままだ。そしてたとえ今から千年経っても、人間はなおも『ああ！人生はなんて辛いのだろう！』と嘆息し、今と同じように死を恐れ、死にたくないと思うのだ」—\n\nアントン・チェーホフ"
 rlit.025.a: "[SCOPE.sCharacter('chekhov_scope').GetLastName]の思想をロシアのすべての都市に広めるべきだ。"
 rlit.025.b: "たまには希望に満ちた作品を書くよう、彼に依頼せよ。"
 rlit.025.c: "彼を旅に出せ！彼は訪問する先々でロシアの名を高めてくれるだろう。"
 rlit.026.t: "神の叡智の哲学者"
 rlit.026.d: "収容人数を超える聴衆で埋め尽くされた[ROOT.GetCountry.GetCapital.GetCityHubName]大学の講堂で、[SCOPE.sCharacter('solovyov_scope').GetFullName]が神秘神学について講演している。この哲学者が[ROOT.GetCountry.GetNameNoFlag]に精神的ルネサンスをもたらすのだと主張する者もいれば、依然として懐疑的な者もいる。"
 rlit.026.f: "講義の間、学生たちはその感情のこもった眼差しと長い髭を持つ男の姿を一目見ようと首を伸ばした。本物のヘレニズム学者でないにせよ、この[SCOPE.sCharacter('solovyov_scope').GetFullNameNoFormatting]は少なくともそれらしく見えるという噂だった。\n\n「自然そのものを愛さなければ、道徳的な方法で物質生活を組織することはできない」と哲学者が語ると、その言葉は講堂に響いた。何列もの学生たちがそれに同意して頷き、ペンを紙に走らせる音—熱心に取られるメモの音が後に続いた。"
 rlit.026.a: "ロシアの使命は精神的なものだ。"
 rlit.026.b: "神秘主義は、高揚をもたらす以上に社会を不安定にする。"
 rlit.026.c: "このような思想こそ、ロシアが文明にもたらす最大の贈り物となりうる。"
 rlit.027.t: "どん底から"
 rlit.027.d: "[SCOPE.sCharacter('gorky_scope').GetFullName]の『#italic どん底#!』が初日を迎えたが、批評家の意見は割れている。人間の苦難を描いた傑作だと評する者もいれば、描かれている人々の人生の暗鬱さに戸惑う者もいる。しかしながら、この作品に込められた政治的な含意を見過ごすことは難しい。"
 rlit.027.f: "「#italic 私#!がどう思うか、だと？」男は眼鏡を外し、目の前の新聞に目を細めた。「これまで23紙に、4か国語で劇評が載っている。木賃宿を舞台に、酔っ払いに娼婦、泥棒が登場する戯曲にしては—いや、#italic そうであるがこそ#!、#italic 驚くべき成果#!を上げている」\n\n「じゃあ、君も賛同するんだね？」彼の友人は考え込みながら尋ねた。\n\n「賛成だと？二度とあれを見ずに済むのなら、人生がどれだけ楽しくなることか」"
 rlit.027.a: "[SCOPE.sCharacter('gorky_scope').GetLastName]の政治活動は、やつの戯曲と同じくらい危険だ。"
 rlit.027.b: "激怒した天才より、大人しい天才の方がましだ。"
 rlit.027.c: "貧困に対処するには、まずその実態を明らかにしなければ。"
 rlit.029.t: "迫る嵐"
 rlit.029.d: "ある大臣が閣議に遅れて到着した。話を聞くと、私的な文学の集いに出席していたのだという。そこでは[SCOPE.sCharacter('blok_scope').GetFullName]が2時間にわたり、静まり返った40人の聴衆に向けて詩を朗読していたのだった。大臣は、[SCOPE.sCharacter('blok_scope').GetLastNamePossessive]の厳粛な詩風と稀有なリズム感には、[ROOT.GetCountry.GetName]を変革する力があると主張している。"
 rlit.029.f: "彼はまず、悲しくも希望に満ちた「#italic 美しき淑女の詩#!」を読みはじめた。すると部屋の空気が変わった。「淑女」は姿を消して堕落し、工場の煙がそれに取って代わった。朗読が終わるころには、居合わせた誰もがそれを感じていた—世界は変わろうとしている。神の意志によってではないのなら、人民の意志によって。\n\n「おお、我がロシアよ！おお、妻よ！我らが進む長い道のりは、痛いほどに明白だ。我らの道、それは古き意志のタタールの矢のように、我らの胸を貫いた」\n\n—アレクサンドル・ブローク"
 rlit.029.a: "彼の言葉の精神的な面を強調しよう。"
 rlit.029.b: "これらの詩を出版しなければならない。"
 rlit.029.c: "[SCOPE.sCharacter('blok_scope').GetLastName]は革命の吟遊詩人だ。全面的に支援せよ。"
 rlit.033.t: "キャバレー「野良犬」"
 rlit.033.d: "キャバレー「野良犬」は、[Glossary('glossary_silver_age','$glossary_silver_age|q$')]を生きる者たちの深夜の聖域となっていた。そこでは[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]が帝国のほかのどこにもない自由を謳歌し、小さな舞台には詩人や画家、踊り手たちがひしめいている。"
 rlit.033.f: "それは冒涜的であると同時に神聖でもあった。洗練された社会からの疎外感を抱く、まさに野良犬のような人々が催す詩の朗読会、演劇、議論。警官たちは好奇と警戒の色が入り混じった表情で、階段の上からじっと監視していた。\n\n「ここに集うのは酔っ払いと娼婦ばかり。歓びもなく肩を寄せ合う！」\n\n— アンナ・アフマートヴァ"
 rlit.033.a: "籠の鳥は歌う。自由な鳥は舞い上がる。"
 rlit.033.b: "バリケードを築かれるより、地下室で群れていてくれるほうがありがたい。"
 rlit.033.c: "ボヘミアは、革命の待合室だ。"
 rlit.035.t: "銀の時代の絶頂期"
 rlit.035.d: "サロンの集いは午前3時を過ぎても続いている。リテイニー通りのメレシコフスキー夫妻の邸宅では、[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]が2日間ぶっ通しで、眠ることも忘れて思想について議論している。"
 rlit.035.f: "満席のキャバレー「野良犬」では、[SCOPE.sCharacter('akhmatova_scope').GetFullNameNoFormatting]と[SCOPE.sCharacter('gumilev_scope').GetFullNameNoFormatting]が、同じ舞台上で彼らの結婚生活を演じつつ、詩を朗読していた。[SCOPE.sCharacter('tsvetaeva_scope').GetFullNameNoFormatting]は20歳そこそこにすぎないが、すでに圧倒的な存在感を放っている。マンデリシュタームは、凍てつく安部屋で水晶のように精緻な詩を紡いでいる。ロシアの泥と煤の底から立ち上がるこの巨大な文化の山をどう活用すべきなのか、それは誰にもわからない。\n\n「なぜこの世紀は、他の時代よりも悪いのだろう？もしかするとそれは、悲しみと不安の中で、最も黒い潰瘍に触れたものの、与えられた時間のうちにそれを癒すことができなかったからかもしれない」\n\n— アンナ・アフマートヴァ"
 rlit.035.a: "この奇跡は、国の制度に取り込まなければ。"
 rlit.035.b: "進むべき道は、カフェやサロンが示してくれよう。"
 rlit.035.c: "実にくだらん戯れだ！文学は政府に奉仕するものでなくてはならぬ。"
 rlit.036.t: "岐路を越えて"
 rlit.036.d: "演劇が再び花開き、地下サロンに集う文人たちが傑作を生み出すなか、批評家たちは、[ROOT.GetCountry.GetAdjective]文学がかつてない高みに達し、今後これを超えることはないかもしれないと評している。今や成熟を遂げた[ROOT.GetCountry.GetAdjectiveNoFormatting]の[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]は、この先数十年、どのような道を歩むのだろうか？"
 rlit.036.f: "「最近の$RUS$の作品を見たかい？」\n\nアブサンのせいでピエールの頭はくらくらしていた。彼は声のするほうへ、目だけをちらりと動かした。声の主はうまく視界に収まらなかったが、頭を動かして吐き気に襲われたくはなかった。「何だって？」\n\n「だから、最近の$RUS$の作品を見たかって聞いてるんだ。アフマートヴァの詩とか、チェーホフの戯曲とかをさ…」\n\n「ああ、ああ、もちろん…って、チェーホフを知らない奴なんているか？ロシア文学だろ？」\n\n足音が聞こえ、声の主が視界に入ってきた——ジャンだ。パンの籠を抱え、見下すような笑みを浮かべている。ジャンはピエールの隣に腰を下ろし、籠をテーブルに置いて言った。「知らない奴がほとんどさ、賭けたっていい。気の毒なことだ」"
 rlit.036.a: "[ROOT.GetCountry.GetRuler.GetFirstName]を称えよ！[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]にして詩神たる御方を！"
 rlit.036.b: "革命は、自らを歌いあげる詩人たちを手にすることだろう。"
 rlit.036.c: "ロシアの魂は、#italic ミール#!（農村共同体）の中にこそ見いだされるはずだ。"
 rlit.036.opt_d: "我々の文学こそ、世界の文学なのだ。"
 rlit.036.e: "時代が終わりを告げようとしている。"
 rlit.052.t: "英国風の服を着た男"
 rlit.052.d: "[SCOPE.sCharacter('kharms_scope').GetFullName]は、ひょうたんパイプを手に英国の伊達男風に装うことで、[ROOT.GetCountry.GetCapital.GetCityHubName]の人々の間でよく知られた男である。そんな彼が、反政府系の児童文学作家グループの一員であるとの容疑で、数名の仲間と一緒に逮捕された。"
 rlit.052.f: "証拠は、子供向けの一部の詩が唯物論的ではないと判断されたことであった。彼は尋問の末、次世代を形成するという大義に重大な損害を与え、現代の具体的な現実から彼らを誘惑して遠ざけたことを認めた。彼は矯正労働収容所での3年間の刑を言い渡されたが、おそらくは流刑に処されることだろう。一方、彼の真の仕事である不条理主義の散文や戯曲は一度も出版されたことがなく、取調官たちはほぼ確実にその存在を知らない。彼の作品は、この世紀そのものを映し出している——ナンセンスがナンセンスを呼ぶこの世紀を。\n\n「詩というものは、それを窓に投げつけたなら、ガラスが割れるような書き方をしなければならない」\n\n— ダニイル・ハルムス"
 rlit.052.a: "オベリウは反政府的な戯言だ。やつは朽ち果てさせればよい。"
 rlit.052.b: "彼を児童文学の執筆に戻らせよう。"
 rlit.052.c: "禁止令が下る前に、最後に一度だけ公演を許可しよう。"
 rlit.052.opt_d: "彼を心神喪失として扱え。"
