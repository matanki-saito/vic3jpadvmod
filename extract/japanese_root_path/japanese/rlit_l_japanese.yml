 RLIT_ROUTE_RADICAL_POINTS: "#v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_radical').GetValue|0]#!"
 RLIT_ROUTE_SPIRITUAL_POINTS: "#v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_spiritual').GetValue|0]#!"
 RLIT_ROUTE_UNIVERSAL_POINTS: "#v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_universal').GetValue|0]#!"
 RLIT_ROUTE_OFFICIAL_TT: "#tooltip_header 専制主義#!\n$TOOLTIP_DELIMITER$\n国家が利用できる作家を保護し、利用できない作家を沈黙させることで勢いを増す。\n\n現状: #v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_official').GetValue|0]#!\n\n$RLIT_ROUTE_COMMON_TT$"
 RLIT_ROUTE_RADICAL_TT: "#tooltip_header 革命主義#!\n$TOOLTIP_DELIMITER$\n批評家や地下出版物に言論の場を与え、処罰された者たちを殉教者に押し上げることで勢いを増す。\n\n現状: #v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_radical').GetValue|0]#!\n\n$RLIT_ROUTE_COMMON_TT$"
 RLIT_ROUTE_SPIRITUAL_TT: "#tooltip_header 精神主義#!\n$TOOLTIP_DELIMITER$\n西欧派よりもスラブ派の伝統を重んじることで獲得できる。\n\n現状: #v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_spiritual').GetValue|0]#!\n\n$RLIT_ROUTE_COMMON_TT$"
 RLIT_ROUTE_UNIVERSAL_TT: "#tooltip_header 普遍主義#!\n$TOOLTIP_DELIMITER$\nロシアの作家に西欧との交流を認めることで獲得できる。\n\n現状: #v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_universal').GetValue|0]#!\n\n$RLIT_ROUTE_COMMON_TT$"
 RLIT_ROUTE_COMMON_TT: "@information! この[concept_journal_entry]の終結時に最も勢いのある#b 路線#!によって、この時代が後世に遺すものが決まる"
 glossary_pochvennichestvo: "土壌主義"
 glossary_pochvennichestvo_desc: "#b;italic 土壌主義#!は19世紀後半のロシア帝国における保守主義運動であり、スラブ主義と密接に関連している。彼らの主な主張の一つは農奴解放の必要性であり、その名称は「故郷の土壌への回帰」を意味している。"
 glossary_silver_age: "銀の時代"
 glossary_silver_age_desc: "#b;italic 銀の時代#!は19世紀後半から20世紀初頭のロシア文学における偉大な創造の時代であり、世界の現状に幻滅した作家たちがリアリズムから離れるのに伴い、詩が隆盛を極めた。この時代はまた、女性による文学作品が社会、特に学問の世界に影響を与える道を開いたとも評価されている。西洋史においては、「ベル・エポック」などの用語と類似性を見出すことができる。"
