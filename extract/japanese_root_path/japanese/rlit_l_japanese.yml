 je_rlit_golden_age: "ロシアの魂: 黄金時代"
 je_rlit_golden_age_reason: "批評家たちは、[ROOT.GetCountry.GetAdjectiveNoFlag]文学がついに自らの声を見出し、ロシア語は檻から解き放たれたと評している。文芸誌や出版契約が急増し、詩人も作家もその恩恵に浴しているが、この文学熱を野放しにしておいてよいのだろうか？玉座にある者は、誰を庇護し、誰を抑圧し、誰を殉教者として死なせるかを決めなければならない。これらの決断が、この先長きにわたり、帝国の知的風土を形づくることになるだろう。"
 je_rlit_golden_age_status: "ロシア文学は黄金時代の真っ只中にある"
 je_rlit_crossroads: "ロシアの魂: 岐路"
 je_rlit_crossroads_reason: "[ROOT.GetCountry.GetAdjectiveNoFlag]文学の黄金時代は幕を閉じた。その偶像と殉教者たちが形づくった論争は、今や新たな形をとりつつある。文学が奉仕するのは神か、ツァーリか、革命か、それとも全人類なのか？作家が国家との関係を自覚し、その関係が辿ってきた長い歴史を知った今、散文はどこまで変わりうるのか？ロシアの詩人は、単なる詩人以上の存在なのか？\n\nこれらの問いに、まだ答えはない。だが、肥沃な黒土の中からその答えを掘り起こそうとする者たちがいる。"
 je_rlit_crossroads_status: "ロシア文学は岐路に立っている"
