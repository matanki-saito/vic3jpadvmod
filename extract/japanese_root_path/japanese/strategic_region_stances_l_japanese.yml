l_japanese:
 # Stances
 stance_none: "なし"
 stance_conquer_region: "地域の征服"
 stance_protect_region: "地域の守護"
 stance_colonize_region: "地域の植民地化"
 stance_none_desc: "この$concept_strategic_region_stance_short$をとる[concept_country]は、この[Concept('concept_strategic_region', '$concept_strategic_region_short|q$')]に特段の野心を抱いていませんが、好機と見れば行動を起こすこともあります。"
 stance_conquer_region_desc: "この$concept_strategic_region_stance_short$をとる[concept_country]は、この[Concept('concept_strategic_region', '$concept_strategic_region_short|q$')]に領土的野心を抱き、勢力圏を広げようとします。"
 stance_protect_region_desc: "この$concept_strategic_region_stance_short$をとる[concept_country]は、[Concept('concept_strategic_region', '$concept_strategic_region_short|q$')]の現状を維持し、[Concept('concept_local_country', '$concept_local_countries|q$')]を[Concept('concept_rivalry','$concept_rivals|q$')]から守ります。"
 stance_colonize_region_desc: "この$concept_strategic_region_stance_short$をとる[concept_country]は、すでに存在する[Concept('concept_local_country', '$concept_local_countries|q$')]を顧みず、この[Concept('concept_strategic_region', '$concept_strategic_region_short|q$')]で植民地化を進めようとします。"
 # Conduct
 stance_none_behavior: "$EFFECT_LIST_BULLET$[STRATEGIC_REGION.GetName]に特別な関心は示さない"
 stance_conquer_region_behavior: "$EFFECT_LIST_BULLET$[STRATEGIC_REGION.GetName]の[Concept('concept_local_country', '$concept_local_countries|q$')]に野心の矛先を向ける\n$EFFECT_LIST_BULLET$[Concept('concept_local_country', '$concept_local_countries|q$')]に対する[concept_attitude]が敵対的になる"
 stance_protect_region_behavior: "$EFFECT_LIST_BULLET$[STRATEGIC_REGION.GetName]の友好的な[Concept('concept_local_country', '$concept_local_countries|q$')]に味方する\n$EFFECT_LIST_BULLET$[Concept('concept_local_country', '$concept_local_countries|q$')]に対する[concept_attitude]がより好意的になる\n$EFFECT_LIST_BULLET$その地域で征服に乗り出そうとする[Concept('concept_rivalry','$concept_rivals|q$')]に対抗する"
 stance_colonize_region_behavior: "$EFFECT_LIST_BULLET$[STRATEGIC_REGION.GetName]の領有権が主張されていない土地に入植する\n$EFFECT_LIST_BULLET$その地域の[Concept('concept_unrecognized_power', '$concept_unrecognized_power_short|q$')]である[Concept('concept_local_country', '$concept_local_countries|q$')]に対して勢力拡大を図る"
 # AI Values
 AI_REGION_STANCE_BASE_VALUE: "#b 基本値#!"
 AI_REGION_STANCE_NUMBER_OF_CLAIMS: "[Concept('concept_claim', '$concept_claims|q$')]数"
 AI_REGION_STANCE_CAPITAL_REGION: "[Concept('concept_capital_state', '$concept_capital_state_short|q$')]の[Concept('concept_strategic_region', '$concept_strategic_region_short|q$')]"
 AI_REGION_STANCE_WANTS_TO_OPEN_UP_JAPAN: "#b $JAP$#!を開国させたいと考えています"
 AI_REGION_STANCE_IS_LOYAL_SUBJECT: "#b 忠実#!な[concept_subject]です"
 AI_REGION_STANCE_FREE_REAL_ESTATE: "$concept_decentralized_nations$や[Concept('concept_unrecognized_power', '$concept_unrecognized_powers|q$')]が保有する[Concept('concept_state', '$concept_states|q$')]"
 AI_REGION_STANCE_CIVILIZING_MISSION_RESEARCHED: "[GetTechnology('civilizing_mission').GetName]を調査しました"
 AI_REGION_STANCE_QUININE_RESEARCHED: "[GetTechnology('quinine').GetName]を調査しました"
 AI_REGION_STANCE_EXISTING_REGION_STANCES: "既存の$concept_strategic_region_stances_short$"
 AI_REGION_STANCE_SMALL_COUNTRY: "[Country.GetName]が小$concept_country$である"
 AI_REGION_STANCE_COLONIAL_COUNTRY: "[Country.GetName]が$concept_colony$である"
 # Tooltip
 STRATEGIC_REGION_AI_STANCE_BEHAVIOR_TITLE: "#title [Country.GetName]は以下の行動をとる:#!"
 STRATEGIC_REGION_AI_STANCE_TT_HEADER: "#title [StrategicRegion.GetName]におけるこの[Concept('concept_strategic_region_stance', '$concept_strategic_region_stance_short|q$')]への評価値は#v [Country.GetAIStrategicRegionStanceScoreIn(StrategicRegion.Self)|0]#!。要因:#!"
 STRATEGIC_REGION_AI_STANCE_BREAKDOWN: "[Country.GetAIStrategicRegionStanceDescIn(StrategicRegion.Self)]"
 STRATEGIC_REGION_AI_STANCE_ATTENTION_ELSEWHERE_TITLE: "#title [Country.GetName]の関心は、むしろ以下$concept_strategic_regions_short$に向いている:#!"
 STRATEGIC_REGION_AI_STANCE_ATTENTION_ELSEWHERE_ENTRY: "[StrategicRegion.GetName]"
 # Regional objectives
 REGIONAL_OBJECTIVE_TYPE: "[Concept('concept_regional_objective', '$concept_regional_objective|q$')]"
