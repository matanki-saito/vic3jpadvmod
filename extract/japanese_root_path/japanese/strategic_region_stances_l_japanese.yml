 REGIONAL_OBJECTIVE_STANCE_ENTRY: "[AIRegionalObjective.GetRegion.GetName]で[AIRegionalObjective.GetStance.GetNameNoFormatting]"
 REGIONAL_OBJECTIVE_STARTED: "#v [AIRegionalObjective.GetStartDate]#!に着手"
 REGIONAL_OBJECTIVE_COMPLETED: "#v [AIRegionalObjective.GetConclusionDate]#!に達成"
 REGIONAL_OBJECTIVE_FAILED: "#v [AIRegionalObjective.GetConclusionDate]#!に失敗"
 REGIONAL_OBJECTIVE_CONCLUDED: "最終的には、[AIRegionalObjective.GetRegion.GetName]において新たな[concept_regional_objective]が代わりに開始されることがあります。"
 REGIONAL_OBJECTIVE_TARGETS_TITLE: "#title 対象:#!"
 REGIONAL_OBJECTIVE_TARGET_COUNTRY: "[Country.GetName]"
 REGIONAL_OBJECTIVE_TARGET_STATE: "[State.GetName]"
 REGIONAL_OBJECTIVE_ADDITIONAL_TARGET_COUNTRIES: "他[GetDataModelSize(DataModelSkipFirst(AIRegionalObjective.GetTargetCountries, GetDefine('NGUI', 'REGIONAL_OBJECTIVE_MAX_TARGETS_SHOWN')))]件…"
 REGIONAL_OBJECTIVE_ADDITIONAL_TARGET_STATES: "他[GetDataModelSize(DataModelSkipFirst(AIRegionalObjective.GetTargetStates, GetDefine('NGUI', 'REGIONAL_OBJECTIVE_MAX_TARGETS_SHOWN')))]件…"
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_TITLE: "#title [Country.GetName]が目指すもの:#!"
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_COMPLETED_TITLE: "#title [Country.GetName]が#v [Country.GetRegionalObjectiveIn(StrategicRegion.Self).GetConclusionDate]#!に#b 達成#!:#!"
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_FAILED_TITLE: "#title [Country.GetName]が#v [Country.GetRegionalObjectiveIn(StrategicRegion.Self).GetConclusionDate]#!に#b 失敗#!:#!"
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_ENTRY: "[Country.GetRegionalObjectiveIn(StrategicRegion.Self).GetName]"
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_CONCLUDED: "最終的に、[Country.GetName]は[StrategicRegion.GetName]において新たな[concept_regional_objective]の達成を目指す場合があります。"
