l_japanese:
 GLOSSARY_OPEN_WEB_LINK: "もっと詳しく"
 GLOSSARY_OPEN_WEB_LINK_TOOLTIP: "ウェブブラウザで以下のリンクを開きます\n\n[GlossaryType.GetWebLink|v]"
 glossary_house_of_obrenovic: "オブレノヴィッチ家"
 glossary_house_of_obrenovic_short: "オブレノヴィッチ"
 glossary_house_of_obrenovic_desc: "#b;italic オブレノヴィッチ家#!は2つの対立する$SER_ADJ$王家のうちの1つで、第二次セルビア蜂起の指導者であり、#b セルビア公国#!の自立を確立した創設者である#b ミロシュ・オブレノヴィッチ#!の子孫である。$glossary_house_of_obrenovic_short$の支持者は通常、#b オーストリア#!との$concept_relations$強化を志向する。"
 glossary_house_of_karadjordjevic: "カラジョルジェヴィチ家"
 glossary_house_of_karadjordjevic_short: "カラジョルジェヴィチ"
 glossary_house_of_karadjordjevic_desc: "#b;italic カラジョルジェヴィチ家#!は、2つの対立する$SER_ADJ$王家のうちの1つで、#b オスマン帝国#!に立ち向かうも悲運の結末を迎えた第一次セルビア蜂起の指導者である#b カラジョルジェ#!の子孫である。$glossary_house_of_karadjordjevic_short$の支持者は通常、#b ロシア#!との$concept_relations$強化と、汎スラブ主義的な野心の追求を志向する。"
 glossary_ri: "里"
 glossary_ri_desc: "#b;italic 里#!は中国の#italic 里#!に由来する伝統的な単位である。\n\n里の規定上の長さは時代とともに変化したが、江戸時代後期では1里はほぼ36#italic 町#!、すなわち3.9kmに相当した。"
 glossary_uchikowashi: "打ち壊し"
 glossary_uchikowashi_desc: "#b;italic 打ち壊し#!とは、金貸し、米の買い占め人、価格をつり上げる商人など、道義に反するとみなされた者の財産を民衆が破壊する行為を指す。\n\nこれらの行為はしばしば略奪を伴ったが、打ち壊しの首謀者たちは多くの場合、自らの行為の正当性を示すために、あえて略奪を控えた。"
 glossary_zaibatsu: "財閥"
 glossary_zaibatsu_desc: "#b;italic 財閥#!とは、一族が所有し、垂直統合された産業・金融複合企業のことを指す。\n\n典型的な財閥は、持株会社と銀行を中核として組織されており、それらが複数の（主として産業系の）子会社の株式を保有する。財閥は江戸時代後期の商人一族による複合企業から生まれ、もともと持っていた資産と国家との結びつきを活用して、#b 日本#!の産業基盤の大部分に対する支配を固めた。\n\n財閥とみなされる$concept_companies$には、#v $company_mitsui$#!、#v $company_mitsubishi$#!、#v $company_yasuda$#!、#v $company_sumitomo$#!などがある。"
 glossary_gongen: "権現"
 glossary_gongen_desc: "#b;italic 権現#!とは、神の形を取って現れた仏を指す。これは土着の神格と、仏教的悟りをもたらす存在を結びつけたものである。"
 glossary_boddhisattva: "菩薩"
 glossary_boddhisattva_desc: "#b;italic 菩薩#!とは、仏教において、自ら悟りを得ながらも、他者が涅槃に至るのを助ける覚者および導師を指す。"
 glossary_decembrists: "デカブリストの乱"
 glossary_decembrists_desc: "#b;italic デカブリストの乱#!は、#b 1825年#!に#b 皇帝アレクサンドル1世#!が崩御した後、自由主義革命派である#b デカブリスト北方結社#!が企てたクーデター未遂事件である。\n\n革命派は、#b ロシア#!における立憲体制の樹立を目指し、3,000人の兵士を率いて#b サンクトペテルブルク#!の#b 元老院広場#!へと進軍したが、忠誠派の軍隊によって瞬く間に鎮圧された。\n\nデカブリストの乱は、#b 皇帝ニコライ1世#!の統治における最初の課題であった。"
 glossary_zemstvo: "ゼムストヴォ"
 glossary_zemstvo_desc: "#b;italic ゼムストヴォ#!は、#b グベールニヤ#!や#b ウエズド#!に設置される地方自治機関であり、ゼムストヴォの中心となるのは、地主、財産を有する都市の有権者、および農村共同体の代表による選挙で選出される議会である。この議会には、管轄区域における経済活動を管理する責任があり、その運営に必要な財源を確保するため、住民に賦役や租税を課す権限も認められている。"
 glossary_annexation_of_finland: "1809年の$FIN$併合"
 glossary_annexation_of_finland_desc: "1808年から1809年にかけて、#b スウェーデン王国#!と#b ロシア帝国#!の間でフィンランド戦争が勃発。和平交渉の結果、フレデリクスハムン条約が締結され、#b フィンランド大公国#!は#b ロシア帝国#!内の自治領となった。"
 glossary_establishment_of_congress_poland: "1815年の$dyn_c_congress_poland$成立"
 glossary_congress_poland_possessive: "ポーランド立憲王国"
 glossary_establishment_of_congress_poland_desc: "#b ナポレオン戦争#!で#b フランス#!が敗れたあと、1815年のウィーン会議で#b ロシア帝国#!に割譲された領土をもとに、#b $dyn_c_congress_poland$#!が成立した。"
 glossary_annexation_baltic_governorates: "$dyn_c_baltic_governorate$の併合"
 glossary_annexation_baltic_governorates_desc: "1700年から1721年にかけての大北方戦争の結果、スウェーデン領エストニアおよびスウェーデン領リボニアは、ニスタット条約によって#b スウェーデン#!から割譲された。その後、1795年の第三次ポーランド分割によって、#b クールラント・ゼムガレン公国#!が#b ロシア帝国#!に併合された。"
 glossary_peredvizhniki_artists: "ペレドヴィジニキ"
 glossary_peredvizhniki_artists_desc: "#b;italic ペレドヴィジニキ#!は、帝国芸術アカデミーを離れたロシアの写実派芸術家の一団で、移動派や移動展派とも呼ばれる。アカデミーが課す制約への抗議として、彼らは芸術家の協同組合を結成した。移動美術展協会は1871年から1923年まで活動し、数十回にわたる展覧会を開きながら国内各地を巡回した。"
 glossary_tomas_de_zumalacarregui: "トマス・デ・ズマラカレギ"
 glossary_tomas_de_zumalacarregui_desc: "#tooltip_header トマス・ズマラカレギ・アイマツ#!\n$TOOLTIP_DELIMITER$\n#v 1788年12月29日#!、ギプスコア州オルマイステギ生まれ\n#v 1835年6月24日#!、ギプスコア州ゼガマで死去\n\nトマス・デ・ズマラカレギ・エ・アイマツは兵士たちから「トマスおじさん」とも呼ばれたバスク出身の軍人であり、ナバラとバスク地方のカルリスタ軍の総司令官として、軍の組織化とカルリスタの初期の決定的な勝利に貢献した人物である。\n1835年の初夏、戦場での銃撃による彼の突然の死は、ドン・カルロスの野望に大きな打撃を与えた。"
 glossary_revolutions_of_1830: "1830年革命"
 glossary_revolutions_of_1830_desc: "#b;italic 1830年革命#!は、1830年7月に#b フランス#!で始まり、1831年半ばまで続いた、ヨーロッパ各地における自由主義およびロマン主義的ナショナリズムによる一連の革命である。革命家たちは、フランスで復古した#b ブルボン王政#!を打倒し、#b ベルギー#!、#b イタリア#!、#b ポーランド#!に独立した国民国家を樹立しようとした。これらの革命により、フランスでは#b 七月王政#!が成立し、#b ベルギー#!はレオポルド1世を国王とする独立国となった。\n\n#b 11月蜂起#!として知られる1830年のポーランド革命は、革命運動が#b ロシア帝国#!の西部諸県へ広がるきっかけとなり、蜂起が軍事的に敗北すると、[Glossary('glossary_establishment_of_congress_poland','$glossary_congress_poland_possessive|q$')]の自治の多くが撤回されることになった。"
 glossary_sejm: "セイム"
 glossary_sejm_short: "セイム"
 glossary_sejm_desc: "[GetLawType('law_landed_voting').GetName]に基づき、貴族層を代表するポーランドの二院制議会。"
 glossary_november_uprising: "11月蜂起"
 glossary_november_uprising_short: "11月蜂起"
 glossary_november_uprising_desc: "ポーランド立憲王国軍が主導した、ロシアの支配に対する大規模な反乱。同軍は、蜂起の鎮圧後に解体された。この蜂起は旧ポーランド・リトアニア共和国の人々から広範な支持を集めた。"
 glossary_third_partition: "第三次分割"
 glossary_third_partition_short: "第三次分割"
 glossary_third_partition_desc: "ポーランド・リトアニア共和国は1795年、$concept_great_powers$であるロシア、プロイセン、オーストリアによって分割された。"
 glossary_congress_of_vienna: "ウィーン議会"
 glossary_french_revolution: "フランス革命"
 glossary_1792: "#b 1792年#!"
 glossary_french_revolutionary_wars: "フランス革命戦争"
