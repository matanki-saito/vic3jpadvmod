 tsarpoints_events.13.t: "Imperial $concept_ukaz$ No. [ROOT.Var('ukaz_no_var').GetValue]"
 tsarpoints_events.13.d: "The failings of the [SCOPE.sCharacter('old_ruler_scope').GetPrimaryRoleTitle] of [SCOPE.sCountry('relevant_country_scope').GetName] have grown too great to ignore. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has issued an Ukaz to [ROOT.GetCountry.GetRuler.GetHerHis] agents within the [SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting] court to have the [SCOPE.sCharacter('old_ruler_scope').GetPrimaryRoleTitle] replaced by a more amicable contender."
 tsarpoints_events.13.f: ""[ROOT.GetCountry.GetRuler.GetSheHe|U] used to line up [ROOT.GetCountry.GetRuler.GetHerHis] little toy men," the old Empress Dowager mused, "from most to least favorite. Somehow, even though [ROOT.GetCountry.GetRuler.GetSheHe] played more with the favorites, the least favorite ones were always the first ones to go missing and need replacement."\n\nShe sighed.\n\n"Perhaps not much has changed!""
 tsarpoints_events.13.a: "Send for a candidate from the Baltic German nobility."
 tsarpoints_events.13.b: "Appoint a son of the [ROOT.GetCountry.GetAdjectiveNoFormatting] court."
 tsarpoints_events.13.c: "We have an august local candidate in [SCOPE.sCharacter('local_puppet_ruler_scope').GetFullName]."

 install_baltic_german_noble_tt: "A [SCOPE.sCharacter('tsar_scope').GetInterestGroup.GetTextIcon] [SCOPE.sCharacter('tsar_scope').GetIdeology.GetName] [GetCulture('east_german').GetName] noble will become [SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('relevant_country_scope').GetName]"
 install_russian_noble_tt: "A [SCOPE.sCharacter('tsar_scope').GetInterestGroup.GetTextIcon] [SCOPE.sCharacter('tsar_scope').GetIdeology.GetName] [GetCulture('russian').GetName] noble will become [SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('relevant_country_scope').GetName]"
 install_local_noble_tt: "[SCOPE.sCharacter('local_puppet_ruler_scope').GetFullName], a [SCOPE.sCharacter('tsar_scope').GetInterestGroup.GetTextIcon] [SCOPE.sCharacter('local_puppet_ruler_scope').GetIdeology.GetName] [SCOPE.sCharacter('local_puppet_ruler_scope').GetCulture.GetName] noble, will become [SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('relevant_country_scope').GetName]"

 tsarpoints_events.14.t: "The Reign of the Caesars"
 tsarpoints_events.14.d: "With the weight of more than three hundred years of autocratic rule behind him, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] rules [ROOT.GetCountry.GetName] with a hand of iron. The Autocracy that survived the Napoleonic Wars must now face the world it left behind."
 tsarpoints_events.14.f: "Finally, we call upon all our faithful subjects to join us in fervent prayers to the Almighty, that he will grant us strength to bear the burden he has, in his Divine Providence, laid upon us, that he may preserve in us the firm resolution to live solely for our beloved country, and to tread in the footsteps of the Monarch whom we now deplore.\n\nMay our reign be nothing but a continuation of his, and may we fulfill all the wishes for Russia's happiness, which animated him, whose sacred memory shall preserve in us the endeavor and hope, to merit the blessing of Heaven, and the love of our people.\n\n#italic Manifesto on the Ascension to the Throne of Emperor Nicholas I #!"
 tsarpoints_events.14.a: "God Save the Tsar!"
 tsarpoints_events.14.b: "One day, may the [ROOT.GetCountry.GetAdjective] people be rid of their yoke."
 tsarpoints_events.14.tt_1: "As [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] of [ROOT.GetCountry.GetName], you now command @tsarpoints! [concept_tsarpoints], tracked in the #b $je_tsarpoints_master$#! [concept_journal_entry]"
 tsarpoints_events.14.tt_2: "Complete the #b agendas#! of your [concept_ruler] and [concept_favorite] to #g earn#! [concept_tsarpoints], then #g spend#! them on powerful [Concept('concept_ukaz','$concept_ukase|q$')]"

 tsarpoints_events.15.t: "Imperial $concept_ukaz$ No. [ROOT.Var('ukaz_no_var').GetValue]"  # Counter-Revolution
 tsarpoints_events.15.d: "The outbreak of Revolution across Europe has roused [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] to action. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] has issued an order to [ROOT.GetCountry.GetAdjective] embassies in the West to aid the monarchies under threat, and for the Army to make ready for war."
 tsarpoints_events.15.f: "The door burst open, and in rushed a whirlwind of cold air, coats, and clunking boots. A dozen pairs of eyes snapped towards the source of the sound.\n\n"I have news from Sergey Alexandrovich!" gasped the man who had just rushed in. "He heard from his sergeant, who heard from a palace guardsman, who said the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] spoke at a ball, from among... among...." The breathless report was buried beneath a barrage of coughs. He doubled over against a bedframe.\n\nOne of the men on the bunks, his hands frozen in the middle of polishing a button, spoke up. "What did he say? Come on, man!"\n\n"He said... the guardsman heard it- "Saddle your horses, gentlemen, France is a Republic!"""
 tsarpoints_events.15.a: "The [ROOT.GetCountry.GetAdjectiveNoFormatting] Army shall set Europe straight."

