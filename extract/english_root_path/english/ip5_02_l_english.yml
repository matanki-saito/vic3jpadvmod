 je_tp_fav_rasputin: "Healing the Future"
 je_tp_fav_rasputin_reason: "#italic "God has seen your tears and heard your prayers. Do not grieve. The Little One will not die. Do not allow the doctors to bother him too much." —Grigoriy Rasputin#!\n\n [SCOPE.sCharacter('fav_character_scope').GetFullName], the current [concept_favorite] of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], has won the admiration of the [ROOT.GetCountry.GetCustom('get_rus_consort_title')] for saving [SCOPE.sCharacter('alexei_scope').GetFullNameWithTitle] from death's door when the court doctors could not. While [SCOPE.sCharacter('fav_character_scope').GetLastNameNoFormatting]'s methods are markedly unusual, the prognosis of [SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting]'s health has significantly improved under the faith healer's care. As [SCOPE.sCharacter('fav_character_scope').GetLastNameNoFormatting]'s influence grows in [ROOT.GetCountry.GetCapital.GetCityHubName], many demand [SCOPE.sCharacter('fav_character_scope').GetHerHis] dismissal. But the [ROOT.GetCountry.GetCustom('get_rus_consort_title')] insists — [SCOPE.sCharacter('fav_character_scope').GetFullNameNoFormatting] must stay. [SCOPE.sCharacter('fav_character_scope').GetHerHis|U] healing is crucial to [SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting]'s survival. To send [SCOPE.sCharacter('fav_character_scope').GetLastNameNoFormatting] away will surely seal a tragic fate for the young [SCOPE.sCharacter('alexei_scope').GetPrimaryRoleTitle]."
