 je_tp_tsar_gendarme_of_europe: "Gendarme of Europe"
 je_tp_tsar_gendarme_of_europe_reason: "Formulated by #b Sergey Uvarov#! in #b 1833#!, the ideological doctrine of #b 'Orthodoxy, Autocracy, and Nationality'#! exemplifies the personal and political outlook of [SCOPE.sCharacter('nicholas_i_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nicholas_i_scope').GetFullName].\n\nA zealous arch-reactionary, the [SCOPE.sCharacter('nicholas_i_scope').GetPrimaryRoleTitle] is committed to the principles of order and autocracy, both domestically and internationally, and will not hesitate to use great force to prevent another [Glossary('glossary_decembrists','Decembrist')] or [GetCulture('polish').GetName] uprising from ever taking place again."

 je_tp_tsar_great_reform: "The Great Reformer"
 je_tp_tsar_great_reform_reason: "$je_great_reformer_reason$"

 je_tp_tsar_crown_of_perfection: "Crown of Perfection"
 je_tp_tsar_crown_of_perfection_reason: "From an early age, [SCOPE.sCharacter('nixa_scope').GetFullName] has been lauded by his tutors as a golden child, destined to become the most enlightened ruler in all the world. His ascension to the throne has been hailed by the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] as the coming of a new Peter the Great.\n\nSteeped in the hopes of the $ig_intelligentsia$ for all his life, [SCOPE.sCharacter('nixa_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nixa_scope').GetFirstNameNoFormatting] has come to view himself as an enlightened patriarch, tasked with continuing the work of [SCOPE.sCharacter('nixa_scope').GetHerHis] father and raising [ROOT.GetCountry.GetName] from backwardness to the fore of Europe. Under [SCOPE.sCharacter('nixa_scope').GetHerHis] benevolent guidance, an Empire of peasants will become a modern nation, and the court of [ROOT.GetCountry.GetCapital.GetCityHubName] will become a leading light of the world."

 je_tp_tsar_unshakable_autocracy: "Unshakeable Autocracy"
 je_tp_tsar_unshakable_autocracy_reason: "Austere, bearded, and colossal in stature, [SCOPE.sCharacter('alexander_iii_scope').GetFullName] was intended by his reform-inclined father to serve in an ordinary Grand Ducal military career. Such was not to be. The untimely death of [SCOPE.sCharacter('alexander_iii_scope').GetHerHis] older brother placed the responsibilities of rule squarely at his unprepared feet.\n\nAs [SCOPE.sCharacter('alexander_iii_scope').GetPrimaryRoleTitle], [SCOPE.sCharacter('alexander_iii_scope').GetFirstNameNoFormatting] has approached governance with the coarse, nationalistic mindset of the Russian soldiery. He has surrounded himself with reactionary advisors, and views any concession to liberalism as a lethal threat to the Empire. To him, autocracy is a sacred trust between [SCOPE.sCharacter('alexander_iii_scope').GetPrimaryRoleTitle] and subjects, and to deny it is to deny God Himself."

 je_tp_tsar_heir_of_alexander: "The Reluctant Autocrat" # alt Heir of Alexander
 je_tp_tsar_heir_of_alexander_reason: "In [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] youth, [SCOPE.sCharacter('nicholas_ii_scope').GetFullName] had been reluctant to take the throne. Whilst the stern instruction of his beloved father and reactionary tutors have steeled [SCOPE.sCharacter('nicholas_ii_scope').GetHerHim] to [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] role as unquestionable autocrat, [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] indecisiveness and desire to please all comers remains.\n\nThe result of this upbringing has been a peculiar contradiction—a ruler inclined to center all power around himself, yet with little competence in applying it. Absent his own vision, [SCOPE.sCharacter('nicholas_ii_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('nicholas_ii_scope').GetFirstNameNoFormatting] wishes to continue in the mold of [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] father, with pious faith and the maintenance of what [SCOPE.sCharacter('nicholas_ii_scope').GetSheHe] sees as [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] divine right to rule always at the center of [SCOPE.sCharacter('nicholas_ii_scope').GetHerHis] mind."

 # Reform Bundle
 je_tp_pool_establish_duma: "Convene [GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')]"
 je_tp_pool_establish_duma_concluded: "Convene the Duma"
 je_tp_pool_establish_duma_reason: "It has become clear that the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] cannot rule alone. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has accepted the necessity of expanding [ROOT.GetCountry.GetRuler.GetHerHis] pool of advisors and engaging the public in the increasingly complex governance of the Empire. To realize these ends, [ROOT.GetCountry.GetRuler.GetSheHe] wishes to convene [GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')][GetPlayer.GetCustom('rus_duma_or_zemsky_sobor_2')]."
 je_tp_pool_bureaucratic_reform: "Initiate Bureaucratic Reform"
 je_tp_pool_bureaucratic_reform_reason: "The shortcomings of the [ROOT.GetCountry.GetAdjective] state bureaucracy are clear to any who witness them. Governorates the size of European countries are staffed by a handful of bureaucrats and a scant military garrison, and communities of dissidents live unharried within the forests of Siberia. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has taken it upon [ROOT.GetCountry.GetRuler.GetHerselfHimself] to extend the reach of the state apparatus to every village of the Empire, and make legible her vast territories."
 je_tp_pool_educational_reform: "Initiate Educational Reform"
 je_tp_pool_educational_reform_reason: "The [ROOT.GetCountry.GetAdjective] state floats atop a sea of illiterate peasants, often unable to reach below the surface. This widespread illiteracy threatens [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]'s desired economic agenda, and fosters the spread of superficial radicalism. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] wishes to see investment into the sciences, the education of the populace, and the emergence of a native Russian class of educators."
 je_tp_pool_citizenship_reform: "Initiate Citizenship Reform"
 je_tp_pool_citizenship_reform_reason: "The territory of [ROOT.GetCountry.GetName] contains a great multitude of peoples, and broad tracts within which Russian is spoken only by the high officialdom. To alienate these communities would be disastrous to state's ability to govern. To this end, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] wishes to establish a framework of citizenship within the Empire, and to broaden the rights of her minority communities."
 je_tp_pool_decrease_landowner_influence: "Weaken the Gentry"
 je_tp_pool_decrease_landowner_influence_reason: "The Russian gentry, historically wedded to antiquated modes of production and prone to palace coups, serves as a threatening counterweight to any reformist program. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] wishes to weaken their political clout in favor of receptive intellectuals, the state bureaucracy, and the productive classes."

 landowners_ideology_close_enough_tt: "The [concept_leader] of the [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] ([GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetIdeology.GetName]) has an [concept_ideology] compatible with the [concept_ruler] ([ROOT.GetCountry.GetRuler.GetIdeology.GetName])"

 legislature_zemsky_sobor_followup: ", the ancient Parliament of the Russian Tsardom"
 legislature_duma_followup: " to serve as a broadly-elected lower house for the State Council"

 # Reaction Bundle
 je_tp_pool_abolish_duma: "Dissolve [GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')]"
 je_tp_pool_abolish_duma_concluded: "Dissolve the Duma"
 je_tp_pool_abolish_duma_reason: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] views the convention of [GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')] as a mortal threat to the integrity of the Empire. The schemes of politicians threaten the standing of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and [ROOT.GetCountry.GetRuler.GetHerHis] family, and revolutionaries abuse their legislative privileges to speak treason on its floor. [ROOT.GetCountry.GetRuler.GetSheHe|U] desires to have this body dissolved, and [ROOT.GetCountry.GetRuler.GetHerHis] proper autocratic powers restored."
 je_tp_pool_secret_police: "Strengthen Public Security"
 je_tp_pool_secret_police_reason: "The fate of Western absolutism beneath the Revolutionary guillotine has taught [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] that would-be assassins and revolutionaries lurk behind every corner. For every agitator that the security services send to $geographic_region_siberia$, ten more lurk beyond their reach in peasant villages, suburban basements, and Swiss hotels.\n\nTo combat these threats, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] desires a [GetLawType('law_secret_police').GetName] capable of shining a light into the darkest crevices of [ROOT.GetCountry.GetName], and ensuring that there remains no hidden place from which revolutionaries may contest [ROOT.GetCountry.GetRuler.GetHerHim].[ROOT.GetCountry.GetCustom('getOkhranaInstructions')]"
 je_tp_pool_suppress_revolts: "Suppress Political Dissent"
 je_tp_pool_suppress_revolts_reason: "For a century, the Tsars have feared the dual threats of palace coup and peasant revolt. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], well-aware of the devastation of the Pugachevshchina and the fates of Catherine's heirs, wishes to ensure that no plot against [ROOT.GetCountry.GetRuler.GetHerHis] rule may shake [ROOT.GetCountry.GetRuler.GetHerHim] from the throne—whether it comes from the fields of Orenburg or the halls of the Winter Palace."
 je_tp_pool_suppress_revolts_goal: "Has not had any [concept_insurrection] or [concept_coup] for [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_goal_duration_years_value')|v0] years"
 je_tp_pool_develop_capital: "Develop the Capital"
 je_tp_pool_develop_capital_reason: "[ROOT.GetCountry.GetCapital.GetCityHubName], seat of the [ROOT.GetCountry.GetAdjective] [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]s and court nobility, is already known as one of the foremost cities of Europe. Viewing the city's status as a metaphor for the prestige of the Russian autocracy, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] wishes for it to rival Paris or London as a model Imperial capital—cultured, prosperous, and serene."
 je_tp_pool_cultural_dominance: "Maintain Russian Dominance"
 je_tp_pool_cultural_dominance_reason: "The doctrine of Count #b Sergey Uvarov#!, Minister of Education of Nicholas I, has established [GetCulture('russian').GetName] national identity as one of the three pillars of the Empire. A staunch believer in $russian$ nationality, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] believes that the [GetCulture('russian').GetName] culture must be held as supreme, and national minorities and foreign cultures prevented from challenging its dominance."
 je_tp_pool_cultural_dominance_goal: "The [concept_political_strength] share of the [GetCulture('russian').GetName] [concept_culture] has remained above [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_cultural_dominance_polstr_share_value')|v0%] for [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_goal_duration_years_value')|v0] years"

 okhrana_button_hint_tt: "\n\n@information! The #v $rus_upgrade_secret_police$#! [concept_decision] may be used to reform the [GetLawType('law_third_section').GetName] [concept_law] into the [GetLawType('law_okhrana').GetName]"

 no_ongoing_coup_tt: "Does #b not#! have any ongoing [concept_coup]"
 europe_not_affected_by_revolutions_tt: "Fears of a [Concept('concept_revolution','$concept_revolutionary|q$')] #b Springtime#! have been allayed"
 springtime_over_tt: "The #b Springtime of the Peoples#! has concluded"
 springtime_liberal_country_expanded_tt: "For a [concept_country] to have a liberal [Concept('concept_revolution','$concept_revolutionary|q$')] government:\n$EFFECT_LIST_BULLET$ Has #b not#! had a #b Conservative#! victory in the #v $je_springtime_of_the_peoples$#!\n$EFFECT_LIST_BULLET$ Has #b not#! had a #b Counter-Revolutionary#! victory in #v $je_red_summer$#!\n$EFFECT_LIST_BULLET$ Any of the following: #indent_newline:3 \n$EFFECT_LIST_BULLET$ Had a successful [concept_revolution]\n$EFFECT_LIST_BULLET$ Has an active #v $je_red_summer$#! [concept_journal_entry]\n$EFFECT_LIST_BULLET$ Had a #b Liberal#! or #b Radical#! victory in #v $je_red_summer$#!\n$EFFECT_LIST_BULLET$ All of the following: #indent_newline:3 \n$EFFECT_LIST_BULLET$ Had a recent [concept_revolution] or [concept_coup]\n$EFFECT_LIST_BULLET$ $has_census_voting_or_universal_suffrage_tt$\n$EFFECT_LIST_BULLET$ $has_national_guard_or_guaranteed_liberties_tt$\n$EFFECT_LIST_BULLET$ $has_right_of_assembly_or_protected_speech_tt$#!#!\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],springtime_revolutionary_countries_list_tt Current [Concept('concept_country','$concept_countries|q$')] with liberal [Concept('concept_revolution','$concept_revolutionary|q$')] governments#!"
 JE_SPRINGTIME_REVOLUTIONARY_COUNTRY: "[THIS.GetCountry.GetName]"

