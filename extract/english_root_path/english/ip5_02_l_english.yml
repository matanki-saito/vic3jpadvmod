 je_tp_tsar_heir_of_alexander_button_1_name: "The Great Asia Program"
 je_tp_tsar_heir_of_alexander_button_1_desc: "From an early age, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has been convinced of Russia's status as a bastion of European civilization in the otherwise-barbarous East. [ROOT.GetCountry.GetRuler.GetSheHe|U] wishes to establish $RUS$ as the dominant power in Asia, reinforce her existing Far Eastern holdings, and combat the "Yellow Peril" presented by a modernized China and Japan."
 je_tp_tsar_heir_of_alexander_button_2_name: "Open Foreign Investment"
 je_tp_tsar_heir_of_alexander_button_2_desc: "Following from the policies of [ROOT.GetCountry.GetRuler.GetHerHis] father, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] is convinced of the necessity of bringing industry to [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetHerHis|U] advisors favor a policy of industrialization through open access to foreign investment, making use of tariffs for finished goods and favorable deals with the capital-rich Western powers to construct industries within [ROOT.GetCountry.GetNameNoFormatting]'s borders."
 je_tp_tsar_heir_of_alexander_button_2b_name: "Expand Resource Exports"
 je_tp_tsar_heir_of_alexander_button_2b_desc: "Following from the policies of [ROOT.GetCountry.GetRuler.GetHerHis] father, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] is convinced of the necessity of bringing industry to [ROOT.GetCountry.GetName]. [ROOT.GetCountry.GetRuler.GetHerHis|U] advisors see opportunity in exploiting the mineral and oil wealth of the Empire to increase exports and construct an industrial base."
 je_tp_tsar_heir_of_alexander_button_3_name: "Modernize the Mobilization Plan"
 je_tp_tsar_heir_of_alexander_button_3_desc: "In the tradition of the [ROOT.GetCountry.GetAdjective] imperial family, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] holds [ROOT.GetCountry.GetRuler.GetHerHis] Army in the highest esteem, and considers it to be the ever-loyal foundation of the Autocracy. He wishes to support the General Staff in their efforts to make the Army meet the demands of a modern war."
 je_tp_tsar_heir_of_alexander_button_4_name: "Answer the Agrarian Question"
 je_tp_tsar_heir_of_alexander_button_4_desc: "When discontent amongst the urban population looms, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] seeks solace in [ROOT.GetCountry.GetRuler.GetHerHis] conception of himself as a beloved father to the simple, pious, and loyal [ROOT.GetCountry.GetAdjectiveNoFormatting] peasantry. Whilst [ROOT.GetCountry.GetRuler.GetSheHe] considers this loyalty as a given, [ROOT.GetCountry.GetRuler.GetHerHis] advisors have put forth a program to earn it in fact—the creation of an agrarian middle class that owes their existence to the beneficience of the monarchy."

