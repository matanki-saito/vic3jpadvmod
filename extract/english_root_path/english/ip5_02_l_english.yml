 # Tsar JE Buttons
 je_tp_tsar_button_advance_agenda_tt: "#g Advances#! the #b Agendas Completed#! of this [concept_journal_entry] by #v 1#!"
 je_tp_tsar_gendarme_of_europe_button_1_name: "Strengthen the Holy Alliance"
 je_tp_tsar_gendarme_of_europe_button_1_desc: "#b The Holy Alliance#! was created in the aftermath of the Napoleonic Wars as an conservative alliance aimed at arresting the development of liberal and revolutionary ideas and movements.\n\n[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] sees this conservative alliance network as an important piece in the struggle to maintain political stability in [GetGeographicRegion('geographic_region_europe').GetName], and desires to use it to quash any and all revolutionary unrest."
 je_tp_tsar_gendarme_of_europe_button_2_name: "Combat Subversive Elements"
 je_tp_tsar_gendarme_of_europe_button_2_desc: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]'s experiences with would-be liberal putchists and [GetCulture('polish').GetName] rebels has sown a near-paranoid fear of subversive elements in his majesty's already reactionary mind. He will not rest easily until their ringleaders, real or imagined, are fusiladed or locked away."
 je_tp_tsar_gendarme_of_europe_button_3_name: "Champion Orthodoxy"
 je_tp_tsar_gendarme_of_europe_button_3_desc: "First among the pillars of Orthodoxy, Autocracy, and Nationality is the [GetReligion('orthodox').GetName] faith. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] wishes to see Orthodoxy reinforced along the Empire's frontiers, through both missionary work in the untamed Far East and in securing conversions from the divergent Christian faiths of the West."
 je_tp_tsar_gendarme_of_europe_button_4_name: "Expand Russian Influence"
 je_tp_tsar_gendarme_of_europe_button_4_desc: "While [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] remains greatly committed to preserving stability and the post-Vienna #italic status quo#! in Europe, [ROOT.GetCountry.GetRuler.GetHerHis] stance toward [ROOT.GetCountry.GetName]'s southern and eastern frontier remains more flexible."

 je_tp_tsar_unshakable_autocracy_button_1_name: "Strengthen Autocratic Power"
 je_tp_tsar_unshakable_autocracy_button_1_desc: "The reformist temperament of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]'s predecessor has not been passed onto his son. [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting] views any concession to liberalism as a dose of poison corrosive to the [ROOT.GetCountry.GetAdjective] monarchy, and wishes to crush any possible threat to the traditional order."
 je_tp_tsar_unshakable_autocracy_button_2_name: "Embrace Russian Nationality"
 je_tp_tsar_unshakable_autocracy_button_2_desc: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] embodies and embraces the idea of Russian nationalism, wearing a beard and eschewing the Western-inspired protocols of the court. [ROOT.GetCountry.GetRuler.GetSheHe|U] desires an Orthodox Russia for Orthodox Russians, viewing Jews, Poles, and other nationalities with suspicion."
 je_tp_tsar_unshakable_autocracy_button_3_name: "The Iron Road"
 je_tp_tsar_unshakable_autocracy_button_3_desc: "The railway has demonstrated its worth as a means of projecting state power. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] wishes to establish the necessary industries to support [ROOT.GetCountry.GetName]'s rail network, and curb her dependence upon the import of foreign industrial goods."
 je_tp_tsar_unshakable_autocracy_button_4_name: "Peace Through Strength"
 je_tp_tsar_unshakable_autocracy_button_4_desc: "The time that [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] spent in the Army has given him a great disdain for the corruption and horrors of war. [ROOT.GetCountry.GetRuler.GetSheHe|U] wishes to pursue a policy of well-armed peace, favoring diplomatic means of realizing [ROOT.GetCountry.GetAdjective] aims."

