 notification_je_tp_mission_failed_favorite_died_name: "[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName] abandoned"
 notification_je_tp_mission_failed_favorite_died_desc: "The [concept_ruler]'s favorite died before the agenda of #b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#! could be completed. As a consequence, [concept_tsarpoints] has #r decreased#! by [GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]."
 notification_je_tp_mission_failed_favorite_dismissed_name: "[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName] abandoned"
 notification_je_tp_mission_failed_favorite_dismissed_desc: "The [concept_ruler]'s favorite fell out of favor before the agenda of #b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#! could be completed. As a consequence, [concept_tsarpoints] has #r decreased#! by [GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]."
 notification_je_tp_mission_failed_new_ruler_name: "[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName] abandoned"
 notification_je_tp_mission_failed_new_ruler_desc: "The previous [concept_ruler] of [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetCountry.GetName] failed to see their agenda of #b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#! through to completion. As a consequence, [concept_tsarpoints] has #r decreased#! by [GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]."
 notification_je_tp_rasputin_mission_failed_name: "[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName] failed"
 notification_je_tp_rasputin_mission_failed_desc: "The [concept_ruler] of [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetCountry.GetName] failed to see their agenda of #b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#! through to completion. As a consequence, [concept_tsarpoints] has #r decreased#! by [GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]."
 notification_je_tp_mission_partial_completed_name: "[SCOPE.sJournalEntry('je_tp_partial_mission_scope').GetName] partially completed"
 notification_je_tp_mission_partial_completed_desc: "The previous [concept_ruler] of [SCOPE.sJournalEntry('je_tp_partial_mission_scope').GetCountry.GetName] made progress on their agenda of #b [SCOPE.sJournalEntry('je_tp_partial_mission_scope').GetName]#! without seeing it through to completion, gaining #v [SCOPE.sJournalEntry('je_tp_partial_mission_scope').MakeScope.Var('tp_partial_reward_var').GetValue|0]#! @tsarpoints! [concept_tsarpoints]."
 notification_je_tp_mission_completed_name: "[SCOPE.GetRootScope.GetJournalEntry.GetName] completed"
 notification_je_tp_mission_completed_desc: "[SCOPE.GetRootScope.GetJournalEntry.GetCountry.GetName] has seen the agenda of #b [SCOPE.GetRootScope.GetJournalEntry.GetName]#! through to completion, gaining #v [SCOPE.GetRootScope.GetJournalEntry.GetCountry.MakeScope.Var('tp_last_mission_reward').GetValue|0]#! @tsarpoints! [concept_tsarpoints]."
 notification_je_tp_war_mission_completed_name: "#b $je_tp_fav_war_concluded$#! completed"
 notification_je_tp_war_mission_completed_desc: "[SCOPE.GetRootScope.GetJournalEntry.GetCountry.GetName] has seen the agenda of #b $je_tp_fav_war_concluded$#! through to completion, gaining #v [SCOPE.GetRootScope.GetJournalEntry.GetCountry.MakeScope.Var('tp_last_mission_reward').GetValue|0]#! @tsarpoints! [concept_tsarpoints]."
 notification_je_tp_greek_joined_name: "[SCOPE.sCountry('greek_target_country_scope').GetName] accepts Enosis"
 notification_je_tp_greek_joined_desc: "Heeding the Emperor's call, [SCOPE.sCountry('greek_target_country_scope').GetName] has agreed to join their lands to the #b $dyn_c_empire_of_the_hellenes$#!."
