 je_tp_tsar_crown_of_perfection_button_1_name: "Patronize the Intelligentsia"
 je_tp_tsar_crown_of_perfection_button_1_desc: "From an early age, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has kept the company of the [ROOT.GetCountry.GetAdjective] [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]. [ROOT.GetCountry.GetRuler.GetSheHe|U] wishes to see a renaissance of [ROOT.GetCountry.GetAdjectiveNoFormatting] intellectual thought, born of the most cultured and liberal court in Europe."
 je_tp_tsar_crown_of_perfection_button_2_name: "Perfect the Great Reforms"
 je_tp_tsar_crown_of_perfection_button_2_desc: "Whilst the Great Reforms of Tsar Alexander II achieved great successes, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] considers their measures to be unfinished and imperfect. [ROOT.GetCountry.GetRuler.GetSheHe|U] wishes to continue the effort where [ROOT.GetCountry.GetRuler.GetHerHis] father left off, elaborating upon [ROOT.GetCountry.GetRuler.GetHerHis] successes, and correcting [ROOT.GetCountry.GetRuler.GetHerHis] failings."
 je_tp_tsar_crown_of_perfection_button_3_name: "Foster Public Life"
 je_tp_tsar_crown_of_perfection_button_3_desc: "For centuries, public life in [ROOT.GetCountry.GetName] has been stifled by a police state that has left her people loyal to their rulers, yet unready for representative governance. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] desires to engineer a prosperous, numerically-significant, and politically-engaged middle-class, so that [ROOT.GetCountry.GetNameNoFormatting] may one day be prepared to loosen the power of the Crown."
 je_tp_tsar_crown_of_perfection_button_4_name: "Rationalize the Empire"
 je_tp_tsar_crown_of_perfection_button_4_desc: "The [ROOT.GetCountry.GetAdjective] Empire is a vast, heterogenuous mass of differently-privileged guberniya, oblasts, and remnant feudal realms absorbed over the course of her expansion. Inspired by [ROOT.GetCountry.GetRuler.GetHerHis] schooling in civil and state law, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] wishes to see the patchwork administration of the Empire made formulaic, and extend one legal code from Baltic to Pacific."

