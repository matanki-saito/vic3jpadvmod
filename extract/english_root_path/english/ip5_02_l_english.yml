 # Tsarpoints Master JE Buttons
 je_tsarpoints_button_1_name: "Exercise Imperial Prerogative"
 je_tsarpoints_button_1_desc: "To draft and implement legislation for the [ROOT.GetCountry.GetName] is an oft-strenuous process, involving the consultation of the #b State Council#! and the jurists of the #b Second Section#!. If a matter is deemed by [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] to be of especial import, [ROOT.GetCountry.GetRuler.GetSheHe] may wield [concept_tsarpoints] to hasten the [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')] of a [concept_law] favored by [ROOT.GetCountry.GetRuler.GetHerselfHimself] or [ROOT.GetCountry.GetRuler.GetHerHis] [concept_favorite]."
 je_tsarpoints_button_1_short_desc: "By Our sovereign will, let the law be hastened, that none delay it..."
 je_tsarpoints_button_1_desc_tt: "[Concept('concept_enactment_of_laws', '$concept_enactment_of_laws_enactment|q$')] of the currently enacting law in [ROOT.GetCountry.GetNameNoFlag] progresses by #v 2#! [Concept('concept_enactment_phase','$concept_enactment_phases_short|q$')]"
 currently_enacting_law_favored_by_tsar_tt: "The [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')] of [ROOT.GetCountry.GetLawBeingEnacted.GetName] is [Concept('concept_endorse_oppose','$concept_endorsed|q$')] by the [concept_ruler]"
 currently_enacting_law_favored_by_favorite_tt: "The [Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')] of [ROOT.GetCountry.GetLawBeingEnacted.GetName] is [Concept('concept_endorse_oppose','$concept_endorsed|q$')] by the [concept_favorite]"

 je_tsarpoints_button_2_name: "Suppress Provincial Culture"
 je_tsarpoints_button_2_desc: "As one approaches the Western borderland of the Empire, the dominance of the [GetCulture('russian').GetName] language blurs into what the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s government considers to be a series of errant dialects. If threatened by the growing [concept_fervor] of an #b $language_east_slavic$#! or #b $language_west_slavic$#! [concept_culture], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] may wield [concept_tsarpoints] to suppress publishing, performances, and education in that language."
 je_tsarpoints_button_2_short_desc: "In order to suppress the dangerous activity of separatists and Polish interests..."
 je_tsarpoints_button_2_name_tt_1: "Immediately reduces the [concept_fervor] of a selected #b $language_east_slavic$#! or #b $language_west_slavic$#! [concept_culture] by #v 5#!, and adds a Proportional $concept_fervor$ modifier of #v -10#!"
 je_tsarpoints_button_2_name_tt_2: "[GetPlayer.MakeScope.ScriptValue('large_radicals')|-=1%] of [GetPopType('academics').GetName] [Concept('concept_pop', '$concept_pops|q$')] of the selected [concept_culture] become more [concept_radical]"
 je_tsarpoints_can_suppress_any_slavic_culture_tt: "[ROOT.GetCountry.GetNameNoFlag] or one of her [Concept('concept_subject','$concept_subjects|q$')] owns any [concept_homeland] [concept_state] of any non-[GetCulture('russian').GetName] #b $language_east_slavic$#! or #b $language_west_slavic$#! [concept_culture] that is not already being suppressed"
 je_tsarpoints_culture_not_suppressed_tt: "This [concept_culture] is not already being suppressed"

 je_tsarpoints_button_3_name: "Reinforce Suzerainty"
 je_tsarpoints_button_3_desc: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] does not rule over each of [ROOT.GetCountry.GetRuler.GetHerHis] subjects alone. Along the Empire's diverse frontier, the cooperation of petty rulers is necessary to sustain Russian rule. Whether they are titled as Prince, Khan, Agha-Sultan, or Shamkhal, the exercise of [concept_tsarpoints] may remind these men of their loyalty to [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName]."
 je_tsarpoints_button_3_short_desc: "We, Hereditary Sovereign and Ruler of these lands and regions..."
 modifier_tsarpoints_liberty_desire_boost: "Watchful Father"
 modifier_tsarpoints_ig_boost: "Imperial Patronage"

 je_tsarpoints_button_4_name: "Grant Government Confidence"
 je_tsarpoints_button_4_desc: "The reverence the masses show to [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] often does not extend to [ROOT.GetCountry.GetRuler.GetHerHis] ministers, with the image of the wicked advisor misleading the good [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] known to every peasant in the Empire. If the efforts of [GetPlayer.GetCustom('country_legislature_name')] are impeded by forces great or small, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] may employ [ROOT.GetCountry.GetRuler.GetHerHis] [concept_tsarpoints] to reassure the masses that [ROOT.GetCountry.GetRuler.GetHerHis] ministers maintain [ROOT.GetCountry.GetRuler.GetHerHis] faith, and that there is nothing to fear."
 je_tsarpoints_button_4_short_desc: "[GetPlayer.GetCustom('country_legislature_name')|U] will not fail to make all appropriate arrangements..."
 modifier_tsarpoints_legitimacy_boost: "Granted Imperial Confidence"

 je_tsarpoints_button_5_name: "Patronize Interest Group"
 je_tsarpoints_button_5_desc: "The true power of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] derives from [ROOT.GetCountry.GetRuler.GetHerHis] ability to elevate one powerful interest over another. By wielding [ROOT.GetCountry.GetRuler.GetHerHis] [concept_tsarpoints] in favor of certain figures within [GetPlayer.GetCustom('country_legislature_name')], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] may increase the [concept_clout] held by their associated interests."
 je_tsarpoints_button_5_short_desc: "Drawing attention to the laudable works of the Honored Minister..."

 je_tsarpoints_button_6_name: "Empower Lesser Ukase"
 je_tsarpoints_button_6_desc: "In order to govern a vast Empire, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must spend a great amount of [ROOT.GetCountry.GetRuler.GetHerHis] time upon making decisions related to various provincial initiatives and concerns. If [ROOT.GetCountry.GetRuler.GetSheHe] wishes, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] may employ [concept_tsarpoints] to dedicate more resources towards ensuring [ROOT.GetCountry.GetRuler.GetHerHis] smaller-scale decisions are carried out in a timely and effective manner."
 je_tsarpoints_button_6_short_desc: "We, with unwavering determination to immediately satisfy these needs..."

 je_tsarpoints_button_7_name: "Install Favored Ruler"
 je_tsarpoints_button_7_desc: "There is no shortage of ambitious sons in [ROOT.GetCountry.GetCapital.GetCityHubName], nor of loyal agents within its periphery's petty courts. As Empress Catherine installed a puppet King on the throne of Poland, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] may wield his [concept_tsarpoints] to have the rulers of [ROOT.GetCountry.GetName]'s subjects replaced with more amicable candidates—sons of the [ROOT.GetCountry.GetAdjectiveNoFormatting] Court, [GetCulture('east_german').GetName] adventurers from the Baltic, or local claimants loyal to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]."
 je_tsarpoints_button_7_short_desc: "The failings of this man have become evident, and his throne made vacant in spirit..."
 enables_install_ruler_action_tt: "Enables #v 1#! use of the #b $da_tsarpoints_install_subject_ruler_action_name$#! [concept_diplomatic_action]"

 da_tsarpoints_install_subject_ruler: "Install Favored Ruler"
 da_tsarpoints_install_subject_ruler_desc: "Place a ruler of our own choosing upon the throne of one of our [Concept('concept_subject','$concept_subjects|q$')], as authorized by the #b $je_tsarpoints_button_7_name$#! [concept_ukaz]. Each [concept_ukaz] permits a single appointment."
 tsarpoints_install_ruler_requires_ukaz_tt: "The #b $je_tsarpoints_button_7_name$#! [concept_ukaz] has been issued"
 tsarpoints_install_ruler_already_authorized_tt: "A use of #b $da_tsarpoints_install_subject_ruler_action_name$#! is not already pending"
 da_tsarpoints_install_subject_ruler_action_name: "Install Favored Ruler"
 da_tsarpoints_install_subject_ruler_action_notification_name: "[INITIATOR_COUNTRY.GetName] installs a ruler in [TARGET_COUNTRY.GetName]"
 da_tsarpoints_install_subject_ruler_action_notification_desc: "[INITIATOR_COUNTRY.GetRuler.GetPrimaryRoleTitle] [INITIATOR_COUNTRY.GetRuler.GetFirstName] of [INITIATOR_COUNTRY.GetName] has decreed that the [TARGET_COUNTRY.GetRuler.GetPrimaryRoleTitle] of [TARGET_COUNTRY.GetName] be replaced by an appointee of the imperial court."
 da_tsarpoints_install_subject_ruler_action_notification_third_party_name: "[TARGET_COUNTRY.GetName] receives an imperial appointee"
 da_tsarpoints_install_subject_ruler_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetRuler.GetPrimaryRoleTitle] [INITIATOR_COUNTRY.GetRuler.GetFirstName] of [INITIATOR_COUNTRY.GetName] has placed an appointee of the imperial court upon the throne of their [concept_subject] [TARGET_COUNTRY.GetName]."

 je_tsarpoints_button_8_name: "Convene the Synod of Polotsk"
 je_tsarpoints_button_8_desc: "In #b 1596#!, the #b Union of Brest#! took place in the #b Polish-Lithuanian Commonwealth#!, resulting in the [GetReligion('orthodox').GetName] churches of #b Ruthenia#! accepting papal authority while preserving the Eastern rite. The resulting #b Ruthenian [GetReligion('catholic').GetName] Church#! has since held great sway in these lands, even after their aquisition by [ROOT.GetCountry.GetName] following the #b Second#! and #b Third Partitions of Poland#!. \n\nWhile the #b Uniate#! hold on the [GetCulture('ukrainian').GetName] people was mostly broken during the reign of #b Catherine the Great#!, the church remains firmly embedded in the more thoroughly Polonized [GetCulture('byelorussian').GetName] [Concept('concept_homeland','$concept_homelands|q$')].\n\nRussophile elements within the #b Ruthenian [GetReligion('catholic').GetName] Church#! have now argued for reunion and the termination of the #b Union of Brest#!, supported by the [GetReligion('orthodox').GetName] metropolitans of Moscow and Kiev."
 je_tsarpoints_button_8_short_desc: "For the reunification of the Uniates with the Orthodox Church of All Russia..."

 je_tsarpoints_button_9_name: "Bolster Counter-Revolution"
 je_tsarpoints_button_9_desc: "The reactionary outlook of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has earned [ROOT.GetCountry.GetName] the moniker of "Gendarme of Europe" amongst the Western press. During the [glossary_revolutions_of_1830], [ROOT.GetCountry.GetRuler.GetSheHe] petitioned Vienna for the use of Russian forces to crush #b Belgium#! and the French #b July Monarchy#!, only to be refused by King Friedrich Wilhelm and Chancellor Metternich. [ROOT.GetCountry.GetRuler.GetHerHis|U] restraint was rewarded with the bloody November Uprising in Poland, which brought revolution as far as #b Minsk#! and #b Podolia#!.\n\nNow, as mutiny and lawlessness spreads throughout [GetGeographicRegion('geographic_region_europe').GetName], [ROOT.GetCountry.GetRuler.GetSheHe] may employ [ROOT.GetCountry.GetRuler.GetHerHis] [concept_tsarpoints] to once more offer up [ROOT.GetCountry.GetRuler.GetHerHis] forces to those rightful sovereigns who find themselves imprisoned by imposed constitutions."
 je_tsarpoints_button_9_short_desc: "Hear this, you nations, and submit, for God is with us!"
 je_tsarpoints_button_9_any_target_tt: "At least one [concept_country] in [GetGeographicRegion('geographic_region_europe').GetName] has the #v $je_red_summer$#! [concept_journal_entry] and has not expelled [GetPlayer.GetAdjective] diplomats"
 je_tsarpoints_button_9_effect_tt: "Every [concept_country] in [GetGeographicRegion('geographic_region_europe').GetName] with the #v $je_red_summer$#! [concept_journal_entry] gains [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_value')|+v0] monthly #b Counter-Revolution#! progress for [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_duration_years_value')|v0] years"
 je_tsarpoints_button_9_effect_subject_tt: "Every [ROOT.GetCountry.GetAdjective] [concept_subject] with the #v $je_red_summer$#! [concept_journal_entry] gains [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_subject_value')|+v0] monthly #b Counter-Revolution#! progress for [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_duration_years_value')|v0] years"
 je_tsarpoints_button_9_effect_immune_tt: "@information! [Concept('concept_country','$concept_countries|q$')] that have expelled [GetPlayer.GetAdjective] diplomats will be unaffected"
 je_tsarpoints_button_9_effect_relations_conservative_tt: "[concept_relations] toward every [concept_country] with a #b conservative#! government in [GetGeographicRegion('geographic_region_europe').GetName] improve by #v [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_relations_value')|v0]#!"
