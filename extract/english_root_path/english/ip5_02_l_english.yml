 je_tp_pool_build_army: "Strengthen the Army"
 je_tp_pool_build_army_reason: "The great [ROOT.GetCountry.GetAdjective] Army is the pride of the Empire, the heart of the state, and the means through which the will of her [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is enforced. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] wishes to see [ROOT.GetCountry.GetRuler.GetHerHis] beloved Army remain the paramount force in Europe, and to ensure that it may defend every one of [ROOT.GetCountry.GetNameNoFormatting]'s borders."
