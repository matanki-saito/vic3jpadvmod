 # Tsarpoints Events
 tsarpoints_events.1.t: "Dirge for the Third Rome"
 tsarpoints_events.1.d: "The rule of the $RUS_ADJ$ Tsars has come to a once-unthinkable end, with a [ROOT.GetCountry.GetGovernment.GetName] now ruling from [ROOT.GetCountry.GetCapital.GetCityHubName]. Revolutionaries rejoice at the demise of the Gendarme of Europe, whilst the loyalists of the dynasty mourn the ruin of the Third Rome."
 tsarpoints_events.1.f: ""When I was abroad I read in #italic Poslednie Novosti#! a description of the shooting, the burning of the bodies, etc. How much of all this is true and how much is invented, I have not the least idea, since I was never curious about #italic how #! the sentence was carried out and, frankly, do not understand such curiosity."\n\n—Leon Trotsky, #italic Diary in Exile#!"
 tsarpoints_events.1.a: "[ROOT.GetCountry.GetName] has joined with the modern world."
 tsarpoints_events.1.b: "Is God no longer with us?"
 notify_upgraded_decrees_removed_tt: "\n@information! All [Concept('concept_decree', '$concept_decrees|q$')] empowered by [Concept('concept_ukaz', '$concept_ukase|q$')] have been restored to default"


 tsarpoints_events.2.t: "Imperial $concept_ukaz$ No. [ROOT.Var('ukaz_no_var').GetValue]"  # Law Passing
 tsarpoints_events.2.d: "Taking especial personal interest in the enactment of [SCOPE.sLaw('current_law_scope').GetName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has issued an Ukaz commanding the swift and Empire-wide implementation of the law."
 tsarpoints_events.2.f: ""The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] appointed me to the [GetPlayer.GetCustom('country_legislature_name')] on account of trusting my good judgment! There are still many outstanding questions about these reforms."\n\n"Of course. However, at the present time, your good judgment is better applied to actions than to questions. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] trusts that you know the difference.""
 tsarpoints_events.2.a: "So it will be done."

 tsarpoints_events.3.t: "Imperial $concept_ukaz$ No. [ROOT.Var('ukaz_no_var').GetValue]"
 tsarpoints_events.3.d: "Alarmed by a rise in national sentiment amongst the Empire's minorities, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has issued an Ukaz decreeing a ban on all publication and performances in a minority language."
 tsarpoints_events.3.f: ""Ah, I have heard this music before! Strange. I could swear that last time, there was singing to go along with it. I remember the lyrics."\n\nHis friend smiled. It was a strange sort of smile, sad and triumphant all at once.\n\n"If you remember them, then sing them in your heart. We all do.""
 tsarpoints_events.3.a: "There is no claim to an independent [GetCulture('ukrainian').GetName] culture."
 tsarpoints_events.3.b: "The [GetCulture('byelorussian').GetName] dialect is a seditious Polish construction."
 tsarpoints_events.3.c: "We must suppress any [GetCulture('polish').GetName] revolutionary conspiracy."
 tsarpoints_events.3.e: "The [GetCulture('czech').GetName] language is hopelessly Germanized."
 tsarpoints_events.3.g: "Proscribe the [GetCulture('slovak').GetName] language as a Magyarized dialect."
 tsarpoints_events.3.h: "The [GetCulture('sorb').GetName] people are merely the Westernmost Russians."

 tsarpoints_events.4.t: "Imperial $concept_ukaz$ No. [ROOT.Var('ukaz_no_var').GetValue]"
 tsarpoints_events.4.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has issued an Ukaz emphasizing [ROOT.GetCountry.GetRuler.GetHerHis] role as Sovereign of many nations, placing additional scrutiny upon the loyalty of [ROOT.GetCountry.GetName]'s subject rulers."
 tsarpoints_events.4.f: ""We must never allow pragmatism to be mistaken for weakness. How many empires have scattered to the winds because they let local rulers believe that their authority to solve local problems conferred sovereignty? In these precarious times, when nationalism can seize even the most mild-mannered populations, it is imperative that those who rule under the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] see themselves as an extension of [ROOT.GetCountry.GetRuler.GetHerHis] hand, rather than one being raised against [ROOT.GetCountry.GetRuler.GetHerHim].""
 tsarpoints_events.4.a: "So it will be done."

 tsarpoints_events.5.t: "Imperial $concept_ukaz$ No. [ROOT.Var('ukaz_no_var').GetValue]"
 tsarpoints_events.5.d: "Seeking to ensure faith in [GetPlayer.GetCustom('country_legislature_name')], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has issued an Ukaz commending [ROOT.GetCountry.GetRuler.GetHerHis] ministers for their work in realizing [ROOT.GetCountry.GetRuler.GetHerHis] vision for the Empire."
 tsarpoints_events.5.f: ""This is a lot of dramatic praise for the important work of men who, as far as I am aware, spend most of their time quibbling over details in the state budget."\n\n"Yes, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] shows good judgment. Details in the state budget is exactly where I would expect an otherwise stable reign to start toppling over.""
 tsarpoints_events.5.a: "So it will be done."

 tsarpoints_events.6.t: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s Ear"
 tsarpoints_events.6.d: "Having secured the confidence of [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName], the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s new favorite [SCOPE.sCharacter('favourite_scope').GetFullName] has suggested that the Empire's administrative apparatus be mobilized to see through [SCOPE.sCharacter('favourite_scope').GetHerHis] personal agenda."
 tsarpoints_events.6.f: "As [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] read out the text of the decree, people in the room began exchanging uncomfortable glances.\n\nAlthough some of [ROOT.GetCountry.GetRuler.GetFirstNamePossessive] recognizable rhetorical flourishes had been inserted, everything substantial about it had an entirely different voice.\n\nAs that voice became more recognizable, [SCOPE.sCharacter('favourite_scope').GetFullNamePossessive] absence in the room began to feel almost deliberate."
 tsarpoints_events.6.a: "There is merit to the words of [SCOPE.sCharacter('favourite_scope').GetCustom('getGospodinGospozha')|l] [SCOPE.sCharacter('favourite_scope').GetLastName]."
 tsarpoints_events.6.b: "We think the good [SCOPE.sCharacter('favourite_scope').GetCustom('getGospodinGospozha')|l] forgets [SCOPE.sCharacter('favourite_scope').GetHerselfHimself]."
 modifier_favorite_rebuffed: "Embarrassing Rebuffal"

 tsarpoints_events.7.t: "In the City of Constantine"
 tsarpoints_events.7.d: "With the [ROOT.GetCountry.GetAdjective] conquest of Constantinople, the city's four centuries under the Turkish yoke has come to an end. Now that this long-standing ambition has been  realized, [ROOT.GetCountry.GetCapital.GetCityHubName] stands poised to fully assume the mantle of Rome."
 tsarpoints_events.7.f: "As [ROOT.GetCountry.GetRuler.GetFirstName] rode through the city, despite its wartorn state, its ancient beauty shone through. This was not the worst it had endured. Perhaps it would be hubris to think it would not endure worse in the future.\n\n"It should have been old Konstantin Pavlovich," [ROOT.GetCountry.GetRuler.GetSheHe] thought to [ROOT.GetCountry.GetRuler.GetHerselfHimself], "but I will have to do.""
 tsarpoints_events.7.a: "Once more, the Cross adorns the dome of the Hagia Sophia."
 tsarpoints_events.7.b: "We must realize the dream of Catherine."
 tsarpoints_events.7.c: "The marbled king is roused from his long slumber."
 tsarpoints_events.7.tt_1: "Enables a [concept_decision] to settle the relationship between the #b Ecumenical Patriarchate#! and the #b Russian Church#!"
 tsarpoints_events.7.tt_2: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] will be declared #b Emperor of the Hellenes#! and a [GetCulture('greek').GetName] state in [concept_personal_union] with [ROOT.GetCountry.GetName] will be established with its capital in #b Constantinople#!"
 tsarpoints_events.7.tt_3: "All [GetCulture('greek').GetName] [concept_homeland] [Concept('concept_state', '$concept_states|q$')] owned by us or our [Concept('concept_subject', '$concept_subjects|q$')] will be transfered to the new country"
 tsarpoints_events.7.tt_4: "All [concept_subject] or #b independent#! [GetCulture('greek').GetName] [Concept('concept_country', '$concept_countries|q$')] will be invited to  #g join#! this new country: "
 tsarpoints_events.7.tt_5: "Change player's actively controlled country from [ROOT.GetCountry.GetName] to the #b $dyn_c_empire_of_the_hellenes$#!"
 modifier_true_heir_of_rome: "Modern Constantine"
 modifier_restoration_of_second_rome: "Return to the Second Rome"
 modifier_orthodox_messianism: "Messianic Enthusiasm"
 modifier_the_restorer: "The Restorer"

 tsarpoints_events.8.t: "Russia Proposes Union with Constantinople"
 tsarpoints_events.8.d: "Having recently conquered Constantinople and declared a new [GetCulture('greek').GetName] Empire under their protection, [SCOPE.sCountry('russia_scope').GetName] has now proposed the joining of our state to theirs."
 tsarpoints_events.8.f: "How fortunate, they wail, are we, o heaven!\nOur heroes are alive today in the Russians who have come!\nHow humble they are toward us, how terrible their sight to the Turks!\nThe inhabitants of Argos and Nauplia prepare for war,\nCorinthians, do not fear—\nLeonidas is in Sparta.\n\n—V. P. Petrov, #italic On the Victories in Morea#!" # Translation by Andrei Zorin
 tsarpoints_events.8.a: "The marbled king wakes, and the world trembles."
 tsarpoints_events.8.b: "We will not trade our liberty away, not even for such grand a prize."

 tsarpoints_events.9.t: "The Synod of Polotsk"
 tsarpoints_events.9.d: "Assembled in the Cathedral of Holy Wisdom in Polotsk, and under heavy cossack guard, [GetPopType('clergymen').GetName] of the Ruthenian [GetReligion('catholic').GetName] Church debate the possible termination of the Union of Brest."
 tsarpoints_events.9.f: "The young priest raised his head, and gazed across the room. The Russophile delegation was an eclectic collection of men of the cloth. Many, no doubt, had their names penned on some Moscow payroll, but there was also no lack of true believers to be found in their midst.\n\nEven then, he estimated, the Russophiles could possibly have been voted down. But a hurried glance over towards the guardhouse, where a man of some Don Cossack Regiment demonstratively sharpened his shashka highlighted the impossibility of the notion. No, the vote would not go his way, but like the martyrs of old he would not compromise on his convictions. Consequences be as they may."
 tsarpoints_events.9.a: "Separated by violence, reunited by love. The union is terminated."
 tsarpoints_events.9.tt_1: "All [GetReligion('catholic').GetName] [GetCulture('ukrainian').GetName] and [GetCulture('byelorussian').GetName] [Concept('concept_pop', '$concept_pops|q$')] are converted to the [GetReligion('orthodox').GetName] [concept_religion]"
 tsarpoints_events.9.tt_2: "The following will apply to all [ROOT.GetCountry.GetAdjective] [Concept('concept_state', '$concept_states|q$')] with a [GetReligion('catholic').GetName] [GetCulture('ukrainian').GetName] or [GetCulture('byelorussian').GetName] [concept_pop]:"
 tsarpoints_events.9.tt_3: "[GetReligion('catholic').GetName] [GetPopType('clergymen').GetName] who refuse to join the [GetReligion('orthodox').GetName] Church will face internal exile or death"
 modifier_uniate_dioceses_converted: "Mass Conversion of Uniate Dioceses"
 modifier_crypto_catholic_communities: "Crypto-Uniate Communities"

 tsarpoints_events.11.t: "Imperial $concept_ukaz$ No. [ROOT.Var('ukaz_no_var').GetValue]"
 tsarpoints_events.11.d: "Seeking to shift the balance of [ROOT.GetCountry.GetRuler.GetHerHis] government towards [ROOT.GetCountry.GetRuler.GetHerHis] favored interests, [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has issued an Ukaz granting rank and privileges to their representatives within [GetPlayer.GetCustom('country_legislature_name')|U]."
 tsarpoints_events.11.f: ""The true servants of [ROOT.GetCountry.GetName]! Not those who merely set the interests of the Empire above their own, but those for whom they are one and the same. Who could be more deserving of our trust? Who better to carry out our will?""
 tsarpoints_events.11.a: "We commend the heroism of the [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]."
 tsarpoints_events.11.b: "We commend the works of the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName]."
 tsarpoints_events.11.c: "The [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] retain our utmost trust."
 tsarpoints_events.11.e: "The efforts of the [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName] have drawn Our attention."
 tsarpoints_events.11.g: "We recognize the works of the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]."
 tsarpoints_events.11.h: "We commend the good example of the [GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName]."
 tsarpoints_events.11.i: "We commend the simple loyalty of the [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName]."
 tsarpoints_events.11.j: "We commend the [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName] for their honest toil."

 tsarpoints_events.12.t: "Imperial $concept_ukaz$ No. [ROOT.Var('ukaz_no_var').GetValue]"
 tsarpoints_events.12.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] has issued an Ukaz containing new protocols for provincial administrations. [ROOT.GetCountry.GetRuler.GetSheHe|U] wishes to set a new standard for compliance with future Ukase."
 tsarpoints_events.12.f: ""So if I have read this correctly, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] expects us to henceforth follow these processes to the letter?"\n\n"That is one way to read it. Another way to read it is that the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] expects certain results. Which is to say, not a single one of these processes can be followed to the letter.""
