 # Shared Bundle
 je_tp_pool_develop_frontier: "Develop the Frontier"
 je_tp_pool_develop_frontier_reason: "Perhaps more than anything else, [ROOT.GetCountry.GetName] is defined by her vast frontier and continuous attempts to settle it. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] views the taming of the Eastern and Southern frontiers as both a romantic undertaking and crucial to the security of the Empire. [ROOT.GetCountry.GetRuler.GetSheHe|U] wishes to send Cossacks and peasant settlers to settle the Russian periphery, and see through the development of the rich resources of [GetGeographicRegion('geographic_region_siberia').GetName]."
 je_tp_pool_develop_frontier_population_tt: "The total population of [GetGeographicRegion('geographic_region_siberia').GetName] has increased by [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_develop_frontier_growth_value')|v0%] ([ROOT.GetCountry.MakeScope.Var('tp_siberia_frontier_target_population').GetValue|v0k]) (currently [ROOT.GetCountry.MakeScope.ScriptValue('rus_siberia_population')|v0k])"
 je_tp_pool_develop_frontier_gdp_tt: "The total [concept_gdp] of [GetGeographicRegion('geographic_region_siberia').GetName] has increased by [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_develop_frontier_growth_value')|v0%] (@money![ROOT.GetCountry.MakeScope.Var('tp_siberia_frontier_target_gdp').GetValue|v0k]) (currently @money![ROOT.GetCountry.MakeScope.ScriptValue('rus_siberia_gdp')|v0k])"
 je_tp_pool_develop_frontier_central_asia_population_tt: "The total population of [GetGeographicRegion('geographic_region_central_asia').GetName] has increased by [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_develop_frontier_growth_value')|v0%] ([ROOT.GetCountry.MakeScope.Var('tp_central_asia_frontier_target_population').GetValue|v0k]) (currently [ROOT.GetCountry.MakeScope.ScriptValue('rus_central_asia_population')|v0k])"
 je_tp_pool_develop_frontier_central_asia_gdp_tt: "The total [concept_gdp] of [GetGeographicRegion('geographic_region_central_asia').GetName] has increased by [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_develop_frontier_growth_value')|v0%] (@money![ROOT.GetCountry.MakeScope.Var('tp_central_asia_frontier_target_gdp').GetValue|v0k]) (currently @money![ROOT.GetCountry.MakeScope.ScriptValue('rus_central_asia_gdp')|v0k])"
 je_tp_pool_develop_frontier_caucasus_population_tt: "The total population of [GetGeographicRegion('geographic_region_caucasus_old').GetName] has increased by [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_develop_frontier_growth_value')|v0%] ([ROOT.GetCountry.MakeScope.Var('tp_caucasus_frontier_target_population').GetValue|v0k]) (currently [ROOT.GetCountry.MakeScope.ScriptValue('rus_caucasus_population')|v0k])"
