 je_tp_pool_build_navy: "Advance Naval Power"
 je_tp_pool_build_navy_reason: "If [ROOT.GetCountry.GetName] is to be a world power, she must be able to project power beyond her peripheral seas. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFirstName] desires an ambitious program of modernization and shipbuilding to rival the world's naval powers. [ROOT.GetCountry.GetRuler.GetHerHis|U] vision would have the [ROOT.GetCountry.GetAdjectiveNoFormatting] Navy headed by sophisticated vessels that will embody [ROOT.GetCountry.GetRuler.GetHerHis] own prestige."
