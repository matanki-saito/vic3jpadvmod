 je_tp_great_reform_zemstvos_button_desc: "The vastness of [ROOT.GetCountry.GetName] cannot be ruled from [ROOT.GetCountry.GetCapital.GetCityHubName] alone. Following the justification that inhabitants of a region would know more about their needs than any central body, the Tsar's advisors have put forth proposals to grant local populations greater ability to govern their own affairs. The reform would establish provincial [Glossary('glossary_zemstvo','zemstvos')] with responsibility over economic activity within their jurisdictions, and expand the powers of urban governments."
