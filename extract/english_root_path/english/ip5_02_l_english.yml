l_english:

 # Tsarpoints Journal Entry
 je_tsarpoints_master: "Emperor and Autocrat" # [ROOT.GetCountry.GetCustom('je_tsarpoints_master_title')]
 je_tsarpoints_title: "The Reign of [ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]"
 je_tsarpoints_title_fallback: "Emperor and Autocrat"
 je_tsarpoints_master_reason: "#bold @tsarpoints! [concept_tsarpoints]:\n#!Your [concept_tsarpoints] will #g increase#! and #r decrease#! with the #b $je_group_tsarpoints$#! and #b $je_group_russia_expansion$#! [concept_journal_entry] groups, as well as with a number of #tooltippable;tooltip:je_tsarpoints_additional_goals important events#!.\n[concept_tsarpoints] grant a passive #g bonus#! and allow you to enact powerful [Concept('concept_ukaz','$concept_ukase|q$')]. The effectiveness of [Concept('concept_ukaz','$concept_ukase|q$')] will be greatly diminished should [ROOT.GetCountry.GetName] adopt a [Concept('concept_election', '$concept_election_voting_franchise|q$')].\n\n[ROOT.GetCountry.GetCustom('tsarpoints_tsar_quote')]\n\nIn the minds of many, [ROOT.GetCountry.GetName] and [GetLawType('law_monarchy').GetName] are but two sides of the same coin. For centuries, the Tsars have ruled the country — first from Moscow, and then from St. Petersburg — but despite the ever-changing particularities of the imperial regime, one fundamental fact remains:\n\nThe authority of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is absolute, and [ROOT.GetCountry.GetRuler.GetHerHis] will be done."

 je_tsarpoints_additional_goals: "The following events will #g increase#! @tsarpoints! [concept_tsarpoints]:\n• #g 20#!: Seizing the city of #b Constantinople#! in [GetStateRegion('STATE_EASTERN_THRACE').GetName]\n• #g 10#!: Achieving #b victory#! in the #v $je_caucasian_war$#!\n\nThe following events will #r decrease#! @tsarpoints! [concept_tsarpoints]:\n• #r 10#!: Being #b defeated#! in the #v $je_caucasian_war$#!"

 tsarpoints_quote_nicholas_i: ""#italic In a state where love for monarchs and devotion to the throne are based on the native characteristics of the people, where there are laws of the fatherland and firmness in administration, all efforts of the evil-intentioned will be in vain and insane.#!"\n\n— Nicholas I, #italic Manifesto On the Establishment of the Supreme Criminal Court for the Judgment of Malefactors#!"
 tsarpoints_quote_alexander_ii: ""#italic It is better to abolish serfdom from above than to wait for it to abolish itself from below.#!"\n\n— Alexander II, #italic Speech to the nobility of Moscow#!""
 tsarpoints_quote_nixa: ""#italic But I console myself with the thought that all our future lies ahead. Here, in Europe, it is summer — while in Russia it is still spring, with all its disorder, but also with its hopes, with its first shoots of awakening life. All the work is still ahead.#!"\n\n— Tsesarevich Nikolai Alexandrovich, #italic Private Letters#!"
 tsarpoints_quote_alexander_iii: ""#italic But in the midst of Our great sorrow, the Voice of God commands Us to stand firmly to the work of Rule, in trust in Divine Providence, with faith in the power and truth of Autocratic authority, which We are called to affirm and to guard for the people’s good against every encroachment upon it.#!"\n\n— Alexander III, #italic Manifesto on Unshakeable Autocracy#!"
 tsarpoints_quote_nicholas_ii: ""#italic What is going to happen to me and all of Russia? I am not prepared to be a Tsar. I never wanted to become one. I know nothing of the business of ruling.#!"\n\n— Nicholas II, #italic Private Letters#!"
 tsarpoints_quote_alexei_ii: ""#italic Why can other boys have everything and I nothing?#!"\n\n— Alexei II"
 tsarpoints_quote_fallback: "#italic The Supreme Authority is the guardian of the idea of the Russian state; it embodies its strength and integrity, and if Russia is to exist, it can only do so through the concerted efforts of all its sons to safeguard and protect this Authority, which has bound Russia together and shields it from disintegration.#!\n\n— Pyotr Stolypin"

