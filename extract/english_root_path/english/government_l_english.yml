 transfer_of_power_hereditary:0 "Hereditary"
 transfer_of_power_hereditary_desc: "Under Hereditary [concept_transfer_of_power], [Concept('concept_ruler', '$concept_rulers|q$')] reign for life and have an [concept_heir] who becomes the new $concept_ruler$ when the $concept_ruler$ dies."
 transfer_of_power_presidential_elective:0 "Presidential Elective"
 transfer_of_power_presidential_elective_desc: "Under Presidential Elective [concept_transfer_of_power], [Concept('concept_ruler', '$concept_rulers|q$')] are chosen from the leader of the [concept_interest_group] with the most [concept_clout] at the end of each [concept_election]."
 transfer_of_power_parliamentary_elective:0 "Parliamentary Elective"
 transfer_of_power_parliamentary_elective_desc: "Under Parliamentary Elective [concept_transfer_of_power], [Concept('concept_ruler', '$concept_rulers|q$')] are chosen from the leader of the [concept_interest_group] in [concept_government_type] with the most [concept_clout]."
 transfer_of_power_dictatorial:0 "Dictatorial"
 transfer_of_power_dictatorial_desc: "Under Dictatorial [concept_transfer_of_power], [Concept('concept_ruler', '$concept_rulers|q$')] reign for life. On the death of the $concept_ruler$, a new $concept_ruler$ is chosen from the leader of the [concept_interest_group] with the most [concept_clout]."
 transfer_of_power_default:0 "Random"
 transfer_of_power_default_desc: "Under Random [concept_transfer_of_power], [Concept('concept_ruler', '$concept_rulers|q$')] reign for life. On the death of the $concept_ruler$, a new $concept_ruler$ is randomly generated."

 TRANSFER_OF_POWER_NAME_DESC:0 "This $concept_government_type$ adopts a #tooltippable #tooltip:[GovernmentType.GetTooltipTag],TRANSFER_OF_POWER_TOOLTIP_DESC [GovernmentType.GetTransferOfPowerName]#!#! [concept_transfer_of_power]"
 TRANSFER_OF_POWER_PLAYER_NAME_DESC:0 "This $concept_government_type$ adopts a #tooltippable #tooltip:[GetPlayer.GetGovernment.GetTooltipTag],TRANSFER_OF_POWER_TOOLTIP_DESC [GetPlayer.GetGovernment.GetTransferOfPowerName]#!#! [concept_transfer_of_power]"
 TRANSFER_OF_POWER_TOOLTIP_DESC:0 "[GovernmentType.GetTransferOfPowerDesc]"
 TRANSFER_OF_POWER_PLAYER_TOOLTIP_DESC:0 "[GetPlayer.GetGovernment.GetTransferOfPowerDesc]"

