# Theocracies
 gov_theocracy:0 "Theocracy"
 gov_theocracy_desc: "This is a [concept_government_type] where the [concept_country] is ruled by the clergy.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_theocratic_dictatorship:0 "Theocratic Dictatorship"
 gov_theocratic_dictatorship_desc: "This is a [concept_government_type] where the [concept_country] is ruled by the head of the clergy.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_theocratic_oligarchy:0 "Theocratic Oligarchy"
 gov_theocratic_oligarchy_desc: "This is a [concept_government_type] where the [concept_country] is ruled by a class of rich and powerful clergy members.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_theocratic_democracy:0 "Theocratic Democracy"
 gov_theocratic_democracy_desc: "This is a [concept_government_type] that is ruled by a clergy who are [Concept('concept_election','$concept_elected|q$')] by the people.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_theocratic_single_party_state: "Theocratic Regime"
 gov_theocratic_single_party_state_desc: "This is a [concept_government_type] that is ruled by a clergy who are [Concept('concept_election','$concept_elected|q$')] by members of a single legal ruling party.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_catholic_theocracy:0 "Catholic Theocracy"
 gov_catholic_theocracy_desc: "A [concept_government_type] ruled by the local hierarchy of the Catholic Church. The most senior [Concept('concept_ruler','$RULER_CARDINAL|q$')] takes the role of [concept_head_of_state].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_protestant_theocracy:0 "Protestant Theocracy"
 gov_protestant_theocracy_desc: "A [concept_government_type] ruled by the state Protestant Church. Its highest authority is called the [Concept('concept_ruler','$RULER_PRIMATE|q$')], who wields both secular and spiritual authority.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_oriental_orthodox_theocracy: "Oriental Orthodox Theocracy"
 gov_oriental_orthodox_theocracy_desc: "A [concept_government_type] ruled by the Oriental Orthodox Church. Ruled by the [Concept('concept_ruler','$RULER_PATRIARCH|q$')], the Church controls all aspects of the state.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_sunni_theocracy:0 "Imamate"
 gov_sunni_theocracy_desc: "A theocratic [concept_government_type] ruled by leaders of the Sunni Muslim faith. A senior [Concept('concept_ruler','$RULER_IMAM|q$')] takes the role of [concept_head_of_state].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_papacy:0 "Papacy"
 gov_papacy_desc: "This is a [concept_government_type] ruled by the [Concept('concept_ruler','$RULER_POPE|q$')], the supreme pontiff, bishop of Rome, and head of the Catholic Church.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_jewish_theocracy:0 "Rabbinical State"
 gov_jewish_theocracy_desc: "A Jewish theocracy led by the [Concept('concept_ruler','$RULER_CHIEF_RABBI|q$')].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_prince_bishopric:0 "Prince-Bishopric"
 gov_prince_bishopric_desc: "This is a [concept_government_type] where the [Concept('concept_ruler','$RULER_TITLE_PRINCE_BISHOP|q$')] exercises both temporal and ecclesiastical authority over the realm.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_zaidi_imamate:0 "Zaidi Imamate"
 gov_zaidi_imamate_desc: "This is a [concept_government_type] where power rests with a semi-hereditary [Concept('concept_ruler','$RULER_IMAM|q$')] belonging to the Zaidi branch of Shia Islam.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_shiite_theocracy:0 "Shiite Theocracy"
 gov_shiite_theocracy_desc: "A theocratic [concept_government_type] ruled by leaders of the Shiite Muslim faith. A senior [Concept('concept_ruler','$RULER_AYATOLLAH|q$')] takes the role of [concept_head_of_state].\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_bhutanese_dual_system_dharma:0 "Bhutanese Diarchy"
 gov_bhutanese_dual_system_dharma_desc: "This is a [concept_government_type] where both religious and temporal authorities share power, but the religious [Concept('concept_ruler','$RULER_TITLE_DHARMA_RAJA|q$')] holds most sway.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_dalai_lama:0 "Religious Kingdom"
 gov_dalai_lama_desc: "This is a [concept_government_type] where the [concept_country] is ruled by the head of the clergy.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_heavenly_kingdom_theocracy:0 "Heavenly Kingdom"
 gov_heavenly_kingdom_theocracy_desc: "A [concept_government_type] ruled by the [Concept('concept_ruler','$RULER_TITLE_HEAVENLY_KING|q$')], who is claimed to be a child of God and brother to Jesus Christ.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_contechne: "Contechne"
 gov_contechne_desc: "This is a [concept_government_type] ruled by the [Concept('concept_ruler','$RULER_TITLE_ARCHMAGOS|q$')], the senior priest in the meritocratic hierarchy of an enlightened clergy.\n\n$TRANSFER_OF_POWER_NAME_DESC$"
 gov_american_theocracy_democratic: "Congregationalist Convention"
 gov_american_theocracy_democratic_desc: ""This is a [concept_government_type] where a council that is [Concept('concept_election','$concept_elected|q$')] by members of the nation's congregations govern the country.\n\n$TRANSFER_OF_POWER_NAME_DESC$""
 gov_american_theocracy_dictatorial: "Church Dictatorship"
 gov_american_theocracy_dictatorial_desc: "This is a [concept_government_type] where the [concept_country] is ruled by the head of a single church body.\n\n$TRANSFER_OF_POWER_NAME_DESC$"

