  russian_government_popular_opposition: "Revolutionary Opposition"
  ip5_revolutions.1.t: "Arise!"
  ip5_revolutions.1.d: "The last chance for compromise has passed unheeded. Revolutionaries have seized [ROOT.GetCountry.GetCapital.GetCityHubName], and [SCOPE.sCharacter('deposed_tsar').GetFullName] has been detained by [SCOPE.sCharacter('deposed_tsar').GetHerHis] advisors. Across [ROOT.GetCountry.GetName], military units and governors are declaring for the Revolution."
  ip5_revolutions.1.f: ""It is clear that His Majesty and you do not realise what is happening here. One of the most terrible revolutions has broken out, and it will not be easy to quell it... unless concessions are made immediately that might satisfy the country... Public sentiment has flared up to such an extent that it will scarcely be possible to restrain it; the troops are utterly demoralised; not only do they disobey orders, but they are killing their own officers... I consider it necessary to inform you that what you had envisaged is no longer sufficient, and the dynastic question has been posed point-blank."\n\n—Mikhail Rodzianko"
  ip5_revolutions.1.a: "The weight of centuries comes crashing down."
  ip5_revolutions.2.t: "Specters of Revolution"
  ip5_revolutions.2.d: "There is a word in the air, a word whispered high and low, a word that brings a spark of hope to even the most defeated man that hears it: #italic Revolution.#!"
  ip5_revolutions.2.f: "Revolution means many things to many people. It can come draped in a red flag, but it can just as easily come bearing a crown. No matter what beliefs drive it, however, one thing remains the same: The Revolution struggles against that which holds the reins of power. Whatever [ROOT.GetCountry.GetNameNoFormatting] is, however [ROOT.GetCountry.GetNameNoFormatting] shapes itself, there will be a Revolution that opposes it."
  ip5_revolutions.2.a: "Revolution? In #italic [ROOT.GetCountry.GetNameNoFormatting]#!, of all places?"
  russian_revolution_radicalism: "Whispers of Revolution"
  russian_revolution_radicalism_tt: "The leading opposition political movement will gain more support and activism the longer Russia's governing ideology #bold inertia#! grows."
  rcw.102.t: "End of the Old Order"
  rcw.102.d: "With the old government swept away, many argue that the [SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetName] is an obsolete institution that should come to an end. If we later decide to create a new bloc, of course, our experiences would make it much easier to rebuild that new organization."
  rcw.102.f: ""If we are meant to break with the past and establish something new, then why should we keep the [SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetNameNoFormatting] around? Yes, it benefits us to maintain relations with some of these nations, but we don't want all these reminders of the old order lingering around.""
  rcw.102.a: "[SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetName] must come to an end."
  refund_mandates_tooltip: "We will recover some mandates that can be reused the next time we create a new power bloc."
  russian_mandates_refund: "Experiences from the Old Order"
  rcw.102.b: "What? The [SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetName] is needed, now more than ever!"

  provisional_government_name_tt: "For the duration of the #v $je_russia_provisional_government$#! [concept_journal_entry], #v $RUS$#! will be known as the #v $dyn_c_russian_provisional_government$#!"
  provisional_government_popular_opposition: "Popular Opposition"
