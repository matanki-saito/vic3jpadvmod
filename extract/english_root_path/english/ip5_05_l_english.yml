l_english:
  je_russian_revolution: "The Russian Revolution"
  je_russian_revolution_reason: "For centuries, the rulers of [ROOT.GetCountry.GetName] have lived in terror of #b Revolution#!. The merciless repressive efforts of these rulers have created a great buildup of pressure throughout [ROOT.GetCountry.GetAdjectiveNoFormatting] society. If these efforts unwind, and #b Revolution#! comes to [ROOT.GetCountry.GetNameNoFormatting], the forces unleashed may lead to a cataclysm hitherto unimaginable.\n\n@information! The [concept_revolution] will always oppose the [concept_ideology] of the state, determined by the [Concept('concept_country','$concept_country_possessive|q$')] current political situation, the ideology of her [concept_ruler], and the cumulative $concept_ideologies$ of past [Concept('concept_government','$concept_governments|q$')]. Even if the $concept_government$ radically changes character in the present, it retains an ideological inertia that the Revolutionaries will remember.\n\nThe Revolutionaries will always belong to the strongest ideological camp which is not the $concept_ideology$ of [ROOT.GetCountry.GetName] and the $concept_government$. If any [concept_political_movement] that aligns with the Revolutionaries erupts into full revolt, that $concept_revolution$ will become #italic the#! Revolution."
  je_russian_revolution_revolution_header: "#title Revolutionaries will overthrow the government if:\n#!"
  je_russian_revolution_revolution_conclusion_desc: "The $concept_journal_entry$ concluded with #b Revolutionaries#! overthrowing the government"
  russia_is_conservative: "Russia is #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_conservative_ideologies_list_tt Conservative#! $russian_alignment_shares$.\nInertia strengthens the [SelectLocalization(ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').IsSet, ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').GetPoliticalMovement.GetName, 'main opposition movement')] by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russian_conservative_inertia_tt [ROOT.GetCountry.MakeScope.ScriptValue('russian_revolution_radicalism_value')|%0v]#!."
  russia_is_liberal: "Russia is #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_liberal_ideologies_list_tt Liberal#! $russian_alignment_shares$.\nInertia strengthens the [SelectLocalization(ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').IsSet, ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').GetPoliticalMovement.GetName, 'main opposition movement')] by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russian_liberal_inertia_tt [ROOT.GetCountry.MakeScope.ScriptValue('russian_revolution_radicalism_value')|%0v]#!."
  russia_is_socialist: "Russia is #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_socialist_ideologies_list_tt Socialist#! $russian_alignment_shares$.\nInertia strengthens the [SelectLocalization(ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').IsSet, ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').GetPoliticalMovement.GetName, 'main opposition movement')] by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russian_socialist_inertia_tt [ROOT.GetCountry.MakeScope.ScriptValue('russian_revolution_radicalism_value')|%0v]#!."
  russia_is_conservative_and_liberal: "Russia is #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_conservative_ideologies_list_tt Conservative#! and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_liberal_ideologies_list_tt Liberal#! $russian_alignment_shares$.\nInertia strengthens the [SelectLocalization(ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').IsSet, ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').GetPoliticalMovement.GetName, 'main opposition movement')] by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russian_conservative_inertia_tt [ROOT.GetCountry.MakeScope.ScriptValue('russian_revolution_radicalism_value')|%0v]#!."
  russia_is_conservative_and_socialist: "Russia is #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_conservative_ideologies_list_tt Conservative#! and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_socialist_ideologies_list_tt Socialist#! $russian_alignment_shares$.\nInertia strengthens the [SelectLocalization(ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').IsSet, ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').GetPoliticalMovement.GetName, 'main opposition movement')] by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russian_socialist_inertia_tt [ROOT.GetCountry.MakeScope.ScriptValue('russian_revolution_radicalism_value')|%0v]#!."
  russia_is_liberal_and_socialist: "Russia is #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_socialist_ideologies_list_tt Socialist#! and #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_liberal_ideologies_list_tt Liberal#! $russian_alignment_shares$.\nInertia strengthens the [SelectLocalization(ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').IsSet, ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').GetPoliticalMovement.GetName, 'main opposition movement')] by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russian_liberal_inertia_tt [ROOT.GetCountry.MakeScope.ScriptValue('russian_revolution_radicalism_value')|%0v]#!."
  russia_is_a_land_of_contrasts: "Russia has achieved true centrism $russian_alignment_shares$.\nInertia increases [ROOT.GetCountry.GetAdjectiveNoFormatting] radicalism by #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russian_liberal_inertia_tt [ROOT.GetCountry.MakeScope.ScriptValue('russian_revolution_radicalism_value')|%0v]#!"
