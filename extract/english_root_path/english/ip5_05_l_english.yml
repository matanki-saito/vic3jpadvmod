  russian_revolutionary_leaderless: "\nRevolutionaries are in search of a leader."
  russia_lib_opposition: "\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_liberal_ideologies_list_tt Liberals#! lead the opposition."
  russia_soc_opposition: "\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_socialist_ideologies_list_tt Socialists#! lead the opposition."
