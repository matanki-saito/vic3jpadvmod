  russia_lib_con_opposition: "\nA #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_liberal_ideologies_list_tt Liberal#! & #tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_conservative_ideologies_list_tt Conservative#! coalition leads the opposition."
