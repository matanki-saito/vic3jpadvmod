l_english:
# Stances
 stance_none: "None"
 stance_conquer_region: "Conquer Region"
 stance_protect_region: "Protect Region"
 stance_colonize_region: "Colonize Region"

 stance_none_desc: "A [concept_country] holding this $concept_strategic_region_stance_short$ has no particular ambitions in this [Concept('concept_strategic_region', '$concept_strategic_region_short|q$')], but may still act opportunistically."
 stance_conquer_region_desc: "A [concept_country] holding this $concept_strategic_region_stance_short$ looks to expand its territorial ambitions and sphere of influence to this [Concept('concept_strategic_region', '$concept_strategic_region_short|q$')]."
 stance_protect_region_desc: "A [concept_country] holding this $concept_strategic_region_stance_short$ has decided to maintain the status quo in [Concept('concept_strategic_region', '$concept_strategic_region_short|q$')] and will protect [Concept('concept_local_country', '$concept_local_countries|q$')] against [Concept('concept_rivalry','$concept_rivals|q$')]."
 stance_colonize_region_desc: "A [concept_country] holding this $concept_strategic_region_stance_short$ wishes to expand its colonial ambitions in this [Concept('concept_strategic_region', '$concept_strategic_region_short|q$')], disregarding the [Concept('concept_local_country', '$concept_local_countries|q$')] that are already present there."

# Conduct
 stance_none_behavior: "$EFFECT_LIST_BULLET$Not show any special interest in [STRATEGIC_REGION.GetName]"
 stance_conquer_region_behavior: "$EFFECT_LIST_BULLET$Press its ambitions against [Concept('concept_local_country', '$concept_local_countries|q$')] in [STRATEGIC_REGION.GetName]\n$EFFECT_LIST_BULLET$Grow hostile in its [concept_attitude] towards [Concept('concept_local_country', '$concept_local_countries|q$')]"
 stance_protect_region_behavior: "$EFFECT_LIST_BULLET$Stand by friendly [Concept('concept_local_country', '$concept_local_countries|q$')] in [STRATEGIC_REGION.GetName]\n$EFFECT_LIST_BULLET$Grow warmer in its [concept_attitude] towards [Concept('concept_local_country', '$concept_local_countries|q$')]\n$EFFECT_LIST_BULLET$Oppose [Concept('concept_rivalry','$concept_rivals|q$')] that are trying embark on conquest there"
 stance_colonize_region_behavior: "$EFFECT_LIST_BULLET$Settle unclaimed land in [STRATEGIC_REGION.GetName]\n$EFFECT_LIST_BULLET$Press its ambitions against [Concept('concept_unrecognized_power', '$concept_unrecognized_power_short|q$')] [Concept('concept_local_country', '$concept_local_countries|q$')] there"

# AI Values
 AI_REGION_STANCE_BASE_VALUE: "#b Base Value#!"
 AI_REGION_STANCE_NUMBER_OF_CLAIMS: "Number of [Concept('concept_claim', '$concept_claims|q$')]"
 AI_REGION_STANCE_CAPITAL_REGION: "[Concept('concept_capital_state', '$concept_capital_state_short|q$')] [Concept('concept_strategic_region', '$concept_strategic_region_short|q$')]"
 AI_REGION_STANCE_WANTS_TO_OPEN_UP_JAPAN: "Wants to open up #b $JAP$#!"
 AI_REGION_STANCE_IS_LOYAL_SUBJECT: "Is #b Loyal#! [concept_subject]"
 AI_REGION_STANCE_FREE_REAL_ESTATE: "[Concept('concept_state', '$concept_states|q$')] held by $concept_decentralized_nations$ and [Concept('concept_unrecognized_power', '$concept_unrecognized_powers|q$')]"
 AI_REGION_STANCE_CIVILIZING_MISSION_RESEARCHED: "[GetTechnology('civilizing_mission').GetName] researched"
 AI_REGION_STANCE_QUININE_RESEARCHED: "[GetTechnology('quinine').GetName] researched"
 AI_REGION_STANCE_EXISTING_REGION_STANCES: "Existing $concept_strategic_region_stances_short$"
 AI_REGION_STANCE_SMALL_COUNTRY: "[Country.GetName] is a small $concept_country$"
 AI_REGION_STANCE_COLONIAL_COUNTRY: "[Country.GetName] is a $concept_colony$"

# Tooltip
 STRATEGIC_REGION_AI_STANCE_BEHAVIOR_TITLE: "#title [Country.GetName] will:#!"
 STRATEGIC_REGION_AI_STANCE_TT_HEADER: "#title #v [Country.GetAIStrategicRegionStanceScoreIn(StrategicRegion.Self)|0]#! in favor of this [Concept('concept_strategic_region_stance', '$concept_strategic_region_stance_short|q$')] in [StrategicRegion.GetName], due to:#!"
 STRATEGIC_REGION_AI_STANCE_BREAKDOWN: "[Country.GetAIStrategicRegionStanceDescIn(StrategicRegion.Self)]"
 STRATEGIC_REGION_AI_STANCE_ATTENTION_ELSEWHERE_TITLE: "#title [Country.GetName] is concerned with these $concept_strategic_regions_short$ instead:#!"
 STRATEGIC_REGION_AI_STANCE_ATTENTION_ELSEWHERE_ENTRY: "[StrategicRegion.GetName]"

# Regional objectives
 REGIONAL_OBJECTIVE_TYPE: "[Concept('concept_regional_objective', '$concept_regional_objective|q$')]"
 REGIONAL_OBJECTIVE_STANCE_TITLE: "#title Pursued under this [Concept('concept_strategic_region_stance', '$concept_strategic_region_stance_short|q$')]:#!"
 REGIONAL_OBJECTIVE_STANCE_ENTRY: "[AIRegionalObjective.GetStance.GetNameNoFormatting] in [AIRegionalObjective.GetRegion.GetName]"
 REGIONAL_OBJECTIVE_STARTED: "Taken up on #v [AIRegionalObjective.GetStartDate]#!"
 REGIONAL_OBJECTIVE_COMPLETED: "Completed on #v [AIRegionalObjective.GetConclusionDate]#!"
 REGIONAL_OBJECTIVE_FAILED: "Failed on #v [AIRegionalObjective.GetConclusionDate]#!"
 REGIONAL_OBJECTIVE_CONCLUDED: "Eventually, a new [concept_regional_objective] may be taken up in [AIRegionalObjective.GetRegion.GetName] in its place."
 REGIONAL_OBJECTIVE_TARGETS_TITLE: "#title Targeting:#!"
 REGIONAL_OBJECTIVE_TARGET_COUNTRY: "[Country.GetName]"
 REGIONAL_OBJECTIVE_TARGET_STATE: "[State.GetName]"
 REGIONAL_OBJECTIVE_ADDITIONAL_TARGET_COUNTRIES: "and [GetDataModelSize(DataModelSkipFirst(AIRegionalObjective.GetTargetCountries, GetDefine('NGUI', 'REGIONAL_OBJECTIVE_MAX_TARGETS_SHOWN')))] more..."
 REGIONAL_OBJECTIVE_ADDITIONAL_TARGET_STATES: "and [GetDataModelSize(DataModelSkipFirst(AIRegionalObjective.GetTargetStates, GetDefine('NGUI', 'REGIONAL_OBJECTIVE_MAX_TARGETS_SHOWN')))] more..."
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_TITLE: "#title [Country.GetName] is pursuing:#!"
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_COMPLETED_TITLE: "#title [Country.GetName] #b completed#! on #v [Country.GetRegionalObjectiveIn(StrategicRegion.Self).GetConclusionDate]#!:#!"
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_FAILED_TITLE: "#title [Country.GetName] #b failed#! on #v [Country.GetRegionalObjectiveIn(StrategicRegion.Self).GetConclusionDate]#!:#!"
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_ENTRY: "[Country.GetRegionalObjectiveIn(StrategicRegion.Self).GetName]"
 STRATEGIC_REGION_AI_STANCE_OBJECTIVE_CONCLUDED: "Eventually, [Country.GetName] may look for a new [concept_regional_objective] to pursue in [StrategicRegion.GetName]."
