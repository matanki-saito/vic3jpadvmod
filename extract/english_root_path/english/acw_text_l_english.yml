 je_acw_countdown: "The Slavery Debate"
 je_acw_countdown_reason: "Slaveholders and abolitionists are engaged in increasingly rancorous debate across the nation. Sooner or later, the arguments will stop being made with words and start being made with bullets."
 je_acw_countdown_complete: "The American Civil War has begun."
 je_acw_reconstruction: "Reconstruction"
 je_acw_reconstruction_status: "Rebuild the nation after the divisive Civil War."
 je_acw_reconstruction_reason: "With the Civil War behind us, now is the time for former secessionist states to be reintegrated into the Union."
 je_acw_reconstruction_goal: "Reconstruct the formerly-rebellious states."
 je_acw_reincorporate: "Readmit the Secessionist States"
 je_acw_reincorporate_status: "Bring the former secessionist states back into the fold as fully-fledged incorporated states once more."
 je_acw_reincorporate_reason: "Readmitting the rebellious states back into the Union is essential for restoring the shaken spirit of the nation, and may help establish new powerbases for the government."
 acw_reincorporate_loyalist_tt: "At least #v [GetPlayer.MakeScope.ScriptValue('acw_reincorporate_dixie_loyalist_min')|0%]#! of [GetCulture('dixie').GetName] [Concept('concept_pop','$concept_pops|q$')] in the [concept_state] are [concept_loyalist]"
 je_acw_equality: "Equality for All"
 je_acw_equality_status: "Create a system that recognizes all men, from the North and South, and Black and White, as true equals."
 je_acw_equality_reason: "This nation fought a war over deep issues that were papered over for generations until the problems became too big to ignore. We must avoid a repeat of this disaster, and tackle the problems head-on lest they are left to fester for another century."
 je_acw_wild_wild_west: "The Wild, Wild West"
 je_acw_wild_wild_west_reason: "The western frontier has been set alight by the unrest in the rest of the nation. We must find a way to calm it down."
 ACW_DIXIE_STATES_HEADER: "All of these [Concept('concept_state', '$concept_states|q$')] are [Concept('concept_incorporated_state','$concept_incorporated|q$')] and have at least [GetPlayer.MakeScope.ScriptValue('acw_reincorporate_dixie_loyalist_min')|0v%] [GetCulture('dixie').GetName] [Concept('concept_loyalist', '$concept_loyalists|q$')]:"
 ACW_DIXIE_STATES_LIST_ENTRY: "[THIS.GetState.GetName]: $concept_incorporated$: [SelectLocalization(THIS.GetState.IsIncorporated,'@green_checkmark_box!','@simple_box!')] $dixie$ $concept_loyalists$: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(THIS.ScriptValue('dixie_loyalist_fraction'), THIS.ScriptValue('acw_reincorporate_dixie_loyalist_min') ),'@green_checkmark_box!','@simple_box!')] ([THIS.ScriptValue('dixie_loyalist_fraction')|%+1])"
 ACW_REINCORPORATE_TT: "$ACW_DIXIE_STATES_HEADER$\n[GetScriptedGui('je_acw_reincoprorate_states_sgui').ExecuteTooltip(GuiScope.SetRoot(ROOT.GetCountry.MakeScope).End)]"
 je_acw_reincorporate_state_unionist: "[THIS.GetState.GetName] sided with the union."
 je_acw_reincorporate_state_completed: "Reconstruction of [THIS.GetState.GetName] has been completed and the state has been readmitted back into the union.\n$ACW_DIXIE_STATES_LIST_ENTRY$"
 je_acw_reincorporate_state_partial: "Reconstruction of [ROOT.GetState.GetName] is partially completed.\n$ACW_DIXIE_STATES_LIST_ENTRY$"
 je_acw_reincorporate_state_not_completed: "Reconstruction of [THIS.GetState.GetName] is still in the early stages.\n$ACW_DIXIE_STATES_LIST_ENTRY$"

 je_acw_war: "The American Civil War"
 je_acw_war_reason: "War between the states is upon us. Now is the time to preserve the Union, or die trying."
 acw_war_tt_complete: "[Concept('concept_secession','$concept_secessionists|q$')] have been defeated and reannexed."

 acw_je_events.1.t1: "The Southern Declaration of Secession"
 acw_je_events.1.t2: "The Northern Declaration of Secession"
 acw_je_events.1.d1: "A convention of pro-slavery states have declared their independence from us as the [SCOPE.sCountry('csa_scope').GetName]. The Union has been challenged, but will not yield so easily."
 acw_je_events.1.d2: "A convention of abolitionist states have declared their independence from us as the [SCOPE.sCountry('fsa_scope').GetName]. The Union has been challenged, but will not yield so easily."
 acw_je_events.1.f1: ""In the momentous step which we have taken of dissolving our connection with the government of which we so long formed a part, it is but just that we should declare the prominent reasons which have induced our course.\n\nOur position is thoroughly identified with the institution of slavery—the great material interest of the world.""
 acw_je_events.1.f2: ""In the momentous step which we have taken of dissolving our connection with the government of which we so long formed a part, it is but just that we should declare the prominent reasons which have induced our course.\n\nOur position is thoroughly identified with the institution of slavery - an institution of unparalleled evil that must be abolished.""
 acw_je_events.1.a: "A house divided against itself cannot stand. For the Union!"
 acw_je_events.1.b: "I would rather call our cause one of states' rights."

 acw_je_events.2.t: "Reconstructing the Nation"
 acw_je_events.2.d: "While the military fight has finished, the fight for the nation's soul has not. The [ROOT.GetCountry.GetName] must rebuild itself after being split in two."
 acw_je_events.2.f: ""I do not expect this nation to fall. Welcome or unwelcome, whether it becomes all one thing or all the other, this nation shall cease to be divided in body and soul.""
 unreconstructed_state: "Unreconstructed State"

 acw_je_events.3.t: "The Nation, Reconstructed"
 acw_je_events.3.d: "Our nation has rebuilt itself, making something distinct, something new, and most importantly, something united."
 acw_je_events.3.f: ""For all our faults, we have reforged our nation, and have built ourselves a government that shall not perish from this earth.""
 acw_je_events.3.a: "We stand united once more."

 acw_je_events.4.t: "The Emancipation Proclamation"
 acw_je_events.4.d: "With the supporters of slavery in rebellion, we can issue a proclamation to free all slaves in rebellious territories. This is the first but most significant step in total abolition."
 acw_je_events.4.f: ""By virtue of the power vested in me in this time of actual armed rebellion, I do order and declare that all persons held as slaves henceforward shall be free. Upon this act, I invoke the considerate judgment of mankind, and the gracious favor of Almighty God.""
 acw_je_events.4.a: "By this stroke, we shall save the Union!"
 acw_je_events.4.b: "We refuse to emancipate outside of conventional means."

