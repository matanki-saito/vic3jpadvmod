l_english:
 acw_events.1.t: "The Abolitionist's Martyrdom"
 acw_events.1.d: "An ardent abolitionist writer died in a firefight against a pro-slavery mob which had gathered in front of his house. The story has gone national, and radicalized previously apathetic individuals high and low."
 acw_events.1.f: "His friend sighed. The funeral had been small, lest the mob appear again in force. The gravestone itself was simple, not calling attention to itself. The only embellishment that had been allowed was a simple inscription:\n\n"Here lies a brave man: now spare his grave.""
 acw_events.1.a: "Ghastly! The violence of slavers must be resisted."
 acw_events.1.b: "This abolitionist agitation must be stopped!"

 acw_events.2.t: "The Fugitive Slave"
 acw_events.2.d: "A slave belonging to [SCOPE.sCharacter('slaver_ig_leader').GetFullName] has escaped [SCOPE.sCharacter('slaver_ig_leader').GetHerHis] estate and fled to a northern free state. [SCOPE.sCharacter('slaver_ig_leader').GetLastName] has demanded his return, but abolitionists are calling for [SCOPE.sCharacter('slaver_ig_leader').GetHerHis] demands to be ignored."
 acw_events.2.f: ""There are few things that I care more about than justice. If a man loses his jacket, it's only natural that it would be returned to him, right? I simply ask that what's mine be returned to me. Why is this causing such an uproar?""
 acw_events.2.a: "We shall find and return [SCOPE.sCharacter('slaver_ig_leader').GetFullName]'s fugitive slave."
 acw_events.2.b: "Free soil makes anyone free. [SCOPE.sCharacter('slaver_ig_leader').GetFullName] will get no help from the government."

 acw_events.3.t: "The [SCOPE.sCharacter('wilmot_proviso_ig_leader').GetLastName] Proviso"
 acw_events.3.d: "[SCOPE.sCharacter('wilmot_proviso_ig_leader').GetFullName], leader of the [SCOPE.gsInterestGroup('wilmot_proviso_ig').GetName], has proposed outright prohibiting slavery in all our new western territories. Some opponents demand simple moderation, but others are demanding legalization of slavery in all new territories."
 acw_events.3.f: ""This intolerable institution cannot spread its influence any further! A free nation needs free soil if it is to thrive!""
 acw_events.3.a: "Reject the proviso, this remains a state-by-state issue."
 acw_events.3.b: "Accept the proviso, and abolish slavery in the West."
 acw_events.3.c: "Reject the proviso, and expand slavery in the West."

 acw_events.4.t: "The Forgotten Event"

 acw_events.5.t: "Bleeding [SCOPE.sState('bleeding_kansas').GetName]"
 acw_events.5.d: "Abolitionists and proponents of slavery have been pouring into [SCOPE.sState('bleeding_kansas').GetName], hoping to shape the territory's government to their liking. Paramilitary groups have begun committing acts of violence against each other and civilians."
 acw_events.5.f: ""Before God and in the presence of these witnesses, from this time, I consecrate my life to the destruction of slavery. The crimes of this guilty land can never be purged away but with blood."" # two separate quotes by John Brown.
 acw_events.5.a: "Border ruffians cannot dictate law! [SCOPE.sState('bleeding_kansas').GetName] must be a free state."
 acw_events.5.b: "Jayhawkers do not decide what is right! [SCOPE.sState('bleeding_kansas').GetName] will be a slave state."
 acw_events_5_free_state_tt: "[SCOPE.sState('bleeding_kansas').GetName] will remain a free territory."
 acw_events_5_slave_state_tt: "A small number of slaves will move to [SCOPE.sState('bleeding_kansas').GetName]."

 acw_events.6.t: "The Caning of [SCOPE.sCharacter('charles_sumner_leader').GetFullName]"
 acw_events.6.d: "[SCOPE.sCharacter('charles_sumner_leader').GetFullName], an outspoken abolitionist, has been beaten with a cane by [SCOPE.sCharacter('preston_brooks_leader').GetFullName], a slave owner. [SCOPE.sCharacter('charles_sumner_leader').GetLastName]'s injuries compel him to convalesce and retire from public office, while [SCOPE.sCharacter('preston_brooks_leader').GetLastName] still currently walks free."
 acw_events.6.f: ""Such barbarism! I sadly do not see how two such disparate communities can still constitute one state.""
 acw_events.6.a: "[SCOPE.sCharacter('preston_brooks_leader').GetFullName] was just defending his honor. We will do nothing."
 acw_events.6.a.tt: "[SCOPE.sCharacter('charles_sumner_leader').GetFullName] retires from office."
 acw_events.6.b: "[SCOPE.sCharacter('preston_brooks_leader').GetFullName] assaulted a citizen! He must be removed from office and arrested."
 acw_events.6.b.tt: "[SCOPE.sCharacter('preston_brooks_leader').GetFullName] is removed from office."

 acw_events.7.t: "The Free State of [SCOPE.GetRootScope.GetCountry.GetCustom('random_free_state_of_place')]"
 acw_events.7.d: "Anti-secessionist agitators in [SCOPE.sState('free_state_of_county').GetName] have rallied support and declared the establishment of a unionist government."
 acw_events.7.f: ""In defiance of the secessionists, we, by resolution of the people, do secede from these traitors and declare ourselves Free and Independent, loyal still to the [SCOPE.sCountry('unionist_usa').GetNameNoFormatting].""
 acw_events.7.a: "A show of strength will bring them to heel."
 acw_events.7.b: "We cannot afford to move against them right now."

 acw_events.8.t: "The Great Locomotive Chase"
 acw_events.8.d: "Enemy raiders have successfully stolen a locomotive and wrecked miles of track and telegraph lines in [SCOPE.sState('great_locomotive_chase_state').GetName] before being stopped."
 acw_events.8.f: "The wisps of smoke grew more and more feeble with each huff of their tired locomotive, the [SCOPE.GetRootScope.GetCountry.GetCustom('random_csa_acw_locomotive')]. The raiders had run out of fuel miles back, and the rails they had torn up hadn't been enough to save them. In the distance, plumes of smoke from their pursuers grew ever-closer. The chase was coming to an end."
 acw_events.8.a: "Damn everything else, rebuild those tracks and lines now!"
 acw_events.8.b: "Keeping troops on our trains will slow them down, but make them safer."
 acw_events.8.c: "Next time, we'll capture the raiders before they start."

 acw_events_low_tt: "Civil War tensions will rise slightly."
 acw_events_med_tt: "Civil War tensions will rise a medium amount."
 acw_events_high_tt: "Civil War tensions will rise significantly."

 acw_followup_events.1.t: "The Attempt on [SCOPE.sCharacter('lincoln_proxy').GetLastName]'s Life"
 acw_followup_events.1.d: "A sympathizer of the recent rebellion has taken the life of [SCOPE.sCharacter('lincoln_proxy').GetFullName]. Although he was captured after the deed and his co-conspirators were exposed, the death of [SCOPE.sCharacter('lincoln_proxy').GetLastName] remains a somber end to this tragic era in American history."
 acw_followup_events.1.f: ""[SCOPE.sCharacter('lincoln_proxy').GetFullNameNoFormatting] went at the call of duty to the post of danger, and although wrecked, [SCOPE.sCharacter('lincoln_proxy').GetHerHis] life is by no means lost. The great blot upon our country, the great stain upon our national character, the great source of strife and contention among our people, by [SCOPE.sCharacter('lincoln_proxy').GetHerHis] courage and fortitude, has been wiped out and removed. [SCOPE.sCharacter('lincoln_proxy').GetFullNameNoFormatting]'s name has become historic.""
 acw_followup_events.1.a: "The nation shall mourn this day."

 acw_followup_events.2.t: "The Attempt on [SCOPE.sCharacter('lincoln_proxy').GetLastName]'s Life"
 acw_followup_events.2.d: "A sympathizer of the recent rebellion has attempted to assassinate [SCOPE.sCharacter('lincoln_proxy').GetFullName]. He was caught attempting to break in, and his plot and co-conspirators exposed. [SCOPE.sCharacter('lincoln_proxy').GetLastName] has taken the opportunity to rally the populace once again to [SCOPE.sCharacter('lincoln_proxy').GetHerHis] cause."
 acw_followup_events.2.f: ""How can those fools think they can ever rise again, when they can't even fire one shot off right?""
 acw_followup_events.2.a: "A tragedy averted!"

 acw_followup_events.3.t: "The Attempt on [SCOPE.sCharacter('lincoln_proxy').GetLastName]'s Life"
 acw_followup_events.3.d: "A sympathizer of the recent rebellion has attempted to assassinate [SCOPE.sCharacter('lincoln_proxy').GetFullName]. The effort did not go as planned for the assassin."
 acw_followup_events.3.f: "[SCOPE.sCharacter('lincoln_proxy').GetFullNameNoFormatting] heard the floorboards creak behind [SCOPE.sCharacter('lincoln_proxy').GetHerHim]. Before [SCOPE.sCharacter('lincoln_proxy').GetHerHis] assailant could even finish pulling out the derringer, [SCOPE.sCharacter('lincoln_proxy').GetLastNameNoFormatting] was upon him. "Fiend! Cur! Have you no decency?" [SCOPE.sCharacter('lincoln_proxy').GetSheHe] cried, every word punctuated by another blow to [SCOPE.sCharacter('lincoln_proxy').GetLastNameNoFormatting]'s would-be assassin with [SCOPE.sCharacter('lincoln_proxy').GetHerHis] bare fists."
 acw_followup_events.3.a: "Thus always to assassins!"

 acw_followup_events.4.t: "Forty Acres and a Mule"
 acw_followup_events.4.d: "In the war against the secessionists, many enslaved people believed that once they were freed, they would have the right to own the land they had been forced to work on as slaves. People in [SCOPE.sState('land_redistribution_state').GetName] have pressed the issue with local authorities, who are turning to us for direction."
 acw_followup_events.4.f: ""Land! Land is what we need! I can't feed myself with a ballot box—give me the plot of land I've already been working on so I can feed my family.""
 acw_followup_events.4.a: "Authorize the limited redistribution of land."
 acw_followup_events.4.b: "Economic measures are liable to cause trouble."

 acw_followup_events.5.t: "Supremacist violence in [SCOPE.sState('supremacist_violence_state').GetName]"
 acw_followup_events.5.d: "Violence between white rioters and black freedmen has caused significant tension in [SCOPE.sState('supremacist_violence_state').GetName]."
 acw_followup_events.5.f: ""The rioters stomped, kicked, and clubbed others mercilessly. The streets grew slick with the blood of innocent men. Emptied revolvers clattered on the ground as attacks grew too frenzied to bother with reloading anymore. It was only when martial law was declared and troops marched in that even a pretense of order could return.""
 acw_followup_events.5.a: "Use the full might of the government to protect freedmen."
 acw_followup_events.5.b: "We cannot alienate local leaders with the use of troops."

 acw_followup_events.6.t: "Redeemers"
 acw_followup_events.6.d: "A coalition of former Confederates and Confederate sympathizers have won control of [SCOPE.sState('redeemer_state').GetName]'s state government through means fair and foul, threatening the ongoing process of Reconstruction."
 acw_followup_events.6.f: ""Draw a line one side of which you see intelligence, virtue, self-respect, and democracy; and on the other the absolute unchecked political supremacy of brute force and terror, and there you will behold not one attribute of free government, but the saddest tyranny of the Old South desperately clawing back power that ever cursed this earth."" # this is an inversion of Lucius Quintus Cincinnatus Lamar II's horrible racist diatribe.
 acw_followup_events.6.a: "Reconciliation demands an accord with these men."
 acw_followup_events.6.b: "Arrest these men and install a new state government."

 acw_followup_events.7.t: "Paramilitary Intimidation"
 acw_followup_events.7.d: "Political groups opposed to Reconstruction have organized militant units to intimidate voters in [SCOPE.sState('paramilitary_intimidation_state').GetName] and restore themselves to power."
 acw_followup_events.7.f: ""While I understand that our organization causes consternation among some elements of the population, I can assure you that our bayonets and our rifles are purely for display purposes only.""
 acw_followup_events.7.a: "A loyal state government is all that matters."
 acw_followup_events.7.b: "Horrendous! Disband these units at once!"

 acw_followup_events.8.t: "Carpetbaggers"
 acw_followup_events.8.d: "Northerners in the state of [SCOPE.sState('carpetbagger_state').GetName] have been targeted by locals who denounce them as troublemakers and exploiters. Writers and orators in [SCOPE.sState('carpetbagger_home').GetName], however, have demanded that the government protect these Northerners."
 acw_followup_events.8.f: ""I came here to help build something better after toppling slave power, and sure I didn't mind making something for myself in the process, but what have I gotten? I'm here empty-handed, with nothing but a litany of slander and threats thrown at my name.""
 acw_followup_events.8.a: "Let the people of [SCOPE.sState('carpetbagger_state').GetName] do what they will."
 acw_followup_events.8.b: "We must protect all Americans, even if it angers some."

 wild_west.1.t: "Outlaws in [SCOPE.sState('bank_robbery_state').GetName]!"
 wild_west.1.d: "A notorious gang of outlaws have been terrorizing the respectable settlements of [SCOPE.sState('bank_robbery_state').GetName]."
 wild_west.1.f: "The rough man holstered his resolver, kicking the deputy's body to the side. "I told them," he guffawed, "I told them that if I ever got free, the [SCOPE.GetRootScope.GetCountry.GetCustom('american_outlaw_gang')] would show them all what bad #Sreally#! means.""
 wild_west.1.a: "Let the local sheriff sort it out."
 wild_west.1.b: "Hire the Pinkertons—they know how to be rough."
 wild_west.1.c: "The guns of the national guard will stop the outlaws."

 wild_west.2.t: "Raids on the Iron Horse"
 wild_west.2.d: "Native raids have been increasing in frequency, with railroads becoming a very common target. Citizens in [SCOPE.sState('raided_railroad').GetName] are demanding action from the government."
 wild_west.2.f: ""We built that line across untouched land, but they've come out to attack us anyways! How are we supposed to get anything done while the trains keep being attacked and the rails keep getting torn up?""
 wild_west.2.a: "Send in the army!"
 wild_west.2.b: "We can't spare anything to help."
 wild_west.2.c: "Let's talk with [SCOPE.sCulture('native_people_infringed').GetName] leaders and make a deal."

 wild_west.3.t: "Gunfight at the Corral"
 wild_west.3.d: "Lawmen in [SCOPE.sState('OK_corral_state').GetName] have engaged in a shootout with several cowboys. The following investigation has revealed that the gunfight was likely due to a personal feud between American marshals and the citizens involved, rather than a pursuit of the law. People are demanding justice—against the lawmen."
 wild_west.3.f: ""Come on, does anyone else want to try their luck? See this badge? It means I'm in charge here! I'm justice! Now get moving, there's nothing to see here.""
 wild_west.3.a: "The Lawmen are the Law, and we cannot stop the Law."
 wild_west.3.b: "Recall the marshals from [SCOPE.sState('OK_corral_state').GetName] temporarily."

 fsa_events.1.t: "A More Perfect Union"
 fsa_events.1.d: "Abolitionist thinkers from across the nation have come together to propose that simply abolishing slavery is insufficient in extending freedom to those once in shackles. They propose a plan of desegregation and reparations to mend the gaps between the races."
 fsa_events.1.f: "Though the chains of slavery have been broken in this fine nation, there are still shackles which bind our people. Centuries of subjugation have meant that our Afro-American citizens live eternally in the shadow of the plantation, without power over their own destinies. Only through active state efforts to mitigate the mistakes of the past can we hope to create a true nation of equals and form an even more perfect union."
 fsa_events.1.a: "They have bootstraps with which to be lifted, do they not?"
 fsa_events.1.b: "These problems cannot be solved without redistribution of political and economic power."
 fsa_reparation_cost: "Social Spending"
 fsa_reparation_reward: "Reparations"
