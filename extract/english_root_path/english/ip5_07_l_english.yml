bolsheviks.5.t: "Splitters!"
bolsheviks.5.d: "Chaos has erupted at a major conference of [SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')]. Threats of schism and accusations of liberalism abound, until [SCOPE.sCharacter('most_popular_leftist').GetFullName] raises [SCOPE.sCharacter('most_popular_leftist').GetHerHis] voice and addresses the throng…"
bolsheviks.5.f: "If, carried away by the logic of what you have begun, you separate into an independent political party, you will immediately reap what you are now sowing: you will break up into a series of factional groups, incapable of maintaining party discipline, acting as guerrillas, each in its own way, and your party will become the victim of complete dispersion, complete pulverization. \n\n — Victor Chernov"
bolsheviks.5.a: "This speech will inspire generations of [SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')]."
bolsheviks.5.b: "[SCOPE.sCharacter('most_popular_leftist').GetLastName]'s reputation will never recover from such embarrassing rhetoric."
mensheviks_plural: "Mensheviks"
