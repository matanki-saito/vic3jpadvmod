l_english:
je_congress_poland: "Whites and Reds"
je_congress_poland_reason: "The [Glossary('glossary_third_partition','$glossary_third_partition_short|q$')] gave [SCOPE.sCountry('russia_poland_scope').GetName] control over much of the former Polish-Lithuanian Commonwealth. Initially, the Tsars held [SCOPE.sCountry('congress_poland_scope').GetName] in [concept_personal_union] and broadly respected the Constitution and the [Glossary('glossary_sejm','$glossary_sejm_short|q$')].\n\nAfter the [Glossary('glossary_november_uprising','$glossary_november_uprising_short|q$')], Russian authorities cracked down harshly on dissent and instituted the Organic Statute - Polish autonomy was severely reduced and the country would be run by the Tsar’s personally appointed Viceroy. Hunger for Polish independence remains, but the cost of failure could doom Poland to decades of autocratic rule.\n$TOOLTIP_DELIMITER$\n@information! The #b Whites#! are made up of [SCOPE.gsInterestGroup('poland_landowners').GetName] and [SCOPE.gsInterestGroup('poland_industrialists').GetName] attempting a reformist path to greater autonomy and the restoration of [glossary_sejm].\n\nThe #b Reds#! are primarily [SCOPE.gsInterestGroup('poland_intelligentsia').GetName] and [SCOPE.gsInterestGroup('poland_rural_folk').GetName] who support a violent uprising against [SCOPE.sCountry('russia_poland_scope').GetName]. They are reckless and may not consider their readiness before igniting the fire."
