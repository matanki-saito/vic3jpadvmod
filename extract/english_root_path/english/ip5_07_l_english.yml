bolsheviks.1.t: "What Is To Be Done?"
bolsheviks.1.desc: "The [SCOPE.sCountry('russia_scope').GetAdjective] left has become sharply divided between three factions with wildly different visions for the future. The #b Bolsheviks#! lead the [SCOPE.sPoliticalMovement('bolshevik_movement').GetName], the #b Mensheviks#! lead the [SCOPE.sPoliticalMovement('menshevik_movement').GetName], and the Left SRs lead the [SCOPE.sPoliticalMovement('left_sr_movement').GetName]."
bolsheviks.1.f: ""The only serious organizational principle the active workers of our movement can accept is strict secrecy, strict selection of members and the training of professional revolutionaries."\n\n—Vladimir Lenin, #italic What Is To Be Done?#!"
bolsheviks.1.a: "Support the #b Bolsheviks#!"
bolsheviks.1.b: "Support the #b Mensheviks#!"
bolsheviks.1.c: "Support the #b Left SRs#!"
bolsheviks.1.d: "Treason! Insurrection!"
bolsheviks_start_at_tt: "The Support of the #b Bolsheviks#! will begin at #v [Divide_CFixedPoint(GetPlayer.MakeScope.Var('bolshevik_current_var').GetValue, '(CFixedPoint)2')|1]%#!"
