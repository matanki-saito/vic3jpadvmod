pol_viceroy_unlikely: "The Viceroy of Poland has immense power over the government, ruling essentially autocratically. While a #b conciliatory Viceroy#! might be persuaded towards leniency, a #b repressive Viceroy#! is likely to do the reverse and thereby incite nationalistic tensions.\n\n@red_cross! Russia is #b unlikely#! to appoint a #b Conciliatory#! Viceroy"
pol_viceroy_likely: "The Viceroy of Poland has immense power over the government, ruling essentially autocratically. While a #b conciliatory Viceroy#! might be persuaded towards leniency, a #b repressive Viceroy#! is likely to do the reverse and thereby incite nationalistic tensions.\n\nRussia is #b likely#! to appoint a #b Conciliatory#! Viceroy"
pol_viceroy_for_russia: "The Viceroy of Poland has immense power over the government, ruling essentially autocratically. While a #b conciliatory Viceroy#! might be persuaded towards leniency, a #b repressive Viceroy#! is likely to do the reverse and thereby incite nationalistic tensions."
congress_poland.1.t: "The Viceroy of Poland"
congress_poland.1.d: "The [SCOPE.sCharacter('tsar_scope').GetPrimaryRoleTitle] has found cause to review the [SCOPE.sCountry('congress_poland_scope').GetAdjective] Viceroyalty. The current governor, [SCOPE.sCharacter('poland_viceroy_scope').GetFullName], has taken a [SCOPE.sCharacter('poland_viceroy_scope').GetCustom('ConciliatoryRepressive')] approach which, while pleasing to some, has not left him without critics."
congress_poland.1.d2: "The [SCOPE.sCharacter('tsar_scope').GetPrimaryRoleTitle] has been called upon to appoint a new Viceroy of [SCOPE.sCountry('congress_poland_scope').GetName]. The primary matter to consider is whether this new governor's rule should be defined by his iron grip or by his open hand."
congress_poland.1.f: "“The longer I govern, the more convinced I am that policies of conciliation are wrong. While cruelty certainly stokes the fires of hatred and a lust for revenge, weakness is punished even more harshly. We should show leniency when, rarely, it is needed. But mostly my policy is to threaten with my resolve and my strength.”"
congress_poland.1.a: "[SCOPE.sCharacter('poland_viceroy_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('poland_viceroy_scope').GetLastName] is doing a fine job already."
congress_poland.1.b: "The new Viceroy must not spare the lash."
congress_poland.1.b2: "Poland should be handled with a lighter touch."
poland_already_conciliatory: "The Viceroy is not conciliatory"
poland_conciliatory_loc: "#b conciliatory#!"
poland_repressive_loc: "#b repressive#!"
