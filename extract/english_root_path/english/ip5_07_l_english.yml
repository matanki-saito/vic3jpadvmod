rcw.4.t1: "The Red Terror in [SCOPE.sState('rcw_terror_state').GetName]"
rcw.4.t2: "The White Terror in [SCOPE.sState('rcw_terror_state').GetName]"
rcw.4.t3: "The Great Terror in [SCOPE.sState('rcw_terror_state').GetName]"
rcw.4.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('my_rcw_side_loc')] forces under the leadership of [SCOPE.sCharacter('rcw_terror_general').GetFullName] have begun a campaign in [SCOPE.sState('rcw_terror_state').GetName] to find and execute any [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')] elements in the civilian population."
rcw.4.f: "What is better? To ferret out, to imprison, sometimes even to shoot hundreds of traitors from among the Cadets, non-party people, Mensheviks and Socialist-Revolutionaries, who “come out” (some with arms in hand, others with conspiracies, others still with agitation against mobilisation, like the Menshevik printers and railwaymen, etc.) against Soviet power, in other words, in favour of Denikin? Or to allow matters to reach such a pass that Kolchak and Denikin are able to slaughter, shoot and flog to death tens of thousands of workers and peasants? The choice is not difficult to make. \n\n—Vladimir Lenin, #italic  The Fight Against Counter-Revolution In The Rear #!"
rcw.4.a: "Don't leave a single [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')] dog alive!"
rcw.4.b: "Make sure that most of them really are [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')] sympathizers."
rcw_whites_custom: "White"
rcw_reds_custom: "Red"
rcw_generic_custom: "Russian"
rcw_generic_2_custom: "enemy"
rcw_terror: "Terror"
rcw.5.t: "The Russian Gold Reserves"
rcw.5.d: "[SCOPE.sCharacter('kazan_ruler').GetFullName] has ordered the [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')] Army to transport the bulk of the Russian gold reserves to [SCOPE.sState('kazan_owner_capital').GetCityHubName], the seat of the [SCOPE.sCountry('kazan_owner').GetAdjective] government. A convoy of armored trains is currently moving the gold out of [SCOPE.sState('kazan_state').GetName]."
rcw.5.f: "At the carriage where the guardroom was situated, we witnessed a characteristic scene. The new guard arrived, about two dozen youths who had no idea, and no interest whatsoever, in what they had been assigned to guard. They stood in a group, laughing or swearing, mostly looking this way and that. Comrade Shelepin, commander of the first Soviet guard, wanted to see their commander, who could not be found. Finally he appeared from somewhere—without a weapon and without a belt, wearing only his greatcoat and felt boots. \n\n — Čila, commander of the Czech 10th Regiment"
rcw.5.a: "We need that gold!"
russian_gold_reserves_lost: "Loss of the Russian Gold Reserves"
capture_gold_reserves_capital_tt: "The gold reserves will be partially recovered if we reconquer [SCOPE.sState('kazan_owner_capital').GetName]."
rcw.6.t: "Recapture of the Gold Reserves"
rcw.6.d: "The gold reserves have finally been recovered from the vaults of [SCOPE.sState('russian_gold_state').GetCityHubName]. A large portion seems to be missing, presumably sold to fund the [SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')] war effort."
rcw.6.f: "The movement of the gold-reserve train is as follows: ahead goes the indicated train with a guard company, up to 150 men; during movement sentries are stationed on the roofs of the cars, on the rear brakes and on the locomotive, and during stops sentries are stationed at the cars; ahead there is a machine-gun with its crew and a patrol around the train. \n\n — Alexander Kosukhin, Cheka officer"
rcw.6.a: "At least we got some of the gold back."
rcw.7.t: "The Fate of the Tsar"
rcw.7.d: "The order has been given to shoot the former Tsar [SCOPE.sCharacter('void_tsar_scope').GetFullName] dead in [SCOPE.sCharacter('void_tsar_scope').GetHerHis] temporary home in [SCOPE.sState('tsar_temp_state').GetFarmHubName], along with [SCOPE.sCharacter('void_tsar_scope').GetHerHis] surviving family."
rcw.7.d2: "It has been some time since Tsar [SCOPE.sCharacter('void_tsar_scope').GetFullName] was dethroned, and the matter can be delayed no further. We must decide [SCOPE.sCharacter('void_tsar_scope').GetHerHis] fate."
rcw.7.f: "“And the family?”\n“And the family with him.”\n“All of them?”\n“All of them.”\n\n — Leon Trotsky, #italic Diary in Exile#!"
rcw.7.f2: "Wishing to take a little physical exercise, we amused ourselves by clearing the sluices of the pond of the ice which was blocking them. A crowd of soldiers and civilians soon lined up along the park railing and watched our work. After some time the officer of the guard went up to the Czar and told him that the Commandant of the Tsarskoïe-Selo garrison had just warned him that he feared a hostile demonstration or even an attempt on the lives of the Imperial family, and he would ask us not to remain where we were. The Czar answered that he had no fear, and that the good people were not annoying him in any way. \n\n — Pierre Gilliard, #italic Thirteen Years at the Russian Court#!"
rcw.7.a: "The trial and execution of [SCOPE.sCharacter('void_tsar_scope').GetFullName] will be a spectacle for the masses."
rcw.7.b: "The former Tsar may retire to [SCOPE.sState('tsar_temp_state').GetFarmHubName] under house arrest."
rcw.7.c: "Such boasting of bloodlust..."
fate_of_the_tsar: "The Fate of the Tsar"

# Bolsheviks JE
je_bolsheviks: "What Is To Be Done?"
je_bolsheviks_reason: "Three socialist factions vie for power in [SCOPE.sCountry('russia_scope').GetName]:\n\nThe #b Bolsheviks#! support a [GetIdeology('ideology_vanguardist').GetName] interpretation of $marxism$, and draw their support from the #v $movement_communist$#!, #v $movement_labor$#!, and [SCOPE.gsInterestGroup('unions_scope').GetName]. The #b Bolsheviks#! will coup the government once they have sufficient support and [concept_legitimacy] has fallen to 50 or a Provisional Government holds power.\n\nThe #b Mensheviks#! espouse [GetIdeology('ideology_state_socialist').GetName] ideology, and draw their support from the #v $movement_socialist$#!, #v $movement_labor$#!, and [SCOPE.gsInterestGroup('nerds_scope').GetName]. The #b Mensheviks#! support a gradual transition to socialism and will not seize power through extraordinary means.\n\nThe #b Left Socialist Revolutionaries#! are an [GetIdeology('ideology_anarchist').GetName] faction of agrarian socialists. They draw their support from the #v $movement_land_reform$#!, #v $movement_anarchist$#!, and [SCOPE.gsInterestGroup('peasants_scope').GetName]. The #b Left SRs#! will coup the government once they have sufficient support and $concept_legitimacy$ has fallen to 50 or a Provisional Government holds power.\n\nEach faction's support moves gradually toward a target set by these sources and by the [concept_popularity] and [concept_prominence] of its leader."
