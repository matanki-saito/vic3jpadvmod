bolsheviks.2.t: "The [SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs')] Coup"
bolsheviks.2.t_1: "The Storming of the Winter Palace"
bolsheviks: "Bolshevik"
left_srs: "Socialist Revolutionary"
bolsheviks_plural: "Bolsheviks"
left_srs_plural: "Left SRs"
proletariat_loc: "proletariat"
peasants_loc: "peasantry"
bolsheviks.2.d: "The [SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')], under the leadership of [SCOPE.sCharacter('rev_leader').GetFullName], have mobilized the [SCOPE.GetRootScope.GetCountry.GetCustom('peasants_proletariat')] and stormed the palace in [ROOT.GetCountry.GetCapital.GetCityHubName]. The new regime has declared that [SCOPE.sCountry('russia_scope').GetName] will henceforth become a [GetLawType('law_council_republic').GetName]."
bolsheviks.2.f: ""We possess the strength of mass organization, which will overcome everything and lead the proletariat to the world revolution. We must now set about building a proletarian socialist state in Russia. Long live the world socialist revolution!"\n\n—Vladimir Lenin"
bolsheviks.2.a: "Glory to the revolution!"
bolsheviks.3.t: "The Socialist Triumph"
bolsheviks.3.d: "The [SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')] under [SCOPE.sCharacter('socialist_faction_leader').GetFullName] have finally established the foundations of their socialist republic. With the reins of power firmly in their hands, the future of [SCOPE.sCountry('russia_scope').GetName] is poised to take a bold new course."
bolsheviks.3.f: ""Our party... has an enormous future. It is a party of a bright, mighty faith in socialism and the International. It cannot be destroyed, neither by you nor by temporary reaction, because it and its ideas live in the masses, are rooted in the depths of their psychology, and the revolutionary rebirth of all humanity will inevitably take place under the banner of its Idea, the Idea of the liberation of the Human Personality."\n\n—Maria Spiridonova"
bolsheviks.3.a: "Long live socialism!"
bol_labor_add: "The #b Bolsheviks#! will draw more support from the [SCOPE.sPoliticalMovement('labor_movement_scope').GetName]"
men_labor_add: "The #b Mensheviks#! will draw more support from the [SCOPE.sPoliticalMovement('labor_movement_scope').GetName]"
bol_labor_subtract: "The #b Bolsheviks#! will draw less support from the [SCOPE.sPoliticalMovement('labor_movement_scope').GetName]"
men_labor_subtract: "The #b Mensheviks#! will draw less support from the [SCOPE.sPoliticalMovement('labor_movement_scope').GetName]"
bolsheviks.4.t: "The Masses and the Vanguard"
bolsheviks.4.d: "At a large [SCOPE.sPoliticalMovement('labor_movement_scope').GetName] gathering, [SCOPE.sCharacter('bolshevik_leader').GetFullName] and [SCOPE.sCharacter('menshevik_leader').GetFullName] are engaged in a fiery debate about the role of the proletariat in revolutionary organizing. Each hopes to win converts to their respective factions, the #b Bolsheviks#! and #b Mensheviks#!."
bolsheviks.4.f: "Behind them, behind these leaders, there is a whole mass of fighters, revolutionary workers who distribute proclamations, collect money, demonstrate in the streets, go to prison and into exile, but who do not belong either to a Committee or to any other organization. Are these fighters, these soldiers of ours, not Party members? Must we exclude them from the Party? Who will be left in the Party? Only generals without an army.  \n\n — 23rd Session of the RSDLP Second Congress"
bolsheviks.4.a: "[SCOPE.sCharacter('bolshevik_leader').GetFullName]'s #b Bolsheviks#! will lead the vanguard of the people."
bolsheviks.4.b: "The #b Menshevik#! call for restraint will have the most appeal."
bolsheviks.4.c: "This is nothing but hot air."
