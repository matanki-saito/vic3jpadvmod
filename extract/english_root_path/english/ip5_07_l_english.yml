rcw_separatist_survived_tt: "Separatist nations have survived the war"
rus_cw_pale_horse: "And I looked, and behold a pale horse: and his name that sat on him was Death, and Hell followed with him.\n\n"
rus_cw_phase_1_status: "The Civil War rages on"
rus_cw_phase_2_status: "The remaining warlords still have pretentions of sovereignty"
rcw.1.t: "The Russian Civil War"
rcw.1.d: "The Provisional Government has failed. Under the loose direction of the [SCOPE.sCountry('rcw_opposition_country').GetName], myriad legions have formed under the command of disaffected warlords such as [SCOPE.sCharacter('scariest_russian_warlord').GetFullName] in [SCOPE.sCountry('scariest_russian_warlord_country').GetName]. But all is not yet lost; our allies also rally to our cause, with the [SCOPE.sCountry('friendliest_russian_warlord_country').GetName] government under [SCOPE.sCharacter('friendliest_russian_warlord').GetFullName] being among our most prominent supporters."
rcw.1.f: ""Think not that I am come to send peace on earth: I came not to send peace, but a sword. For I am come to set a man at variance against his father, and the daughter against her mother, and the daughter in law against her mother in law. And a man's foes shall be they of his own household."\n\n—Matthew 10, King James Bible#!"
rcw.1.a: "To war!"
rcw_warlords_button: "Reincorporate Loyal Faction"
rcw_warlords_button_desc: "Many of our Russian comrades have been forced to establish local governments in the chaos of the war. We must reincorporate them as soon as the opportunity presents itself."
