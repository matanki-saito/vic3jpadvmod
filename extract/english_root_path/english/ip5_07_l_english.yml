je_rus_civil_war_partitioned_conclusion_desc: "The $concept_journal_entry$ concluded with the partition of Russia, with no #b Russian#! faction left standing."
je_rus_civil_war_frozen_conclusion_desc: "The $concept_journal_entry$ concluded without a victor. The surviving #b Russian#! factions have settled into an uneasy peace."
