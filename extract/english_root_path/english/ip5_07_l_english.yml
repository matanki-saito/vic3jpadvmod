notification_poland_repressive_viceroy_notification_desc: "[SCOPE.sCountry('russia_poland_scope').GetAdjective] tyranny grips [SCOPE.sCountry('congress_poland_scope').GetName] once again."
notification_poland_repressive_viceroy_notification_tooltip: "#header $notification_poland_repressive_viceroy_notification_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_repressive_viceroy_notification_desc$"
notification_poland_conciliatory_viceroy_notification_name: "[SCOPE.sCountry('russia_poland_scope').GetName] appoints a conciliatory viceroy"
notification_poland_conciliatory_viceroy_notification_desc: "There is hope for [SCOPE.sCountry('congress_poland_scope').GetName] yet."
notification_poland_conciliatory_viceroy_notification_tooltip: "#header $notification_poland_conciliatory_viceroy_notification_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_conciliatory_viceroy_notification_desc$"
expand_poland_button: "Expand Congress Poland"
expand_poland_button_desc: "If more of Poland should somehow fall into Russian hands, it may be in the common interest to consolidate those lands into the administration of Congress Poland."
congress_poland.2.t: "Expanding [SCOPE.sCountry('congress_poland_scope').GetNameNoFormatting]"
congress_poland.2.d: "The [SCOPE.sCharacter('tsar_scope').GetPrimaryRoleTitle] has received a petition proposing an enlargement of [SCOPE.sCountry('congress_poland_scope').GetName], a territory that [SCOPE.sCountry('russia_poland_scope').GetName] so graciously allows some limited semblance of self-rule."
congress_poland.2.f: "“Our borders expand ever westward, and I’ll not diminish the glory of that in any place where there are ears to hear it. But the fact remains that we find ourselves burdened with a large population of unruly Poles who would be better off confined under the Viceroy’s domain rather than blighting our own administration.”"
congress_poland.2.a: "The [GetCulture('polish').GetName] are less troublesome when they can pretend to have a state."
congress_poland.2.b: "We will not compromise on the integrity of [SCOPE.sCountry('russia_poland_scope').GetAdjective] borders."
poland_territory_cooldown_tt: "[SCOPE.sCountry('russia_poland_scope').GetName] has not considered expanding [SCOPE.sCountry('congress_poland_scope').GetName] for at least #b 5 years#!"
russia_decides_expand_poland: "[SCOPE.sCountry('russia_poland_scope').GetName] will decide whether to cede territory to [SCOPE.sCountry('congress_poland_scope').GetName]"
notification_poland_expansion_accepted_name: "[SCOPE.sCountry('russia_poland_scope').GetName] agreed to expand [SCOPE.sCountry('congress_poland_scope').GetName]"
notification_poland_expansion_accepted_desc: "A step towards the reunification of the [GetCulture('polish').GetName] people!"
notification_poland_expansion_accepted_tooltip: "#header $notification_poland_expansion_accepted_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_expansion_accepted_desc$"
notification_poland_expansion_refused_name: "When will we be free of our oppressors?"
notification_poland_expansion_refused_desc: "[SCOPE.sCountry('russia_poland_scope').GetName] refuses [SCOPE.sCountry('congress_poland_scope').GetAdjective] expansion."
notification_poland_expansion_refused_tooltip: "#header $notification_poland_expansion_refused_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_expansion_refused_desc$"
poland_army_tt: "[SCOPE.sCountry('congress_poland_scope').GetName] has at least one [concept_army]"
congress_poland.3.t: "The Restoration of the Polish Constitution"
congress_poland.3.d: "The #b White#! cause in [SCOPE.sCountry('congress_poland_scope').GetName] has succeeded in restoring the [SCOPE.sCountry('congress_poland_scope').GetAdjectiveNoFormatting] Constitution. [SCOPE.sCountry('russia_poland_scope').GetName], at least for now, will respect the edicts of [glossary_sejm] and, for the most part, allow Poland to govern itself."
congress_poland.3.f: "“The Polish Legions are restored, yet they march to the tune of Russian drums. The Sejm no longer meets in secret, but acts in full view of the Tsar. One cannot help but feel that in winning autonomy, we have sacrificed independence. I will say a prayer for the Polish nation we have gained, but also for the one we have lost.”"
congress_poland.3.a: "An amicable resolution."
dp_polish_uprising: "Polish Uprising"
polish_uprising: "Polish Uprising"
congress_poland.4.t: "The Polish Uprising"
congress_poland.4.d: "The #b Reds#! in [SCOPE.sCountry('congress_poland_scope').GetName] have rallied all the support they can muster and taken up arms in the name of [SCOPE.sCountry('congress_poland_scope').GetAdjective] freedom. They pray that it will be enough."
congress_poland.4.f: "Praise God, that when our sons now go away,\nit's not to buy new clothes or even pamphlets,\nor learn by sitting in a Paris cafe,\nthe proper way the French run-up their debts.\nBut now we have our dear Napoleon,\nwho has no time for idle talk of fashions,\nwho cares less for a frock than for a weapon,\nand wishes that Poland, of all nations,\nbecome what it once was--The Republic!\n\n—Adam Mickiewicz, #italic Pan Tadeusz#!"
congress_poland.4.a: "Can so few defeat so many?"
congress_poland_restrictions: "The Organic Statute: Army"
congress_poland_laws: "The Organic Statute: Laws"
congress_poland.5.t: "The Organic Statute"
congress_poland.5.d: "In the wake of the [glossary_november_uprising], [SCOPE.sCountry('russia_poland_scope').GetName] has greatly restricted [SCOPE.sCountry('congress_poland_scope').GetAdjectiveNoFormatting] autonomy. [SCOPE.sCountry('congress_poland_scope').GetName] is forbidden to raise armies, open universities, or to legislate its own laws. A Russian Viceroy will oversee all matters of state."
congress_poland.5.f: "From time to time stories might reach our land,\nin Lithuania, when some old beggar\nmissing a leg or arm extends his only hand\nfor bread. Accepting alms, he turns to stare\nwith caution at the manor: If there is\nno Russian soldier, yarmulke, or red\ncollar, then he shamelessly confesses\nthere was Polish Legion he once led.\n\n—Adam Mickiewicz, #italic Pan Tadeusz#!"
congress_poland.5.a: "Now he returns his old and weary bones..."
congress_poland.5.a.tt: "... to a homeland he can no more defend"
