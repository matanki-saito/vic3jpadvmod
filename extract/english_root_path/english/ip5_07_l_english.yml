modifier_russian_revolution_new_government: "Revolutionary Government"
rus_prov_gov.1.t: "No Longer Provisional"
rus_prov_gov.1.d: "Against all odds, [SCOPE.sCountry('russia_scope').GetName] has a stable government. While the future will surely be far from untroubled, at the very least a devastating [concept_civil_war] has been averted."
rus_prov_gov.1.f: "It was not a bloodless coup, nor an entirely peaceful transition of power. But it was not a bloodbath. Countless Russian mothers go about their day like any other, not having to bury their sons."
rus_prov_gov.1.a: "How fortunate that this was relatively bloodless."
rus_prov_gov.2.t: "The Provisional Government"
rus_prov_gov.2.d: "Revolution! The old regime has fallen and a new [SCOPE.sCountry('russia_scope').GetAdjective] [SCOPE.sLaw('principles_law').GetName] led by [SCOPE.sCharacter('russia_ruler_scope').GetFullName] has seized power in [SCOPE.sState('russia_capital').GetCityHubName]. While it implements a new system of [SCOPE.sLaw('power_law').GetName], reactionaries and radicals alike begin to arm themselves for [concept_civil_war]."
rus_prov_gov.2.f: "“The world thinks that the Russian Revolution is at an end. Do not be mistaken. The Russian Revolution is just beginning.”\n\n—Alexander Kerensky"
rus_prov_gov.2.a: "What is to be done?"
rus_prov_gov_no_civil_wars: "Has no active [concept_civil_war]"
rus_prov_gov.3.t: "Self-Government of the Non-Russian Nationalities"
rus_prov_gov.3.d: "Driven by determined national [concept_fervor], multitudes of nominal [SCOPE.sCountry('russia_scope').GetAdjective] subjects have declared autonomous governments in the chaos of the Revolution. Perhaps most troubling is the newly proclaimed [SCOPE.sCountry('rus_autonomy_nation').GetGovernment.GetName] of [SCOPE.sCountry('rus_autonomy_nation').GetName]."
rus_prov_gov.3.f: ""Russians are all more or less disguised imperialists, including revolutionists. The trait of these minds, always longing for the absolute, is a vivid centralism. They loathe varieties, cannot conciliate dissonances - such things dull their will and imagination."\n\n—Józef Piłsudski"
rus_prov_gov.3.a: "They will regret this."

# Russian Civil War
je_russia_civil_war: "The Russian Civil War"
je_russia_civil_war_reason: "There are almost as many competing factions in Russia as there are men with guns. An immense civil war engulfs the nation, and the violence will not end until all Russians are once more united under a single government.\n$TOOLTIP_DELIMITER$\n@information! [Concept('concept_truce','$concept_truces|q$')] between countries with [GetCulture('russian').GetName] [Concept('concept_primary_cultures','$concept_primary_culture|q$')] will be quickly annulled."
je_rus_civil_war_header: "To end the Russian Civil War:\n"
je_rus_civil_war_conclusion_desc: "The $concept_journal_entry$ concluded with the end of the #b Russian Civil War#!"
je_rus_civil_war_effect_header: "If the Russian Civil War is ended:\n$EFFECT$"
je_rus_civil_war_partitioned_header: "Russia will be partitioned if:\n"
