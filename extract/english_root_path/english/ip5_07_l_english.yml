# Russian Provisional Government
je_russia_provisional_government: "The Provisional Government"
je_russia_provisional_government_reason: "With the fall of the old regime, a #b Provisional Government#! has been declared in [ROOT.GetCountry.GetCapital.GetCityHubName]. Dominated by [SCOPE.GetRootScope.GetCountry.GetCustom('provisional_government_identity_plural')], it seeks to legitimize itself and ensure that its vision for #v $RUS$#! wins out over both the old regime and its [SCOPE.GetRootScope.GetCountry.GetCustom('provisional_government_opponent_identity_singular')] rivals.\n\n@information! The [SCOPE.sCountry('russia_scope').GetAdjective] Provisional Government hangs on to unity by a thread. If the [SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle] does not move quickly to legitimize [SCOPE.sCountry('russia_scope').GetRuler.GetHerHis] new government, [SCOPE.sCountry('russia_scope').GetName] will become engulfed by a terrible [concept_revolution]."
