rcw.3.t: "The End of the Russian Civil War"
rcw.3.d: "We have crushed all armed resistance by the enemies of the state, and brought our allies back into the fold. At last, the Russian Civil War is over."
rcw.3.f: "Civil war is the most severe of all forms of war. It is unthinkable not only without violence against tertiary figures but, under contemporary technique, without murdering old men, old women and children.\n\n—Leon Trotsky, #italic Their Morals and Ours#!"
rcw.3.a: "This will be an era of stability and peace."
rcw.3.b: "Now about those separatists..."
rcw.3.c: "The new Russia will be greater than anything that came before."
rcw_3_b_claim_lost_territories_tt: "Gain [Concept('concept_claim', '$concept_claims|q$')] on every [concept_state] that belonged to the #b $dyn_c_russian_empire$#! prior to the outbreak of #b $je_russia_civil_war$#!"
