l_english:
 notification_nemo_appears_notification_name: "A prince vanishes"
 notification_nemo_appears_notification_desc: "The dispossessed heir of the annexed [concept_princely_state] has disappeared. The Company's resident reports that the young prince walked down to the shipyards at dusk, and did not come back."

 nemo_events.2.t: "The Wreck of the Company Indiaman"
 nemo_events.2.d: "An [SCOPE.GetRootScope.GetCountry.GetAdjective] merchantman has gone down in open water off the [SCOPE.sState('nemo_coast_state_scope').GetName] coast. According to those who made it back to shore, there was no warning or sight of sails on the horizon."
 nemo_events.2.d_repeat: "Another merchant vessel bound for Europe has been lost off of [SCOPE.sState('nemo_coast_state_scope').GetName]."
 nemo_events.2.f: ""The sea does not belong to despots. Upon its surface men can still exercise unjust laws, fight, tear one another to pieces, and be carried away with terrestrial horrors."\n\n—Jules Verne, #italic 20,000 Leagues Under the Sea#!"
 nemo_events.2.a: "The human mind delights in grand conceptions of supernatural beings."
 nemo_events.2.b: "Assure the Court that our fleet will protect the shipping lanes."
 nemo_patrol_promise_tt_a: "We have promised our [concept_fleet] to escort the [Concept('concept_supply_ship','$concept_supply_ships|q$')] in the [Concept('concept_shipping_lane','$concept_shipping_lanes|q$')] around [GetGeographicRegion('geographic_region_india').GetName]"
 nemo_patrol_promise_tt_b: "@warning! If no [concept_fleet] is doing so when the raider next strikes, the public will be displeased"

 nemo_events.3.t: "A Promise Written in Water"
 nemo_events.3.d: "Despite calm waters and favorable winds, another merchant convoy has disappeared into the sea. Those following current affairs have become enraged at the failure of the Court of Directors to uphold their responsibilities."
 nemo_events.3.f: ""The great depths of the ocean are entirely unknown to us. Soundings cannot reach them. What passes in those remote depths — what beings live, or can live, twelve or fifteen miles beneath the surface of the waters ... we can scarcely conjecture."\n\n—Jules Verne, #italic 20,000 Leagues Under the Sea#!"
 nemo_events.3.a: "We may brave human laws, but we cannot resist natural ones."

 nemo_events.4.t: "Guns Against the Shore"
 nemo_events.4.d: "What has been terrorizing the crews of our merchant fleet for so long has turned its attention to our shores and revealed itself. A great, unnatural beast made of iron has risen from beneath the waves and bombarded our harbors! Pillars of smoke can be seen from miles inland marking its progress along the coast."
 nemo_events.4.f: ""Even now, as I write, my recollection is still so vivid, that an involuntary terror seizes me, and my lungs seem to be without air."\n\n—Jules Verne, #italic 20,000 Leagues Under the Sea#!"
 nemo_events.4.a: "Close and board her. Take the thing intact if it can be taken."
 nemo_events.4.b: "Stand off and sink her with the long guns."
 nemo_events.4.c: "We have nothing at sea to send against her. Let the guns fall silent and the reckoning be counted."
 nemo_unopposed_bombardment_tt: "With no squadron to oppose her the #b Nautilus#! shells the coast at her leisure"
 nemo_squadron_damage_heavy_tt: "The engaging squadron takes #b heavy damage#! closing with her, every hull in it battered by the exchange"
 nemo_squadron_damage_light_tt: "The engaging squadron takes #b some damage#! trading fire at range."
 nemo_nautilus_captured_tt: "The #b Nautilus#! is taken intact and entered upon the Company's list. Her likeness becomes available to our submarine flotillas"
 nemo_nautilus_sunk_tt: "The #b Nautilus#! is broken open and goes down with her captain aboard"
 nemo_nautilus_escaped_tt: "The #b Nautilus#! slips beneath the smoke and is not found again"

 nemo_events.5.t: "No Flag, No Nation"
 nemo_events.5.d: "The attacks have stopped. What felt like an ever present danger throughout the Indian Ocean has been replaced with the gentle lapping of the waves on a calm sea."
 nemo_events.5.f: ""The sea is everything. It covers seven-tenths of the terrestrial globe. Its breath is pure and healthy. It is an immense desert, where man is never lonely, for he feels life stirring on all sides. The sea is only the embodiment of a supernatural and wonderful existence. It is nothing but love and emotion; it is the 'Living Infinite,' as one of your poets has said."\n\n—Jules Verne, #italic 20,000 Leagues Under the Sea#!"
 nemo_events.5.a: "If there were no thunder, men would have little fear of lightning."
 nemo_becomes_agitator_tt: "Captain Nemo enters [concept_exile] as an [concept_agitator]."

 nemo_nautilus_ship_name: "Nautilus"
 ship_graphics_type_nautilus: "Nautilus"
 ship_graphics_type_nautilus_desc: ""On the #italic Nautilus#! men's hearts never fail them. No defects to be afraid of... for when it dives below the water, it reaches absolute tranquility. There sir! That is the perfection of vessels!"\n\n—Jules Verne, #italic 20,000 Leagues Under the Sea#!"

 nemo_dies_tt: "[SCOPE.sCharacter('nemo_scope').GetFullName] dies"
 nemo_shipping_losses: "Losses to the Raider"
 nemo_promised_protection: "Convoys Under Escort"
 nemo_broken_promise_country: "An Empty Assurance"
 nemo_broken_promise_IG: "$nemo_broken_promise_country$"
 nemo_scourge_ended: "The Scourge Has Ended"
 nemo_nautilus_captured: "The Nautilus Taken"
 notification_nemo_nautilus_captured_notification_name: "The Nautilus taken"
 notification_nemo_nautilus_captured_notification_desc: "After a hard-won battle, boarders carried the submersible before she could be scuttled. This wonder of engineering is now ours!"
 notification_nemo_nautilus_sunk_notification_name: "The Nautilus sunk"
 notification_nemo_nautilus_sunk_notification_desc: "The submersible was opened up below the waterline and went down with all hands. Nothing was recovered, and no survivor was ever put ashore to be questioned."
 notification_nemo_nautilus_escaped_notification_name: "The Nautilus escaped"
 notification_nemo_nautilus_escaped_notification_desc: "The submersible dipped beneath the waves and did not come up again. Her ultimate fate as yet unknown."
