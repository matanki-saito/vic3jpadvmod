 #Journal Entry Production Events
 production_tech_events.102.t:1 "Exploding Demand"
 production_tech_events.102.d:1 "The development of more stable [SCOPE.sGoods('explosives_goods').GetName] has led to an uptick in demand for explosive materials. Our military and industrial sectors have entered a bidding war to secure shares of our production."
 production_tech_events.102.f:1 "\"\"Civilian applications?\" Really? What does a civilian firm want with two thousand tonnes of dynamite?\" The Quartermaster-General paced back and forth, clutching the dossier to his chest. \"If I had two thousand tonnes of dynamite, I could equip an artillery corps for the year. I could fill warehouses with shells.\"\n\n\"It is... regrettable,\" said the clerk, cautiously testing each word. \"A bidding frenzy has erupted over the material. Our current budget would buy us a fraction of what it should.\"\n\nNot ideal, thought the Quartermaster-General, but survivable. \"Place the order, and tell me the figure. I will petition the Cabinet for twice as much.\""
 production_tech_events.102.a:1 "Increasing supply will lift all boats."
 production_tech_events.102.b:1 "The industrial sector will make best use of it."
 production_tech_events.102.c:1 "The military must have their cut."
 production_tech_events.103.t:0 "Roaring Engines"
 production_tech_events.103.d:0 "With the invention and implementation of motor transportation the question arises. Shall we focus on public or private transportation?"
 production_tech_events.103.f:0 ""Why should I have to sit on a bus or a train with a stinky peasant, I should have my own mean of transportation"\n\n"The speed of the nation should not be left in the hand of the rich few, we need to keep the poor in mind.""
 production_tech_events.103.a:0 "More automobiles are needed!"
 production_tech_events.103.b:0 "More Public Transportation!"

 #Journal Entry Society Events
 society_tech_events.104.t:0 "Rising to New Heights"
 society_tech_events.104.d:0 "With the introduction and implementation of elevators into daily society, we can now reap the benefits of our increased industries."
 society_tech_events.104.f:0 ""It goes all the way up and it goes all the way down. Why walk up ten or twenty flights of stairs when you can simply just take an elevator to the top floor."\n\n"In the future we will have buildings with hundreds of floors and the sky will be the limit.""
 society_tech_events.104.a:0 "Keep boosting the industries."
 society_tech_events.104.b:0 "Keep providing for our citizens."
 society_tech_events.105.t:0 "Mutually Beneficial"
 society_tech_events.105.d:0 "Now that we have more publicly traded companies we should now focus on what comes next."
 society_tech_events.105.f:0 ""I don't see the problem. What is wrong with more money? Are you telling me that if they offered you more you would say no?"\n\n"It's not about getting more money. It's about who is getting more money. The rich get richer it would appear.""
 society_tech_events.105.a:0 "This might affect our politics."
 society_tech_events.105.b:0 "Maybe we can use this elsewhere."
 
