 RLIT_ROUTE_OFFICIAL_TT: "#tooltip_header Autocracy#!\n$TOOLTIP_DELIMITER$\nEarned by protecting the writers the state can use and silencing the ones it cannot.\n\nStanding: #v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_official').GetValue|0]#!\n\n$RLIT_ROUTE_COMMON_TT$"
 RLIT_ROUTE_RADICAL_TT: "#tooltip_header Revolution#!\n$TOOLTIP_DELIMITER$\nEarned by letting the critics and underground presses speak, and by making martyrs of those you punish.\n\nStanding: #v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_radical').GetValue|0]#!\n\n$RLIT_ROUTE_COMMON_TT$"
 RLIT_ROUTE_SPIRITUAL_TT: "#tooltip_header Spirituality#!\n$TOOLTIP_DELIMITER$\nEarned by favoring the Slavophile tradition over the Westernizers.\n\nStanding: #v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_spiritual').GetValue|0]#!\n\n$RLIT_ROUTE_COMMON_TT$"
 RLIT_ROUTE_UNIVERSAL_TT: "#tooltip_header Universalism#!\n$TOOLTIP_DELIMITER$\nEarned by allowing Russian writers to engage with the West.\n\nStanding: #v [JournalEntry.GetCountry.MakeScope.Var('russia_lit_route_points_universal').GetValue|0]#!\n\n$RLIT_ROUTE_COMMON_TT$"
