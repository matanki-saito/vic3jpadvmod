 je_rlit_golden_age: "The Soul of Russia: The Golden Age"
 je_rlit_golden_age_reason: "Critics have said that [ROOT.GetCountry.GetAdjectiveNoFlag] literature has finally found its voice, and that the Russian language has been freed from its cage. Poets and writers alike have been enjoying a huge rise in literary journals and publishing deals, but can this literary craze go unchecked? The Throne must decide who it protects, who it suppresses, and who it allows to die as a martyr. These decisions will shape the intellectual landscape of the empire for years to come."
 je_rlit_golden_age_status: "The Golden Age of Russian literature is in full swing"
 je_rlit_crossroads: "The Soul of Russia: The Crossroads"
 je_rlit_crossroads_reason: "The Golden Age of [ROOT.GetCountry.GetAdjectiveNoFlag] literature has concluded. Its idols and martyrs have set the terms for a debate that now takes a new form: does literature serve God, the Tsar, the Revolution, or all of Humanity? How different can prose become when the author is now self-conscious and aware of their relationship with a state, when they know the long-standing history of such relationship? Is the Russian poet more than just a poet?\n\nThere are yet no answers to those questions, but there are some who are willing to attempt to dig them out of the rich black soil."
 je_rlit_crossroads_status: "Russian literature has reached a Crossroads"
