l_english:

 rlit.001.t: "A Duel of Pens"
 rlit.001.d: "The conservative editor of the #italic Northern Bee#!, [SCOPE.sCharacter('bulgarin_scope').GetFullName], has issued a letter condemning the poet [SCOPE.sCharacter('pushkin_scope').GetFullName] and his associates for their connections to the [Glossary('glossary_decembrists','Decembrists')] and the 'dangerous foreign sympathies' prolific in their salons."
 rlit.001.f: "The letter was left at the Chancellery unsigned, but its author was obvious to anyone who had ever flipped through the pages of the #italic Northen Bee#!. That periodical was known for its loyalty to the throne, and the Third Section always seemed to know the contents of the next issue. The ministers nodded in agreement, lest the officers standing guard by the doors would pick up on anything but absolute approval.\n\n "Bulgarin knows what he's talking about", one of them mumbled, passing the letter on to the next desk.\n\n"Indeed", his colleague sighed. "Literature #italic must#! serve the government. Writers like [SCOPE.sCharacter('pushkin_scope').GetLastNameNoFormatting] are dangerous dreamers.""
 rlit.001.a: "Literature must serve the Empire. [SCOPE.sCharacter('pushkin_scope').GetLastNameNoFormatting]'s conduct is unacceptable."
 rlit.001.b: "What could be the harm in writing a few poems?"
 rlit.001.c: "Let them fight among themselves."

 rlit.002.t: "The Duel at the Black River"
 rlit.002.d: "[SCOPE.sCharacter('pushkin_scope').GetFullName] has been carried off the dueling grounds at Chyornaya Rechka with a bullet piercing his abdomen. Two days later, the poet was dead. A prominent young writer, [SCOPE.sCharacter('lermontov_scope').GetFullName], has drawn attention by having written a furious elegy: #italic Death of a Poet#!, blaming the state and nobility for the death of his idol."
 rlit.002.f: "The Third Section was roused. Outside of [SCOPE.sCharacter('pushkin_scope').GetFullNameNoFormatting]'s apartment in [GetStateRegion('STATE_INGRIA').GetCityHubName], thousands of mourners were filling the streets, some crying, some struck numb by the all too early passing of one of the greatest writers of their time.\n\n\"Our freshest dreams and meditations, in swift succession should decay, like autumn leaves that rot away."\n\n—Alexander Pushkin"
 rlit.002.a: "#italic We#! shall define his legacy—grant him a state funeral."
 rlit.002.b: "Allow Lermontov's elegy to circulate."
 rlit.002.c: "Dangerous sentimentality! Restrict public mourning."

 rlit.003.t: "A Hero of Our Time"
 rlit.003.d: "A manuscript authored by [SCOPE.sCharacter('lermontov_scope').GetFullName] has become popular amongst officers in [GetStateRegion('STATE_NORTH_CAUCASUS').GetCityHubName]. [SCOPE.sCharacter('lermontov_scope').GetLastNameNoFormatting], sent to serve in the [GetStateRegion('STATE_NORTH_CAUCASUS').GetName] as punishment for [SCOPE.sCharacter('lermontov_scope').GetHerHis] elegy on Pushkin's death, has spent the posting writing a novel whose hero holds [SCOPE.sCharacter('lermontov_scope').GetHerHis] service and the Empire's faith and morals in equal contempt."
 rlit.003.f: "The officer sat on his bed, looking up at the man in the doorway. He kept his voice low, not wanting to give the impression that his musings had been rehearsed, that he had agonized over this speech—a seditious speech—for weeks.\n\n"The protagonist, Pechorin, is a man of obvious brilliance who has turned his intelligence against the world and himself. It is a most precisely observed portrait of a certain kind of Russian mind. I would say... perhaps, I see myself in him. Perhaps I would say that many of us do. Could you... say the same?"\n\n\"'Why have I lived—for what purpose was I born?'... A purpose there must have been, and, surely, mine was an exalted destiny, because I feel that within my soul are powers immeasurable..."\n\n— Mikhail Lermontov"
 rlit.003.a: "Set him to glorifying our Caucasus campaigns."
 rlit.003.b: "There is something to be said about Russian alienation."
 rlit.003.c: "The front will humble him."

 rlit.004.t: "The Imperial Literary Prize"
 rlit.004.d: "[SCOPE.sCharacter('bulgarin_scope').GetFullName] has sent a proposal to the Ministry of Education for the establishment of an Imperial Literary Prize. The prize would be awarded annually to works that demonstrate loyalty to the Tsar, the Orthodox faith, and the [ROOT.GetCountry.GetAdjective] national character."
 rlit.004.f: "In an auditorium at the Ministry of Education, Bulgarin spoke for forty minutes, singing the praise of the Tsar's government and lashing out at those he deemed his enemies. Far from the Ministry, in thick-curtained salons and basements, those enemies issued their response, called him a police-spy and a hack.\n\nThe #italic Northern Bee's#! mission is to demonstrate that Russian literature, properly guided, serves the same ends as Russian law: order, piety, and the greatness of the Russian people."
 rlit.004.a: "Loyal art—and [SCOPE.sCharacter('bulgarin_scope').GetLastName]—deserve celebration."
 rlit.004.b: "Let the reading public choose their own heroes."
 rlit.004.c: "[ROOT.GetCountry.GetNameNoFlag] has had enough of [SCOPE.sCharacter('bulgarin_scope').GetLastNameNoFormatting] and his paper."

 rlit.005.t: "Profane Comedy"
 rlit.005.d: "[SCOPE.sCharacter('gogol_scope').GetFullName]'s latest work is a brash comic assault on every class of the provincial [ROOT.GetCountry.GetAdjective] life. Its readers believe it a miracle that the first volume passed the censors."
 rlit.005.f: "It is the funniest and most devastating thing written in Russian in many years. The intelligentsia has been arguing about it for weeks; some call it an indictment of the serf economy; Gogol himself insists it is an allegory—Dante's #italic Inferno#! transplanted onto familiar background.\n\n\"Ah, Russia, Russia... In you everything is flat and open; your towns project like points or signals from smooth levels of plain, and nothing whatsoever enchants or deludes the eye. Yet what secret, what invincible force draws me to you?"\n\n— Nikolai Gogol, #italic Dead Souls#!"
 rlit.005.a: "This portrayal of our landowning class is too dangerous."
 rlit.005.b: "We all know how to have a laugh, don't we?"
 rlit.005.c: "Commission him to write something #italic praising#! [ROOT.GetCountry.GetNameNoFlag] as well."

 rlit.006.t: "The Man with the Peasant's Beard"
 rlit.006.d: "The philosopher [SCOPE.sCharacter('aksakov_scope').GetFullName] has appeared at court wearing rough peasant garments. Reactions are stirring, not only in response to his appearance—the man looks as though he comes from medieval times, and some believe that is where he wishes to send [ROOT.GetCountry.GetNameNoFlag] back to."
 rlit.006.f: "He speaks of the village commune as the highest form of social organization, of Peter as the greatest Russian mistake, and of Westernization's devastating severance of the link between Tsar and narod. He speaks with haste, as though death is nearing him—many believe the shame of defeat has broken something deep within him, opening the way for the tuberculosis to set in.\n\nThe State is the external truth of the people. The land is its internal truth."
 rlit.006.a: "The "narod" philosophy must enter official discourse."
 rlit.006.b: "His beard is embarrassing."

 rlit.007.t: "The Furious Letter"
 rlit.007.d: "A devastating letter has circulated through the salons of [ROOT.GetCountry.GetCapital.GetCityHubName]. It is a product of the liberal critic [SCOPE.sCharacter('belinsky_scope').GetFullName]—despite writing from his sickbed, his prose condemning the Tsar and his own literary peers is as fiery and lively as ever."
 rlit.007.f: "It was a masterpiece of controlled fury, addressed directly to Gogol. It accused him of betraying every reader who had taken #italic Dead Souls#! as a condemnation of serfdom and autocracy. How could Gogol allow the complacency of the upper strata to cushion the blow he could have inflicted with his prose? Why had he not taken a bolder stance when the success of his work became clear?\n\nBy the third page, the letter escalated and targeted the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetNameNoFormatting] as a whole, for their foolish belief in the Tsar as the father of the people, when the Tsar was—according to [SCOPE.sCharacter('belinsky_scope').GetLastNameNoFormatting]—their #italic jailor#!.\n\nThe Third Section were apoplectic—what could they do to a man on the edge of his grave? The tuberculosis would settle the matter before they could."
 rlit.007.a: "His letter is sedition, whatever his condition."
 rlit.007.b: "The letter will fade with his life."
 rlit.007.c: "Let's arrange a public debate between these two."

 rlit.008.t: "The #italic Bell#! Rings from London"
 rlit.008.d: "A copy of the latest #italic Bell#!—a socialist paper notorious for slandering the Tsar—has been found lying on a desk in the Ministry of Interior. No one has come forwards as its owner; association with its exiled editor [SCOPE.sCharacter('herzen_scope').GetFullName] could have serious repercussions."
 rlit.008.f: "[SCOPE.sCharacter('herzen_scope').GetFullNameNoFormatting]'s #italic Bell#! had become the most widely read political publication in the Empire, yet it was entirely illegal. Its ways into its readers' hands were long and twisted, but in the end even the Tsar's closest circle paid close attention to it. [SCOPE.sCharacter('herzen_scope').GetLastNameNoFormatting] wrote about serfdom and the moral bankruptcy of the autocracy, with a clarity no domestic press could match. #italic Because there#! is #italic no independent domestic press#!, the minister thought, as the officers searched his desk for anything revealing him as the nitwit who forgot his copy out in the open.\n\n\"The Russians who want to be free must be free at once — not free in twenty years, not free 'when the time is right,' but free now, in their own souls, before any law changes.\"\n\n—Alexander Herzen"
 rlit.008.a: "Perhaps there is wisdom in this journal, for reformers."
 rlit.008.b: "The #italic Bell#! must not ring in Russia."
 rlit.008.c: "Bring the exile [SCOPE.sCharacter('herzen_scope').GetLastName] home, under a conditional amnesty."

 rlit.009.t: "The Tutor's Memorandum"
 rlit.009.d: "The highly regarded jurist and tutor to the Tsesarevich, [SCOPE.sCharacter('pobedonostsev_scope').GetFullName], has submitted a memorandum on the 'nihilist literary phenomenon'. [SCOPE.sCharacter('pobedonostsev_scope').GetSheHe|U] argues that nihilism is not merely a philosophical position, but a legal threat that [ROOT.GetCountry.GetName] cannot ignore much longer."
 rlit.009.f: ""Nihilists deny the foundations of property, family, and the state, and so their writings should be treated accordingly—not as a question for literary critics, but for the Third Section of His Imperial Majesty", the gaunt man said, slamming his fist into the table, and knocking over a cup of water. As he continued, the puddle trickled towards several important papers on the desk.\n\nHis assistant hurried to attend to the situation, quietly wondering whether the emerging gray eminence had any specific measures in mind."
 rlit.009.a: "He's right—the legal system has no room for nihilism."
 rlit.009.b: "Perhaps this threat warrants #italic some#! of our attention."
 rlit.009.c: "This is a literary problem—let us move on."

 rlit.010.t: "The Scaffold at Semyonovsky Square"
 rlit.010.d: "The author of the soul-crushing #italic Poor Folk#!, [SCOPE.sCharacter('dostoevsky_scope').GetFullName] has been arrested for reading Belinsky's seditious letter aloud at a meeting of the Petrashevsky Circle. With the execution is scheduled for dawn, the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] must decide whether to pardon [SCOPE.sCharacter('dostoevsky_scope').GetHerHim]."
 rlit.010.f: "Three men are tied to the stakes, the sound of drums growing louder as rifles are raised against them. Then, the tapping of horseshoes against paved stone. Little do they know, the Tsar has decided it's exile—not death—that awaits them all. Could this truly be the end of it?\n\n\"To be a human being among people and to remain one forever, no matter in what circumstances, not to grow despondent and not to lose heart—that's what life is all about, that's its task.\"\n\n—Fyodor Dostoevsky"
 rlit.010.a: "If [SCOPE.sCharacter('dostoevsky_scope').GetLastName] lives, the lesson must be unforgettable."
 rlit.010.b: "Let's reconsider our methods—pardon them all."
 rlit.010.c: "Radicalism must have no romantic martyrs."

 rlit.011.t: "Fathers and Sons"
 rlit.011.d: "A new novel by [SCOPE.sCharacter('turgenev_scope').GetFullName] has become an instant sensation in [ROOT.GetCountry.GetCapital.GetCityHubName]. The protaganist of the story is a nihilist who believes in nothing that cannot be dissected or proven—a depiction that has sparked outrage amongst some sections of the [ROOT.GetCountry.GetAdjective] [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName], and praise from the remainder."
 rlit.011.f: "One reviewer calls the book a slander on Russian youth; another, their vindication. Even the author seems genuinely surprised by the popularity of the novel. One thing is certain; the term 'nihilist' has entered the Russian language, and is not going away.\n\n\"Yes, there used to be Hegelists and now there are nihilists. We shall see how you will manage to exist in the empty airless void; and now ring, please, brother Nikolai, it's time for me to drink my cocoa.\"\n\n— Ivan Turgenev"
 rlit.011.a: "Turgenev has betrayed Russian spiritual values."
 rlit.011.b: "Russia must look West and embrace progress."
 rlit.011.c: "Nihilism is dangerous enough without fictional heroes."

 rlit.012.t: "#italic What Is To Be Done?#!"
 rlit.012.d: "From within his cell of the Peter and Paul Fortress, [SCOPE.sCharacter('chernyshevsky_scope').GetFullName] has written a manuscript depicting a socialist utopia where women are free, labor is dignified, and there is neither God nor Tsar. Despite its radicalism, the censors have deemed it too dull and didactic to be dangerous."
 rlit.012.f: ""They live gayly and cordially; they work and they rest; they enjoy life; and look forward to the future if not without thought, yet with a firm and substantial assurance that the further they go, the better it will be.\"\n\n—Nikolai Chernyshevsky"
 rlit.012.a: "This book cannot be allowed to circulate."
 rlit.012.b: "We can trust the censors' judgment."
 rlit.012.c: "Exile [SCOPE.sCharacter('chernyshevsky_scope').GetLastName] to [GetStateRegion('STATE_TOMSK').GetName] for sedition."

 rlit.013.t: "[SCOPE.sCharacter('katkov_scope').GetLastName] and the #italic Moscow Gazette#!"
 rlit.013.d: "An editorial in the #italic Moscow Gazette#! by [SCOPE.sCharacter('katkov_scope').GetFullName] has captured the attention of high society. [SCOPE.sCharacter('katkov_scope').GetLastName], once an Anglophilic liberal who advocated for free trade, has made a Damascene conversion to fierce nationalism."
 rlit.013.f: "His work on the #italic Gazette#! and the #italic Russian Messenger#! has redefined him as the most aggressive nationalist journalist in Russia, and his readership is soaring. His ire jumps from one of Russia's enemies to another: Polish separatists, nihilists, liberals, the foreign-educated intelligentsia who love everything about her except for the Russians themselves. While Herzen writes from [SCOPE.sStateRegion('herzen_exile_state').GetCityHubName] about Russia's sins, Katkov writes from [SCOPE.sStateRegion('katkov_home_state').GetCityHubName] about her glories, and the depravities of her enemies.\n\n\"All power has its derivation from God; the Russian Czar, however, was granted a special significance distinguishing him from the rest of the world's rulers... Herein lies the mystery of the deep distinction between Russia and all the nations of the world."\n\n— Mikhail Katkov"
 rlit.013.a: "[SCOPE.sCharacter('katkov_scope').GetLastName] is our answer to Herzen and his #italic Bell#!."
 rlit.013.b: "His nationalism is useful, but unpredictable."
 rlit.013.c: "We already have Bulgarin."

 rlit.014.t: "The Philosopher of the Soil"
 rlit.014.d: "The first issue of a new journal has come to [SCOPE.sStateRegion('relevant_state').GetCityHubName], bearing the signature of the conservative publisher [SCOPE.sCharacter('strakhov_scope').GetFullName]. The outlet has caused '[Glossary('glossary_pochvennichestvo','$glossary_pochvennichestvo|q$')]' to become the word of the month, in spite of its regressive implications."
 rlit.014.f: "Russia's intelligentsia has floated away from the people, lost its roots and connection to the earth beneath its feet. It is neither Slavophile mysticism nor Western rationalism—Dostoevsky calls it the only serious idea in Russian intellectual life.\n\nThe educated Russian has floated free of the #italic narod#! like a balloon. He must learn to ground himself."
 rlit.014.a: "The outlet for this grounded philosophy deserves funding."
 rlit.014.b: "We cannot throw money on every academic with a pen."
 rlit.014.c: "$glossary_pochvennichestvo$ is not a serious philosophy."

 rlit.015.t: "The Golden Age Concludes"
 rlit.015.d: "What has been deemed the "Golden Age" of [ROOT.GetCountry.GetAdjective] literature has come to an end. This age has raised the question of the relation between art and state, and the answer has been written into history. What the Empire has done to its poets will determine what the poets do with their Empire."
 rlit.015.f: "On the balcony of an Alpine villa, shaded by a paper parasol, a man leafed through a fresh translation of Gogol. It was novel to him to need a translation at all. His own language had dominated the literary world for centuries—Racine, Voltaire, Delille, Rousseau. It was the language of credibility, that of the most liberal and civilized country in Europe. The French intellectual tradition—the greatest in the world—had swayed the people from the worship of kings, and stirred to liberate Humanity. What did it mean that such a tradition was now blooming in the heart of the Gendarme of Europe?\n\nPerhaps, he thought, there was hope for Russia after all."
 rlit.015.a: "Literature emerges as the instrument of the state."
 rlit.015.b: "Weep, for the Empire has martyred its greatest sons."
 rlit.015.c: "The attention of the intelligentsia turns towards the #italic narod#!."
 rlit.015.opt_d: "Russian literature belongs to the world."
 rlit.015.e: "We move forward with what we have built."

 rlit.016.t: "The Return of the Prodigal"
 rlit.016.d: "[SCOPE.sCharacter('dostoevsky_scope').GetFullName] has returned from [GetStateRegion('STATE_TOMSK').GetName]. Once almost executed for his rash effrontery to the government, he has been transformed into a fervent [ROOT.GetCountry.GetAdjectiveNoFlag] Orthodox Christian and a Pan-Slavic nationalist. His latest work describes the devastating downfall of a guilty man."
 rlit.016.f: "His new work, #italic Crime and Punishment#!, follows a student who murders a pawnbroker—and then is destroyed not by the law, but by his own conscience. Some call it a masterpiece, some call it reactionary hogwash. It is, unquestionably, the most important Russian novel since #italic Dead Souls#!.\n\n\"Accept suffering and achieve atonement through it — that is what you must do.\"\n\n— Fyodor Dostoevsky"
 rlit.016.a: "His conservative voice serves us well."
 rlit.016.b: "His new novel needs to be published."
 rlit.016.c: "Too much darkness in the public sphere is unhealthy."
 rlit.016.opt_d: "Dostoevsky's liberal voice—pardoned and undimmed—speaks freely."

 rlit.017.t: "War and Peace"
 rlit.017.d: "Count [SCOPE.sCharacter('tolstoy_scope').GetFullName] has published a novel of over a thousand pages on the Napoleonic Wars, presenting a view of history where ministers, marshals and Emperors decide nothing at all. It has become popular across [ROOT.GetCountry.GetAdjective] society, and the authorities have begun to question why such an anti-statist writer is allowed to work so freely."
 rlit.017.f: "It is a meditation on the nature of historical causation, the relationship between the individual and grand state of affairs, but also on what it means to be Russian. Critics are struggling to find sufficient words for it, the Tsar has read it, and Flaubert could not put it down; meanwhile, Tolstoy himself is already well on his way toward his next work. One may ask how to control him, but another might say that is the wrong question, and ask this: is it worth trying at all?\n\n"There is no greatness where there is not simplicity, goodness, and truth."\n\n— Leo Tolstoy"
 rlit.017.a: "Commission Tolstoy to write on the glory of Russian arms."
 rlit.017.b: "Leave the writer alone. He has earned that much."
 rlit.017.c: "Restrict foreign publications—his audience need not be global."

 rlit.018.t: "The Governors of Foolov"
 rlit.018.d: "A new book is capturing the attention of the reading public. [SCOPE.sCharacter('saltykov_scope').GetFullName]'s satirical history of the fictional town of Foolov has recently passed the censors—they, like many readers, are unable to determine whether it is a historical study or a comedy."
 rlit.018.f: "A governor with a music box installed in his skull in an attempt to replace the human brain, six women brought to power by coups, and a man who terrorized his own subjects with fire and famine. People laugh until they start crying—sometimes out of joy, sometimes out of bitter recognition.\n\n"Idealism is the despot of thought, just as politics is the despot of will.\"\n\n— Mikhail Saltykov-Shchedrin"
 rlit.018.a: "Satire that embarrasses no one in particular threatens no one."
 rlit.018.a_tt: "This 'Foolov' could arguably be depicting any place on earth. #italic Right?#!"
 rlit.018.b: "Prosecute him for insulting the dignity of Russian governance."
 rlit.018.c: "Use his insight for a commission on administrative reform."

 rlit.019.t: "The Righteous People"
 rlit.019.d: "From a position somewhere between the Slavophiles and the Westernizers, [SCOPE.sCharacter('leskov_scope').GetFullName] has published stories about "good men" who don't fit in anywhere. Some scholars have called him the most [ROOT.GetCountry.GetAdjective] of all [ROOT.GetCountry.GetAdjectiveNoFormatting] writers, yet some others disagree."
 rlit.019.f: "Some writers are obsessed with ideas, but [SCOPE.sCharacter('leskov_scope').GetFullNameNoFormatting] fixates upon the soul. His holy fools walk the Earth, surviving crisis through kindness and good nature. They are simply human.\n\n\"In our parts such characters sometimes turn up that, however many years ago you met them, you can never recall them without an inner trembling.\"\n\n— Nikolai Leskov"
 rlit.019.a: "The most Russian of all Russian writers, indeed."
 rlit.019.b: "This is not a political matter. Leave him be."
 rlit.019.c: "His moral vision can be our gift to Europe."

 rlit.020.t: "The Freezer"
 rlit.020.d: "[SCOPE.sCharacter('pobedonostsev_scope').GetFullName] is circulating a government memorandum denouncing parliamentary government and praising autocracy. Officials are split on how to react."
 rlit.020.f: ""Forty-seven pages", a bespectacled minister said, tapping his finger on the stack of papers. "Yet, elegant in its bleakness, one must admit".\n\nHis colleague sank back in his chair. "Well, as [SCOPE.sCharacter('pobedonostsev_scope').GetFirstNameNoFormatting] would say, 'such is the complicated mechanism of the Parliamentary farce; such is the great political lie which dominates our age.'""
 rlit.020.a: "Grant [SCOPE.sCharacter('pobedonostsev_scope').GetLastName] full authority over censorship and cultural affairs."
 rlit.020.b: "Keep him within the Synod, religion should be his only domain."
 rlit.020.c: "The Freezer has frozen enough."

 rlit.021.t: "The Excommunication of a Count"
 rlit.021.d: "Under pressure from the [GetInterestGroupVariant('ig_devout',GetPlayer).GetName], [SCOPE.sCharacter('tolstoy_scope').GetFullName] has begun renouncing everything one may ever have associated with him: his manor; his novels; even his aristocratic identity. The [SCOPE.sCharacter('tolstoy_scope').GetLastNameNoFormatting] estate is in disarray."
 rlit.021.f: ""He's begun walking barefoot, and he ploughs his own fields, like a common peasant", a servant said, her voice low.\n\nThe gossip of the great nobleman chastising corrupt church officials, was spreading village to village, with some whispering that the excommunication from the [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameNoFormatting] was already backfiring—the author's home was slowly turning into a place of pilgrimage for common folk.\n\n"Everyone thinks of changing the world, but no one thinks of changing himself.\"\n\n— Leo Tolstoy"
 rlit.021.a: "A heretic such as [SCOPE.sCharacter('tolstoy_scope').GetLastName] warrants excommunication."
 rlit.021.b: "The [GetInterestGroupVariant('ig_devout',GetPlayer).GetNameNoFormatting] are overly zealous, on occasion."
 rlit.021.c: "Let [SCOPE.sCharacter('tolstoy_scope').GetLastNameNoFormatting] contemplate his situation in exile."

 rlit.022.t: "The Prince's Gazette"
 rlit.022.d: "Thanks to its favorable eye to the monarchy, the #italic Citizen#!—the reactionary gazette of Prince [SCOPE.sCharacter('meshchersky_scope').GetFullName]—has long enjoyed a royal patronage. Recently, however, even the most traditional of conservatives are beginning to question its prominence."
 rlit.022.f: ""He is an odious man", the minister sighed, folding the paper away. "Slanders everyone, while holding who-knows-how-many skeletons in his closet himself? It's the type of hypocrisy that makes me lose my appetite, I tell you. And the Tsar wants it fed to us on a weekly basis?" He shook his head.\n\n"I get a good laugh out of his novels", another minister said, scratching his beard. "And Dostoevsky edited the #italic Citizen#! for a while, did he not?"\n\n"Yes, but does it need a readership of hundreds of thousands?""
 rlit.022.a: "The #italic Citizen#! is the state's voice in literature."
 rlit.022.b: "Use the #italic Citizen#! without endorsing its publisher."
 rlit.022.c: "The sycophancy of [SCOPE.sCharacter('meshchersky_scope').GetLastNameNoFormatting] embarrasses the Crown."

 rlit.023.t: "The Publisher and the Playwright"
 rlit.023.d: "A letter criticizing the #italic New Times#! from [SCOPE.sCharacter('chekhov_scope').GetFullName] to his friend [SCOPE.sCharacter('suvorin_scope').GetFullName] has been circulating in literary circles, apparently by mistake. Conservative voices are urging for an official statement to defend the newspaper."
 rlit.023.f: "The friendship between a great playwright and a powerful conservative publisher has been deteriorating since the Dreyfus affair, when one has backed the anti-Dreyfus side and Chekhov has sided with Zola. Suvorin had himself been a liberal, has gotten exiled for his journalism, and upon his return transformed into something new. The New Times is read by everyone, but what do the readers derive from its works?"
 rlit.023.a: "Mass-market conservatism is in the interest of [ROOT.GetCountry.GetNameNoFormatting]."
 rlit.023.b: "Use Suvorin's press, but moderate his more extreme positions."
 rlit.023.c: "The #italic New Times#! is a disgrace to [ROOT.GetCountry.GetNameNoFormatting]."

 rlit.024.t: "The King is Dead"
 rlit.024.d: "The king of the conservative press, [SCOPE.sCharacter('katkov_scope').GetFullName], has died, worn out by many years of polemical warfare. Many are wondering who will take over his monthly outlet, the #italic Russian Messenger#!."
 rlit.024.f: "His death leaves a vacuum at the center of Russian conservative writing that no single figure can fill. #italic The Russian Messenger#!, which published #italic War and Peace#!, #italic Anna Karenina#!, #italic The Brothers Karamazov#!, and #italic Crime and Punishment#!—the four greatest Russian novels—must find a new direction. What will become of the conservative press? Will it pursue pure reaction, or moderation? Will the state absorb it, and end the pretense of independence?\n\nRussia's literature would have been different without Katkov. His willingness to publish Tolstoy and Dostoevsky alongside his political editorials complicates his legacy—a nationalist who inadvertently served the idea of universal Humanity."
 rlit.024.a: "The #italic Russian Messenger#! passes to a hardline reactionary."
 rlit.024.b: "The #italic Russian Messenger#! passes to a moderate nationalist."
 rlit.024.c: "The state purchases the #italic Russian#! Messenger directly."

 rlit.025.t: "Three Sisters"
 rlit.025.d: "[SCOPE.sCharacter('chekhov_scope').GetFullNamePossessive] plays have been filling the Moscow Art Theatre for years. His latest work, #italic Three Sisters#!, has premiered to a standing ovation from its audience. "
 rlit.025.f: ""After us they'll fly in hot air balloons, coat styles will change, perhaps they'll discover a sixth sense and cultivate it, but life will remain the same, a hard life full of secrets, but happy. And a thousand years from now man will still be sighing, "Oh! Life is so hard!" and will still, like now, be afraid of death and not want to die."\n\n— Anton Chekhov"
 rlit.025.a: "[SCOPE.sCharacter('chekhov_scope').GetLastNamePossessive] vision should reach every Russian city."
 rlit.025.b: "Commission him to write something hopeful for a change."
 rlit.025.c: "Send him on tour! He elevates Russia wherever he goes."

 rlit.026.t: "The Philosopher of Divine Wisdom"
 rlit.026.d: "The lecture hall at [ROOT.GetCountry.GetCapital.GetCityHubName] University has become crowded past its capacity as [SCOPE.sCharacter('solovyov_scope').GetFullName] speaks on mystical theology. Some argue the philosopher is bringing with him a spiritual renaissance for [ROOT.GetCountry.GetNameNoFlag], whilst others remain skeptical."
 rlit.026.f: "As the lecture went on, students craned their necks in the hope of catching a glimpse of the man with the soulful eyes and the long beard. If not an true Hellenistic scholar, this [SCOPE.sCharacter('solovyov_scope').GetFullNameNoFormatting] was rumored to at least look the part.\n\n"Without loving nature for its own sake, it is impossible to organize material life in a moral way", the philosopher said, letting the words ring out. Rows of students nodded in agreement, and the sound that followed was of pens against paper—notes, eagerly taken."
 rlit.026.a: "Russia's mission is spiritual."
 rlit.026.b: "Mysticism destabilizes more than it elevates."
 rlit.026.c: "Such thought could become Russia's greatest gift to civilization."

 rlit.027.t: "From the Lower Depths"
 rlit.027.d: "[SCOPE.sCharacter('gorky_scope').GetFullNamePossessive] #italic The Lower Depths#!, has had its premiere and critics are torn. Some are calling it a masterpiece about human hardships, while others struggle with the doom and gloom of the lives depicted. Regardless, it is difficult to miss the political undertones of the work."
 rlit.027.f: ""What #italic I#! think?" The man took off his glasses, squinting at the journal in front of him. "So far, it's been reviewed in twenty-three papers, and in four languages. #italic Remarkable#! for—or because it #italic is#!— a play set in a homeless shelter, the stage inhabited by drunks, prostitutes, and thieves."\n\n"So you approve?", his friend mused.\n\n"Approve? If I never have to see it again, I will live a life of joy.""
 rlit.027.a: "[SCOPE.sCharacter('gorky_scope').GetLastNamePossessive] political activities are as dangerous as his plays."
 rlit.027.b: "A tame genius is better than an enraged one."
 rlit.027.c: "Poverty must be seen before it can be addressed."

 rlit.029.t: "The Storm Is Coming"
 rlit.029.d: "A minister has arrived late to a meeting. Questioning reveals they were attending a private literary event, where [SCOPE.sCharacter('blok_scope').GetFullName] had been reading for two hours, to a silent room of forty people. The minister argues that [SCOPE.sCharacter('blok_scope').GetLastNamePossessive] portentous poetry and rare sense of rhythm has the power to change [ROOT.GetCountry.GetName]."
 rlit.029.f: "He started with #italic Verses About the Beautiful Lady#!, sad, yet hopeful. Then the room changed, the Lady gone, corrupted, replaced by factory smoke. At the end of the reading, they all felt it: that the world was going to change— if not by the will of God, then by the will of the People.\n\n\"O, my Russia! O, wife! The long road is clear to us to the point of pain. Our road—like a Tatar arrow of ancient will has pierced our breast.\"\n\n— Alexander Blok"
 rlit.029.a: "Let us emphasize the spiritual side of his words."
 rlit.029.b: "We must print these verses."
 rlit.029.c: "[SCOPE.sCharacter('blok_scope').GetLastName] is the bard of the Revolution—give him our full support."

 rlit.033.t: "The Stray Dog Cabaret"
 rlit.033.d: "The Stray Dog Cabaret has become the after-midnight sanctuary of the [Glossary('glossary_silver_age','$glossary_silver_age|q$')]. There, the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] exercises freedom unheard of elsewhere in the Empire, with poets, painters, and dancers crowding the little stage."
 rlit.033.f: "It was profane and it was sacred. The poetry readings, the plays and discussions held by people feeling shunned by polished society—stray dogs, indeed!—had the policemen intently observing them from the top of the stairs with a mixture of fascination and alarm on their faces.\n\n\"Here we're all drunkards and whores, Joylessly stuck together!\"\n\n— Anna Akhmatova"
 rlit.033.a: "A cage-bird sings; a free one soars."
 rlit.033.b: "Better they fill a cellar than the barricades."
 rlit.033.c: "Bohemia is the antechamber of revolution."

 rlit.035.t: "The Silver Age at Its Zenith"
 rlit.035.d: "The salons have been running past three in the morning. At the Merezhkovskys' on Liteiny, the [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] has been sleeplessly arguing about ideas for two days in a row."
 rlit.035.f: "At the Stray Dog cabaret, [SCOPE.sCharacter('akhmatova_scope').GetFullNameNoFormatting] and [SCOPE.sCharacter('gumilev_scope').GetFullNameNoFormatting] have been reading in the packed rooms while playing out their marriage on the same stage. [SCOPE.sCharacter('tsvetaeva_scope').GetFullNameNoFormatting] is barely twenty and already a force of nature, and Mandelstam is writing poems of crystalline precision in cold cheap rooms. No one knows how to capitalise on this pile of culture that grows from the bottom of Russian mud and grime.\n\n\"Why is this century worse than those others? Maybe, because, in sadness and alarm, It only touched the blackest of the ulcers, But couldn't heal it in its span of time. \"\n\n— Anna Akhmatova"
 rlit.035.a: "We must institutionalize this miracle."
 rlit.035.b: "The cafés and salons may lead the way."
 rlit.035.c: "Vapid triviality! Literature must serve the government."

 rlit.036.t: "Past the Crossroads"
 rlit.036.d: "With a renaissance in theater and patrons of underground salons producing masterworks, critics have declared that [ROOT.GetCountry.GetAdjective] literature has reached heights it may never surpass. What will the coming decades hold for the now-mature [ROOT.GetCountry.GetAdjectiveNoFormatting] [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]?"
 rlit.036.f: ""Have you seen what's been coming out of $RUS$, lately?"\n\nPierre's head was spinning from the absinthe. He flicked his eyes in the direction of the voice. He could not quite fit it into his field of vision, and did not wish to risk the nausea of moving his head. "Mhm?"\n\n"I said, have you seen what's been coming out of $RUS$? Akhmatova? Chekhov's plays?"\n\n"Yes, yes, of- who doesn't know Chekhov? Russian literature?"\n\nFootsteps. The source of the voice entered his field of vision. Jean, carrying a basket of bread, with a condescending smile on his face. He sat down next to him, and placed the basket on the table. "Most people, I would wager. How terrible for them.""
 rlit.036.a: "Hail, [ROOT.GetCountry.GetRuler.GetFirstName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] and Muse!"
 rlit.036.b: "The Revolution will have its poets."
 rlit.036.c: "The soul of Russia can be found in the #italic mir#!."
 rlit.036.opt_d: "Our literature is the world's literature."
 rlit.036.e: "The age concludes."


 rlit.052.t: "The Man in the English Suit"
 rlit.052.d: "[SCOPE.sCharacter('kharms_scope').GetFullName]—famous amongst [ROOT.GetCountry.GetCapital.GetCityHubName] society for dressing like an English dandy with a calabash pipe—has been arrested together with several other members of his circle on the charge of being a member of a group of anti-government children's writers."
 rlit.052.f: "The evidence: some children's poems deemed insufficiently materialist. Under interrogation he confessed to doing significant damage to the cause of forming the rising generation by seducing it away from contemporary concrete reality. He has been sentenced to three years in correctional camps, but most likely he will be exiled. Meanwhile his real work—the absurdist prose and plays—has never been published and is almost certainly unknown to his interrogators. His writing mirrors our century—nonsense inspiring nonsense.\n\n\"One must write poetry in such a way that if one threw the poem in a window, the pane would break.\"\n\n— Daniil Kharms"
 rlit.052.a: "OBERIU is anti-government nonsense, let him rot."
 rlit.052.b: "Let him return to writing for children."
 rlit.052.c: "Allow one final performance before the ban falls."
 rlit.052.opt_d: "Charge him with insanity."


