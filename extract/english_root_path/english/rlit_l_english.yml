glossary_pochvennichestvo: "Pochvennichestvo"
glossary_pochvennichestvo_desc: "#b;italic Pochvennichestvo#! is a late 19th century conservative movement in the Russian Empire, close related to that of the Slavophiles. One of their major focuses was the necessity of serf emancipation, hence the name—\"return to the native soil\"."
glossary_silver_age: "Silver Age"
glossary_silver_age_desc: "The #b;italic Silver Age#! is a period of Russian literature and great creativity in the late 19th and early 20th century, which saw a flourishing of poetry, as writers, disenchanted with the state of the world, moved away from realism. As an era, it's also deemed to have paved the way for women's writing allowed influence in society, and especially the halls of academia. In Western history, parallels can be drawn to terms such as 'La Belle Époque.'"
