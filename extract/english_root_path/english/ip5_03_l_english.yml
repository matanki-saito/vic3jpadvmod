favorites.3.t: "An Impassioned Speech"
favorites.3.d: "[SCOPE.sCharacter('current_favorite_scope').GetFullName], enjoying a wave of popularity as the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s appointed $concept_favorite$, has become the leading proponent of [SCOPE.sLaw('current_law_scope').GetName] — even delivering a speech in [ROOT.GetCountry.GetCapital.GetCityHubName] backing its enactment."
favorites.3.f: "#bold [ROOT.GetCountry.GetCapital.GetCityHubName], [TimeKeeper.GetCurrentDate.GetString]—#! Officials assembled in [ROOT.GetCountry.GetCapital.GetCityHubName] to debate the merits of [SCOPE.sLaw('current_law_scope').GetNameNoFormatting]. Notably present was [SCOPE.sCharacter('current_favorite_scope').GetFullNameNoFormatting], who delivered an impassioned speech in support of the policy.\n\nAn official, previously doubtful of the proposal, expressed his approval following [SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]'s speech: "[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]'s [SCOPE.sCharacter('current_favorite_scope').GetCustom('favorite_law_speech')] presence has given me full confidence in [SCOPE.sLaw('current_law_scope').GetNameNoFormatting]. The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] is right to have placed trust in [SCOPE.sCharacter('current_favorite_scope').GetHerHim]."\n\n#italic —The [ROOT.GetCountry.GetCapital.GetCityHubName] [SCOPE.GetRootScope.GetCountry.GetCustom('generic_newspaper_type')]#!"
favorites.3.a: "[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]'s efforts won't go to waste."
favorites.3.b: "This is exactly why the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] appointed [SCOPE.sCharacter('current_favorite_scope').GetHerHim] $concept_favorite$."

