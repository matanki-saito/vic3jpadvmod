rasputin.5.t: "The Prince's Concern"
rasputin.5.d: "An incriminating letter written by [SCOPE.sCharacter('felix_scope').GetFullName], a prominent aristocrat married to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s niece, has been discovered. [SCOPE.sCharacter('felix_scope').GetLastNameNoFormatting] makes it no secret that [SCOPE.sCharacter('felix_scope').GetSheHe] vehemently opposes [SCOPE.sCharacter('rasputin_scope').GetLastName]'s influence in court and has turned to [SCOPE.sCharacter('relevant_character_scope').GetFullName] for support in ousting the #italic starets#!."
rasputin.5.f: ""It is no wonder that many men and women are lured by the promises of this starets's methods. The magnetism of [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]'s hypnotic powers and piercing gaze are undeniable," [SCOPE.sCharacter('felix_scope').GetFullNameNoFormatting] writes. "[SCOPE.sCharacter('rasputin_scope').GetHerHis|U] continued presence in court is insupportable and I now worry that [SCOPE.sCharacter('rasputin_scope').GetSheHe] is a threat to the future of [ROOT.GetCountry.GetNameNoFormatting]. [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting] must go. [SCOPE.sCharacter('relevant_character_scope').GetLastNameNoFormatting], do I have your support in this endeavor? I urge you to consider your stance on this matter.""
rasputin.5.a: "The House of [SCOPE.sCharacter('felix_scope').GetLastNameNoFormatting] will always remain loyal to the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s interests."
rasputin.5.b: "The prince must exercise caution when speaking of [SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]."
modifier_felix_ig_upset: "Ignored Prince's Concerns"

# Favorite Content
favorites.1.t: "Lobbying Champion"
favorites.1.d: "[SCOPE.sCharacter('current_favorite_scope').GetFullName], the appointed $concept_favorite$ of [ROOT.GetCountry.GetRuler.GetFullNameWithTitle], has been vehemently advocating for the [SCOPE.sPoliticalLobby('current_favorite_lobby_scope').GetName]'s interests. In response, [SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetFullName] has personally beseeched the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] to keep [SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]'s growing influence in check."
favorites.1.f: "It took [SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetFullNameNoFormatting] a fortnight to gain a private audience with [ROOT.GetCountry.GetRuler.GetFullNameWithTitleNoFormatting]. Once alone, [SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetLastNameNoFormatting] does not waste a moment and launches into a tirade decrying the dangers of [SCOPE.sCharacter('current_favorite_scope').GetFullNameNoFormatting]'s recent political endeavors.\n\n"[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]'s overreach is preposterous," [SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetLastNameNoFormatting] tells the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]. "Surely [SCOPE.sCharacter('current_favorite_scope').GetSheHe] does not need to interfere in foreign affairs.""
favorites.1.a: "[SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetLastNameNoFormatting] ought to focus on matters pertaining to the [SCOPE.gsInterestGroup('opposition_ig_scope').GetName]."
favorites.1.b: "[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]'s input is invaluable."
favorites.1.c: "Perhaps [SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting] should take a step away from public matters."
modifier_favored_interests_ig_approval: "Favored Interests"

favorites.2.t: "Fact or Fiction?"
favorites.2.d: "The [ROOT.GetCountry.GetCapital.GetCityHubName] Gazette has reported on a scandal involving the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s appointed $concept_favorite$, [SCOPE.sCharacter('current_favorite_scope').GetFullName]. While the article has caused a public outcry, [SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting] insists it is a misunderstanding."
favorites.2.f: "#bold [ROOT.GetCountry.GetCapital.GetCityHubName], [TimeKeeper.GetCurrentDate.GetString]—#! [SCOPE.sCharacter('current_favorite_scope').GetFullNameNoFormatting] has found [SCOPE.sCharacter('current_favorite_scope').GetHerselfHimself] in the center of a scandal. [SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting], trusted confidant of the [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], has been accused of [SCOPE.GetRootScope.GetCountry.GetCustom('favorite_scandal_reason')]. Replying to [SCOPE.sCharacter('current_favorite_scope').GetHerHis] critics, [SCOPE.sCharacter('current_favorite_scope').GetSheHe] says: "This is an assassination of my character. These accusations are an embellishment of reality. We should focus on fact, not fiction!"\n\nDespite [SCOPE.sCharacter('current_favorite_scope').GetHerHis] denial of wrongdoing, a number of witnesses have come forward with expert testimony attesting to [SCOPE.sCharacter('current_favorite_scope').GetHerHis] scandalous misdeeds. Are the days of [SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]'s influence in [ROOT.GetCountry.GetCapital.GetCityHubName] numbered?\n\n#italic —The [ROOT.GetCountry.GetCapital.GetCityHubName] Gazette#!"
favorites.2.a: "Cover up [SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]'s misdeeds."
favorites.2.b: "[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting] must go — this publicity has thoroughly ruined [SCOPE.sCharacter('current_favorite_scope').GetHerHis] reputation."
modifier_favorite_embarrassment: "Public Embarrassment"

