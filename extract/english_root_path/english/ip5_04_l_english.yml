 je_five_year_plan_forced_labor_button_name: "Employ Forced Labor"
 je_five_year_plan_forced_labor_button_desc: "The modernization of [ROOT.GetCountry.GetName] will require extraordinary effort, and just as extraordinary sacrifice. Extending shifts, requisitioning materiel from the peasant population, and incorporating prison labor into #v $je_five_year_plan$#! will improve productivity, and increase our chances of success."

