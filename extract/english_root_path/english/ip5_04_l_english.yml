 je_extraordinary_commission: "Extraordinary Measures"
 je_extraordinary_commission_reason: ""#italic The proletariat needs state power, a centralized organization of force, an organization of violence, both to crush the resistance of the exploiters and to lead the enormous mass of the population to the organization of a socialist economy.#!"\n\n—Vladimir Lenin, #italic The State and Revolution#!\n\nThe establishment of [ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')|l] power in [ROOT.GetCountry.GetName] has not brought an end to the bourgeoisie as a class. From within and without, the enemies of the Revolution plot to destroy [ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')|l] power and return the [SCOPE.gsInterestGroup('proletariat_ig').GetName] to base servitude.\n\nIn order to defend the Revolution from all who would destroy it, the All-[ROOT.GetCountry.GetAdjectiveNoFormatting] [GetLawType('law_extraordinary_commission').GetName] has been granted sweeping powers to subject suspected counter-revolutionaries and saboteurs to revolutionary justice. Until the last bourgeois resistance is crushed, terror will be the order of the day."
 vanguard_custom_tooltip: "No [concept_powerful] or [concept_in_government] [concept_interest_group] is [Concept('concept_endorse_oppose','$concept_opposed|q$')] to [GetLawType('law_council_republic').GetName]."
 vanguard_instruction_status: "The [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName], [GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName], [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName], and [GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName] will select their most [Concept('concept_prominence','$concept_prominent|q$')] [GetIdeology('ideology_vanguardist').GetName] [concept_character] as [concept_leader] if they are [concept_marginalized]."

