ideological_unification.1.t: "One Revolution"
ideological_unification.1.d: "The Revolution has triumphed in both our country and our larger neighbor of [SCOPE.sCountry('mother_country_scope').GetName]. With the old order swept away, the chance presents itself to dissolve the borders separating our republics."
ideological_unification.1.f: "The Revolution had driven the soldiers from the border post, and an enterprising group of workers had set about dismantling the lengths of fence around it. A similar story had repeated itself across the former frontier—urban residents crossing the former line to fraternize with friends, peasants carrying goods across former toll barriers. All that remained of the former border force were scattered groups of militiamen scanning for infiltrating counter-revolutionaries. The old protocols and duties repealed, the guardsmen leaned against walls, chatted with those who came and went without harassment.\n\nTo rebuild what the Revolution had torn down would require effort that no one desired to exert, will that no one possessed. With the real barrier gone, the formal one seemed more absurd by the day."
ideological_unification.1.a: "Send our comrades a request for union."
ideological_unification.1.b: "Our autonomy comes first."

ideological_unification.11.t: "[SCOPE.sCountry('smaller_country_scope').GetName] Offers Union"
ideological_unification.11.d: "With the victory of the Revolution in [SCOPE.sCountry('smaller_country_scope').GetName], [SCOPE.sCountry('smaller_country_scope').GetCustom('country_legislature_name')] has requested union between our republics."
ideological_unification.11.f: "The delegation from [SCOPE.sCountry('smaller_country_scope').GetNameNoFormatting] was met with red confetti as they stepped off the train. The population of [ROOT.GetCountry.GetCapital.GetCityHubName] was out in force for the event, bearing red flags and homemade signs welcoming their new comrades.\n\nAbove them, run from one side of the station to the other by railroad workers on the night shift, hung a banner with brilliant golden letters:\n\n"LONG LIVE THE WORLD SOCIALIST REPUBLIC""
ideological_unification.11.a: "Welcome, comrades!"
ideological_unification.11.b: "Establish [SCOPE.sCountry('smaller_country_scope').GetNameNoFlag] as an autonomous republic."
ideological_unification.11.c: "We want nothing to do with them."

german_unification.6.t: "Confederation with [SCOPE.sCountry('mother_country_scope').GetName]"
german_unification.6.d: "The victory of the [SelectLocalization(SCOPE.sPoliticalMovement('german_national_movement_scope').IsValid, SCOPE.sPoliticalMovement('german_national_movement_scope').GetName, 'movement_german_national')] has paved the way to the unification of Germany. [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')|U] has put forward a motion to petition [SCOPE.sCountry('mother_country_scope').GetName] for confederation under [SCOPE.sCountry('mother_country_scope').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCountry('mother_country_scope').GetRuler.GetFullName]."
german_unification.6.f: ""By joining this confederation with [SCOPE.sCountry('mother_country_scope').GetNameNoFormatting], we may be surrendering [ROOT.GetCountry.GetAdjectiveNoFormatting] sovereignty, but by doing so, we help to secure German sovereignty. The spirit of the times is undeniable; the German people desire unity, and the [SCOPE.sCountry('mother_country_scope').GetAdjectiveNoFormatting] government seems set to be the one to make it happen. To oppose the coming together of the German people would be utter folly.""
german_unification.6.a: "For Germany!"
german_unification.6.b: "Our sovereignty is inviolable."

german_unification.7.t: "German Nationalists Seize [SCOPE.sCountry('smaller_country_scope').GetCapital.GetCityHubName]"
german_unification.7.d: "Inspired by calls for the establishment of a single German nation, nationalist rebels have seized [SCOPE.sCountry('smaller_country_scope').GetName]. They have pledged themselves to the unification of Germany under [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]."
german_unification.7.f: ""Unity and justice and freedom\nFor the German fatherland!\nLet us strive for this together,\nBrotherly with heart and hand!"\n\n—August Heinrich Hoffmann, #italic Deutschlandlied#!"
german_unification.7.a: "We welcome our brothers and sisters."
german_unification.7.b: "It is best to not frighten our neighbors."

factory_councils.1.t: "The [SCOPE.sState('council_state_scope').GetCityHubName] [SCOPE.sState('council_state_scope').GetCustom('getCouncilSoviet')]"
factory_councils.1.d: "As revolution spreads throughout [ROOT.GetCountry.GetName], the [SCOPE.gsInterestGroup('trade_unions_ig').GetName] have organized [GetLawType('law_factory_councils').GetName] from which to coordinate their struggle against the government. The most influential of these bodies is the [SCOPE.sState('council_state_scope').GetCityHubName] [SCOPE.sState('council_state_scope').GetCustom('getCouncilSoviet')], which workers throughout the country have come to view as an authority."
factory_councils.1.f: "The first meeting had been attended by a few dozen persons, arranged around a core of fifty representatives from a union of as many print-shops. Over the next weeks, the number of delegates swelled to the hundreds. They were metalworkers and printers, shop-workers and pharmacists, office clerks and those who toiled in the textile mills. The building in which they met, a university lecture-hall, began to send out the nerve signals of the mass strike—couriers, petitioners, reporters, delegates from political parties.\n\nWhen the police, horrified by the continued strikes, sent a squad to disperse them, they posted volunteer guards—first a lone unarmed man, then three with rifles. Clad in flatcaps and workmen's suits, they glared down from red-draped parapets at badged and booted men who now seemed terribly small."
factory_councils.1.a: "All power to the [SCOPE.sState('council_state_scope').GetCustom('getCouncilSovietPlural')|l]!"
factory_councils.1.b: "Buy time—signal willingness to issue reforms."
factory_councils.1.c: "We cannot lose control of the country. Intervene at once!"

factory_councils.11.t: "The [ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')]"
factory_councils.11.b: "We have no enemies to our left."

factory_councils.2.t: "The Civil War in [SCOPE.sCountry('commune_enemy_country').GetNameNoFormatting]"
factory_councils.2.t_1: "Working Men's [SCOPE.sState('commune_state').GetCityHubName]"
factory_councils.2.t_2: "The Civil War in [SCOPE.sState('commune_state').GetStateRegion.GetNameNoFormatting]"
factory_councils.2.d: "The workers' revolution in [SCOPE.sState('commune_state').GetCityHubName] has spurred great interest amongst revolutionary socialists worldwide. [SCOPE.sCharacter('paris_commune_author').GetFullName] has authored a work on the revolution, lauding it as the world's first working-class political regime."
factory_councils.2.f: ""The working class did not expect miracles from the Commune. They have no ready-made utopias to introduce #italic par décret du peuple#!. They know that in order to work out their own emancipation, and along with it that higher form to which present society is irresistably tending by its own economical agencies, they will have to pass through long struggles, through a series of historic processes, transforming circumstances and men. They have no ideals to realize, but to set free the elements of the new society with which old collapsing bourgeois society itself is pregnant. In the full consciousness of their historic mission, and with the heroic resolve to act up to it, the working class can afford to smile at the coarse invective of the gentlemen’s gentlemen with pen and inkhorn, and at the didactic patronage of well-wishing bourgeois-doctrinaires, pouring forth their ignorant platitudes and sectarian crotchets in the oracular tone of scientific infallibility."\n\n—Karl Marx, #italic The Civil War in France#!"
factory_councils.2.a: "The new society makes itself known."
factory_councils.2.b: "An ignorant regime of assassins and arsonists."

