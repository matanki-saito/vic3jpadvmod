 nomenklatura.1.t: "The Apparatus"
 nomenklatura.1.d: "In recent years, the increasing political influence of [GetPopType('bureaucrats').GetName] and appointed professionals has given rise to a strata referred to as the #b $ig_nomenklatura$#!. Citing the need for order and discipline to defend the Revolution, they advocate for further professionalization and extension of the state apparatus."
 nomenklatura.1.f: "It was not long after they left the office that the first complaint exited [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]'s mouth. "Did you see the newest class of trainees? There's not a single callus among them, they've hands like bloody cream."\n\n[SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting] nodded, lips tight. "I did. I could swear I saw one of their faces on the other side of a barricade, way back when."\n\n"They're starting higher-up than we did. Half of the office are appointees, now, salaried. No revolutionary spirit." [SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] looked around himself, looking for something to accentuate his point. There was an unrepaired bullet hole on the next building's facade, and he nodded to it. "What are we going to do if they start flooding into the Party, too?""
 nomenklatura.1.a: "The defects of our state become more and more apparent."
 nomenklatura.1.b: "We must exert utmost effort to defend our gains."

 nomenklatura.2.t: "The Man of Steel"
 nomenklatura.2.d: "Commissar [SCOPE.sCharacter('stalin_scope').GetFullName], a long-time Bolshevik militant and member of the [SCOPE.sParty('stalin_party_scope').GetName]'s informal leadership group, has distinguished himself in the field of nationalities policy. [ROOT.GetCountry.GetRuler.GetFullName] has considered him for a promotion."
 nomenklatura.2.f: ""We know where the demarcation of workers according to nationalities leads to. The disintegration of a united workers' party, the splitting of trade unions according to nationalities, aggravation of national friction, national strikebreaking, complete demoralization within the ranks of Social-Democracy—such are the results of organizational federalism. This is eloquently borne out by the history of Social-Democracy in Austria and the activities of the Bund in Russia.\n\nThe only cure for this is organization on the basis of internationalism.\n\nTo unite locally the workers of all nationalities of Russia into single, integral collective bodies, to unite these collective bodies into a single party—such is the task."\n\n—Iosif Stalin, #italic Marxism and the National Question#!"
 nomenklatura.2.a: "His attention to detail warrants a higher position in the Party."
 nomenklatura.2.b: "Commend him for his work as Commissar for Nationalities."
 nomenklatura.2.c: "He is too crude to advance any further."

 modifier_general_secretary: "General Secretary"
 modifier_commissar_for_nationalities: "Commissar for Nationalities"
 modifier_marxism_and_the_national_question: "$marxism$ and the National Question"

 nomenklatura.3.t: "Instant Recall"
 nomenklatura.3.d: "Infuriated by the perceived failure of [SCOPE.sCharacter('relevant_character_scope').GetFullName] to represent their interests, [SCOPE.sCharacter('relevant_character_scope').GetHerHis] constituents have voted to have [SCOPE.sCharacter('relevant_character_scope').GetHerHim] recalled from [SCOPE.sCharacter('relevant_character_scope').GetHerHis] official positions. [SCOPE.sCharacter('relevant_character_scope').GetLastName] has protested the recall, claiming it to be disruptive to critical state projects."
 nomenklatura.3.f: ""You don't understand," said [SCOPE.sCharacter('relevant_character_scope').GetLastNameNoFormatting] for neither the first nor last time. "I have work to do. By all means, don't re-elect me. Replace me with whoever you would like. But not #italic now#!. I need time to-"\n\nThe constituent delivering the message—a middle-aged man with glasses and thinning hair—gave a curt shake of the head. "You've had enough time, haven't you? And enough warnings. I voted for you, you know, but [ROOT.GetCountry.GetCapital.GetCityHubName] hasn't been kind to you."\n\n[SCOPE.sCharacter('relevant_character_scope').GetLastNameNoFormatting|U]'s cheeks burned. [SCOPE.sCharacter('relevant_character_scope').GetSheHe|U] could fight harder, [SCOPE.sCharacter('relevant_character_scope').GetSheHe] thought. [SCOPE.sCharacter('relevant_character_scope').GetSheHe|U] could kick, and scream, and dig [SCOPE.sCharacter('relevant_character_scope').GetHerHis] nails into the ground and appeal to [SCOPE.sCharacter('relevant_character_scope').GetHerHis] party. [SCOPE.sCharacter('relevant_character_scope').GetSheHe|U] could move and run from another constituency. Did [SCOPE.sCharacter('relevant_character_scope').GetSheHe] want to? It would be a disgrace, but it would mean [SCOPE.sCharacter('relevant_character_scope').GetSheHe] could stay in office for just a bit longer. Would it be worth it?"
 nomenklatura.3.a: "The workers have a right to instant recall."
 nomenklatura.3.b: "[SCOPE.sCharacter('relevant_character_scope').GetLastName] is too valuable to lose. Grant [SCOPE.sCharacter('relevant_character_scope').GetHerHim] a special appointment."

 remove_as_ig_leader_tt: "[SCOPE.sCharacter('relevant_character_scope').GetFullName] will be removed as [concept_leader] of the [SCOPE.sCharacter('relevant_character_scope').GetInterestGroup.GetName]"

 nomenklatura.4.t: "Relief of Command"
 nomenklatura.4.d: "The unpopular orders issued by [SCOPE.sCharacter('relevant_character_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('relevant_character_scope').GetFullName] have led to [SCOPE.sCharacter('relevant_character_scope').GetHerHim] losing the confidence of [SCOPE.sCharacter('relevant_character_scope').GetHerHis] unit, with [SCOPE.sCharacter('relevant_character_scope').GetHerHis] soldiers voting to have [SCOPE.sCharacter('relevant_character_scope').GetHerHim] recalled from [SCOPE.sCharacter('relevant_character_scope').GetHerHis] command. The [SCOPE.gsInterestGroup('red_army_ig').GetName]'s commmand has protested, claiming that [SCOPE.sCharacter('relevant_character_scope').GetHerHis] elected replacement's competence cannot be guaranteed."
 nomenklatura.4.f: ""As long as the power was vested in the class that is our enemy and the commanding personnel appeared a tool in the hands of this power, it was our duty to strive, through the election principle, to break the class opposition of the commanding personnel. But at the present time the political power lies in the hands of the same working-class from whose ranks the army is recruited. Under the present regime in the army—I tell you this with absolute frankness—the election principle appears politically unnecessary and from the technical point of view impractical."\n\n—Leon Trotsky, "Work, Discipline, and Order""
 nomenklatura.4.a: "It is their right to elect their own officers."
 nomenklatura.4.b: "A partisan farce. Have the high command intercede."

 nomenklatura.5.t: "Workers' Initiative"
 nomenklatura.5.d: "Spurred by revolutionary fervor and their newfound authority, a number of [GetLawType('law_factory_councils').GetName] have begun to put [SCOPE.sLaw('trade_union_law_scope').GetName] into effect across the territories they control. Their initiative has come to the attention of [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]."
 nomenklatura.5.f: "[SCOPE.sCharacter('proletariat_leader').GetLastNameNoFormatting|U] poured over the reports from [SCOPE.sState('relevant_urban_state').GetCityHubName]. It was late, and [SCOPE.sCharacter('proletariat_leader').GetSheHe] had replaced the oil in [SCOPE.sCharacter('proletariat_leader').GetHerHis] lamp once already. The work of the [SCOPE.sState('relevant_urban_state').GetCityHubName] [SCOPE.sState('relevant_urban_state').GetCustom('getCouncilSoviet')] had all of the typical attributes of a spontaneous, local initiative—eager, born of the particular interests of those in the city, tailored to local circumstances.\n\nIt was a start—perhaps a good one, perhaps the opposite. It was all too easy for such initiatives to reveal themselves as parochial or petty-bourgeois in nature. He did not wish to disappoint the eager councilors who had handed him the papers, yet he was all too aware that the interests of some workers were not necessarily congruent with the interests of the working class.\n\nThe Dictatorship of the Proletariat, he thought, not the Dictatorship of the [SCOPE.sState('relevant_urban_state').GetCityHubName] [SCOPE.sState('relevant_urban_state').GetCustom('getCouncilSoviet')]. If a refusal was necessary, at least he would have a slogan to print in [GetPlayer.GetCustom('newspaper_type')]."
 nomenklatura.5.a: "Commend their initiative, and extend this policy nationwide."
 nomenklatura.5.b: "A few councils do not speak for the entire class."

