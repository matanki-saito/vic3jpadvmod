 je_five_year_plan: "The Five-Year Plan"
 je_five_year_plan_reason: ""#italic We are fifty or a hundred years behind the advanced countries. We must make good this distance in ten years. Either we do it, or we shall go under.#!"\n\n—Iosif Stalin\n\nThe backwardness of the [ROOT.GetCountry.GetAdjective] economy has raised fears that [ROOT.GetCountry.GetNameNoFormatting] will be outcompeted and smothered by the capitalist powers. In order to match and eventually surpass her rivals, [SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')] has put forward a plan for the forced industrialization of the country. Its immediate aims are to transform the remnants of the peasantry into proletarians, and construct the material base for future socialist society.\n\n@information! Once drafting of #v $je_five_year_plan$#! concludes, #b all#! of the selected requirements must be fulfilled in time in order for the Plan to be successfully completed" # quote from Stalin, The Tasks of Business Executives
 je_five_year_plan_drafting_status: "Drafting #v $je_five_year_plan$#! ([ROOT.GetCountry.MakeScope.Var('five_year_plan_drafting_var').GetValue|v0] months remaining)"
 je_five_year_plan_in_progress_status: "The process of fulfilling #v $je_five_year_plan$#! is under way"
 je_five_year_plan_heavy_industry_button_name: "Develop Heavy Industry"
 je_five_year_plan_heavy_industry_button_desc: "Heavy industry is the means through which the means of production are produced. The lathes produced under this Plan will build the factories of the next Plan, and those will build the arsenals of the next."
 je_five_year_plan_light_industry_button_name: "Develop Light Industry"
 je_five_year_plan_light_industry_button_desc: "Light industry is the means through which the means of consumption are produced. Just as the reproduction of capital requires labor, the reproduction of labor-power requires the products of light industry—bread, clothing, and household goods."
 je_five_year_plan_transportation_button_name: "Develop Transportation"
 je_five_year_plan_transportation_button_desc: "The rapid circulation of goods is a necessity for the development of the economy. For every kilometer of track we lay, we free a dozen workers from the tyranny of the road-cart."
 je_five_year_plan_agriculture_button_name: "Develop Agriculture"
 je_five_year_plan_agriculture_button_desc: "The survival of pre-capitalist forms within the countryside is a sign of the backwardness of the [ROOT.GetCountry.GetAdjectiveNoFlag] economy. The agricultural sector must be organized to meet the demands of the Plan, and the remnants of the peasantry made proletarian."
 je_five_year_plan_electrification_button_name: "Pursue Electrification"
 je_five_year_plan_electrification_button_desc: "Communism is [ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')|l] power plus electrification of the whole country. If the state is to have economic success, its industries must be both numerically sufficient and built on a foundation of the most modern technology." # Quote from Lenin
 je_five_year_plan_conclude_button_name: "Conclude Draft"
 je_five_year_plan_conclude_button_desc: "The targets we have set for #v $je_five_year_plan$#! are satisfactory. Let us continue with its fulfillment."
