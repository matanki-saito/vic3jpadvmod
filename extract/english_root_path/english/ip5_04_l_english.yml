 nomenklatura.6.t: "Wreckers and Saboteurs"
 nomenklatura.6.d: "Technical specialists in [SCOPE.sState('relevant_industrial_state').GetName] have complained of unfair treatment from the [SCOPE.gsInterestGroup('proletariat_ig').GetName], claiming that they have faced spurious accusations of sabotage and a lack of compliance from the [GetPopType('laborers').GetName] and [GetPopType('machinists').GetName] they have been appointed to manage."
 nomenklatura.6.f: "The air inside the foundry rippled with heat. Even with the skylights open, a suffocating haze was collecting near the roof. On the floor, three crews worked to feed red-hot steel through a rolling machine. It was towards the end of the shift, and the heat and effort had their clothing feeling like sandpaper against their skin.\n\nAbove them, on a catwalk, a man in a fine coat timed their every move with a stopwatch. It was on his orders that they could no longer strip down to their waists when working—it reduced injuries, he said, prevented burns from getting too close. Maybe so. But they could have thought of it themselves, given time, and it would be up to them whether to adopt it or not. As it was, the dictates being passed down from the catwalk burned more than the molten metal."
 nomenklatura.6.a: "Under their rule, the proletariat suffered much worse."
 nomenklatura.6.b: "They know the best practices, the workers must comply."

