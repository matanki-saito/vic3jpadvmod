communism_debug.1000.t: "Dialectical Control Panel"
communism_debug.1000.d: ""What is certain is that if this is $marxism$, then I myself am not a $marxist$."\n\n—$marx_full$"
communism_debug.1000.f: ""In the name of the [SCOPE.sStateRegion('first_proletarian_revolution_state_region').GetCityHubName] of [GetVariableFromGlobalVariableMap( 'first_proletarian_revolution', SCOPE.sStateRegion('first_proletarian_revolution_state_region').MakeScope ).GetValue], greetings to the socialist workers of the world.""
communism_debug.1000.a: "What a wonderful thing to dedicate all of my time to."
communism_debug.1000.b: "Moralist! Idealist! Positivist! Saint-Simonian! Proudhonised Stirnerite!"

 # Baltic Mass Conversions to Orthodoxy
 russia_misc_events.1.t: "The Baltic Conversions"
 russia_misc_events.1.d: "Spurred by the desire to resist their Lutheran landlords and seek Imperial favor, [GetCulture('estonian').GetName] and [GetCulture('latvian').GetName] [GetPopType('peasants').GetName] in the [SCOPE.sCountry('baltic_governorates_scope').GetName] have begun to convert en masse to the [GetReligion('orthodox').GetName] faith. The Church institutions in the Baltic region are struggling to manage the influx of converts."
 russia_misc_events.1.f: ""Where did you hear these claims?"\n\nJānis had never sat in such an uncomfortable chair before. It seemed to have more corners than made sense for its shape, and all of them were jabbing into the nearest vulnerable point. He tried to remember. The tavern? Some chatter whilst collecting firewood? The former, he thought, but he didn't want to speak unless he could be sure whatever he said was right. If the gendarme suspected he was lying, he could be caned—and he looked German, so that "could" was more of a "would".\n\n"I said," repeated the gendarme. "Where did you hear those claims?"\n\n"It was..." Jānis mumbled, "...something someone said to me when I was- we were drinking. That the Tsar would be giving land and cutting the taxes to- of followers of his faith. I didn't mean to do anything wrong.""
 russia_misc_events.1.a: "It is our duty to spread the True Faith."
 russia_misc_events.1.b: "We must not alienate the Baltic nobility."

