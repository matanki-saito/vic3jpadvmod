reform_or_revolution.1.t: "The Heroic Era"
reform_or_revolution.1.d: "The growing political enfranchisement of the [SCOPE.gsInterestGroup('trade_unions_ig').GetName] has given rise to a flourishing international [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')]. Across the industrialized world, mass workers' organizations have emerged to advance the cause of labor."
reform_or_revolution.1.f: "The people's flag is deepest red,\nIt shrouded oft our martyred dead,\nAnd ere their limbs grew stiff and cold,\nTheir hearts blood dyed its every fold.\nThen raise the scarlet standard high.\nWithin its shade we'll live and die,\nThough cowards flinch and traitors sneer,\nWe'll keep the red flag flying here."\n\n—Jim Connell, #italic The Red Flag#!"
reform_or_revolution.1.a: "Vive la Révolution sociale!"
reform_or_revolution.1.b: "Liberty, equality, and the Rights of Labor!"
reform_or_revolution.1.c: "We have nothing to say to the enemies of order."

reform_or_revolution.2.t: "The Goal is Everything"
reform_or_revolution.2.d: "The revolutionary activity spreading across the world has brought the tensions within the international [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')] to their conclusion. With their former parties pledging themselves to the revolution, moderates and reformists have fled to organizations seeking to defend national unity."
reform_or_revolution.2.f: "The condemned men paraded across the stage, each issuing their plea against the majority. Shouts of "Traitor!" and "Warmonger!" crashed down from the audience like an artillery bombardment, the concussive outrage drowning out whatever justifications they had brought with them.\n\n"You think to sign my death warrant, but you are mistaken!" shouted the latest of the condemned. He had been the highest-ranking of them, with a voice to challenge a dozen men. Now, it faded in and out as it battled with the crowd. "Today, you hate me, because you still love me! I have given you twelve years of my life! But you have not seen the last of me. Socialism is something which takes root in the heart. Do not think that in taking my membership card, you will be taking away my faith. I am and always will be a socialist!""
reform_or_revolution.2.a: "The spirit of revolt rises everywhere. Long live the International!"
reform_or_revolution.2.b: "The violence of madmen threatens all we have built."
reform_or_revolution.2.c: "Another socialist split?"

reform_or_revolution.3.t: "The Crisis of Social Democracy"
reform_or_revolution.3.d: "The tensions between reformists and revolutionaries within the international [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')] have come to a head. Enraged by their parties' increasingly close alignment with their national governments, a wave of anti-parliamentarian and revolutionary fractions have split from the traditional socialist parties."
reform_or_revolution.3.d_1: "The tensions between reformists and revolutionaries within the international [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')] have come to a head. Enraged by their parties remaining loyal to their national governments in wartime, revolutionary socialists have formed rival organizations to oppose the war."
reform_or_revolution.3.f: ""The revolutionary epoch will create new forms of organization out of the inexhaustible resources of proletarian Socialism, new forms that will be equal to the greatness of the new tasks. To this work we will apply ourselves at once, amid the mad roaring of the machine-guns, the crashing of cathedrals, and the patriotic howling of the capitalist jackals. We will keep our clear minds amid this hellish death music, our undimmed vision. We feel ourselves to be the only creative force of the future. Already there are many of us, more than it may seem. Tomorrow there will be more of us than today. And the day after tomorrow, millions will rise up under our banner, millions who even now, sixty seven years after the Communist Manifesto, have nothing to lose but their chains."\n\n—Leon Trotsky, #italic The War and the International#!"
reform_or_revolution.3.a: "The gains we have won are too precious to lose."
reform_or_revolution.3.b: "The worker has no fatherland! Down with the national truce!"
reform_or_revolution.3.c: "Another socialist split?"

socialist_movement_is_reformist_tt: "The [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')] in [ROOT.GetCountry.GetName] is #b Reformist#!-leaning"
socialist_movement_is_revolutionary_tt: "The [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')] in [ROOT.GetCountry.GetName] is #b Revolutionary#!-leaning"

ip5_historical_agitators.1.t: "Property is Theft"
ip5_historical_agitators.1.d: "[SCOPE.sCharacter('historic_agitator_scope').GetFullName], a self-declared [GetIdeology('ideology_anarchist').GetName] and Mutualist, has published a series of polemics against profit, interest, and governance. [SCOPE.sCharacter('historic_agitator_scope').GetSheHe|U] advocates for the establishment of a system of free cooperatives from which to challenge the capitalist economy."
ip5_historical_agitators.1.f: ""You desire neither Catholicism nor monarchy nor nobility, but you must have a God, a religion, a dictatorship, a censorship, a hierarchy, distinctions, and ranks. For my part, I deny your God, your authority, your sovereignty, your judicial State, and all your representative mystifications."\n\n—Pierre-Joseph Proudhon, #italic The Philosophy of Poverty#!"
ip5_historical_agitators.1.a: "Whoever would govern me, I declare my enemy."
ip5_historical_agitators.1.b: "He wants to be the synthesis—he is a composite error." # The Poverty of Philosophy

marx_events.2.t: "The Grave of [GetGlobalVariable('big_communism_builder').GetCharacter.GetFullNameNoFormatting]"
marx_events.2.d: "[GetGlobalVariable('big_communism_builder').GetCharacter.GetFullName], [GetGlobalVariable('big_communism_builder').GetCharacter.GetIdeology.GetName] revolutionary and codifier of scientific socialism, has passed away. [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis|U] friends and followers in the $movement_socialist$ have organized a funeral in [SCOPE.sState('grave_scope').GetCityHubName]."
marx_events.2.d_1: "[GetGlobalVariable('big_communism_builder').GetCharacter.GetFullName], [GetGlobalVariable('big_communism_builder').GetCharacter.GetIdeology.GetName] revolutionary and codifier of scientific socialism, has passed away. [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis|U] friends and followers in the $movement_socialist$ have organized a funeral in [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis] native [SCOPE.sState('grave_scope').GetForestryHubName]."
marx_events.2.f: ""...and, consequently, [GetGlobalVariable('big_communism_builder').GetCharacter.GetLastNameNoFormatting] was the best-hated and most calumniated [GetGlobalVariable('big_communism_builder').GetCharacter.GetWomanMan] of [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis] time. Governments, both absolutist and republican, deported [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHim] from their territories. Bourgeois, whether conservative or ultra-democratic, vied with one another in heaping slanders upon [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHim]. All this [GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe] brushed aside as though it were cobweb, ignoring it, answering only when extreme necessity compelled [GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHim]. And [GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe] died beloved, revered and mourned by millions of revolutionary fellow-workers—from the mines of Siberia to California, in all parts of Europe and America—and I make bold to say that though [GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe] may have had many opponents [GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe] had hardly one personal enemy."" # Friedrich Engels, 1883
marx_events.2.a: "Deceased, living friend, we shall follow to the final aim." # Wilhelm Liebknecht
marx_events.2.b: "A name to ring throughout history."
marx_events.2.c: "Had this happened some decades ago..."

marx_events.3.t: "Descent and Ascent"
marx_events.3.d: "[SCOPE.sCharacter('marx_scope').GetFullName] has embarked upon a project to write a comprehensive critique of modern political economy. [SCOPE.sCharacter('marx_scope').GetHerHis|U] method will begin with a loose concrete conception of political economy as a whole, move to a detailed examination of its abstract components, and then reconstruct it as totality."
marx_events.3.f: ""I am so far advanced that I shall be finished with the whole of the #italic ökonomischen Scheiße#! in five weeks. And when that's done I'll draft the economics at home and throw myself into another science in the Museum. It's beginning to bore me. At bottom this science has made no progress since A. Smith and D. Ricardo, however much may have happened in investigations into particular topics, which are often of extreme intricacy."\n\n—Karl Marx to Friedrich Engels, 1851"
marx_events.3.a: "A monumental work lies ahead."
marx_events.3.b: "Provide him support with the project."
marx_events.3.c: "His other obligations must come first."

marx_events.4.t: "Capital"
marx_events.4.d: "[SCOPE.sCharacter('capital_publisher_scope').GetFullName] has published the first volume of [SCOPE.sCharacter('capital_publisher_scope').GetHerHis] #italic Capital#!, a detailed critique of modern political economy. The work has swiftly become a centerpiece of the theoretical corpus of the [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')]."
marx_events.4.d_1: "[SCOPE.sCharacter('capital_publisher_scope').GetFullName], a friend and collaborator of the late [SCOPE.sCharacter('capital_author_scope').GetFullNameNoFormatting], has posthumously published the first volume of [SCOPE.sCharacter('capital_author_scope').GetLastNameNoFormatting]'s #italic Capital#!. The work has swiftly become a centerpiece of the theoretical corpus of the [SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid, SCOPE.sPoliticalMovement('socialist_movement_scope').GetName, 'movement_socialist')]."
marx_events.4.f: "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] ran [SCOPE.sCharacter('name_a_scope').GetHerHis] gaze along [SCOPE.sCharacter('name_a_scope').GetHerHis] host's bookshelf, studying each title and author. The typical fare was present—Rousseau, Feuerbach, Heinrich Heine, Smith and Strauss and Schiller. A fat volume clad in brown leather sat at the very end, a familiar name gleaming from the middle of its pristine spine.\n\n"You have read $marx_last$?" he asked, turning at last to face the man on the other side of the table.\n\n"Of course," [SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting] responded, expression serene. "Have you? I was utterly convinced by the thesis about the tendency of wages to return to barest subsistence... if I so wished, I could put forth an essay on it.""
marx_events.4.a: "A new weapon in the hands of the workers."
marx_events.4.b: "What #italic is#! a commodity?"
marx_events.4.c: "It has no application in [ROOT.GetCountry.GetNameNoFormatting]."

