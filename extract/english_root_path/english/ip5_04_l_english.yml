 siberia.2.t: "In the Exile Colony"
 siberia.2.d: "While living in exile, [SCOPE.sCharacter('siberian_exile_scope').GetFullName] has been exposed to the political views of other exiles. This may very well change the foundation of [SCOPE.sCharacter('siberian_exile_scope').GetHerHis] own ideology."
 siberia.2.f: ""No matter how exile by administrative process may be regulated and restricted, it will always suggest to the mind of the exiled person the idea of uncontrolled official license, and this alone is sufficient to prevent any reformation whatever."\n— Major-General Nicolai Baranof, #italic Juridical Messenger, 1883#!" # quoted by George Kennan in Siberia and the Exile System Vol. 1, 1891
 siberia.2.a: "An exchange of ideas is perhaps one of the few luxuries an exile can still afford."
 siberia.2.b: "Heated debates between exiles might influence [SCOPE.sCharacter('other_siberian_exile_scope').GetFullName] in unexpected ways."

 je_social_revolution: "Social Revolution"
 je_social_revolution_reason: "The Revolution has unleashed all of the long-repressed forces of society, throwing aside its most deeply-rooted institutions and revealing once-unquestionable ideas to be as fragile as spun glass. The once-despised [SCOPE.gsInterestGroup('proletariat_ig').GetName] have seized supreme power, the formerly voiceless now command armies and ministries, and the reckless radicals of one year appear as the conservatives of the next.\n\nAs these forces rage all around us, we have an opportunity to construct a new society in [ROOT.GetCountry.GetName]: one inspired not by the decrepit traditions of the past, but in anticipation of a truly free mankind."
 je_social_revolution_low_consolidation_tt: "Both [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')] values in #v $je_state_and_revolution$#! [concept_journal_entry] have been below #v 50%#! for a total of #v 120#! months (currently [ROOT.GetCountry.MakeScope.Var('communist_welfare_low_consolidation_months_var').GetValue|v0])"
 je_social_revolution_concluded_consolidation_tt: "The #v $je_state_and_revolution$#! [concept_journal_entry] has concluded in [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')]"

 je_state_and_revolution: "State and Revolution"
 je_state_and_revolution_reason: "The #b Political [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')] Bar#! will drift towards #tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_political_confrontation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_political_confrontation_display')|%0r]#!/#tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_political_consolidation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_political_consolidation_display')|%0u]#! over time.\nThe #b Economic [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')] Bar#! will drift towards #tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_economic_confrontation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_economic_confrontation_display')|%0r]#!/#tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_economic_consolidation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_economic_consolidation_display')|%0o]#! over time.\n\nThrough immense effort and hardship, the [ROOT.GetCountry.GetAdjective] working class has instated a [GetLawType('law_council_republic').GetName]. Revolutionary flags now fly over a land that once suffered under the reign of kings and capitalists, and Red [ROOT.GetCountry.GetCapital.GetCityHubName] may serve as a symbol to workers the world over.\n\nTo instate a $law_council_republic$, however, is only a step towards world communism. For as long as the Revolution in [ROOT.GetCountry.GetNameNoFlag] must struggle against a world dominated by its enemies, it will face two impulses—continued [Concept('concept_state_and_revolution_confrontation', '$concept_state_and_revolution_confrontation_short|q$')] of world capitalism, and the [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')] of its gains in the face of overwhelming opposition.\n\n@information! As [Concept('concept_state_and_revolution_consolidation', '$concept_state_and_revolution_consolidation_short|q$')] increases, non-[GetLawType('law_council_republic').GetName] [Concept('concept_country','$concept_countries|q$')] will become more accepting of [ROOT.GetCountry.GetAdjectiveNoFormatting] diplomacy and trade."
