 intelligentsia.1.t: "No Half Measures"
 intelligentsia.1.d: "The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]'s antagonization of the [SCOPE.gsInterestGroup('intelligentsia_scope').GetName] has led to their increasingly coming under the influence of the [SCOPE.sPoliticalMovement('republican_movement_scope').GetName]. [GetIdeology('ideology_republican').GetName] sentiments have eclipsed their prior demands for a constitutional [GetLawType('law_monarchy').GetName]."
 intelligentsia.1.f: "The gendarmes collected in front of the wall, gazing at the posters that had covered it. Some were innocent, or closer to such—advertisements, or invitations to clubs. Others were quite the opposite. Those were the calls to action, the caricatures, the slander against Crown and Country.\n\nOne of the gendarmerie lay off to the side, a nurse bandaging a bleeding gash in his palm. He had been the first of them to arrive, and had met a hidden razor blade when he attempted to take a poster down. It fluttered in the breeze, bloodstained, and defiant, black block letters blaring down at them: #b The [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] Must Die#!."
 intelligentsia.1.a: "Will the Terror come to [ROOT.GetCountry.GetName]?"
 intelligentsia.1.b: "Let every crowned head tremble."
