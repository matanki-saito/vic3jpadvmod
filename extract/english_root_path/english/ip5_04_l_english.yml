je_reform_or_revolution_reason: "The growing political enfranchisement of the [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName] has given rise to a flourishing international #b $movement_socialist$#!. Across the industrialized world, mass #b Socialist Parties#! have emerged, advocating for the radical transformation of society—public ownership of the means of production, democratic freedoms, and the end of exploitation and social inequality.\n\nThough the movement has exploded into international prominence, there remains a deep division at its core. As the working class wins the battle for democracy, the #bold revolutionary#! heritage of the movement is challenged by the possibility of parliamentary #bold reform#!. Will #b Socialism#! stand for the gradual improvement of the present state of things, or for its revolutionary overthrow?\n\n@warning! The outbreak of a [concept_war] between more than  [GetPlayer.MakeScope.ScriptValue('reform_or_revolution_war_threshold')|0%v] of Involved [Concept('concept_country','$concept_countries|q$')] will cause this [concept_journal_entry] to #b rapidly progress#! towards its leading outcome."

