 # Siberia
 siberian_exile_pool: "Siberia"
 siberia.1.t: "Exile by Administrative Process"
 siberia.1.d: "Police have discovered that [SCOPE.sCharacter('siberian_exile_scope').GetFullName] [SCOPE.sCharacter('siberian_exile_scope').GetCustom('custom_siberian_exile_reason_loc')]. [SCOPE.sCharacter('siberian_exile_scope').GetSheHe|U] now faces political exile in Siberia. If convicted, [SCOPE.sCharacter('siberian_exile_scope').GetSheHe] would be permitted to return after the expiration of [SCOPE.sCharacter('siberian_exile_scope').GetHerHis] term."
 siberia.1.f: ""The greater part of them are administrative exiles — that is, persons whom the Government, for various reasons, has thought it expedient to remove from their homes and put under police surveillance in a part of the empire where they can do no harm. The real conspirators and revolutionists — the men and women who have actually engaged in criminal activity — are sent to more remote parts of Siberia and into penal servitude."\n— George Kennan, #italic Siberia and the Exile System Vol. 1, 1891#!"
 siberia.1.a: "A five-year sentence, to keep [SCOPE.sCharacter('siberian_exile_scope').GetHerHim] under close surveillance."
 siberia.1.b: "A ten-year sentence, to dismantle any influence [SCOPE.sCharacter('siberian_exile_scope').GetSheHe] has in the capital."
 siberia.1.c: "Twenty years. [SCOPE.sCharacter('siberian_exile_scope').GetSheHe|U] has been a nuisance for too long."
 siberia.1.e: "This will cause too much of a scandal. Exonerate [SCOPE.sCharacter('siberian_exile_scope').GetHerHim]."
 to_siberia_5_tt: "[SCOPE.sCharacter('siberian_exile_scope').GetFullName] will be sentenced to [concept_siberian_exile] for #v 5 years#!"
