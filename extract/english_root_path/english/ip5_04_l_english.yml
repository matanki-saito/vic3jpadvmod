 communism.12.t: "Sabotage and Wrecking"
 communism.12.d: "The Control Commissariat has uncovered a pervasive campaign amongst state planners to falsify progress towards the #v $je_five_year_plan$#!. The [SCOPE.gsInterestGroup('proletariat_ig').GetName] are demanding those responsible face revolutionary justice as wreckers."
 communism.12.f: "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting] sat at [SCOPE.sCharacter('name_a_scope').GetHerHis] kitchen table, staring vacantly at the wall above the stove. Before him, open to its second page, lay a copy of [GetPlayer.GetCustom('newspaper_type')], its bold print screaming out accusations of fraud and conspiracy. A half-empty glass of vodka weighed down its upper left corner.\n\nOn the floor beside him lay a Party-issue revolver. A drop of blood fell onto its cylinder, and rolled off the finely-machined metal. The puddle beneath had grown large enough to taint the white lining of the rug.\n\nThere was a knock on the door."
 communism.12.a: "The charges follow: conspiracy, wrecking, industrial sabotage..."
 communism.12.b: "We cannot afford a purge. Bury the papers, and deep."

