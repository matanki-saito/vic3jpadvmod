je_ukraine_cultural_renaissance: "Ukrainian Renaissance"
je_ukraine_cultural_renaissance_reason: "After the suppression of the Haidamaky Uprisings, the dream of an independent Ukrainian state seems further away than ever. However, while swords have failed, champions of the Ukrainian cause have been sharpening their pens. Authors, poets and journalists, invigorated by the liberal zeitgeist, are willing to risk imprisonment or exile to keep the dream alive. Perhaps they can light the fire again."
je_ukraine_cultural_renaissance_hromada_info: "@information! [concept_hromada] societies will appear in [GetCulture('ukrainian').GetName] [Concept('concept_homeland','$concept_homelands|q$')] in [ROOT.GetCountry.GetName] while the Journal Entry is active."
