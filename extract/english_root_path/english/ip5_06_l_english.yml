je_belarus_cultural_renaissance: "Byelorussian Renaissance"
je_belarus_cultural_renaissance_reason: "As former subjects of the Polish-Lithuanian Commonwealth and later of the Russian Empire, the inhabitants of the lands called White Rus' find their own cultural identity contested. Yet out of this tumultuous time, something new may emerge: The ambition to form their own nation."
je_belarus_cultural_renaissance_trigger_poland: "The #v $je_congress_poland$#! [concept_journal_entry] has completed with a #b Red#! victory"
je_belarus_cultural_renaissance_map_fervor: "[GetCulture('byelorussian').GetName] [concept_fervor]: [GetCulture('byelorussian').GetCurrentFervor|v0]"
je_belarus_cultural_renaissance_map_homeland: "[ROOT.GetState.GetName] is a [GetCulture('byelorussian').GetName] [concept_homeland]"
je_belarus_cultural_renaissance_map_culture_percent: "[SCOPE.GetValue('byelorussian_culture_percent')|v0%] of the [Concept('concept_pop','$concept_pops|q$')] in [ROOT.GetState.GetName] are [GetCulture('byelorussian').GetName]"

cultural_renaissances_events.1.t: "Supreme Ruthenian Council"
cultural_renaissances_events.1.d: "A political organization has formed in [SCOPE.sState('src_state').GetCityHubName], promoting the unification of Ukrainian lands within [ROOT.GetCountry.GetName] and increased use and teaching of the Ukrainian language."
cultural_renaissances_events.1.f: ""Within a week of this Council announcing the colors of their flag, a yellow and blue banner is flying on the Town Hall tower. Do they really expect us to believe they had nothing to do with this?"\n\n"I don't think they want us to believe anything. What they want us to know is exactly what we now know with certainty: That they have a flag and that its colors are yellow and blue.""
cultural_renaissances_events.1.a: "Give them what they want."
cultural_renaissances_events.1.bb: "Try to work with their representatives." # Loc key changed to avoid hash collision
cultural_renaissances_events.1.c: "The last thing we need is more separatists."
supreme_ruthenian_council: "Supreme Ruthenian Council"
ruthenian_representatives: "Ruthenian Representatives"

cultural_renaissances_events.2.t: "Brotherhood of Saints Cyril and Methodius"
cultural_renaissances_events.2.d: "A political society, named after the creators of the Cyrillic alphabet, has formed in [SCOPE.sState('boscam_state').GetCityHubName]. They promote liberal reforms, education of the masses and an independent Ukrainian state as part of a pan-Slavic union of equals."
cultural_renaissances_events.2.f: ""Peaceful land, beloved country,\nO my dear Ukraine!\nWhy, my mother, have they robbed you?\nWhy do you thus wane?"\n\n—Taras Shevchenko, #italic The Plundered Grave #!" # Translation by Vera Rich
cultural_renaissances_events.2.a: "The idea of a pan-Slavic union is worth entertaining."
cultural_renaissances_events.2.b: "No need for secrecy among poets!"
cultural_renaissances_events.2.c: "Arrest them, along with whoever writes what they read for good measure."
cultural_renaissances_events.2.e: "Such ideas must be stamped out."
brotherhood_of_saints_cyril_and_methodius: "Brotherhood Of Saints Cyril And Methodius"
ukrainophile_intelligentsia: "Ukrainophile Intelligentsia"

cultural_renaissances_events.3.t: "Hromada"
cultural_renaissances_events.3.d: "A network of societies referred to as 'hromada' have formed in [SCOPE.sState('hromada_state').GetCityHubName], promoting Ukrainian language, studying its folklore and poetry. They host cultural events and spread educational materials among the peasantry."
cultural_renaissances_events.3.f: ""The glory and will of Ukraine has not yet perished,\nAnd yet upon us, Ukrainians, fate shall smile once more.\nOur enemies shall melt away, like the dew in the sun.\nAnd we too shall rule, O brethren, the homeland of our own."\n\n—Pavlo Chubynskyi, #italic The Glory and Will of Ukraine Has Not Yet Perished #!"
cultural_renaissances_events.3.a: "Let them educate the peasants in the language they speak."
cultural_renaissances_events.3.b: "Suspiciously subversive activities. Keep an eye on them."
cultural_renaissances_events.3.c: "They are in clear violation of the law! Arrest them."
cultural_renaissances_events.3.tt: "Other Hromada will appear and be subject to the same treatment"
hromada: "Hromada"

cultural_renaissances_events.4.t: "Prosvita"
cultural_renaissances_events.4.d: "An educational organization called 'Prosvita' has been established in [SCOPE.sState('prosvita_state').GetCityHubName], providing educational and economic resources and promoting Ukrainian language and culture."
cultural_renaissances_events.4.f: ""Some people come here to read and they find a community. Others come here for the community and discover that they quite like to read. Our goal is not one or the other—what we are building here requires both.""
cultural_renaissances_events.4.a: "This is the sort of initiative [ROOT.GetCountry.GetName] should be funding!"
cultural_renaissances_events.4.b: "If they can find the funding, we welcome their efforts."
cultural_renaissances_events.4.c: "We must shut down this hotbed of separatism quickly."
cultural_renaissances_events.4.tt: "Other Prosvita will appear and be subject to the same treatment"
government_funded_prosvita: "Government Funded Prosvita"
self_funded_prosvita: "Self-funded Prosvita"

cultural_renaissances_events.5.t: "Chłopomania"
cultural_renaissances_events.5.d: "A surge in interest for the culture and lifestyle of the peasantry has taken hold among the Polish and Ukrainian Intelligentsia, spending time among Ukrainian peasants in particular and championing their culture."
cultural_renaissances_events.5.f: ""The people! Everyone professes to love them, serve them, speak for them. Yet few are willing to go out there and live among them. Many old intellectuals have never spoken to a peasant. We will be different. We will live a simple life among simple men. We will not have to say we love the people. The people will tell you.""
cultural_renaissances_events.5.a: "Inspiring to see the youth take an interest in culture and history!"
cultural_renaissances_events.5.b: "What's next? Reenacting a peasant uprising?"
encouraged_chlopomania: "Encouraged Chłopomania"
discouraged_chlopomania: "Discouraged Chłopomania"

cultural_renaissances_events.6.t: "$peasants_truth$"
cultural_renaissances_events.6.d: "[SCOPE.sCharacter('kalinowski_scope').GetFullName] has started publishing the first newspaper in the Belarusian language, speaking to the plight of the local peasantry while taking an anti-tsarist stance."
cultural_renaissances_events.6.f: ""The choice of language itself is a message, as is the choice of the Latin alphabet used to print it. With what those say by themselves, there is no reason to mince words with the contents: That the peasant's days of praying for a good tsar are over. There can be no good tsar. God is on the side of the peasant.""
cultural_renaissances_events.6.a: "Writing for illiterate peasants? Hardly worth concern."
cultural_renaissances_events.6.b: "Arrest these revolutionaries and exile them."
cultural_renaissances_events.6.c: "For this and past crimes, the punishment must be death."
peasants_truth: "Peasants' Truth"

cultural_renaissances_events.7.t: "$letters_from_gallows$"
cultural_renaissances_events.7.d: "While awaiting execution, Kanstancin Kalinoŭski wrote two final letters calling for Belarusian nationalists to resist [ROOT.GetCountry.GetAdjective] rule. The letters have been published in [SCOPE.sCountry('letters_publishing_country').GetCapital.GetCityHubName] and found their way to supporters in his homeland."
cultural_renaissances_events.7.f: ""Hear my last words in sincerity, my people, for it is as if they were written from this world only for your good. You will never have more happiness on this earth, my brothers, until man has understanding and learning in his head. Only then can he be equal and live in plenty, and only then, praying for the truth of God, can he deserve heaven, for once he has enriched his intellect and heart, he can truly love his country."\n\n—Kanstancin Kalinoŭski, #italic Letters from Beneath the Gallows #!"
cultural_renaissances_events.7.a: "We must be more careful with what publications we allow in from [SCOPE.sCountry('letters_publishing_country').GetName]."
cultural_renaissances_events.7.b: "Arrest those in possession of these letters."
cultural_renaissances_events.7.c: "A dead man's words. Their echo will soon fade."
letters_from_gallows: "Letters from Beneath the Gallows"

cultural_renaissances_events.8.t: "Łacinka"
cultural_renaissances_events.8.d: "As more works of literature are being published in Belarusian, some poets and authors have chosen to use the Latin alphabet to write the language instead of Cyrillic."
cultural_renaissances_events.8.f: ""Ruthenian was written in the Latin alphabet for centuries. I am simply trying to assist in establishing a new standard."\n\n"Have you published works in other languages?"\n\n"Is that relevant?"\n\n"Just answer the question, please."\n\n"In Polish."\n\nThe officer took a note."
cultural_renaissances_events.8.a: "Whichever alphabet, the language is the same."
cultural_renaissances_events.8.b: "It is nothing but a tool for political agitation. Ban it."
latin_alphabet_permitted: "Latin Alphabet Permitted"
latin_alphabet_banned: "Latin Alphabet Banned"

cultural_renaissances_events.9.t: "The Dictionary of the Belarusian Local Tongue"
cultural_renaissances_events.9.d: "An ethnographic researcher at the University of [SCOPE.sState('belarusian_dictionary_state').GetCityHubName] has published a dictionary of modern Belarusian words and expressions. Although intended to document a local dialect of Russian, the work has been held up as an example of Belarusian as a distinct language and culture."
cultural_renaissances_events.9.f: ""Studying a dead language can sometimes be made safe. Studying a living language can not. Like any living thing, it moves about, refusing to conform to the researcher's agenda. Also like any living thing, it has something to lose.""
cultural_renaissances_events.9.a: "We must do more research into local linguistics across [ROOT.GetCountry.GetName]!"
cultural_renaissances_events.9.b: "Researchers must express their conclusions more carefully."
local_linguistics_research: "Local Linguistics Research"
restricted_linguistics_research: "Restricted Linguistics Research"

cultural_renaissances_events.10.t: "$homan$"
cultural_renaissances_events.10.d: "A new political grouping has appeared in [SCOPE.sState('homan_state').GetCityHubName], promoting Belarusian separatism and revolutionary socialism. Its members distribute a newspaper advocating their views, using a hectograph to clandestinely produce copies."
cultural_renaissances_events.10.f: ""You are quite mistaken. I am a collector of fairy tales. The supposed social satire that led to these works being confiscated is quite lost on me."\n\n"And the hectograph?"\n\n"To print more fairy tales. Nothing more.""
cultural_renaissances_events.10.a: "A revolution is not necessary for an independent Belarus."
cultural_renaissances_events.10.b: "Confiscate their publications and printing equipment."
cultural_renaissances_events.10.c: "Find and arrest all of them!"
hope_for_belarus: "Hope for Belarus"
homan: "Homan"
