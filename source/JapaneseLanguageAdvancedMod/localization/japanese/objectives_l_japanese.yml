 objective_tutorial_name_DAI:0 "#v $DAI$#!"
 objective_tutorial_desc_DAI:0 "#lore $DAI_FLAVOR_TEXT$#!"
 economic_dominance_welcome:0 "経済的支配"
 economic_dominance_welcome_desc:0 "この目標では、完了するべき一連の[Concept('concept_journal_entry','$concept_journal_entries$')]が与えられます。これらの任務をどう完了するかはプレイヤー次第です。\n\n注 : 最初のジャーナル記事を入手する前に自国に鉄または石炭の採掘場がなければなりません。"
 economic_dominance_lesson_button_skip:0 "前進！"
 je_objective_expand_goods_production:0 "我が国の採掘産業の拡張"
 je_objective_expand_goods_production_status:0 "[JournalEntry.GetTarget.GetBuilding.GetState.GetName]にある[JournalEntry.GetTarget.GetBuilding.GetName]を拡張する"
 je_objective_expand_goods_production_reason:0 "国内生産量の増加に向けての第一歩を踏み出しましょう。[JournalEntry.GetTarget.GetBuilding.GetState.GetName]の[JournalEntry.GetTarget.GetBuilding.GetName]を拡張するべきです。これにより、今後さらに産業を拡大するための態勢を整えることができます。"
 je_objective_expand_goods_production_goal:0 "[JournalEntry.GetTarget.GetBuilding.GetState.GetName]の[JournalEntry.GetTarget.GetBuilding.GetName]を1レベル上げる。"
 expand_goods_production_complete_1:0 "生産量が増加した！"
 expand_goods_production_complete_1_desc:0 "素晴らしい！経済的支配目標の序盤を完了しました。さらに任務をアンロックするには[Concept('concept_journal_entry','$concept_journal_entries$')]を引き続き完了してください。"
 je_refining_goods:0 "生産の洗練"
 je_refining_goods_status:0 "州にレベル4の[GetBuildingType('building_steel_mill').GetName]を持つ。"
 je_refining_goods_reason:0 "原材料となる[Concept('concept_good','$concept_goods$')]の生産量を増加させました。次はこれらの$concept_goods$を精製し、潜在的利益を増加させるべきです。自分たちで作れるものを、他国から輸入する必要があるでしょうか？"
 je_specialized_goods:0 "専門商品の生産"
 je_specialized_goods_status:0 "州にレベル2の[GetBuildingType('building_motor_industry').GetName]を持つ。"
 je_specialized_goods_reason:0 "商品生産の多様化をさらに進めるべきです。ひとつの商品の生産を始めましたが、さらに高価な商品の生産を始めれば、世界中へ輸出することが可能になるでしょう。"
 je_expanding_the_market:0 "市場の拡張"
 je_expanding_the_market_status:0 "8つの国に自国の[concept_customs_union]の一員になってもらう。"
 je_expanding_the_market_reason:0 "今後は$concept_customs_union$をさらに多くの国で展開することを視野に入れるべきでしょう。そうすれば[concept_world_market]を相手に[concept_trade]をする必要がなくなり、他国とより自由で直接的な貿易ができるようになります。"
 je_strong_market:0 "有力市場"
 je_strong_market_reason:0 "世界でもっとも巨大で強力な市場を自国に築き上げる時が来ました。"
 economic_dominance_complete_1:0 "経済的支配完了"
 economic_dominance_complete_desc:0 "素晴らしい！経済的支配目標を完了しました。このままゲームを続けるか、別の目標に挑戦してください。"
 je_objective_expand_goods_production_invalid_tooltip:0 "[GetPlayer.GetName]はもはや[JournalEntry.GetTarget.GetBuilding.GetState.GetName]にある[JournalEntry.GetTarget.GetBuilding.GetName]の所有者ではありません"
 je_specialized_inputs:0 "生産量向上"
 je_specialized_inputs_reason:0 "工業化された製品の生産は順調に進んでおり、これらの商品を他の施設に再投資することを検討すべきです。そうすれば、他の労働者を他の場所で働かせることができるようになります。\n\n注 : このジャーナル記事を完了すると、「利益の輸出」ジャーナル記事が無効になります。"
 je_utilizing_our_strength:0 "強みの活用"
 je_utilizing_our_strength_reason:0 "産業品を自分たちのために使うことに重点を置くことにしました。これらの商品の価格をできるだけ低く抑えることで、これらの商品に大きく依存している他の施設のコストを上昇させないようにするのが最善です。"
 je_exporting_profits:0 "利益の輸出"
 je_exporting_profits_reason:0 "商品を大量に備蓄することができました。生産施設の収益性を高めるために、これらの商品の輸出を始められます。\n\n注 : このジャーナル記事を完了すると、「生産量向上」ジャーナル記事が無効になります。"
 je_raise_exports_value:0 "輸出価値の増加"
 je_raise_exports_value_reason:0 "現在、貴重な商品の輸出に重点を置いています。施設の利益を最大化させるために、商品の価値を上げることが最善策でしょう。"
 je_lower_production_costs:0 "消費価格の低減"
 je_lower_production_costs_reason:0 "産業の発展に伴い、工場への安定的な商品供給に加え、それらの原料が高額過ぎず、より貴重な商品の追加生産の妨げにならないよう確認する必要があります。"
 tt_lower_production_costs_sub_obj:0 "[AccessPlayer.AccessFirstMarket.GetName]の[GetGoods('iron').GetName]、[GetGoods('coal').GetName]と[GetGoods('steel').GetName]が[concept_base_price]より20%安価になる"
 tt_raise_exports_value_sub_obj:0 "[AccessPlayer.AccessFirstMarket.GetName]の[GetGoods('engines').GetName]が[concept_base_price]より50%高価になる"
 tt_utilizing_our_strength_sub_obj:0 "[AccessPlayer.AccessFirstMarket.GetName]の[GetGoods('engines').GetName]が[concept_base_price]より20%安価になる"
 je_african_colonies_own_a_colony:0 "アフリカ大陸に位置している[concept_colony]です"
 je_african_colonies_own_whole_state_region:0 "[concept_state_region]全域にわたっています"
 je_objective_encourage_liberal_ideas:0 "自由主義思想の奨励"
 je_objective_encourage_liberal_ideas_reason:0 "平等主義社会醸成への第一歩は、政府に適切な人材を確保することです。改憲可能な地位に彼らを配置することで、平等な社会に向けた一歩を踏み出すことができるのです。"
 je_pass_laws:0 "法案の可決"
 je_pass_laws_reason:0 "政府内に強力な自由主義勢力を所有することができました。彼らの影響力を行使してより平等主義的な法案の可決を目指しましょう。\n\n注意 : このジャーナルを完了した後にこれらの法を後退させると、法律が再度制定されるまでこのジャーナルが非表示になります。"
 je_public_services:0 "公的サービス"
 je_public_services_reason:0 "法律が整備された今、[Concept('concept_institution','$concept_institutions$')]を拡張して、住民の利便性やアクセシビリティを高める必要があります。$egalitarian_objective_note_loc$"
 je_liberate_the_slaves:0 "奴隷解放"
 je_liberate_the_slaves_reason:0 "国内で奴隷制度を積極的に利用しているのに、どうして自らを平等主義的社会と呼ぶことができようか？何よりもまずこの時代遅れで不道徳な慣習を止めることが重要だ。"
 je_women_and_children:0 "女性と子供"
 je_women_and_children_reason:0 "我が国は平等主義社会を構築するために様々な対応を行ってきましたが、それでもすべての人がこれらの権利を享受していることを確実なものにしなければなりません。女性や子供に対する不公正な慣行に終止符を打つべきです。$egalitarian_objective_note_loc$"
 je_egalitarian_society:0 "平等主義社会"
 je_egalitarian_society_reason:0 "これで法律と制度がすべて整いました。全市民に平等な機会が与えられる平等な社会を実現することに尽力する必要があります。我が国は平等主義の光で世界を導く灯台のような存在であるべきなのです。$egalitarian_objective_note_loc$"
 liberalizing_the_government_complete:0 "自由主義思想"
 liberalizing_the_government_complete_desc:0 "これでジャーナル記事の最初のエントリーが完了しました。この目標の残りを完了して平等主義社会を誕生させる準備が整いました。"
 egalitarian_society_welcome:0 "平等主義社会"
 egalitarian_society_welcome_desc:0 "プレイヤー目標「平等主義社会」へようこそ。ここでは一連の[Concept('concept_journal_entry','$concept_journal_entries$')]を完了して、平等主義社会の構築を目指すことになります。"
 liberalizing_the_government_complete_1:0 "自由主義思想"
 liberalizing_the_government_complete_1_desc:0 "素晴らしい！これで最初の目標が完了しました。これからはあなた独自の平等主義社会を確立する道を模索してみましょう。"
 egalitarian_society_complete:0 "平等主義社会完成"
 egalitarian_society_complete_desc:0 "素晴らしい！平等主義社会目標を完了しました。このままゲームを続けるか、別の目標に挑戦してください。"
 je_liberate_the_slaves_invalid_tooltip:0 "[JournalEntry.GetTarget.GetCountry.GetName]はすでに存在しません。"
 egalitarian_objective_note_loc:0 "\n\n注意 : 以前のジャーナル記事で可決された法律のいずれかを後退させると、その法律が再度制定されるまで、このジャーナルは非表示になり、この目標での進捗を進めることができなくなります。"
 je_colonization_laws:0 "植民地国家"
 je_colonization_laws_reason:0 "覇権を確立するための第一歩は海外に国境を拡大することです。目標達成のために、植民地化を可能にするよう法律を改正するべきです。"
 je_african_colonies:0 "アフリカ植民地"
 je_african_colonies_reason:0 "これで我が国の法律が植民地の設立を許可します。覇権の拡大に向けた第一歩としてアフリカ大陸における新しい領土の獲得を目指しましょう。"
 je_expand_navy_and_army:0 "軍事の強化"
 je_expand_navy_and_army_reason:0 "最初の植民地を築いたからには、最悪の事態に備えましょう。我が軍は世界でもっとも強力である必要はありませんが、他国が我々に対して[concept_diplomatic_play]を試みることがないよう配慮しなければなりません。"
 je_form_alliance:0 "同盟を形成する"
 je_form_alliance_reason:0 "強力な軍を維持することは大切ですが、安全確保の方法はそれだけではありません。我が国の正当な所有物を盗もうとする国家が現れた際に、世界各地から支援に駆けつけてくれるような同盟国との協力関係を構築することにも目を向けるべきです。"
 je_take_subject:0 "従属国の保持"
 je_take_subject_reason:0 "我々の権力が確固たるものになった今、その影響力を他国にも拡大するべきです。いくつかの国を支配下に置けば、我々の国際的な影響力の増加に大いに役立つでしょう。"
 je_increase_technology:0 "盤石の技術的優位性"
 je_increase_technology_reason:0 "確かに戦いは数です。しかし可能であるなら圧倒的な数の兵士を保有することに頼ることは避けるべきです。適切な作業に最適な道具を兵士に提供する方法を検討する必要があります。"
 je_greatest_power:0 "超列強国"
 je_greatest_power_reason:0 "我が国は世界から列強であると認識されていますが、我が国が最も偉大な国であることを世界に知らしめる必要があります。同等の国家が存在すべきではありません。"
 je_greater_power:0 "列強国"
 je_greater_power_reason:0 "我が国は一部の地域で権力を握っていますが、今後は世界情勢における地位を固め、国力を示すために他の列強諸国に加わることを目指すべきでしょう。"
 je_great_power:0 "大国"
 je_great_power_reason:0 "我が国は決して最強ではありませんが、それも過去の話です！我が国は誰にも相手にされない遠隔地の小さな声ではないのだということを世界に知らしめる必要があります。"
 je_unrecognized_power:0 "認知度"
 je_unrecognized_power_reason:0 "いわゆる\"文明的な\"列強から忌避されている我々は、労苦と闘争を通じて自らの価値を彼らに証明し、国家の仲間として尊敬される地位を確保しなければなりません。 "
 je_the_hegemon:0 "覇権国"
 je_the_hegemon_reason:0 "我が国は世界に国力を示しましたし、大きな進歩も遂げました。しかし今後は、我が国の世界的な地位の裏付けとなる人口の確保に目を向ける必要があります。"
 colonization_law_passed_complete_1:0 "植民地国家"
 colonization_law_passed_complete_1_desc:0 "おめでとうございます！これで最初の目標が完了しました。これからはあなた独自の覇権を確立する道を模索してみましょう。"
 hegemon_welcome:0 "覇権国家"
 hegemon_welcome_desc:0 "プレイヤー目標「覇権」へようこそ。ここでは一連の[Concept('concept_journal_entry','$concept_journal_entries$')]を完了して、独自の覇権国家構築を目指すことになります。"
 hegemon_complete:0 "覇権国家完了"
 hegemon_complete_desc:0 "素晴らしい！覇権国家目標を完了しました。このままゲームを続けるか、別の目標に挑戦してください。"
 modifier_industrial_barriers_nat_supremacy:0 "人種差別的反応"
 modifier_industrial_barriers_against_nat_supremacy:0 "差別への反対"
