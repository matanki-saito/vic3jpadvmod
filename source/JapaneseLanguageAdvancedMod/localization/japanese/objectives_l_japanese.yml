 objective_hegemon:0 "覇権国家"
 objective_hegemon_desc:0 "世界中の大衆を完全に支配することでのみ心の渇きが癒されます。世界人口の大部分が自国の国境内に住むようになるまで国々を従属させ、征服しましょう。単に自国の人口を増やしても構いません。"
