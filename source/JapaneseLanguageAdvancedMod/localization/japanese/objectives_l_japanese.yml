 objective_economic_dominance:0 "経済的支配"
 objective_economic_dominance_desc:0 "生産を増やして市場規模を広げ、世界経済を完全に掌握するまで貿易の影響力を拡大することが目的です。世界GDPの大部分を手中に収めることが最終目標となります。"
