 objective_hegemon_name_JAP:0 "#v $dyn_c_japan_shogunate$#!"
 objective_hegemon_desc_JAP:0 "#lore $JAP_FLAVOR_TEXT$#!"
 objective_egalitarian_society:0 "平等主義社会"
 objective_egalitarian_society_desc:0 "人々に力を！国全体の生活水準向上とその機会を確保し、自由と平等で世界を照らす誘導灯となって人々の尊敬を一身に集めましょう。"
 objective_egalitarian_society_idle_header:0 "自分の道を進み続けましょう"
