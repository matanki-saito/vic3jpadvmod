l_japanese:
 je_russification:0 "西部の国境"
 je_russification_reason:0 "我が国の西部国境地帯は、長年にわたる政治的対立と戦争により形作られてきた。[Glossary('glossary_annexation_of_finland','1809年の$FIN|q$併合')]と[Glossary('glossary_establishment_of_congress_poland','1815年の$dyn_c_congress_poland|q$成立')]の後、上流階級の支持を得るために譲歩がなされた。一方、[Glossary('glossary_annexation_baltic_governorates','バルト海沿岸地域')]では貴族が地方特権を維持しており、社会と経済のあり方は[ROOT.GetCountry.GetAdjectiveNoFormatting]行政の中枢とは別個のままである。[ROOT.GetCountry.GetCapital.GetCityHubName]より西方の地域における我が国の権威は、この地域の行政統合によってのみ維持できるのだ。"
 je_russification_map_owned_tt:0 "[THIS.GetState.GetCustom('je_russification_state_owned_by_russia')]$je_russification_is_owned_by_tt$"
 je_russification_map_incorporated_tt:0 "[THIS.GetState.GetCustom('je_russification_state_is_incorporated')]$TRIGGER_IS_INCORPORATED$"
 je_russification_map_turmoil_tt:0 "[THIS.GetState.GetCustom('je_russification_state_turmoil')][concept_turmoil]が[THIS.ScriptValue('je_russification_state_turmoil_max')|v%1]未満である ([THIS.GetState.CalcTurmoil|v%1]) "
 je_russification_map_culture_tt:0 "[THIS.GetState.GetCustom('je_russification_state_is_assimilated')][GetCulture('russian').GetName][concept_culture][THIS.ScriptValue('je_russification_state_russian_culture_min')|v%1] ([THIS.ScriptValue('russian_culture_fraction')|v%1]) "
 je_russification_is_owned_by_tt:0 "[SelectLocalization(ROOT.GetCountry.IsValid,ROOT.GetCountry.GetName,'RUS')]が所有している"
 russification.1.t:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]の外へ"
 russification.1.d1:0 "リーダーたちは、外国の影響が西部国境地帯の長期的な安定と一体性を脅かしていると懸念している。我々は[ROOT.GetCountry.GetCapital.GetCityHubName]の外にも権威を及ぼさなければならない。"
 russification.1.d2:0 "$PRU$によるドイツ統一の推進は、西部国境地帯の安定を脅かしている。我々は[ROOT.GetCountry.GetCapital.GetCityHubName]の外にも権威を及ぼさなければならない。"
 russification.1.d3:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]のリーダーたちは、$GER$の統一の成功が西部国境地帯の安定を脅かすことを懸念している。我々は利益を守るため、この地域における権威を確立しなければならない。"
 russification.1.f:0 "「…彼らはロシア人を祖先に持つ者ではないが、強大なロシア国家の繁栄を支える健全な国家原則を、徐々に身に付けていくべきである…」\n\n‑S.P.スホドリスキー、 『#italic 1896年コヴノ県知事報告書#!』"
 russification.1.a:0 "[GetGeographicRegion('geographic_region_finland_old').GetName]に注力する。"
 russification.1.b:0 "[GetGeographicRegion('geographic_region_baltic_states_old').GetName]に目を向ける。"
 russification.1.c:0 "[GetGeographicRegion('geographic_region_poland_old').GetName]に集中する。"
 russification.1.d:0 "今は[ROOT.GetCountry.GetCapital.GetCityHubName]以外に投資する余裕はない。"
 modifier_regional_russification_payments:0 "行政費用"
 modifier_regional_russification_efforts:0 "地域での取り組み"
 russification.2.t:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]による命令"
 russification.2.d:0 "西部国境地帯の統合に成功したことで、我が国は西方における[ROOT.GetCountry.GetNameNoFormatting]の未来を確かなものにした。"
 russification.2.f:0 "かつて[ROOT.GetCountry.GetAdjectiveNoFormatting]の統治の中枢から隔絶されていた西部辺境は、いまや統合された。[ROOT.GetCountry.GetCapital.GetCityHubName]のリーダーたちはこの結果に大いに満足し、野心的な計画を成功へと導いた[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]を称えている。\n\n[ROOT.GetCountry.GetAdjectiveNoFormatting]のある官僚は、[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]に宛てて次のようにしたためている。「西部における[ROOT.GetCountry.GetNameNoFormatting]の未来は明るいものです。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]にこの大事業へ断固として取り組む決断を促したのは、間違いなく貴殿です」"
 russification.2.a:0 "西方における我々の権威は揺るがない。"
 russification.2.b:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の統治は、今なお揺るぎないものだ。"
 modifier_je_russification_secured_ext:0 "西部国境の安全確保"
 modifier_je_russification_secured_int:0 "再燃した野望"
 modifier_je_russification_ig_str:0 "西部の獲得"
 modifier_je_russification_loyal_prominence_gain:0 "明るい未来"
 russification_2b_character_modifier_tt:0 "[concept_favorite]または[concept_leader]である[concept_character]は、#tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_je_russification_loyal_prominence_gain_tt $modifier_je_russification_loyal_prominence_gain$#!を#v [GetPlayer.MakeScope.ScriptValue('display_long_modifier_time')]#!年間獲得する"
 modifier_je_russification_loyal_prominence_gain_tt:0 "[GetStaticModifier('modifier_je_russification_loyal_prominence_gain').GetName|v]\n[GetStaticModifier('modifier_je_russification_loyal_prominence_gain').GetDesc]"
 russification.3.t:0 "破られた国境"
 russification.3.d:0 "かつての[ROOT.GetCountry.GetAdjectiveNoFormatting]西部領土は、すべて我々の支配下から離れた。我々の西部国境地帯を統合するという方針は、決定的な失敗に終わった。"
 russification.3.f:0 "有力者である[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]は、その権力によって多くの特権を享受している。[ROOT.GetCountry.GetCapital.GetCityHubName]では[SCOPE.sCharacter('relevant_character').GetHerHis]の権威を疑問視する者はほとんどいない。だが、西部の[ROOT.GetCountry.GetAdjectiveNoFormatting]領を失って以来、#italic [SCOPE.sCharacter('relevant_character').GetSheHe]#!こそがこの悲惨な結果を招いた責任があるのではないかという噂が広がっている。[SCOPE.sCharacter('relevant_character').GetLastNameNoFormatting]は、この喪失には単純には語れない事情があることを知っているが、世論を自らに有利な方向へ動かすことは難しい。この失敗による影響は、今後何年にもわたって[SCOPE.sCharacter('relevant_character').GetHerHis]の政治的な将来の足かせとなるだろう。"
 russification.3.a:0 "我々は将来にわたって国境の保全を確保しなければならない。"
 modifier_je_russification_loyal_prominence_loss:0 "不運な嫌われ者"
 modifier_je_russification_approval_loss:0 "不幸なつまずき"
 modifier_je_russification_decline_approval_loss:0 "ロシア化の先送り"
 russification_3a_character_modifier_tt:0 "[concept_favorite]または[concept_leader]である[concept_character]は、#tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_je_russification_loyal_prominence_loss_tt $modifier_je_russification_loyal_prominence_loss$#!を#v [GetPlayer.MakeScope.ScriptValue('display_long_modifier_time')]#!年間獲得する"
 modifier_je_russification_loyal_prominence_loss_tt:0 "[GetStaticModifier('modifier_je_russification_loyal_prominence_loss').GetName|v]\n[GetStaticModifier('modifier_je_russification_loyal_prominence_loss').GetDesc]"
 russification.4.t:0 "襲撃"
 russification.4.d:0 "[SCOPE.sCountry('finland_scope').GetName]の独立を支持する絵画が、[SCOPE.sCountry('finland_scope').GetCapital.GetCityHubName]で密かに展示された。この絵画の複製は数千点にのぼり、[ROOT.GetCountry.GetNameNoFormatting]の西部国境地帯に出回っているのが確認されている。"
 russification.4.f:0 "[SCOPE.sCountry('finland_scope').GetCapital.GetCityHubName]の私邸で、ひとりの若者がその作品をじっくりと鑑賞する機会を得た。この絵の画家やモデルと同じく、彼もまた[SCOPE.sCountry('finland_scope').GetNameNoFormatting]最北の地に生まれた者であった。若者は、[SCOPE.sCountry('finland_scope').GetAdjectiveNoFormatting]の法典を抱えた乙女が、それを奪い取ろうと迫る双頭の鷲に果敢に抗っている姿を、この絵が完璧に描き出していることに感銘を受ける。そして彼は、この大胆な絵画を絵葉書にしてみようと思った。"
 russification.4.a:0 "この絵画が広まるのを、何としても禁じよ。"
 russification.4.b:0 "こんな作品が複製されようと、大した害にはならん。"
 russification.5.t:0 "重点的な取り組み"
 russification.5.d:0 "西部国境地帯を統合する政策の一環として、[SCOPE.sCharacter('relevant_character').GetFullName]が[SCOPE.sState('relevant_state').GetName]の編入を主導する役に選ばれた。"
 russification.5.f:0 "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]は、[ROOT.GetCountry.GetNameNoFormatting]による西部国境地帯の完全掌握が遅々として進んでいないことを、よく承知している。[SCOPE.sState('relevant_state').GetNameNoFormatting]の開発を監督するよう求める書簡を読みながら、[SCOPE.sCharacter('relevant_character').GetSheHe]はその任務がどのような責任を伴うのか、そしてこの取り組みが失敗すればどれほどの追及に晒されることになるのかと思いを巡らせる。\n\n[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]はペンを手に取り、こう記した。「西方における我々の利益を守れというのであれば、私はその期待に応えてみせましょう」"
 russification.5.a:0 "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]なら、この任務を果たせる。"
 russification.5.b:0 "[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]は、あまりに多くの責務を抱えている。この件は地方行政に任せよう。"
 modifier_candidate_reject_approval_loss:0 "却下された候補者"
 modifier_local_administration_autonomy:0 "地方のリーダーシップ"
 russification.6.t:0 "[SCOPE.sState('relevant_state').GetNameNoFormatting]の正式編入"
 russification.6.d:0 "[SCOPE.sCharacter('relevant_character').GetFullName]は、[SCOPE.sState('relevant_state').GetName]の編入に向けた取り組みを見事に成功へ導いた。[ROOT.GetCountry.GetNameNoFormatting]は、西部領域の掌握に向けて、また一歩前進した。"
 russification.6.f:0 "[SCOPE.sState('relevant_state').GetCityHubName]の中心部で、[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]は自身の監督任務が成功したことに歓喜している。同輩たちを前に、[SCOPE.sCharacter('relevant_character').GetSheHe]は誇らしげに語った。「[SCOPE.sState('relevant_state').GetCityHubName]は、我が国の拡大がもたらす機会と展望を示す格好の実例となった。[SCOPE.sState('relevant_state').GetNameNoFormatting]が[ROOT.GetCountry.GetNameNoFormatting]にとって欠かせない存在となるにつれ、残る西部領域も間違いなく我々の後に続くことだろう」"
 russification.6.a:0 "[SCOPE.gsInterestGroup('relevant_ig').GetName]は、[SCOPE.sCharacter('relevant_character').GetFullNameNoFormatting]が成し遂げた事業の恩恵に浴するだろう。"
 russification.6.b:0 "[SCOPE.sState('relevant_state').GetName]は、我々の統治下で間違いなく繁栄するだろう。"
 modifier_russify_state_success:0 "確かな実績"
 modifier_western_territory_incorporated:0 "西部への入植"
 russia_events.31.t:0 "ダブルするかしないか、それが問題だ"
 russia_events.31.d:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]のある大公が、バックギャモンにダブルを導入したという記事が国外で出回っている。伝えられるところでは、この遊び方はニューヨークの社交界で大いに流行しているらしい。"
 russia_events.31.f:0 "「認めざるをえないが、ダブルは、バックギャモンをより技量が問われるゲームにするなどという高尚な目的から生まれたものではない。これは、最短の時間で最大限の\"駆け引き\"を得るためだけに考案されたものであり、その点において、考案者とされる大公ドミトリは見事に成功した。彼自身はおそらく気づいていなかっただろうが…これによって、互いの形勢を巧みに分析することが勝利に不可欠となった。そして、この現代的な変種が、未来のバックギャモンとしての地位を固めることは確実と思われる」\n\n―ジョン・ロングエーカー、『#italic ダブルするかしないか、それが問題だ#!』"
 russia_events.31.a:0 "実に斬新だな！"
 russia_events.31.b:0 "ダブル…まさに独創性も2倍だな！"
 modifier_doubling_origin:0 "ダブルの起源"
 modifier_early_doubler:0 "ダブルの早期採用者"
 russia_events.32.t:0 "写実派の反乱"
 russia_events.32.d:0 "[SCOPE.sState('relevant_state').GetName]の[GetBuildingType('building_art_academy').GetName]は、来たる全国美術コンクールにおいて、芸術家たちに自由な主題選択を認めようとしていない。アカデミーの旧態依然としたやり方に幻滅した芸術家たちは、抗議のために独立した芸術団体を結成した。"
 russia_events.32.f:0 "全国美術コンクールの開幕当日、ひとりの芸術家がアカデミーの会議場を行き来しながら、コンクールの主題が発表されるのを待っている。学術評議会に宛てた連名の書簡がまたしても黙殺されたことに、彼は苛立ちを隠せない。彼は思う。「#italic どうして主題を好きに選ばせてもらえないんだ？#!」\n\n募る不満を抑えきれなくなった彼は、ほかの参加者たちに向けて熱のこもった演説を行い、こう宣言する。「アカデミーが我々の要求に応じないというのなら、このコンクールへの参加を拒み、この機関に頼らず自分たちの作品を売ろうではないか！」"
 russia_events.32.a:0 "言語道断だ！警察に命じて、この芸術家たちを厳重に監視させろ。"
 russia_events.32.b:0 "逸材たちがアカデミーを去るとは…なんとも惜しいことだ。"
 modifier_surveilled_artists:0 "監視下の芸術家"
 modifier_ig_surveilled_artists_approval:0 "創作統制"
 modifier_artel_of_artists:0 "芸術家協同組合"
 russia_events.33.t:0 "移動美術展を催す芸術家たち"
 russia_events.33.d:0 "独立した芸術団体を結成した[Glossary('glossary_peredvizhniki_artists','写実派芸術家の一団')]が、芸術を民衆に届けるべく、[ROOT.GetCountry.GetNameNoFormatting]各地の都市を巡る移動美術展を企画した。彼らの作品は国外でも評価を高めており、やがて芸術アカデミー公認の作品をしのぐ価値を持つかもしれない。"
 russia_events.33.f:0 "「ロシアの風景画家レヴィタンは、それまで誰もなし得なかったほど見事に、色彩によってロシアの\"魂\"を表現した――そう私が言うとき、それは単に理論を唱えているにすぎないのか、それともありのままの事実を伝えているのか…どちらであろう？いずれにせよ、彼が描いたロシアの風景は、これまでにない形でロシアの魂を表していた。それは雄弁に、痛切に、そして見る者の心に情景を呼び起こす魔法の如き力で訴えかけてきて…」\n\n―フランシス・ハフカイン・スノウ、『 #italic イサーク・レヴィタン―ロシアの魂を描いた画家#!』"
 russia_events.33.a:0 "芸術アカデミーを改革し、ペレドヴィジニキの芸術家たちを取り込め。"
 russia_events.33.b:0 "非公認の作品を弾圧せよ。"
 modifier_peredvizhniki_art:0 "ペレドヴィジニキの芸術家たち"
 modifier_peredvizhniki_political_movement:0 "影響力がある展覧会"
 modifier_ig_approves_peredvizhniki_rejection:0 "写実派の排斥"
 russia_events.34.t:0 "[SCOPE.sState('relevant_state').GetCityHubName]万国博覧会への招待"
 russia_events.34.d:0 "[SCOPE.sCountry('relevant_country').GetName]が[SCOPE.sState('relevant_state').GetCityHubName]で万国博覧会を開催することとなった。我が国の国際的な印象を向上させるため、閣僚たちは[SCOPE.sCountry('russia_scope').GetName]の参加を促している。"
 russia_events.34.f:0 "[SCOPE.sCountry('relevant_country').GetNameNoFormatting]から招待状が届くと、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は外務大臣を呼び寄せ、[SCOPE.sState('relevant_state').GetCityHubName]万国博覧会への参加が[ROOT.GetCountry.GetNameNoFormatting]にどのような利益をもたらすか、意見を求めた。\n\n国際舞台で[ROOT.GetCountry.GetNameNoFormatting]を代表する機会に胸を躍らせた外務大臣は、参加には大きな意義があると力説した。「我が国が参加すれば、工業の発展ぶりをヨーロッパの人々に深く印象づけることができるでしょう」"
 russia_events.34.a:0 "担当者を派遣し、我が国の農産物を売り込もう。"
 russia_events.34.b:0 "参加を手配し、我が国の兵器を披露しよう。"
 russia_events.34.c:0 "そのような浮ついた催しに、我が国の資源を割く価値はない。"
 russia_did_attend_worlds_fair_tt:0 "[SCOPE.sCountry('russia_scope').GetAdjective]の展示物が[SCOPE.sState('relevant_state').GetCityHubName]に#bold #g 送られる#!#!"
 russia_did_not_attend_worlds_fair_tt:0 "[SCOPE.sCountry('russia_scope').GetAdjective]の展示物が[SCOPE.sState('relevant_state').GetCityHubName]に#bold #r 送られない#!#!"
 modifier_russia_participation_cost:0 "万国博覧会のコスト"
 modifier_russia_participation_prestige:0 "万国博覧会の威信"
 modifier_russia_agricultural_showcase:0 "農業の進歩"
 modifier_russia_armaments_showcase:0 "注目すべき兵器"
 notification_russia_world_fair_participant_message_name:0 "[SCOPE.sCountry('russia_scope').GetName]、万国博覧会に参加"
 notification_russia_world_fair_participant_message_desc:0 "[SCOPE.sCountry('russia_scope').GetName]が、[SCOPE.sState('relevant_state').GetCityHubName]万国博覧会での大規模な文化・経済交流に参加することとなりました。"
 russia_events.35.t:0 "[SCOPE.sCountry('russia_scope').GetAdjectiveNoFormatting]パビリオン"
 russia_events.35.d:0 "[SCOPE.sCountry('russia_scope').GetName]が我が国の万国博覧会に参加したことで大きな注目が集まっており、[SCOPE.sCountry('russia_scope').GetAdjective]パビリオンの展示品は、[SCOPE.sCountry('russia_scope').GetNameNoFormatting]の産業発展を強く印象づけている。"
 russia_events.35.f:0 "「これほど多くの対照を抱えた国はない。博覧会を訪れた者の目に、その姿を要約して見せることがこれほど難しい国もない。それでもロシアパビリオンの担当者たちは、あの巨大な帝国の全体像を、包括的かつ鮮やかに示してみせた。ロシアを知る者はそこにロシアを見出し、知らぬ者はそこでロシアを発見するだろう」\n\n―モーリス・ノルマン、『#italic 博覧会におけるロシア#!』"
 russia_events.35.a:0 "なんと見事な展示だ。"
 modifier_russia_expo_research_speed:0 "驚嘆すべき展示"
 notification_russia_world_fair_showcase_message_name:0 "[SCOPE.sCountry('relevant_country').GetName]での展示が成功"
 notification_russia_world_fair_showcase_message_desc:0 "[SCOPE.sCountry('russia_scope').GetName]が[SCOPE.sCountry('relevant_country').GetName]万国博覧会に参加したことで、文化交流は成功裏に終わりました。"
 chartering_the_stanitsas.1.t:0 "新たなスタニツァ前哨線"
 chartering_the_stanitsas.1.d:0 "[SCOPE.sState('cossack_frontier_state').GetName]が我が国の支配下に入ったことで、[SCOPE.sState('cossack_host_state').GetName]のコサック軍の長老たちは、最外縁の前哨線の向こうにある土地を求めて代表団を送ってきた。"
 chartering_the_stanitsas.1.f:0 "「コサックとは祖国に仕える者であり、内外の敵から祖国を守る者である」\n\n―ザポロージャ・コサック軍総軍務官房、『#italic 1649年ザポロージャ・コサック軍登録簿#!』"
 chartering_the_stanitsas.1.a:0 "防衛線を維持させろ。"
 chartering_the_stanitsas.1.b:0 "辺境の地は、彼らに頼らず維持すべきだ。"
 modifier_chartering_the_stanitsas_expense:0 "スタニツァ認可状"
 modifier_chartering_the_stanitsas_host_approval:0 "コサック軍への土地付与"
