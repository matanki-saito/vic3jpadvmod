 favorite_scandal_blackmailing:0 "役人の恐喝"
 favorite_scandal_drunken_misconduct:0 "劇場での飲酒による迷惑行為"
 favorites.3.t:0 "熱のこもった演説"
 favorites.3.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の指名した$concept_favorite$として人気を博している[SCOPE.sCharacter('current_favorite_scope').GetFullName]は、[SCOPE.sLaw('current_law_scope').GetName]の主導的な推進者となった。[ROOT.GetCountry.GetCapital.GetCityHubName]で演説まで行い、その制定を支持している。"
 favorites.3.f:0 "#bold [TimeKeeper.GetCurrentDate.GetString]、[ROOT.GetCountry.GetCapital.GetCityHubName]―#! [ROOT.GetCountry.GetCapital.GetCityHubName]に役人たちが集まり、[SCOPE.sLaw('current_law_scope').GetNameNoFormatting]の是非について議論が交わされた。政策を支持する熱のこもった演説を行った[SCOPE.sCharacter('current_favorite_scope').GetFullNameNoFormatting]は、特に存在感を示した。\n\n以前は案に懐疑的だったとある役人は、[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]の演説を受けてこう語った。「[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]の[SCOPE.sCharacter('current_favorite_scope').GetCustom('favorite_law_speech')]演説により、[SCOPE.sLaw('current_law_scope').GetNameNoFormatting]への支持が確たるものとなった。[SCOPE.sCharacter('current_favorite_scope').GetHerHim]に信頼を置くという[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の判断は正しいものだった」\n\n#italic ―[ROOT.GetCountry.GetCapital.GetCityHubName]・[SCOPE.GetRootScope.GetCountry.GetCustom('generic_newspaper_type')]#!"
 favorites.3.a:0 "[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]の努力を無駄にしてはならない。"
 favorites.3.b:0 "これこそまさに、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]が[SCOPE.sCharacter('current_favorite_scope').GetHerHim]を$concept_favorite$に指名した理由である。"
