 rasputin.1.t:0 "[SCOPE.sCharacter('alexei_scope').GetFullNameNoFormatting]の治療師"
 rasputin1t_tt:0 "アレクセイ・ロマノフを救う祈祷師"
 rasputin.1.d:0 "[SCOPE.sCharacter('alexei_scope').GetFullName]が死の床に伏しているとき、[GetStateRegion('STATE_TOBOLSK').GetName]出身の治療師である[SCOPE.sCharacter('rasputin_scope').GetFullName]が現れた。[SCOPE.sCharacter('rasputin_scope').GetHerHis]の奇跡的な仕業に敬畏の念を抱いた[ROOT.GetCountry.GetCustom('get_rus_consort_title')]は、[SCOPE.sCharacter('rasputin_scope').GetHerHim]を[concept_favorite]に任命したいと考えている。"
 rasputin.1.f:0 "[ROOT.GetCountry.GetCustom('get_rus_consort_title')]は、命に関わる出血に苦しむ[SCOPE.sCharacter('alexei_scope').GetFullNameNoFormatting]の枕元を片時も離れようとしない。[SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting]が痛みに叫び声をあげるたびに涙を流し、ひたすら祈りを捧げていた。医師たちから[SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting]は今夜を越せないだろうと告げられると、[ROOT.GetCountry.GetCustom('get_rus_consort_title')]は必死の思いで$STATE_TOBOLSK$の祈祷師を呼び寄せた。\n\n祈祷師はほどなく到着し、堂々とした足取りで部屋に入ってきた。[SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting]は[SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting]のベッドの足元に立ち、祈りを捧げた。すると、ほどなくして熱は下がり、出血も止まった。[SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting]の瞳には澄んだ輝きが戻っていた。もはや命の危険はなかった。"
 rasputin.1.a:0 "[SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting]を[concept_favorite]に任命する。"
 rasputin.1.b:0 "これは奇跡ではない。単なる幸運だったのだ。"
 modifier_faith_healing:0 "信仰による治療"
 modifier_faith_healing_tt:0 "[GetStaticModifier('modifier_faith_healing').GetName|v]\n[GetStaticModifier('modifier_faith_healing').GetDesc]"
 revoke_current_favorite_effect_tt:0 "[SCOPE.sCharacter('current_favorite_scope').GetFullName]が[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]の[concept_favorite]ではなくなる"
 appoint_rasputin_favorite_effect_tt:0 "[SCOPE.sCharacter('rasputin_scope').GetFullName]が[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]の[concept_favorite]になる"
 alexei_health_deteriorates_tt:0 "\n@warning! [SCOPE.sCharacter('rasputin_scope').GetFullName]が[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]の[concept_favorite]で#b ない#!あいだは、[SCOPE.sCharacter('alexei_scope').GetFullName]が[GetCharacterTrait('hemophilia').GetName]で死亡する可能性が高くなる。"
 alexei_health_improves_tt:0 "\n@information! [SCOPE.sCharacter('rasputin_scope').GetFullName]が[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]の[concept_favorite]であるあいだは、[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]の#tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_faith_healing_tt $modifier_faith_healing$#!による加護で、[SCOPE.sCharacter('alexei_scope').GetFullName]が[GetCharacterTrait('hemophilia').GetName]で死亡する可能性が低くなる。"
 rasputin.2.t:0 "聖なる悪魔"
 rasputin.2.d:0 "[SCOPE.sCharacter('rasputin_scope').GetFullName]が奇妙な言動とっており、さらには[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]に対する影響力が増しているとの報告に、[SCOPE.gsInterestGroup('relevant_ig').GetName]は大いに懸念を抱いた。[SCOPE.sCharacter('relevant_leader_scope').GetFullName]は[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]の即時免職を要求している。"
 rasputin.2.f:0 "長年にわたって[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の子供たちを誠実に世話してきたが、先日解雇された女家庭教師は、例の不躾な祈祷師との衝撃的な遭遇の一部始終をためらうことなく語っている。彼の振る舞いは度を越しており、不適切極まりない。そのような不敬な人物は、皇帝一家の評判だけでなく、[ROOT.GetCountry.GetNameNoFormatting]全体の評判をも損なうことは間違いない。\n\n元家庭教師はあらゆる社交上のつてを頼りに女大公との謁見を取り付け、彼女の姉妹である[ROOT.GetCountry.GetCustom('get_rus_consort_title')]を説得するよう懇願した。「長年お仕えしてまいりましたが、無作法な農民が宮殿内を、あろうことか子供部屋まで自由に歩き回るなど、見たこともございません！」"
 rasputin.2.a:0 "[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]はその座に留まる。"
 rasputin.2.b:0 "[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]を追放する。"
 modifier_rasputin_not_dismissed:0 "聖なる悪魔の留任"
 revoke_rasputin_favorite_effect_tt:0 "[SCOPE.sCharacter('rasputin_scope').GetFullName]が[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]の[concept_favorite]ではなくなる"
 rasputin.3.t:0 "[SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting]の刺傷"
 rasputin.3.d:0 "早朝、[SCOPE.sCharacter('rasputin_scope').GetFullName]の自宅のすぐ外で、[SCOPE.sCharacter('rasputin_scope').GetHerHis]の命を狙う襲撃事件が発生した。[SCOPE.sCharacter('rasputin_scope').GetFullName]は重傷を負い、治療を受ける必要がある。"
 rasputin.3.f:0 "皇帝一家は、休暇の船旅の最中に[SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting]への襲撃事件の連絡を受けた。電報によれば、[SCOPE.sCharacter('rasputin_scope').GetSheHe]は手術を受けたものの危篤状態にあり、生死の境をさまよっているという。祈祷治療師の運命が不確かななか、船上の[ROOT.GetCountry.GetCustom('get_rus_consort_title')]は取り乱した。彼女は、息子の命の恩人が生き延びることを願い、毎日祈りを捧げている。\n\n「私の魂は苦しみに苛まれています」と[ROOT.GetCountry.GetCustom('get_rus_consort_title')]は嘆く。「私の祝福された救い主が、間もなくこの世を去ってしまうのでしょうか？」"
 rasputin.3.a:0 "[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]に最高の治療を受けさせよ。"
 rasputin.3.b:0 "[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]の回復は運に任せよう。"
 rasputin_dies_tt:0 "[SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting]が負傷により死亡する"
 rasputin_lives_tt:0 "#b [SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting]がなんとか一命をとりとめる。#!"
 modifier_survived_assassination:0 "暗殺の試みからの生還"
 modifier_rasputin_legit_instability:0 "聖なる悪魔の生還"
 modifier_tsar_saved_rasputin:0 "不評の寵臣の救済"
 rasputin.4.t:0 "[SCOPE.sCharacter('rasputin_scope').GetFullNameNoFormatting]の暗殺未遂"
 rasputin.4.d2:0 "イリナ公女に会えるという口実で新居披露の宴におびき出された[SCOPE.sCharacter('rasputin_scope').GetFullName]は、ユスポフ宮殿の地下室で凄惨な襲撃を受け、瀕死の状態で発見された。捜査当局は、この暗殺計画の首謀者として、[SCOPE.sCharacter('conspirator_scope').GetFullName]を名指しした。"
 rasputin.4.d:0 "またしても[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]の[concept_favorite]の命が狙われた。[SCOPE.GetRootScope.GetCountry.GetCustom('rasputin_death_perpetrator')]によって[SCOPE.GetRootScope.GetCountry.GetCustom('rasputin_death_reason')]ことにより、[SCOPE.sCharacter('rasputin_scope').GetFullName]は瀕死の状態にある。"
 rasputin.4.f:0 "[SCOPE.sCharacter('alexei_scope').GetFullNameNoFormatting]の命の恩人は、宮廷中で[ROOT.GetCountry.GetNameNoFormatting]の敵として知られるようになった。皇帝一家に対する[SCOPE.sCharacter('rasputin_scope').GetHerHis]の影響力を排除しようとする陰謀がいくつも企てられるなか、[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]は死の淵にありながらも、かろうじて生き永らえている。しかし、この祈祷治療師の命運もこれまでなのか？\n\n[ROOT.GetCountry.GetCapital.GetCityHubName]の至るところで、人々は皇帝一家に寵愛された#italic スターレツ#!の運命を固唾を呑んで見守っている。"
 rasputin.4.a:0 "[SCOPE.sCharacter('alexei_scope').GetFullName]のために、[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]を死なせてはならない。"
 rasputin.4.b:0 "[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]の運命は神の手の中にある。"
 rasputin_ig_instability_tt:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],modifier_rasputin_ig_instability_tt $modifier_rasputin_ig_instability$#!を、[concept_in_government]の[concept_interest_group]のうち、まだこの補正が適用されていないもの#b すべて#!に#v [GetPlayer.MakeScope.ScriptValue('display_normal_modifier_time')]#!年間付与する"
