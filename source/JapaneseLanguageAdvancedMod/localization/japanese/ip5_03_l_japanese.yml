 rasputin.5.t:0 "公爵の懸念"
 rasputin.5.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の姪を妻に持つ有力貴族、[SCOPE.sCharacter('felix_scope').GetFullName]が記した書簡が発見された。その内容は、陰謀への関与を疑わせるものだった。[SCOPE.sCharacter('felix_scope').GetLastNameNoFormatting]は、宮廷における[SCOPE.sCharacter('rasputin_scope').GetLastName]の影響力に公然と激しく反発しており、この#italic 祈祷師#!を宮廷から排除するため、[SCOPE.sCharacter('relevant_character_scope').GetFullName]に協力を求めていた。"
 rasputin.5.f:0 "「この祈祷師の療法に期待を寄せ、心を奪われる者が多いのも無理はない。[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]の催眠術めいた力と、射すくめるような眼差しには、確かに抗いがたい魅力がある」と[SCOPE.sCharacter('felix_scope').GetFullNameNoFormatting]は記している。「しかし、これ以上宮廷に居座りつづけることは容認できない。今では、[ROOT.GetCountry.GetNameNoFormatting]の将来を脅かす存在ではないかと危惧している。[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]を排除しなければならない。[SCOPE.sCharacter('relevant_character_scope').GetLastNameNoFormatting]殿、この計画に力を貸していただけるだろうか？どうか、この件についてよく考えていただきたい」"
 rasputin.5.a:0 "[SCOPE.sCharacter('felix_scope').GetLastNameNoFormatting]家は、今後も変わらず[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]のために忠義を尽くす。"
 rasputin.5.b:0 "公爵は、[SCOPE.sCharacter('rasputin_scope').GetLastNameNoFormatting]について語るなら、言葉を選ぶべきだ。"
 modifier_felix_ig_upset:0 "公爵の懸念を無視"
 favorites.1.t:0 "ロビー活動の旗手"
 favorites.1.d:0 "[ROOT.GetCountry.GetRuler.GetFullNameWithTitle]が指名した$concept_favorite$である[SCOPE.sCharacter('current_favorite_scope').GetFullName]は、[SCOPE.sPoliticalLobby('current_favorite_lobby_scope').GetName]の利益を強く主張してきた。これに対して[SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetFullName]は[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]に直接嘆願し、[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]の強まる影響力を抑え込もうとしている。"
 favorites.1.f:0 "[SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetFullNameNoFormatting]が[ROOT.GetCountry.GetRuler.GetFullNameWithTitleNoFormatting]との非公式な謁見を取り付けるまでには2週間かかった。2人きりになると、[SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetLastNameNoFormatting]はすぐさま[SCOPE.sCharacter('current_favorite_scope').GetFullNameNoFormatting]の最近の政治活動がもたらす危険性を強く非難した。\n\n「[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]の越権行為は非常識です」と、[SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetLastNameNoFormatting]は[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]に語った。「[SCOPE.sCharacter('current_favorite_scope').GetSheHe]が外交に干渉する必要はまったくないはずです」"
 favorites.1.a:0 "[SCOPE.gsInterestGroup('opposition_ig_scope').GetLeader.GetLastNameNoFormatting]は[SCOPE.gsInterestGroup('opposition_ig_scope').GetName]に関する事柄に集中すべきだ。"
 favorites.1.b:0 "[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]の意見は貴重だ。"
 favorites.1.c:0 "[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]は公務から身を引いた方がいいのかもしれない。"
 modifier_favored_interests_ig_approval:0 "特別待遇"
 favorites.2.t:0 "事実か作り話か？"
 favorites.2.d:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]・ガゼット紙が、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の指名した$concept_favorite$である[SCOPE.sCharacter('current_favorite_scope').GetFullName]の関与する不祥事を報じた。記事は大衆の猛反発を巻き起こしたが、[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]は誤解であると主張している。"
 favorites.2.f:0 "#bold [TimeKeeper.GetCurrentDate.GetString]、[ROOT.GetCountry.GetCapital.GetCityHubName]―#! [SCOPE.sCharacter('current_favorite_scope').GetFullNameNoFormatting]の醜聞が大きな騒ぎを引き起こしている。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の腹心である[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]は、[SCOPE.GetRootScope.GetCountry.GetCustom('favorite_scandal_reason')]で告発されているが、本人は批判者に対し「これは私の信用を毀損するための中傷だ。このような告発は、現実を誇張したものに他ならない。重視すべきは事実であり、作り話ではない！」と返している。\n\n本人は不正行為を否定しているものの、複数の証人が名乗り出てその恥ずべき悪行を裏付ける専門的な証言を行っている。[ROOT.GetCountry.GetCapital.GetCityHubName]における[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]の影響力も、風前の灯なのだろうか？\n\n#italic ―[ROOT.GetCountry.GetCapital.GetCityHubName]・ガゼット紙#!"
 favorites.2.a:0 "[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]の悪行を隠蔽しろ。"
 favorites.2.b:0 "[SCOPE.sCharacter('current_favorite_scope').GetLastNameNoFormatting]は追放せねばならない。記事によって評判はもはや修復不能だ。"
