 poland_viceroy_button:0 "副王の任命"
 poland_viceroy_cooldown_tt:0 "副王の任命が、少なくとも#b 5年間#!検討されていない"
 poland_conciliatory_viceroy:0 "融和的な副王"
 poland_autocratic_viceroy:0 "抑圧的な副王"
 pol_viceroy_unlikely:0 "ポーランド副王は政府に対して絶大な権限を持ち、実質的には専制的に統治している。#b 融和的な副王#!であれば寛大な対応を取るよう説得できるかもしれないが、#b 抑圧的な副王#!は逆に強硬策を取り、民族主義的な緊張を煽る可能性が高い。\n\n@red_cross! ロシアが#b 融和的#!な副王を任命する可能性は#b 低い#!"
 pol_viceroy_likely:0 "ポーランド副王は政府に対して絶大な権限を持ち、実質的には専制的に統治している。#b 融和的な副王#!であれば寛大な対応を取るよう説得できるかもしれないが、#b 抑圧的な副王#!は逆に強硬策を取り、民族主義的な緊張を煽る可能性が高い。\n\nロシアが#b 融和的#!な副王を任命する可能性は#b 高い#!"
 pol_viceroy_for_russia:0 "ポーランド副王は政府に対して絶大な権限を持ち、実質的には専制的に統治している。#b 融和的な副王#!であれば寛大な対応を取るよう説得できるかもしれないが、#b 抑圧的な副王#!は逆に強硬策を取り、民族主義的な緊張を煽る可能性が高い。"
 congress_poland.1.t:0 "ポーランド副王"
 congress_poland.1.d:0 "[SCOPE.sCharacter('tsar_scope').GetPrimaryRoleTitle]は[SCOPE.sCountry('congress_poland_scope').GetAdjective]における副王統治を見直すべき理由を見出した。現任の副王である[SCOPE.sCharacter('poland_viceroy_scope').GetFullName]は、[SCOPE.sCharacter('poland_viceroy_scope').GetCustom('ConciliatoryRepressive')]な方針を取ってきた。これを歓迎する者もいる一方で、彼の手法に批判の声も上がっている。"
 congress_poland.1.d2:0 "[SCOPE.sCharacter('tsar_scope').GetPrimaryRoleTitle]は[SCOPE.sCountry('congress_poland_scope').GetName]の新たな副王を任命するよう求められている。最大の検討事項は、この新たな統治者の手法をどのようなものにするかである。人々を厳しく締め上げるべきか、それとも寛容な姿勢をもって扱うべきか。"
 congress_poland.1.f:0 "「統治の経験を積めば積むほど、融和的な政策は誤りだという確信が深まっていく。たしかに、残酷な仕打ちは憎悪の火を煽り、復讐への渇望を掻き立てる。だが、弱腰はそれ以上に苛烈な代償を招くものだ。ごく稀に必要とされる場合には、寛容さを示すべきだろう。だが基本的には、揺るぎない決意と力をもって相手を威圧するのが私のやり方だ」"
 congress_poland.1.a:0 "[SCOPE.sCharacter('poland_viceroy_scope').GetPrimaryRoleTitle]の[SCOPE.sCharacter('poland_viceroy_scope').GetLastName]は、すでに悪くない仕事をしている。"
 congress_poland.1.b:0 "新たな副王は、鞭を惜しまぬ者でなければならない。"
 congress_poland.1.b2:0 "ポーランドの統治には、穏やかな手法で臨むべきだ。"
 poland_already_conciliatory:0 "副王は融和的ではない"
 poland_conciliatory_loc:0 "#b 融和的#!"
 poland_repressive_loc:0 "#b 抑圧的#!"
 notification_poland_repressive_viceroy_notification_name:0 "[SCOPE.sCountry('russia_poland_scope').GetName]が抑圧的な副王を任命"
 notification_poland_repressive_viceroy_notification_desc:0 "[SCOPE.sCountry('russia_poland_scope').GetAdjective]の暴政が、再び[SCOPE.sCountry('congress_poland_scope').GetName]を締めつけます。"
 notification_poland_repressive_viceroy_notification_tooltip:0 "#header $notification_poland_repressive_viceroy_notification_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_repressive_viceroy_notification_desc$"
 notification_poland_conciliatory_viceroy_notification_name:0 "[SCOPE.sCountry('russia_poland_scope').GetName]が融和的な副王を任命"
 notification_poland_conciliatory_viceroy_notification_desc:0 "[SCOPE.sCountry('congress_poland_scope').GetName]には、まだ希望が残されています。"
 notification_poland_conciliatory_viceroy_notification_tooltip:0 "#header $notification_poland_conciliatory_viceroy_notification_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_conciliatory_viceroy_notification_desc$"
 expand_poland_button:0 "ポーランド立憲王国の拡大"
 expand_poland_button_desc:0 "何らかの形でポーランドのさらなる地域がロシアの手に落ちたなら、それらの土地をポーランド立憲王国の行政下に統合することは、双方の利益になるかもしれない。"
 congress_poland.2.t:0 "[SCOPE.sCountry('congress_poland_scope').GetNameNoFormatting]の拡大"
 congress_poland.2.d:0 "[SCOPE.sCharacter('tsar_scope').GetPrimaryRoleTitle]は、[SCOPE.sCountry('congress_poland_scope').GetName]の拡大を求める嘆願を受け取った。同地では、[SCOPE.sCountry('russia_poland_scope').GetName]が寛大にも、ごく限られた自治らしきものを認めている。"
 congress_poland.2.f:0 "「我らの国境は今も西へと広がり続けている。もちろん人前で、その栄光を否定するつもりはない。だが実際のところ、我々は手に負えないポーランド人の大集団を抱え込むことになったのだ。彼らに我々の行政を蝕ませるくらいなら、副王の支配のもとで押さえつけておくほうがよかろう」"
 congress_poland.2.a:0 "自分たちの国があると思わせておけば、[GetCulture('polish').GetName]人もいくらか扱いやすくなるだろう。"
 congress_poland.2.b:0 "[SCOPE.sCountry('russia_poland_scope').GetAdjective]の国境が損なわれるような妥協はしない。"
 poland_territory_cooldown_tt:0 "[SCOPE.sCountry('russia_poland_scope').GetName]は、少なくとも#b 5年間#!、[SCOPE.sCountry('congress_poland_scope').GetName]の拡大を検討していない"
 russia_decides_expand_poland:0 "[SCOPE.sCountry('russia_poland_scope').GetName]が[SCOPE.sCountry('congress_poland_scope').GetName]に領土を割譲するかどうかを決定する"
 notification_poland_expansion_accepted_name:0 "[SCOPE.sCountry('russia_poland_scope').GetName]が[SCOPE.sCountry('congress_poland_scope').GetName]の領土拡大に同意"
 notification_poland_expansion_accepted_desc:0 "[GetCulture('polish').GetName]人の再統一に向けた一歩です！"
 notification_poland_expansion_accepted_tooltip:0 "#header $notification_poland_expansion_accepted_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_expansion_accepted_desc$"
 notification_poland_expansion_refused_name:0 "我々はいつになれば抑圧者から解放されるのか？"
 notification_poland_expansion_refused_desc:0 "[SCOPE.sCountry('russia_poland_scope').GetName]が[SCOPE.sCountry('congress_poland_scope').GetAdjective]の拡大を拒否します"
 notification_poland_expansion_refused_tooltip:0 "#header $notification_poland_expansion_refused_name$#!\n$TOOLTIP_DELIMITER$\n$notification_poland_expansion_refused_desc$"
 poland_army_tt:0 "[SCOPE.sCountry('congress_poland_scope').GetName]は、少なくとも1つの[concept_army]を保有している"
 congress_poland.3.t:0 "ポーランド憲法の復活"
 congress_poland.3.d:0 "[SCOPE.sCountry('congress_poland_scope').GetName]の#b 白党#!は[SCOPE.sCountry('congress_poland_scope').GetAdjectiveNoFormatting]憲法を復活させることに成功した。[SCOPE.sCountry('russia_poland_scope').GetName]も、少なくとも当面は[glossary_sejm]の決定を尊重し、ポーランドの自治をおおむね認める構えである。"
 congress_poland.3.f:0 "「ポーランド軍団は復活した。だが、その行進の太鼓を打ち鳴らしているのは、他ならぬロシアだ。隠れてセイムを開く必要はなくなったが、その行動はすべてツァーリに睨まれている。自治を勝ち取ったことで、我々は独立を手放してしまったのではないかと…そう考えずにはいられない。今はただ、我々が勝ち得た――そして同時に失った、ポーランドという国のために祈ろう」"
 congress_poland.3.a:0 "友好的な決着だ。"
 dp_polish_uprising:0 "ポーランド蜂起"
 polish_uprising:0 "ポーランド蜂起"
 congress_poland.4.t:0 "ポーランド蜂起"
 congress_poland.4.d:0 "[SCOPE.sCountry('congress_poland_scope').GetName]の#b 赤党#!は、集めうるかぎりの支持を結集し、[SCOPE.sCountry('congress_poland_scope').GetAdjective]の自由の名のもとに武器を取った。彼らは、それで勝利を掴めることを祈っている。"
 congress_poland.4.f:0 "神を讃えよ。今や我らの息子たちが旅立つのは、\n新しい服や小冊子を買うためではない。\nパリのカフェに腰を下ろし、\nフランス流の借金の重ね方を学ぶためでもない。\n今の我らには、親愛なるナポレオンがいる。\n流行談義に費やす暇など持たぬ男、\n上着よりも武器を重んじる男、\nそして何よりポーランドが、\nかつての姿――共和国となることを望む男が！\n\n―アダム・ミツキェヴィチ、『#italic パン・タデウシュ#!』"
 congress_poland.4.a:0 "こんな少数で、あれほどの多勢に勝てるのか？"
 congress_poland_restrictions:0 "基本法 : 軍制"
 congress_poland_laws:0 "基本法 : 法制"
 congress_poland.5.t:0 "基本法"
 congress_poland.5.d:0 "[glossary_november_uprising]を受け、[SCOPE.sCountry('russia_poland_scope').GetName]は[SCOPE.sCountry('congress_poland_scope').GetAdjectiveNoFormatting]の自治を大幅に制限した。[SCOPE.sCountry('congress_poland_scope').GetName]は軍の編成、大学の開校、独自の立法を禁じられ、国政のすべてがロシア人副王の監督下に置かれることとなった。"
 congress_poland.5.f:0 "ときおり、我らの地リトアニアにも\nこんな話が伝わってくる。\n片脚や片腕を失った老乞食が\nパンを求めて残された手を差し出す。\n施しを受けると、彼は用心深く屋敷の方を見やる。\nロシア兵も、ヤルムルケも、赤い襟も見えぬとなれば\n恥じることなく打ち明けるのだ。\nかつて自分は、ポーランド軍団を率いていたのだと。\n\n―アダム・ミツキェヴィチ、『#italic パン・タデウシュ#!』"
 congress_poland.5.a:0 "いま彼は、老い疲れた身で帰る…"
 congress_poland.5.a.tt:0 "…もはや守ること叶わぬ祖国へ"
 poland_has_conciliatory_viceroy:0 "ポーランドには#b 融和的#!な副王がいる"
 poland_has_repressive_viceroy:0 "ポーランドには#b 抑圧的#!な副王がいる"
 poland_army_button:0 "ポーランド軍の再建"
 poland_army_button_desc:0 "ポーランド軍は11月蜂起の後、強制的に解体された。適切な監督のもとであれば、今なら再編も可能かもしれない。"
