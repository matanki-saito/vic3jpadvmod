 poland_sejm_button:0 "セイムの復活"
 poland_sejm_button_desc:0 "ロシア人副王の支配下でセイムは秘密裏に開かれてはいるが、その実効性は失われている。ポーランドが自治を取り戻すには、セイムに再び統治権を与えなければならない。"
