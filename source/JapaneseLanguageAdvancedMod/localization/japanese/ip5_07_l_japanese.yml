 rus_prov_gov.1.t:0 "もはや臨時にあらず"
 rus_prov_gov.1.d:0 "あらゆる予想に反して、[SCOPE.sCountry('russia_scope').GetName]に安定した政府が誕生した。今後も決して平穏な道のりとはならないだろうが、少なくとも壊滅的な[concept_civil_war]は回避された。"
 rus_prov_gov.1.f:0 "無血のクーデターではなかったし、完全に平和な権力移行でもなかった。だが、血の海にはならなかった。数えきれないほどのロシアの母親たちが、息子を葬らずに済み、いつもと変わらぬ一日を送っている。"
 rus_prov_gov.1.a:0 "比較的流血が少なく済んだのは幸いだった。"
 rus_prov_gov.2.t:0 "臨時政府"
 rus_prov_gov.2.d:0 "革命だ！旧体制は崩壊し、[SCOPE.sCharacter('russia_ruler_scope').GetFullName]率いる新たな[SCOPE.sCountry('russia_scope').GetAdjective]の[SCOPE.sLaw('principles_law').GetName]が[SCOPE.sState('russia_capital').GetCityHubName]で権力を掌握した。[SCOPE.sLaw('power_law').GetName]という新たな体制の導入が進む一方で、反動派も急進派も[concept_civil_war]に備えて武装を始めている。"
 rus_prov_gov.2.f:0 "「世界はロシア革命が終わったと思っている。だが、思い違いをしてはならない。ロシア革命は、まだ始まったばかりなのだ」\n\n―アレクサンドル・ケレンスキー"
 rus_prov_gov.2.a:0 "どうすればいいだろう？"
 rus_prov_gov_no_civil_wars:0 "進行中の[concept_civil_war]はない"
 rus_prov_gov.3.t:0 "非ロシア系民族の自治"
 rus_prov_gov.3.d:0 "燃えあがる民族的[concept_fervor]に突き動かされ、名目上は[SCOPE.sCountry('russia_scope').GetAdjective]臣民である無数の人々が、革命の混乱に乗じて自治政府の樹立を宣言した。なかでも懸念すべきは、新たに樹立が宣言された[SCOPE.sCountry('rus_autonomy_nation').GetName]の[SCOPE.sCountry('rus_autonomy_nation').GetGovernment.GetName]だろう。"
 rus_prov_gov.3.f:0 "「ロシア人は、革命家も含め、誰もが多かれ少なかれ隠れた帝国主義者である。常に絶対的なものを渇望する、こうした彼らの精神に共通するのは、鮮烈なまでの中央集権主義だ。ロシア人は多様性を嫌い、不協和を調和させることができない。そうしたものは、彼らの意志と想像力を鈍らせるのだ」\n\n―ユゼフ・ピウスツキ"
 rus_prov_gov.3.a:0 "彼らはこれを後悔することになる。"
 je_russia_civil_war:0 "ロシア内戦"
 je_russia_civil_war_reason:0 "ロシアには、銃を手にした者の数だけ派閥があると言っても過言ではない。国全体が凄惨な内戦に呑み込まれ、すべてのロシア人が再びひとつの政府のもとに統一されるまで、この暴力が終わることはない。\n$TOOLTIP_DELIMITER$\n@information! [GetCulture('russian').GetName]文化を[Concept('concept_primary_cultures','$concept_primary_culture|q$')]とする国家間の[Concept('concept_truce','$concept_truces|q$')]は、すぐに破棄される。"
 je_rus_civil_war_header:0 "ロシア内戦を終結させるには : \n"
 je_rus_civil_war_conclusion_desc:0 "この$concept_journal_entry$は#b ロシア内戦#!の終結で幕を閉じた"
