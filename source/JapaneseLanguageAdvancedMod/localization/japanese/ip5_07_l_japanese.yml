 bolsheviks.2.t:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs')]のクーデター"
 bolsheviks.2.t_1:0 "冬宮殿襲撃"
 bolsheviks:0 "ボリシェヴィキ"
 left_srs:0 "社会革命党"
 bolsheviks_plural:0 "ボリシェヴィキ"
 left_srs_plural:0 "左翼社会革命党"
 proletariat_loc:0 "プロレタリアート"
 peasants_loc:0 "農民層"
 bolsheviks.2.d:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')]は[SCOPE.sCharacter('rev_leader').GetFullName]の指導のもと、[SCOPE.GetRootScope.GetCountry.GetCustom('peasants_proletariat')]を動員して[ROOT.GetCountry.GetCapital.GetCityHubName]の宮殿を襲撃した。新政権は、[SCOPE.sCountry('russia_scope').GetName]が今後、[GetLawType('law_council_republic').GetName]へ移行すると宣言した。"
 bolsheviks.2.f:0 "「我々には、組織された大衆の力がある。その力はあらゆる障害を打ち破り、プロレタリアートを世界革命へと導くだろう。今こそロシアで、プロレタリアートによる社会主義国家の建設に乗り出さなければならない。世界社会主義革命万歳！」\n\n ― ウラジーミル・レーニン"
 bolsheviks.2.a:0 "革命に栄光あれ！"
 bolsheviks.3.t:0 "社会主義の勝利"
 bolsheviks.3.d:0 "[SCOPE.sCharacter('socialist_faction_leader').GetFullName]率いる[SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')]は、ついに自らの社会主義共和国の基盤を築き上げた。権力を確固として掌握した今、[SCOPE.sCountry('russia_scope').GetName]の未来は大胆な新路線へと歩み出そうとしている。"
 bolsheviks.3.f:0 "「我が党には…輝かしい未来が開けている。我が党は、社会主義とインターナショナルへの希望に満ちた、揺るぎない信念を抱く党である。あなたがたにも、一時の反動にも、この党を滅ぼすことはできない。党とその思想は大衆の中に息づき、人々の心の奥深くに根を下ろしているからだ。そして、我が党の理念である『人間の人格の解放』を旗印に、全人類は必ず革命的な再生を遂げるだろう」\n\n ― マリア・スピリドーノワ"
 bolsheviks.3.a:0 "社会主義万歳！"
 bol_labor_add:0 "#b ボリシェヴィキ#!が[SCOPE.sPoliticalMovement('labor_movement_scope').GetName]から得る支持が増加する"
 men_labor_add:0 "#b メンシェヴィキ#!が[SCOPE.sPoliticalMovement('labor_movement_scope').GetName]から得る支持が増加する"
 bol_labor_subtract:0 "#b ボリシェヴィキ#!が[SCOPE.sPoliticalMovement('labor_movement_scope').GetName]から得る支持が減少する"
 men_labor_subtract:0 "#b メンシェヴィキ#!が[SCOPE.sPoliticalMovement('labor_movement_scope').GetName]から得る支持が減少する"
 bolsheviks.4.t:0 "大衆と前衛"
 bolsheviks.4.d:0 "[SCOPE.sPoliticalMovement('labor_movement_scope').GetName]の大集会で、[SCOPE.sCharacter('bolshevik_leader').GetFullName]と[SCOPE.sCharacter('menshevik_leader').GetFullName]が、革命運動の組織化におけるプロレタリアートの役割をめぐって激論を交わしている。両者はそれぞれ、自派である#b ボリシェヴィキ#!と#b メンシェヴィキ#!への支持を広げようとしている。"
 bolsheviks.4.f:0 "「あの指導者たちの背後には、大勢の闘士がいる。ビラを配り、資金を集め、街頭でデモを行い、投獄され、流刑に処される革命的な労働者たちだ。だが彼らは、どの委員会にも、ほかのいかなる組織にも属してはいない。この闘士たち、我らの兵士たちが党員ではないというのか？彼らを党から締め出すべきだというのか？そうなれば、党には誰が残るのだ？軍隊なき将軍だけではないか」\n\n ― ロシア社会民主労働党 第2回大会 第23回会議"
 bolsheviks.4.a:0 "[SCOPE.sCharacter('bolshevik_leader').GetFullName]率いる#b ボリシェヴィキ#!が、人民の前衛を導くだろう。"
 bolsheviks.4.b:0 "#b メンシェヴィキ#!の説く自制こそが、最も広く支持を集めるだろう。"
 bolsheviks.4.c:0 "どれもこれも、口先だけの空論だ。"
 bolshevik_labor_activism:0 "ボリシェヴィキの労働運動"
 menshevik_labor_support:0 "メンシェヴィキへの労働者支持"
 social_faction_labor_failure:0 "幻滅した労働者たち"
 most_popular_leftist_modifier:0 "有力な左派"
 popular_leftist_movement_support:0 "左派の勢い"
 bolsheviks.5.t:0 "分裂分子め！"
 bolsheviks.5.d:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')]の大規模な会議は混乱に陥った。分裂をちらつかせる脅しや自由主義的だという非難が飛び交うなか、[SCOPE.sCharacter('most_popular_leftist').GetFullName]が声を張り上げ、群衆に語りかける…"
 bolsheviks.5.f:0 "「このまま自ら始めた道を突き進み、独立した政党として袂を分かつなら、諸君は今まさに蒔いている種を、たちまち自ら刈り取ることになる。党はいくつもの分派に分裂し、各派は党の規律を保てず、ゲリラのように勝手に行動するようになる。そうなれば、諸君の党は四分五裂し、ついには完全に崩壊するだろう」\n\n ― ヴィクトル・チェルノフ"
 bolsheviks.5.a:0 "この演説は、幾世代もの[SCOPE.GetRootScope.GetCountry.GetCustom('bolsheviks_srs_plural')]を鼓舞するだろう。"
 bolsheviks.5.b:0 "あんな恥ずべき弁舌を振るった以上、[SCOPE.sCharacter('most_popular_leftist').GetLastName]の評判はもう二度と回復しないだろう。"
 mensheviks_plural:0 "メンシェヴィキ"
