 rcw_map_separatist:0 "[SCOPE.sCountry('rcw_map_owner').GetName]は独立を目指す#b 分離主義#!国家である#!"
 rcw.4.t1:0 "[SCOPE.sState('rcw_terror_state').GetName]の赤色テロ"
 rcw.4.t2:0 "[SCOPE.sState('rcw_terror_state').GetName]の白色テロ"
 rcw.4.t3:0 "[SCOPE.sState('rcw_terror_state').GetName]の大規模テロ"
 rcw.4.d:0 "[SCOPE.sCharacter('rcw_terror_general').GetFullName]率いる[SCOPE.GetRootScope.GetCountry.GetCustom('my_rcw_side_loc')]の部隊が、[SCOPE.sState('rcw_terror_state').GetName]で住民の中から[SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')]側の分子を一人残らず探し出し、処刑する作戦を開始した。"
 rcw.4.f:0 "「どちらを選ぶべきか？カデット、無党派者、メンシェヴィキ、社会革命党員の中から、ソビエト権力に敵対する数百人の反逆者たちを探し出し、投獄し、ときには銃殺することか？武器を手に立ち上がる者もいれば、陰謀を企てる者もいる。メンシェヴィキの印刷工や鉄道員のように、動員に反対するよう人々を扇動する者もいる。つまり、いずれもデニーキンに味方する者たちだ。それとも、コルチャークやデニーキンが何万人もの労働者や農民を虐殺し、銃殺し、鞭で打ち殺すような事態を許すのか？答えは明白だ」\n\n―ウラジーミル・レーニン、『#italic 後方における反革命との闘争#!』"
 rcw.4.a:0 "[SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')]の犬どもを1匹たりとも生かしておくな！"
 rcw.4.b:0 "やつらの大半が本当に[SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')]の同調者なのか、確かめておけ。"
 rcw_whites_custom:0 "白軍"
 rcw_reds_custom:0 "赤軍"
 rcw_generic_custom:0 "ロシア"
 rcw_generic_2_custom:0 "敵"
 rcw_terror:0 "テロ"
 rcw.5.t:0 "ロシアの金準備"
 rcw.5.d:0 "[SCOPE.sCharacter('kazan_ruler').GetFullName]は[SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')]の部隊に対し、ロシアの金保有高の大半を、[SCOPE.sCountry('kazan_owner').GetAdjective]政府の所在地である[SCOPE.sState('kazan_owner_capital').GetCityHubName]へ移送するよう命じた。現在、装甲列車の隊列が[SCOPE.sState('kazan_state').GetName]から金を運び出しつつある。"
 rcw.5.f:0 "衛兵詰所が置かれた車両で、我々はいかにも当世を映したような光景を目の当たりにした。二十数名の若い衛兵たちが新たにやってきたのだが、彼らは自分たちが何を守るよう命じられたのかも知らず、関心のかけらもない様子だった。一か所に寄り集まり、笑ったり悪態をついたりしながら、あちこちを見回すばかり。ソビエト第1衛兵隊を率いる同志シェレピンは、彼らの指揮官に会おうとしたが、それらしき人物は見当たらない。ようやくどこからともなく現れた指揮官は、武器も帯革も身につけず、軍用外套を羽織り、フェルト靴を履いただけの出で立ちだった。\n\n ― チェコ第10連隊指揮官、チラ"
 rcw.5.a:0 "その金が必要だ！"
 russian_gold_reserves_lost:0 "失われたロシアの金準備"
 capture_gold_reserves_capital_tt:0 "[SCOPE.sState('kazan_owner_capital').GetName]を奪還すれば、金準備の一部を取り戻せる。"
 rcw.6.t:0 "金準備の奪還"
 rcw.6.d:0 "ついに[SCOPE.sState('russian_gold_state').GetCityHubName]の金庫から金準備が回収された。しかし、大部分は失われているようだ。おそらく、[SCOPE.GetRootScope.GetCountry.GetCustom('enemy_rcw_side_loc')]の戦費を賄うため売却されたのだろう。"
 rcw.6.f:0 "金準備輸送列車の移動要領は次のとおりである。当該列車が先行し、最大150名からなる警備中隊がこれに随伴する。移動中は、各車両の屋根、後部の制動席、および機関車に歩哨を配置する。停車中は、各車両のそばに歩哨を立てる。先頭には機関銃とその銃手を配し、列車の周囲には哨戒を巡らせる。\n\n ― チェーカー職員、アレクサンドル・コスーヒン"
 rcw.6.a:0 "少なくとも、金の一部は取り戻せた。"
 rcw.7.t:0 "ツァーリの運命"
 rcw.7.d:0 "元ツァーリの[SCOPE.sCharacter('void_tsar_scope').GetFullName]を、[SCOPE.sState('tsar_temp_state').GetFarmHubName]にある仮住まいで、存命の家族もろとも銃殺せよとの命令が下された。"
 rcw.7.d2:0 "ツァーリの[SCOPE.sCharacter('void_tsar_scope').GetFullName]が廃位されてからしばらく経った。この問題をこれ以上先送りにすることはできない。[SCOPE.sCharacter('void_tsar_scope').GetHerHis]の命運を決めなければ。"
 rcw.7.f:0 "「それで、家族は？」\n「家族も一緒だ」\n「全員か？」\n「全員だ」\n\n ― レフ・トロツキー、『#italic 亡命日記#!』"
 rcw.7.f2:0 "少し体を動かしたくなり、私たちは池の水門をふさいでいた氷を取り除いて気晴らしをしていた。ほどなく兵士や市民が大勢集まり、庭園の柵沿いに並んで私たちの作業を眺めはじめた。しばらくすると、衛兵の将校がツァーリのもとへやって来た。将校は、ツァールスコエ＝セロー駐屯地の司令官から、敵対的な示威行動や皇族の命を狙う企てが起こるおそれがあると警告を受けたことを伝え、その場を離れるよう求めた。だがツァーリは、何も恐れてはいないし、あの善良な人々もなんら迷惑をかけてはいないと答えた。\n\n ― ピエール・ジリヤール、『#italic ロシア宮廷の十三年#!』"
 rcw.7.a:0 "[SCOPE.sCharacter('void_tsar_scope').GetFullName]の裁判と処刑は、大衆の格好の見世物となるだろう。"
 rcw.7.b:0 "元ツァーリには、[SCOPE.sState('tsar_temp_state').GetFarmHubName]で自宅軟禁の身のまま、余生を送らせてもいいだろう。"
 rcw.7.c:0 "血に飢えた者どもめ…"
 fate_of_the_tsar:0 "ツァーリの運命"
 je_bolsheviks:0 "何をなすべきか"
 je_bolsheviks_reason:0 "[SCOPE.sCountry('russia_scope').GetName]では、3つの社会主義派閥が権力を争っている : \n\n#b ボリシェヴィキ#!は、$marxism$を[GetIdeology('ideology_vanguardist').GetName]の立場から解釈し、#v $movement_communist$#!、#v $movement_labor$#!、[SCOPE.gsInterestGroup('unions_scope').GetName]から支持を集めている。十分な支持を得たうえで、[concept_legitimacy]が50以下になるか、臨時政府が権力を握ると、クーデターによって政権を掌握する。\n\n#b メンシェヴィキ#!は、[GetIdeology('ideology_state_socialist').GetName]を掲げ、#v $movement_socialist$#!、#v $movement_labor$#!、[SCOPE.gsInterestGroup('nerds_scope').GetName]から支持を集めている。社会主義への漸進的な移行を目指しており、非常手段による権力奪取は行わない。\n\n#b 左翼社会革命党#!は、農民を重視する社会主義者からなる[GetIdeology('ideology_anarchist').GetName]派閥である。#v $movement_land_reform$#!、#v $movement_anarchist$#!、[SCOPE.gsInterestGroup('peasants_scope').GetName]から支持を集めている。十分な支持を得たうえで、$concept_legitimacy$が50以下になるか、臨時政府が権力を握ると、クーデターによって政権を掌握する。\n\n各派閥の支持率は、こうした支持基盤と指導者の[concept_popularity]と[concept_prominence]によって決まる目標値に向かって、徐々に変化する。"
