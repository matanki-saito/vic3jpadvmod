 bolsheviks.1.t:0 "何をなすべきか"
 bolsheviks.1.desc:0 "[SCOPE.sCountry('russia_scope').GetAdjective]の左派は、未来への展望が大きく異なる3つの派閥に分裂している。#b ボリシェヴィキ#!は[SCOPE.sPoliticalMovement('bolshevik_movement').GetName]を、#b メンシェヴィキ#!は[SCOPE.sPoliticalMovement('menshevik_movement').GetName]を、左翼社会革命党は[SCOPE.sPoliticalMovement('left_sr_movement').GetName]をそれぞれ主導している。"
 bolsheviks.1.f:0 "「我々の運動に積極的に携わる活動家が受け入れうる唯一の確かな組織原則は、徹底した秘密保持、構成員の厳格な選抜、そして職業革命家の育成である」\n\n―ウラジーミル・レーニン、『#italic 何をなすべきか#!』"
 bolsheviks.1.a:0 "#b ボリシェヴィキ#!を支持する"
 bolsheviks.1.b:0 "#b メンシェヴィキ#!を支持する"
 bolsheviks.1.c:0 "#b 左翼社会革命党#!を支持する"
 bolsheviks.1.d:0 "反逆だ！反乱だ！"
 bolsheviks_start_at_tt:0 "#b ボリシェヴィキ#!の支持率は#v [Divide_CFixedPoint(GetPlayer.MakeScope.Var('bolshevik_current_var').GetValue,'(CFixedPoint)2')|1]%#!から始まる"
