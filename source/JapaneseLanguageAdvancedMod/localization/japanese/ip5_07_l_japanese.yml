l_japanese:
 je_congress_poland:0 "白党と赤党"
 je_congress_poland_reason:0 "[Glossary('glossary_third_partition','$glossary_third_partition_short|q$')]により、[SCOPE.sCountry('russia_poland_scope').GetName]は旧ポーランド・リトアニア共和国の領土の大部分を支配下に収めた。当初、ツァーリは[SCOPE.sCountry('congress_poland_scope').GetName]を[concept_personal_union]のもとで統治し、憲法と[Glossary('glossary_sejm','$glossary_sejm_short|q$')]もおおむね尊重していた。\n\nしかし、[Glossary('glossary_november_uprising','$glossary_november_uprising_short|q$')]のあと、ロシア当局は反対派を厳しく弾圧し、ポーランド王国組織法を制定した。これによりポーランドの自治権は大幅に削られ、ツァーリが自ら任命した総督の統治下に置かれた。それでも独立を求める声は消えていない。だが、独立の試みが失敗に終われば、その後何十年にわたって専制支配を強いられかねない。\n$TOOLTIP_DELIMITER$\n@information! #b 白党#!は、[SCOPE.gsInterestGroup('poland_landowners').GetName]と[SCOPE.gsInterestGroup('poland_industrialists').GetName]を中心とする勢力で、改革を通じて自治権の拡大と[glossary_sejm]の復活を目指している。\n\n#b 赤党#!は主に[SCOPE.gsInterestGroup('poland_intelligentsia').GetName]と[SCOPE.gsInterestGroup('poland_rural_folk').GetName]で構成され、[SCOPE.sCountry('russia_poland_scope').GetName]に対する武装蜂起を支持している。彼らは無謀で、十分な準備も整わないまま蜂起に踏み切るおそれがある。"
