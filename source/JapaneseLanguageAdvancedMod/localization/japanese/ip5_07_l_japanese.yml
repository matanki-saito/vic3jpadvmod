 je_rus_civil_war_partitioned_effect_header:0 "#b ロシア#!の勢力が1つも残っていない場合 : \n$EFFECT$"
 je_rus_civil_war_partitioned_conclusion_desc:0 "この$concept_journal_entry$はロシアの分割という形で幕を閉じ、#b ロシア#!の勢力は1つも残らなかった。"
 je_rus_civil_war_frozen_conclusion_desc:0 "この$concept_journal_entry$は勝者が決まらぬまま幕を閉じた。生き残った#b ロシア#!の各勢力は、緊張を残しながらも、ひとまず和平に至った。"
