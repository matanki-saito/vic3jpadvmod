 je_russia_provisional_government_reason:0 "旧体制の崩壊を受け、[ROOT.GetCountry.GetCapital.GetCityHubName]で#b 臨時政府#!の樹立が宣言された。[SCOPE.GetRootScope.GetCountry.GetCustom('provisional_government_identity_plural')]が主導するこの政府は、自らの正統性を確立するとともに、旧体制および対立する[SCOPE.GetRootScope.GetCountry.GetCustom('provisional_government_opponent_identity_singular')]勢力の双方を退け、自らの描く#v $RUS$#!の未来を実現しようとしている。\n\n@information! [SCOPE.sCountry('russia_scope').GetAdjective]臨時政府は、かろうじて結束を保っている。[SCOPE.sCountry('russia_scope').GetRuler.GetPrimaryRoleTitle]が早急に自身の新政府の正統性を確立しなければ、[SCOPE.sCountry('russia_scope').GetName]は恐るべき[concept_revolution]の渦に呑み込まれるだろう。"
