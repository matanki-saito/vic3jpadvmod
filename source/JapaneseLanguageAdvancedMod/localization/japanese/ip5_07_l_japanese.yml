 annex_a_russian_warlord:0 "自国よりGDPが低く、隣接する友好的な#b ロシア#!軍閥国家が併合される"
 rcw_warlords_button_ideologically_aligned:0 "[ROOT.GetCountry.GetNameNoFormatting]とイデオロギー的に同調している"
 rcw_warlords_button_target_tt:0 "我が国より規模が小さく、イデオロギー的に同調し、平和状態にあるロシアの勢力が隣接している"
 rcw.3.t:0 "ロシア内戦の終結"
 rcw.3.d:0 "我々は国家の敵によるあらゆる武装抵抗を粉砕し、同盟者たちを再び我らのもとへ迎え入れた。ついに、ロシア内戦は終結したのだ。 "
 rcw.3.f:0 "内戦は、あらゆる戦争のなかで最も苛烈なものである。それは第三者への暴力なしにはありえず、しかも現代の技術のもとでは、老いた男を、老いた女を、そして子供を殺すことなしには成り立たないのだ。\n\n―レフ・トロツキー、『#italic 彼らの道徳と我らの道徳#!』"
 rcw.3.a:0 "これからは安定と平和の時代だ。"
 rcw.3.b:0 "さて、あの分離主義者どもをどうするか…"
 rcw.3.c:0 "新生ロシアは、かつてないほど偉大な国となる。"
