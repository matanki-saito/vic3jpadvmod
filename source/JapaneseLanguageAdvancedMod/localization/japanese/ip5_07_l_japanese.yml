 rcw_no_russian_faction_left_tt:0 "独立したロシアの勢力が1つも残っていない"
 rcw_victor_tt:0 "最後まで残った#b ロシア#!の勢力が内戦に勝利する"
 rcw_separatist_survived_tt:0 "分離主義国家が内戦後も存続している"
 rus_cw_pale_horse:0 "私は蒼ざめた馬を見た――それに乗る者の名は「死」といい、地獄がその後に従っていた。\n\n"
 rus_cw_phase_1_status:0 "内戦はいまだ激しく続いている"
 rus_cw_phase_2_status:0 "残る軍閥はいまだ主権を主張している"
 rcw.1.t:0 "ロシア内戦"
 rcw.1.d:0 "臨時政府は崩壊した。[SCOPE.sCountry('rcw_opposition_country').GetName]の緩やかな指揮のもと、[SCOPE.sCountry('scariest_russian_warlord_country').GetName]の[SCOPE.sCharacter('scariest_russian_warlord').GetFullName]をはじめとする不満を抱いた諸軍閥の指揮下に、無数の軍勢が結集した。だが、すべてが失われたわけではない。我らの同盟者もまた我らの大義のもとに馳せ参じており、なかでも[SCOPE.sCharacter('friendliest_russian_warlord').GetFullName]率いる[SCOPE.sCountry('friendliest_russian_warlord_country').GetName]政府は、最も有力な支持者のひとつである。"
 rcw.1.f:0 "「私が地上に平和をもたらすために来たと思ってはならない。私がもたらしに来たのは、平和ではなく剣である。私は息子を父と、娘を母と、嫁を姑と争わせるために来たのだ。人の敵となるのは、ほかならぬその家の者たちである」\n\n―『マタイによる福音書』第10章、欽定訳聖書#!"
 rcw.1.a:0 "戦争だ！"
 rcw_warlords_button:0 "忠実な派閥を再編入"
 rcw_warlords_button_desc:0 "多くのロシア人同志が、戦争の混乱のなかでやむなく地方政府を樹立した。機会が訪れ次第、彼らを再編入しなければならない。"
