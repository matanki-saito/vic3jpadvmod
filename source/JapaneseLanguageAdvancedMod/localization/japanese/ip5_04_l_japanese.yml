 je_five_year_plan:0 "五カ年計画"
 je_five_year_plan_reason:0 "「#italic 我々は先進諸国に五十年、あるいは百年遅れている。この差を十年で埋めなければならない。やり遂げるか、さもなくば滅びるかだ#!」\n\n―ヨシフ・スターリン\n\n[ROOT.GetCountry.GetAdjective]経済の後進性は、[ROOT.GetCountry.GetNameNoFormatting]が資本主義列強との競争に敗れ、押し潰されるのではないかという恐れを生んでいる。競争相手に追いつき、いずれ追い越すため、[SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]は国家の強制的な産業化計画を打ち出した。その当面の目標は、残存する農民層をプロレタリアへと変え、未来の社会主義社会に向けた物質的基盤を築くことである。\n\n@information! #v $je_five_year_plan$#!の立案が完了したのち、計画を成功裏に完遂するには、選択された要件の#b すべて#!を期限内に満たさねばならない。"
 je_five_year_plan_drafting_status:0 "#v $je_five_year_plan$#!を立案中 (残り[ROOT.GetCountry.MakeScope.Var('five_year_plan_drafting_var').GetValue|v0]か月) "
