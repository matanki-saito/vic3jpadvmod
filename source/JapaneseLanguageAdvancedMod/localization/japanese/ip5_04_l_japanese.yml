 ideological_unification.1.t:0 "一つの革命"
 ideological_unification.1.d:0 "革命は、我が国のみならず、より大きな隣国たる[SCOPE.sCountry('mother_country_scope').GetName]においても勝利を収めた。旧体制が一掃された今、我々の共和国を隔てる国境を取り払う好機が訪れている。"
 ideological_unification.1.f:0 "革命によって国境検問所から兵士たちは追い払われ、行動力のある労働者の一団が、周囲を巡る柵の撤去に取りかかっていた。かつての国境沿いのそこかしこで、同じ光景が――都市の住民たちがかつての境界線を越えて友と旧交を温め、農民たちがかつての関所を越えて荷を運んでいく――そんな光景が繰り返されていた。かつての国境警備隊の名残といえば、潜り込む反革命分子に目を光らせる民兵の一団が散在している程度だった。旧来の規則も職務も廃された今、警備兵たちは壁に寄りかかり、行き交う人々を咎めるでもなく、言葉を交わしていた。\n\n革命が壊したものを再び築き直すには、誰も費やそうとは思わぬほどの大きな労力が――そして誰も持ち合わせぬほどの強き意志が要る。現実の壁が消え去った今、形ばかりの壁は、日に日にいっそう馬鹿げたものに映るのだった。"
 ideological_unification.1.a:0 "同志たちに統合を要請しよう。"
 ideological_unification.1.b:0 "我が国の自治が第一だ。"
 ideological_unification.11.t:0 "[SCOPE.sCountry('smaller_country_scope').GetName]が統合を提案"
 ideological_unification.11.d:0 "[SCOPE.sCountry('smaller_country_scope').GetName]で革命が勝利を収めたことを受け、[SCOPE.sCountry('smaller_country_scope').GetCustom('country_legislature_name')]は我が国に対し、両共和国の統合を要請してきた。"
 ideological_unification.11.f:0 "[SCOPE.sCountry('smaller_country_scope').GetNameNoFormatting]の代表団が列車から降り立つと、赤い紙吹雪が舞い散った。[ROOT.GetCountry.GetCapital.GetCityHubName]の市民たちは大挙して駅に詰めかけ、赤旗や新たな同志たちを歓迎する手製のプラカードを掲げていた。\n\n群衆の頭上には、夜勤の鉄道員たちが駅の端から端まで張り渡した横断幕がかかっていた。そこには鮮やかな金文字でこう記されていた。\n\n「世界社会主義共和国万歳」"
 ideological_unification.11.a:0 "ようこそ、同志たちよ！"
 ideological_unification.11.b:0 "[SCOPE.sCountry('smaller_country_scope').GetNameNoFlag]を自治共和国として樹立しよう。"
 ideological_unification.11.c:0 "彼らとは関わりたくない。"
 german_unification.6.t:0 "[SCOPE.sCountry('mother_country_scope').GetName]との連合"
 german_unification.6.d:0 "[SelectLocalization(SCOPE.sPoliticalMovement('german_national_movement_scope').IsValid,SCOPE.sPoliticalMovement('german_national_movement_scope').GetName,'movement_german_national')]の勝利により、ドイツ統一への道が開かれた。[SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')|U]は、[SCOPE.sCountry('mother_country_scope').GetRuler.GetPrimaryRoleTitle][SCOPE.sCountry('mother_country_scope').GetRuler.GetFullName]の下で[SCOPE.sCountry('mother_country_scope').GetName]との連合を請願する動議を提出した。"
 german_unification.6.f:0 "「この連合に[SCOPE.sCountry('mother_country_scope').GetNameNoFormatting]と参加することによって、我々は[ROOT.GetCountry.GetAdjectiveNoFormatting]の主権を放棄することになるのかもしれない。だが、そうすることによって、ドイツの主権の確保に貢献することができるのだ。時代の精神を拒むことはできない。ドイツ国民は統一を望み、[SCOPE.sCountry('mother_country_scope').GetAdjectiveNoFormatting]政府はそれを実現するものであるように思われるのだ。ドイツ国民の結集に反対することは、全くの愚行である」"
 german_unification.6.a:0 "ドイツのために！"
 german_unification.6.b:0 "我々の主権を侵すことは許されない。"
 german_unification.7.t:0 "ドイツの国家主義者が[SCOPE.sCountry('smaller_country_scope').GetCapital.GetCityHubName]を掌握"
 german_unification.7.d:0 "ドイツ単一国家の樹立を求める声に触発され、国家主義者の反乱軍は[SCOPE.sCountry('smaller_country_scope').GetName]を掌握した。彼らは[ROOT.GetCountry.GetRuler.GetFullName][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の下、ドイツの統一を誓った。"
 german_unification.7.f:0 "「統一と正義と自由を\n父なる祖国ドイツの為に\nそれを求めて我らは皆で兄弟の如く\n心と手を携えて努力しようではないか」\n\n―アウグスト・ハインリヒ・ホフマン、『#italic ドイツの歌#!』"
 german_unification.7.a:0 "私たちは、我らの兄弟姉妹を歓迎する。"
 german_unification.7.b:0 "隣国を恐れさせない方がいいだろう。"
 factory_councils.1.t:0 "[SCOPE.sState('council_state_scope').GetCityHubName][SCOPE.sState('council_state_scope').GetCustom('getCouncilSoviet')]"
 factory_councils.1.d:0 "革命が[ROOT.GetCountry.GetName]全土に広がる中、[SCOPE.gsInterestGroup('trade_unions_ig').GetName]は政府との闘争を調整するための[GetLawType('law_factory_councils').GetName]を組織した。これらの組織の中で最も影響力を持つのは[SCOPE.sState('council_state_scope').GetCityHubName][SCOPE.sState('council_state_scope').GetCustom('getCouncilSoviet')]であり、国内の労働者たちはこれを権威ある存在として認めるようになった。"
 factory_councils.1.f:0 "最初の会合には数十人が出席し、50の印刷所からなる労働組合の50人の代表を中心に構成されていた。その後数週間のうちに、代表者の数は数百人にも膨れ上がった。そこにいたのは、金属工や印刷工、作業員、薬剤師、事務員、そして繊維工場で働く人々だった。 彼らが集った建物、つまり大学の講堂は、大規模ストライキの神経中枢のように機能し始め、通信員、陳情者、記者、政党の代表者たちが出入りするようになった。\n\nストライキがなおも続いていることを懸念した警察は、彼らを解散させるための部隊を送り込んだ。すると彼らは、警備志願者を配置した。最初は武器を持たない男を1人、次いでライフルを持った男を3人。ハンチング帽を被り作業服に身を包んだ彼らは、赤い布で覆われた防壁の上から徽章をつけ長靴をはいた警官たちを睨み下ろした。今やその警官たちは、ひどく小さな存在に見えた。"
 factory_councils.1.a:0 "すべての権力を[SCOPE.sState('council_state_scope').GetCustom('getCouncilSovietPlural')|l]へ！"
 factory_councils.1.b:0 "時間を稼ぎ、改革を実施する意思を示す。"
 factory_councils.1.c:0 "国家の統制を失うわけにはいかない。直ちに介入せよ！"
 factory_councils.11.t:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]の[ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')]"
