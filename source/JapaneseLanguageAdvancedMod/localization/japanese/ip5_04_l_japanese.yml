 je_state_and_revolution_industrialisation_plan_button_name:0 "産業化計画を実施"
 je_state_and_revolution_industrialisation_plan_button_desc:0 "革命前の産業化の遅れにより、[ROOT.GetCountry.GetName]はより先進的な資本主義諸国に大きく後れを取っている。我が国は産業化を速やかに進めるため、国中の資源を組織的に活用しなければならない。"
 je_state_and_revolution_bourgeois_specialists_button_name:0 "ブルジョワ専門家を雇用"
 je_state_and_revolution_bourgeois_specialists_button_desc:0 "[ROOT.GetCountry.GetAdjective]の労働者階級の教育水準は、いまだ専門的な官僚機構なしで済ませられるほどには達していない。国家機構の不備を補うため、我々は外国企業や旧体制に雇われていた技術専門家に手を差し伸べ、その働きと引き換えに、手厚い報酬と恩赦を与えることができる。"
