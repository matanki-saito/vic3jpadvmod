 russia_misc_events.1.t:0 "バルトでの改宗"
 russia_misc_events.1.d:0 "ルター派の地主たちに対抗し、皇帝の恩寵を得ようという思惑から、[SCOPE.sCountry('baltic_governorates_scope').GetName]の[GetCulture('estonian').GetName]および[GetCulture('latvian').GetName]の[GetPopType('peasants').GetName]が、一斉に[GetReligion('orthodox').GetName]へと改宗しはじめた。バルト地方の教会は、急増する改宗者への対応に追われている。"
 russia_misc_events.1.f:0 "「その話はどこで聞いた？」\n\nヤーニスは、これほど座り心地の悪い椅子に座ったことがなかった。不可解なほど角が多く、どの角も体の痛いところばかり突いてくる。記憶をたどった。酒場だったか？それとも薪を集めていたときの世間話か？酒場だった気がする。だが、確信が持てるまでは口を開きたくなかった。嘘をついていると憲兵に疑われれば、棒で打ち据えられるかもしれない。しかも、相手はドイツ人に見えた。となれば、「かもしれない」ではなく「ほぼ間違いなく」だ。\n\n「聞いているんだ」と憲兵は繰り返した。「その話はどこで聞いた？」\n\n「それは…」ヤーニスは口ごもった。「…誰かから聞いたんです。私が酒を飲んで…いえ、みんなで飲んでいたときに。ツァーリが、ご自分と同じ信仰の者たちに土地を与えて、税を…その人たちの税を軽くしてくださるって。悪いことをするつもりはなかったんです」"
 russia_misc_events.1.a:0 "真の信仰を広めるのは我々の義務だ。"
 russia_misc_events.1.b:0 "バルト貴族の反感を買ってはならない。"
