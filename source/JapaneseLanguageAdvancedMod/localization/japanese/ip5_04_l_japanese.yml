 communism.12.t:0 "妨害行為と破壊工作"
 communism.12.d:0 "監督人民委員部は、国家の計画立案者の間で、#v $je_five_year_plan$#!の進捗を偽装しようとする組織的な活動が広がっていることを突き止めた。[SCOPE.gsInterestGroup('proletariat_ig').GetName]は、責任者たちを破壊分子として革命的正義の裁きにかけるよう要求している。"
 communism.12.f:0 "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]は台所のテーブルにつき、ストーブの上の壁を虚ろに見つめていた。彼の前には2ページ目を開いた[GetPlayer.GetCustom('newspaper_type')]が置かれ、その太い活字が不正と陰謀を激しく糾弾していた。左上の隅を、半分空いたウォッカのグラスが押さえていた。\n\n傍らの床には、党支給のリボルバーが転がっていた。血の一滴がその弾倉に落ち、精緻に削り出された金属を伝って滑り落ちる。その下に広がった血だまりは、絨毯の白い縁を染めるほどに大きくなっていた。\n\n扉を叩く音がした。"
 communism.12.a:0 "罪状は共謀、破壊工作、産業妨害、それから…"
 communism.12.b:0 "粛清などしている余裕はない。書類は闇に葬れ。徹底的にな。"
 form_white_movement_tt:0 "反#tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_movements_list_tt 社会主義#!の[Concept('concept_political_movement','$concept_political_movements|q$')]が#v $movement_anti_communist_name$#!に加わる"
 je_extraordinary_commission:0 "非常措置"
 je_extraordinary_commission_reason:0 "「#italic プロレタリアートは、搾取を行う者の抵抗を粉砕し、膨大な数の人口を社会主義経済の組織化に導くために、国家権力、力の集中組織、暴力の組織を必要としている#!」\n\n―ウラジーミル・レーニン、『#italic 国家と革命#!』\n\n[ROOT.GetCountry.GetName]における[ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')|l]権力の樹立は、階級としてのブルジョワジーに終焉をもたらしはしなかった。国の内外に存在する革命の敵は、[ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')|l]権力の打倒と、[SCOPE.gsInterestGroup('proletariat_ig').GetName]を卑しい隷属へと引き戻すことを企んでいる。\n\n革命を破壊せんとするあらゆる者からこれを守るため、全[ROOT.GetCountry.GetAdjectiveNoFormatting][GetLawType('law_extraordinary_commission').GetName]には、反革命分子および破壊工作員の疑いがある者を革命的正義の裁きにかける広範な権限が与えられた。最後のブルジョワ的抵抗が粉砕されるまで、恐怖こそが日々の秩序となる。"
 vanguard_custom_tooltip:0 "[concept_powerful]な[concept_interest_group]、または[concept_in_government]の[concept_interest_group]は、[GetLawType('law_council_republic').GetName]に[Concept('concept_endorse_oppose','$concept_opposed|q$')]していない。"
 vanguard_instruction_status:0 "[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]、[GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName]、[GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName]、[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]は、[concept_marginalized]の場合、それぞれの集団内で最も[Concept('concept_prominence','$concept_prominent|q$')]な[GetIdeology('ideology_vanguardist').GetName]の[concept_character]を[concept_leader]に選出する。"
 has_suppressed_white_movement_for_some_years_tt:0 "[SelectLocalization(SCOPE.sPoliticalMovement('white_movement_scope').IsValid,SCOPE.sPoliticalMovement('white_movement_scope').GetName,'movement_anti_communist')]の[concept_political_movement_support]が#b 24#!か月連続で#v 5%#!を下回っている (現在#v [ROOT.GetCountry.MakeScope.Var('anti_communist_suppression_var').GetValue|v0]#!) "
 no_reactionary_conservative_liberal_agitators_tt:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],reactionary_ideologies_list_tt 反動主義#!、#tooltippable;tooltip:[GetPlayer.GetTooltipTag],conservative_ideologies_list_tt 保守主義#!、または#tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_ideologies_list_tt 自由主義#!の[Concept('concept_agitator','$concept_agitators|q$')]がいない"
 leader_of_nomenklatura_tt:0 "[THIS.GetCharacter.GetFullName]が#b $ig_nomenklatura$#!の[concept_leader]になる"
 nomenklatura_tt:0 "[SCOPE.gsInterestGroup('nomenklatura_scope').GetName]が#b ノーメンクラトゥーラ#!へと再編され、[GetIdeology('ideology_materialist').GetName]、[GetIdeology('ideology_managerial').GetName]、[GetIdeology('ideology_defensist').GetName]の[Concept('concept_ideology','$concept_ideologies|q$')]を持つようになる"
 nomenklatura_dissolved_tt:0 "#b $ig_nomenklatura$#!が$ig_intelligentsia$へと再編され、[GetIdeology('ideology_liberal').GetName]、[GetIdeology('ideology_anti_clerical').GetName]、[GetIdeology('ideology_republican').GetName]の[Concept('concept_ideology','$concept_ideologies|q$')]を持つようになる"
 nomenklatura.1.t:0 "機構"
 nomenklatura.1.d:0 "近年、[GetPopType('bureaucrats').GetName]や任命された専門家たちの政治的影響力が増大したことで、#b $ig_nomenklatura$#!と呼ばれる階層が台頭しつつある。彼らは革命を守るには秩序と規律が必要だと主張し、国家機構のさらなる専門化と拡大を提唱している。"
 nomenklatura.1.f:0 "役所を出て間もなく、最初の不満が[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]の口から飛び出した。「新入りの研修生たちを見たか？タコがある奴など1人もいない。まるでクリームみたいに柔らかい手をしているんだ」\n\n[SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting]は唇を結んだまま頷いた。「ああ見た。昔、バリケードの向こう側であいつらのうちの1人の顔を見たような気すらするよ」\n\n「奴らは我々より高い地位から始まってる。今じゃ役所の半分が任命された連中で、給料まで出ている。革命精神なんてありゃしない」[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]は周囲を見回し、自分の主張を補強してくれるものを探した。隣の建物の外壁には銃弾の跡が修理されずに残っており、彼はそれに向かって頷いた。「こいつらが党にもなだれ込むようになったら、我々はどうしたらいいんだ？」"
 nomenklatura.1.a:0 "我が国の欠陥が、どんどん明らかになっている。"
 nomenklatura.1.b:0 "我らの成果を守るため、最大限の努力をせねばならない。"
 nomenklatura.2.t:0 "鉄の男"
 nomenklatura.2.d:0 "古くからのボリシェヴィキ闘士であり、[SCOPE.sParty('stalin_party_scope').GetName]の実質的な指導部の一員でもある人民委員の[SCOPE.sCharacter('stalin_scope').GetFullName]は、民族政策の分野で頭角を現しており、[ROOT.GetCountry.GetRuler.GetFullName]は彼の昇進を検討している。"
 nomenklatura.2.f:0 "「我々は、民族による労働者の分断が何をもたらすかを知っている。統一労働者党の解体、民族ごとの労働組合の分裂、民族的摩擦の激化、民族的スト破り、社会民主主義陣営内の完全な道義的退廃。それが、組織上の連邦主義がもたらす結果である。これは、オーストリアの社会民主主義の歴史と、ロシアにおけるブンドの活動によって雄弁に証明されている。\n\nこれに対する唯一の治療法は、インターナショナリズムに基づく組織化である。\n\nロシアのあらゆる民族の労働者を、地域ごとに単一かつ不可分の共同体に統合し、これらの共同体を単一の党へと統合すること。これこそが課せられた任務なのだ」\n\n―ヨシフ・スターリン、『#italic マルクス主義と民族問題#!』"
 nomenklatura.2.a:0 "彼の細部への注意力は、党内でのより高い地位に値する。"
 nomenklatura.2.b:0 "民族問題人民委員としての彼の働きを称賛する。"
 nomenklatura.2.c:0 "彼はあまりにも粗暴で、これ以上昇進させるわけにはいかない。"
 modifier_general_secretary:0 "書記長"
 modifier_commissar_for_nationalities:0 "民族問題人民委員"
 modifier_marxism_and_the_national_question:0 "$marxism$と民族問題"
 nomenklatura.3.t:0 "即時解任"
 nomenklatura.3.d:0 "[SCOPE.sCharacter('relevant_character_scope').GetFullName]が自分たちの利益を代表できなかったことに憤慨した[SCOPE.sCharacter('relevant_character_scope').GetHerHis]の選挙区民たちは、投票により[SCOPE.sCharacter('relevant_character_scope').GetHerHim]を公職から解任すると決定した。[SCOPE.sCharacter('relevant_character_scope').GetLastName]は、重要な国家事業を妨げることになるとして、解任に抗議している。"
 nomenklatura.3.f:0 "「わかっていないようだな」と[SCOPE.sCharacter('relevant_character_scope').GetLastNameNoFormatting]は言った。これまでも何度となく口にしてきた言葉であり、これが最後になることもないだろう。「私にはやるべき仕事がある。再選しないというなら、それでも構わない。後任には好きな者を選べばいい。だが、#italic 今#!は駄目だ。まだ時間が必要で――」\n\n知らせを伝えに来たのは、眼鏡をかけ、髪が薄くなりはじめた中年の有権者だった。男はそっけなく首を横に振った。「時間なら十分あったでしょう？警告だって何度も受けたはずです。私もあなたに投票したんですよ。ですが、[ROOT.GetCountry.GetCapital.GetCityHubName]はあなたにとって、いい場所ではなかったようですね」\n\n[SCOPE.sCharacter('relevant_character_scope').GetLastNameNoFormatting|U]の頬がかっと熱くなった。まだ抵抗することはできる、と[SCOPE.sCharacter('relevant_character_scope').GetSheHe|U]は思った。地団駄を踏み、わめき散らし、地面に爪を立ててでも党に訴えることはできる。別の選挙区に移り、そこから立候補する手もある。だが、そこまでしたいのか？恥をさらすことにはなるが、そうすればもう少しだけ今の地位に留まれる。それだけの価値があるのだろうか？"
 nomenklatura.3.a:0 "労働者には即時解任の権利がある。"
 nomenklatura.3.b:0 "[SCOPE.sCharacter('relevant_character_scope').GetLastName]は失うには惜しい人材だ。[SCOPE.sCharacter('relevant_character_scope').GetHerHim]に特別な役職を与えよ。"
 remove_as_ig_leader_tt:0 "[SCOPE.sCharacter('relevant_character_scope').GetFullName]が[SCOPE.sCharacter('relevant_character_scope').GetInterestGroup.GetName]の[concept_leader]から解任される"
 nomenklatura.4.t:0 "司令官の解任"
 nomenklatura.4.d:0 "[SCOPE.sCharacter('relevant_character_scope').GetPrimaryRoleTitle]の[SCOPE.sCharacter('relevant_character_scope').GetFullName]が発した命令は評判が悪く、部隊からの信頼は失われた。兵士たちは投票によって[SCOPE.sCharacter('relevant_character_scope').GetHerHim]を司令官の職から解任すると決定した。[SCOPE.gsInterestGroup('red_army_ig').GetName]の司令部はこの解任に抗議し、選挙で選ばれる後任者の能力は保証できないと主張している。"
 nomenklatura.4.f:0 "「権力が我々の敵である階級に握られ、司令部がその権力の道具と化していた間は、選挙制原則を通じて司令部の階級的反抗を打ち砕くことこそが我々の義務であった。しかし現在、政治権力は軍隊がその階級から徴募されているのと同じ労働者階級の手にある。現在の軍隊の体制下では、正直なところ、選挙原則は政治的には不要であり、技術的な観点からも非現実的に思われる」\n\n―レフ・トロツキー、『労働、規律、そして秩序』"
 nomenklatura.4.a:0 "彼らには、自らの上に立つ士官を選ぶ権利がある。"
 nomenklatura.4.b:0 "党派的な茶番だ。最高司令部に介入させよ。"
 nomenklatura.5.t:0 "労働者の取り組み"
 nomenklatura.5.d:0 "革命的な熱狂と新たな権限に駆り立てられ、多くの[GetLawType('law_factory_councils').GetName]が、自らの支配地域全体で[SCOPE.sLaw('trade_union_law_scope').GetName]の運用を開始した。彼らの取り組みは[SCOPE.GetRootScope.GetCountry.GetCustom('country_legislature_name')]の注目を集めている。"
 nomenklatura.5.f:0 "[SCOPE.sCharacter('proletariat_leader').GetLastNameNoFormatting|U]は[SCOPE.sState('relevant_urban_state').GetCityHubName]からの報告書を読みふけっていた。夜はすでに更け、ランプの油もすでに一度注ぎ足している。[SCOPE.sState('relevant_urban_state').GetCityHubName]の[SCOPE.sState('relevant_urban_state').GetCustom('getCouncilSoviet')]による活動には、地域主導の自発的な取り組みによく見られる、熱意にあふれ、その都市の住民独自の利益から生まれ、地域の事情に適合しているという、すべての特徴が揃っていた。\n\nそれは一つの始まりであった。良い始まりかもしれないし、その逆かもしれない。そうした取り組みが、視野の狭い地域主義的な、あるいは小ブルジョワ的な性質を持つものへと豹変するのは、ごくありがちなことであった。彼は書類を手渡してきた熱心な評議員たちを失望させたくはなかったが、一部の労働者の利益が労働者階級全体の利益と一致するわけではないことも、十分に承知していた。\n\nプロレタリアート独裁なのだ、と彼は考えた。[SCOPE.sState('relevant_urban_state').GetCityHubName]の[SCOPE.sState('relevant_urban_state').GetCustom('getCouncilSoviet')]独裁ではない。たとえ拒絶が必要になったとしても、少なくとも[GetPlayer.GetCustom('newspaper_type')]に掲載するスローガンは手に入る。"
 nomenklatura.5.a:0 "彼らの取り組みを称賛し、この政策を国全体に拡大せよ。"
 nomenklatura.5.b:0 "一部の評議会が階級全体を代弁するわけではない。"
 modifier_recall_overridden:0 "解任の回避"
 modifier_recall_overridden_military:0 "解任の無効化"
 modifier_spontaneous_enactment:0 "自発的な取り組み"
 modifier_bureaucratic_veto:0 "取り組みの弾圧"
 nomenklatura.6.t:0 "破壊分子と破壊工作員"
 nomenklatura.6.d:0 "[SCOPE.sState('relevant_industrial_state').GetName]の技術専門家たちは、[SCOPE.gsInterestGroup('proletariat_ig').GetName]から不公平に扱われていると不満を訴えている。彼らの主張によれば、管理を任されている[GetPopType('laborers').GetName]や[GetPopType('machinists').GetName]から、根拠のないサボタージュの告発を受けたり、指示に従ってもらえなかったりするという。"
 nomenklatura.6.f:0 "鋳造工場内の空気は熱により揺らめいていた。天窓を開け放っていても、息を詰まらせるような煙霧が屋根の近くに立ち込めている。現場では3組の作業班が赤熱した鋼鉄を圧延機に送り込む作業に追われていた。交代勤務が終わりに近づき、暑さと重労働のせいで、肌に触れる衣服が紙やすりのように感じられた。\n\n頭上のキャットウォークでは、上等なコートを着た男がストップウォッチで彼らのあらゆる動作の時間を測定していた。作業中に腰まで裸になるのが許されなくなったのも、彼の命令によるものだった。そうすれば負傷を減らせるし、火傷を負うほど火に近づくのを防げるというのだ。そうかもしれない。だが、そんなことは時間さえあれば彼ら自身で考えついただろうし、それを採用するかどうかを決めるのも、彼らの自由であったはずだ。それなのに、キャットウォークから下される命令は、溶けた金属よりも熱く彼らを焼きつけていた。"
 nomenklatura.6.a:0 "彼らの統治下では、プロレタリアートは遥かにひどい目にあった。"
 nomenklatura.6.b:0 "彼らは最善の手法を知っている。労働者はこれに従わねばならない。"
 modifier_defended_the_specialists:0 "擁護された技術専門家"
 modifier_wrecking_accusations:0 "迫害された技術専門家"
 begin_one_phase_ahead_tt:0 "[SCOPE.sLaw('trade_union_law_scope').GetName]の[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')]が、すでに#v 1#![Concept('concept_enactment_phase','$concept_enactment_phase_short|q$')]完了した状態で始まる"
 new_revolutionary_general_tt:0 "[THIS.GetMilitaryFormation.GetName]は、[Concept('concept_character_trait','$concept_character_trait_short|q$')]「[GetCharacterTrait('charismatic').GetName]」を有する#tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_ideologies_list_tt 社会主義者#!の[concept_general]を新たに選出する"
 new_revolutionary_admiral_tt:0 "[THIS.GetMilitaryFormation.GetName]は、[Concept('concept_character_trait','$concept_character_trait_short|q$')]「[GetCharacterTrait('charismatic').GetName]」を有する#tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_ideologies_list_tt 社会主義者#!の[concept_admiral]を新たに選出する"
 intelligentsia.1.t:0 "もはや妥協はない"
 intelligentsia.1.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]が[SCOPE.gsInterestGroup('intelligentsia_scope').GetName]を敵に回したことで、彼らのあいだでは[SCOPE.sPoliticalMovement('republican_movement_scope').GetName]の影響力がますます強まっている。かつては立憲[GetLawType('law_monarchy').GetName]を求めていたものの、今やその声は影を潜め、[GetIdeology('ideology_republican').GetName]への支持が主流となっている。"
 intelligentsia.1.f:0 "憲兵たちは壁の前に集まり、一面に貼られたビラを見つめていた。広告やクラブへの勧誘など、無害に見えるものもあった。だが、中には決起を呼びかける檄文や風刺画、君主と祖国を中傷するビラも混じっていた。\n\n少し離れたところには憲兵の一人が横たわり、看護婦が血の流れる手のひらに包帯を巻いていた。真っ先に駆けつけた彼は、ビラを剥がそうとして、そこに仕込まれていた剃刀の刃で手のひらを深く切ったのだ。血に染まったそのビラは、なおも挑発するかのように風にはためいていた。黒々とした太い文字が、憲兵たちに向かって叫んでいた。「#b [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]に死を#!」"
 intelligentsia.1.a:0 "[ROOT.GetCountry.GetName]にも恐怖政治が訪れるのか？"
 intelligentsia.1.b:0 "王冠を戴く者は皆、震え上がるがいい。"
 modifier_republican_intelligentsia:0 "急進化した知識人"
 modifier_republican_movement_growing:0 "知識人の支持"
 je_forest_of_bayonets:0 "銃剣の森"
 je_forest_of_bayonets_reason:0 "ナポレオン戦争の終結以来、[GetGeographicRegion('geographic_region_europe').GetName]では$glossary_congress_of_vienna$で確立された反動的な秩序が支配を続けてきた。[glossary_revolutions_of_1830]によって大きく揺らいだものの、#b ベルギー#!とフランスの#b 七月王政#!をその枠組みに取り込んだことで、ウィーン体制はひとまず存続を確保した。$glossary_1792$の再来を恐れる絶対主義体制と保守的な立憲体制は結束し、革命の兆しさえも容赦なく弾圧している。\n\nそれでも、自由・平等・博愛の理想は潰えていない。[Concept('concept_revolution','$concept_revolutionary|q$')]勢力は今なおウィーン体制の打倒を目指している。一方、ヨーロッパ各地の首都では、貧困にあえぎ参政権も持たない労働者階級の不満が爆発寸前にまで高まっている。ひとたび火がつけば、ヨーロッパ全土が炎に包まれかねない。\n\n@warning! [Concept('concept_revolution','$concept_revolutionary|q$')]活動が臨界点に達すると、脆弱なウィーン体制は大きく揺らぎ、#b 革命の春#!が幕を開ける"
 forest_of_bayonets_progress_bar:0 "銃剣の森"
