 je_five_year_plan_heavy_industry_button_name:0 "重工業を発展させる"
 je_five_year_plan_heavy_industry_button_desc:0 "重工業は、生産手段を生み出すための手段である。この計画で製造される旋盤は次の計画の工場を建て、その工場はさらに次の計画の軍需工場を建てることになる。"
 je_five_year_plan_light_industry_button_name:0 "軽工業を発展させる"
 je_five_year_plan_light_industry_button_desc:0 "軽工業は、消費手段を生み出すための手段である。資本の再生産に労働が必要であるように、労働力の再生産には軽工業の産物――パン、衣服、日用品などが必要となる。"
 je_five_year_plan_transportation_button_name:0 "輸送網を発展させる"
 je_five_year_plan_transportation_button_desc:0 "物資の迅速な流通は、経済の発展に不可欠である。我々が線路を1キロ敷くごとに、十数人の労働者が荷馬車から解放される。"
 je_five_year_plan_agriculture_button_name:0 "農業を発展させる"
 je_five_year_plan_agriculture_button_desc:0 "農村部に前資本主義的な形態が残存していることは、[ROOT.GetCountry.GetAdjectiveNoFlag]経済の後進性を示している。農業部門は計画の要求に応えられるよう組織されねばならず、残存する農民層はプロレタリア化されねばならない。"
 je_five_year_plan_electrification_button_name:0 "電化を推進する"
 je_five_year_plan_electrification_button_desc:0 "共産主義とは、[ROOT.GetCountry.GetCapital.GetCustom('getCouncilSoviet')|l]権力に全国電化を加えたものである。国家が経済的成功を収めるには、その産業は量的に十分であるだけでなく、最先端技術を基盤として築かれていなければならない。"
 je_five_year_plan_conclude_button_name:0 "立案を完了する"
 je_five_year_plan_conclude_button_desc:0 "#v $je_five_year_plan$#!のために、十分な目標を設定した。これより、それらの達成に取りかかろう。"
