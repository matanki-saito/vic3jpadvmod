 je_five_year_plan_reduce_objectives_button_name:0 "経済目標を縮小"
 je_five_year_plan_reduce_objectives_button_desc:0 "#v $je_five_year_plan$#!で設定された目標はやや野心的すぎたようだ。今、経済目標を見直せば、縮小した形で計画を立て直せるかもしれない。"
 je_five_year_plan_reduce_objectives_button_tt_2:0 "#v $je_five_year_plan$#!のすべての目標が#v 10%#!緩和される"
 je_five_year_plan_reduce_objectives_button_tt_3:0 "#v $je_five_year_plan$#!を完了した場合の#bold 報酬#!が#r 半減#!する"
 je_five_year_plan_cheat_button_name:0 "統計を操作"
 je_five_year_plan_cheat_button_desc:0 "#v $je_five_year_plan$#!で設定された目標を達成できなければ、多くの地方官僚の経歴に破滅的な傷を残すことになる。大きな損害をもたらす失敗と、それに伴うあらゆる政治的余波を避けるため、いくつかの事実や数字は、より都合のよい方向へ「概算」してもよいのだ。我々に必要なのは、目を光らせている監督人民委員部の同志たちに、そうした「概算」が気づかれないようにすることだけだ。"
 je_five_year_plan_cheat_button_success_tt:0 "公式統計では、#v $je_five_year_plan$#!の達成に向けて#g 大幅な進捗#!があったと報告される"
 je_five_year_plan_cheat_button_caught_tt:0 "#bold 不正操作#!の試みが監督人民委員部に#r 発覚#!した"
 je_five_year_plan_cheat_button_conditions_tt:0 "この[concept_country]が#v $je_five_year_plan$#!の期間中に記録した[concept_bureaucracy]の余剰の最大値に比例して、#b 不正操作#!の成功率が#b 低下#!する"
 je_five_year_plan_forced_labor_button_name:0 "強制労働を導入"
 je_five_year_plan_forced_labor_button_desc:0 "[ROOT.GetCountry.GetName]の近代化には、並々ならぬ努力と、それに劣らぬ犠牲が求められる。労働時間を延ばし、農民から物資を徴発し、囚人を#v $je_five_year_plan$#!の労働力として動員すれば、生産性が向上し、計画が成功する見込みも高まる。"
