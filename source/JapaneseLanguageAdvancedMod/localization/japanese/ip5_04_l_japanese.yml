 siberian_exile_pool:0 "シベリア"
 siberia.1.t:0 "行政処分による流刑"
 siberia.1.d:0 "警察は、[SCOPE.sCharacter('siberian_exile_scope').GetFullName]が[SCOPE.sCharacter('siberian_exile_scope').GetCustom('custom_siberian_exile_reason_loc')]ことを突き止めた。[SCOPE.sCharacter('siberian_exile_scope').GetSheHe|U]は現在、政治犯としてシベリア流刑に処される危機に直面している。有罪となれば、[SCOPE.sCharacter('siberian_exile_scope').GetSheHe]は刑期満了後に帰還を認められることになる。"
 siberia.1.f:0 "「彼らの大半は行政流刑者である。すなわち、政府が種々の理由から、自宅より引き離し、彼らが危害を及ぼしえぬ帝国の一地方において、警察の監視下に置くのが得策と判断した者たちだ。実際に犯罪活動に関与した本物の陰謀家や革命家は、男女を問わずシベリアのさらに奥地へ送られ、徒刑に処される」\n―ジョージ・ケナン、『#italic シベリアと流刑制度#!』第1巻、1891年"
 siberia.1.a:0 "懲役5年だ。[SCOPE.sCharacter('siberian_exile_scope').GetHerHim]を厳重な監視下に置け。"
 siberia.1.b:0 "懲役10年だ。[SCOPE.sCharacter('siberian_exile_scope').GetSheHe]が首都で持つ影響力をすべて消し去る。"
 siberia.1.c:0 "20年だ。[SCOPE.sCharacter('siberian_exile_scope').GetSheHe|U]にはあまりにも長い間、煩わされてきたからな。"
 siberia.1.e:0 "これは醜聞になりすぎる。[SCOPE.sCharacter('siberian_exile_scope').GetHerHim]を放免せよ。"
 to_siberia_5_tt:0 "[SCOPE.sCharacter('siberian_exile_scope').GetFullName]は#v 5年間#!の[concept_siberian_exile]に処される"
 to_siberia_10_tt:0 "[SCOPE.sCharacter('siberian_exile_scope').GetFullName]は#v 10年間#!の[concept_siberian_exile]に処される"
 to_siberia_20_tt:0 "[SCOPE.sCharacter('siberian_exile_scope').GetFullName]は#v 20年間#!の[concept_siberian_exile]に処される"
 to_siberia_exonerated_tt:0 "[SCOPE.sCharacter('siberian_exile_scope').GetFullName]にかけられた容疑は取り下げられる"
 society_siberian_exile_reason_custom:0 "禁制の秘密結社に所属していた"
 books_siberian_exile_reason_custom:0 "禁書を所持していた"
 communication_siberian_exile_reason_custom:0 "政治犯と密かに連絡を取っていた"
 siberia.2.t:0 "流刑地にて"
 siberia.2.d:0 "流刑地での暮らしのなかで、[SCOPE.sCharacter('siberian_exile_scope').GetFullName]はほかの流刑者たちの政治思想に触れてきた。この経験は、[SCOPE.sCharacter('siberian_exile_scope').GetHerHis]自身のイデオロギーの根幹を大きく変えることになるかもしれない。"
 siberia.2.f:0 "「行政処分による流刑をいかに規制・制限したとしても、それは必ず、公権が恣意的に行使されているという思いを流刑者の心に植え付ける。その事実だけで、いかなる更生も完全に阻まれてしまうのである」\n―少将ニコライ・バラノフ、『#italic 法学報知#!』、1883年"
 siberia.2.a:0 "思想の交換は、流刑者に許された数少ない贅沢のひとつなのかもしれない。"
 siberia.2.b:0 "流刑者同士の白熱した議論は、思いもよらぬ形で[SCOPE.sCharacter('other_siberian_exile_scope').GetFullName]に影響を及ぼすかもしれない。"
 je_social_revolution:0 "社会革命"
 je_social_revolution_reason:0 "革命は、長らく抑圧されてきた社会のあらゆる力を解き放った。社会に深く根を下ろしていた諸制度は投げ捨てられ、疑う余地なしと信じられていた思想も、実はガラス細工のように脆いものであることが明らかになった。今や、かつて蔑まれていた[SCOPE.gsInterestGroup('proletariat_ig').GetName]が最高権力を掌握し、以前は声を上げられなかった人々が軍と省庁を動かしている。ある年には無謀な急進派と見なされた者たちが、翌年には保守派のように映る。\n\nこうした力が我々の周囲で荒れ狂うなか、[ROOT.GetCountry.GetName]に新たな社会を――過去の朽ち果てた伝統に倣うのではなく、人類の真の解放を見据えた新たな社会を――築く機会が訪れている。"
 je_social_revolution_low_consolidation_tt:0 "#v $je_state_and_revolution$#!の[concept_journal_entry]において、[Concept('concept_state_and_revolution_consolidation','$concept_state_and_revolution_consolidation_short|q$')]値が両方とも#v 50%#!未満である期間が合計#v 120#!か月に達している (現在[ROOT.GetCountry.MakeScope.Var('communist_welfare_low_consolidation_months_var').GetValue|v0]か月) "
 je_social_revolution_concluded_consolidation_tt:0 "#v $je_state_and_revolution$#!の[concept_journal_entry]が[Concept('concept_state_and_revolution_consolidation','$concept_state_and_revolution_consolidation_short|q$')]状態で終結している"
 je_state_and_revolution:0 "国家と革命"
 je_state_and_revolution_reason:0 "#b 政治[Concept('concept_state_and_revolution_consolidation','$concept_state_and_revolution_consolidation_short|q$')]ゲージ#!は、時間経過とともに#tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_political_confrontation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_political_confrontation_display')|%0r]#!/#tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_political_consolidation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_political_consolidation_display')|%0u]#!に向かって変化していく。\n#b 経済[Concept('concept_state_and_revolution_consolidation','$concept_state_and_revolution_consolidation_short|q$')]ゲージ#!は、時間経過とともに#tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_economic_confrontation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_economic_confrontation_display')|%0r]#!/#tooltippable;tooltip:[GetPlayer.GetTooltipTag],state_and_revolution_economic_consolidation_pivot_factors_tt [SCOPE.ScriptValue('state_and_revolution_economic_consolidation_display')|%0o]#!に向かって変化していく。\n\n多大な努力と苦難の末、[ROOT.GetCountry.GetAdjective]の労働者階級は[GetLawType('law_council_republic').GetName]を樹立した。革命の旗が、かつて王と資本家の支配に苦しんだ大地にはためく。赤き[ROOT.GetCountry.GetCapital.GetCityHubName]は、世界中の労働者にとっての象徴となるかもしれない。\n\nだが、$law_council_republic$の樹立は、世界共産主義へ至るための一歩にすぎない。[ROOT.GetCountry.GetNameNoFlag]の革命が、敵対者に支配された世界と闘い続けなければならないかぎり、それは2つの衝動に直面する。すなわち、世界資本主義との継続的な[Concept('concept_state_and_revolution_confrontation','$concept_state_and_revolution_confrontation_short|q$')]、そして圧倒的な反対に直面しながら勝ち取った成果の[Concept('concept_state_and_revolution_consolidation','$concept_state_and_revolution_consolidation_short|q$')]である。\n\n@information! [Concept('concept_state_and_revolution_consolidation','$concept_state_and_revolution_consolidation_short|q$')]が高まるほど、[GetLawType('law_council_republic').GetName]ではない[Concept('concept_country','$concept_countries|q$')]は、[ROOT.GetCountry.GetAdjectiveNoFormatting]との外交と交易を受け入れやすくなる。"
