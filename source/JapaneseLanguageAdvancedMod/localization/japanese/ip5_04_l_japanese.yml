 reform_or_revolution.1.d:0 "[SCOPE.gsInterestGroup('trade_unions_ig').GetName]の政治的権利が拡大したことで、国際的な[SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid,SCOPE.sPoliticalMovement('socialist_movement_scope').GetName,'movement_socialist')]が隆盛を迎えている。工業化された世界各地では、労働者の大衆組織が台頭し、労働運動の大義を推し進めている。"
 reform_or_revolution.1.f:0 "「深紅に染まれり人民の旗は、\n斃れし我らの殉難者を幾たびと包んできた。\nその手足が硬く冷たくなるより先に、\n心臓の血が旗を余さず染めあげた。\nいざ、高く掲げよ緋色の旗を。\nその陰にて、我らは生き、そして死なん。\n臆病者がたじろぎ、裏切り者が嘲ろうとも、\n我らはこの地に、赤き旗をなびかせ続ける」\n\n―ジム・コネル、『#italic 赤旗の歌#!』"
 reform_or_revolution.1.a:0 "社会革命万歳！"
 reform_or_revolution.1.b:0 "自由、平等、そして労働者の権利を！"
 reform_or_revolution.1.c:0 "秩序の敵に語る言葉などない。"
 reform_or_revolution.2.t:0 "目的こそがすべて"
 reform_or_revolution.2.d:0 "革命の動きが世界各地に広がったことにより、国際的な[SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid,SCOPE.sPoliticalMovement('socialist_movement_scope').GetName,'movement_socialist')]内部の緊張はさらに高まり、ついにその決着を見た。穏健派や改革派は、かつて所属していた政党が革命へと身を投じるなか、国家の統一を守ろうとする組織へと逃れていったのである。"
 reform_or_revolution.2.f:0 "断罪された者たちが次々と壇上に引き出され、めいめいが多数派へ向けて弁明を口にした。だが、観衆からは「裏切り者！」や「戦争屋！」といった罵声が砲撃のように降り注ぎ、その怒号の衝撃が、彼らの携えてきた弁明を掻き消していった。\n\n「諸君は私に死刑を宣告したつもりでいる。だが、それは思い違いだ！」最後に引き出された男が叫んだ。彼は一同のなかでもっとも高位にあり、その声は十人分にも匹敵するものだった。それが今や群衆の喚声に遮られ、途切れ途切れにしか聞こえない。「今日、諸君が私を憎むのは、いまだ私を愛しているからだ！私は人生の12年を諸君のために捧げてきた！これで私を葬ったと思うな！社会主義とは、人の心根に宿るものだ。私の党員証を取り上げたところで、私の信念まで奪えると思うな。私は社会主義者だ。これからも、ずっとそうであり続ける！」"
 reform_or_revolution.2.a:0 "反逆の気運は、至るところで高まっている。インターナショナル万歳！"
 reform_or_revolution.2.b:0 "狂人どもの暴力が、我々の築き上げてきたすべてを脅かしている。"
 reform_or_revolution.2.c:0 "また社会主義者の分裂か？"
 reform_or_revolution.3.t:0 "社会民主主義の危機"
 reform_or_revolution.3.d:0 "国際的な[SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid,SCOPE.sPoliticalMovement('socialist_movement_scope').GetName,'movement_socialist')]の内部で、改革派と革命派のあいだの緊張がついに頂点に達した。自国の政府へとますます接近していく党の姿勢に憤った反議会主義派や革命派の諸分派が、相次いで従来の社会主義政党から袂を分かっていったのである。"
 reform_or_revolution.3.d_1:0 "国際的な[SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid,SCOPE.sPoliticalMovement('socialist_movement_scope').GetName,'movement_socialist')]の内部で、改革派と革命派のあいだの緊張がついに頂点に達した。戦時にあってなお自国の政府に忠実であり続ける党の姿勢に憤った革命的社会主義者たちが、戦争に反対すべく、対抗組織を結成したのである。"
 reform_or_revolution.3.f:0 "「革命の時代は、プロレタリア社会主義の尽きせぬ泉から、新たな組織の形を生み出すだろう。来たるべき大いなる使命にふさわしい、新たな形を。我々は、ただちにこの仕事に取りかかる――狂ったように吠えたてる機関銃の轟き、崩れ落ちる大聖堂、資本家の犬どもの愛国的な咆哮、そのただなかで。この地獄めいた死の音楽のなかにあってなお、我々は澄んだ理性を、曇りなき眼差しを保ち続ける。我々こそが、未来を切り拓く唯一の創造的な力なのだ。我々はすでに数多く、見た目よりもはるかに多い。今日より明日、我々はさらに数を増すだろう。そして明後日には、幾百万もの人々が、我々の旗のもとに立ち上がるだろう――『共産党宣言』から67年を経た今でもなお、自らを縛る鎖のほかに失うものを持たぬ、幾百万もの人々が」\n\n―レフ・トロツキー、『#italic 戦争とインターナショナル#!』"
 reform_or_revolution.3.a:0 "我々が勝ち取った成果は、失うにはあまりに尊い。"
 reform_or_revolution.3.b:0 "労働者に祖国なし！国内休戦を許すな！"
 reform_or_revolution.3.c:0 "また社会主義者の分裂か？"
 socialist_movement_is_reformist_tt:0 "[ROOT.GetCountry.GetName]の[SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid,SCOPE.sPoliticalMovement('socialist_movement_scope').GetName,'movement_socialist')]は#b 改革派#!寄りである"
 socialist_movement_is_revolutionary_tt:0 "[ROOT.GetCountry.GetName]の[SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid,SCOPE.sPoliticalMovement('socialist_movement_scope').GetName,'movement_socialist')]は#b 革命派#!寄りである"
 ip5_historical_agitators.1.t:0 "所有とは盗みである"
 ip5_historical_agitators.1.d:0 "[SCOPE.sCharacter('historic_agitator_scope').GetFullName]は、自称[GetIdeology('ideology_anarchist').GetName]および相互主義者で、利益、利子、および統治を批判する一連の論文を発表した。[SCOPE.sCharacter('historic_agitator_scope').GetSheHe|U]は資本主義経済に対抗するため、自由な協同組合による体制の確立を提唱している。"
 ip5_historical_agitators.1.f:0 "「あなた方はカトリック主義も、君主制も、貴族制も望まないが、神、宗教、独裁、検閲、階級制度、区別、位階は必要としている。私は、あなた方の神、権威、主権、司法国家、そしてあらゆる代表制の欺瞞を否定する」\n\n―ピエール＝ジョゼフ・プルードン、『#italic 貧困の哲学#!』"
 ip5_historical_agitators.1.a:0 "私を支配しようとするものは、誰であれ敵とみなす。"
 ip5_historical_agitators.1.b:0 "彼は総合的な存在であろうとしているが、複合的な誤りにすぎない。"
 marx_events.2.t:0 "[GetGlobalVariable('big_communism_builder').GetCharacter.GetFullNameNoFormatting]の墓"
 marx_events.2.d:0 "[GetGlobalVariable('big_communism_builder').GetCharacter.GetIdeology.GetName]の革命家であり、科学的社会主義を体系化した人物、[GetGlobalVariable('big_communism_builder').GetCharacter.GetFullName]が死去した。[GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis|U]が$movement_socialist$で得た友人や支持者たちは、[SCOPE.sState('grave_scope').GetCityHubName]でその葬儀を執り行った。"
 marx_events.2.d_1:0 "[GetGlobalVariable('big_communism_builder').GetCharacter.GetIdeology.GetName]の革命家であり、科学的社会主義を体系化した人物、[GetGlobalVariable('big_communism_builder').GetCharacter.GetFullName]が死去した。[GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis|U]が$movement_socialist$で得た友人や支持者たちは、[GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis]の故郷である[SCOPE.sState('grave_scope').GetForestryHubName]でその葬儀を執り行った。"
 marx_events.2.f:0 "「…そしてその結果、 [GetGlobalVariable('big_communism_builder').GetCharacter.GetLastNameNoFormatting]は、[GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHis]の時代において最も憎悪され、最も中傷された[GetGlobalVariable('big_communism_builder').GetCharacter.GetWomanMan]となった。絶対主義政府も共和制政府も、[GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHim]を自国の領土から追放した。ブルジョワ階級は、保守派から超民主主義派いたるまで、まるで競うように[GetGlobalVariable('big_communism_builder').GetCharacter.GetHerHim]を中傷した。こうしたすべてを、[GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe]はクモの巣でも払うかのように払いのけて意に介さず、本当に必要に迫られたときだけは応じた。そして[GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe]は、シベリアの鉱山からカリフォルニアまで、ヨーロッパとアメリカのあらゆる地域にいる数百万の革命の同志から愛され、敬われ、悼まれながら世を去った。そしてあえて言っておくが、[GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe]には多くの反対者がいたものの、[GetGlobalVariable('big_communism_builder').GetCharacter.GetSheHe]には個人的な敵はほとんどいなかった」"
 marx_events.2.a:0 "亡き友よ、生ける友よ、我らは最後の目的へ向かって進もう。"
 marx_events.2.b:0 "その名は歴史に刻まれる。"
 marx_events.2.c:0 "もしこれが数十年前に起きていたなら…"
 marx_events.3.t:0 "没落と興隆"
 marx_events.3.d:0 "[SCOPE.sCharacter('marx_scope').GetFullName]は、近代政治経済学を包括的に批判する著作の執筆に取りかかった。[SCOPE.sCharacter('marx_scope').GetHerHis|U]の手法は、まず政治経済学の全体像を大まかに捉え、次にその抽象的な要素を詳しく分析したうえで、最後に一つの体系として再構築するというものである。"
 marx_events.3.f:0 "「かなり進んでいるので、あと5週間もあれば#italic この忌々しい経済学#!をすべて終えられるだろう。それが済んだら、家で経済学の草稿を書き上げ、博物館では別の学問に没頭するつもりだ。もうこの学問にはうんざりしてきた。個別の論題については極めて複雑な問題の研究が数多く進められているとはいえ、本質的にはアダム・スミスやデヴィッド・リカードから進歩していないのだ」\n\n―カール・マルクスからフリードリヒ・エンゲルスへ宛てた書簡、1851年"
 marx_events.3.a:0 "大事業が待ち受けている。"
 marx_events.3.b:0 "彼の計画に支援を。"
 marx_events.3.c:0 "彼はその前にすべきことがある。"
 marx_events.4.t:0 "首都"
 marx_events.4.d:0 "[SCOPE.sCharacter('capital_publisher_scope').GetFullName]は、近代政治経済学を詳細に批判した『#italic 資本論#!』の第1巻を出版した。この著作は、[SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid,SCOPE.sPoliticalMovement('socialist_movement_scope').GetName,'movement_socialist')]の理論体系における中心的なものとして、たちまち重要な位置を占めた。"
 marx_events.4.d_1:0 "亡き[SCOPE.sCharacter('capital_author_scope').GetFullNameNoFormatting]の友人であり共同研究者でもあった[SCOPE.sCharacter('capital_publisher_scope').GetFullName]は、[SCOPE.sCharacter('capital_author_scope').GetLastNameNoFormatting]の『#italic 資本論#!』第1巻を遺稿として出版した。この著作は、[SelectLocalization(SCOPE.sPoliticalMovement('socialist_movement_scope').IsValid,SCOPE.sPoliticalMovement('socialist_movement_scope').GetName,'movement_socialist')]の理論体系における中心的なものとして、たちまち重要な位置を占めた。"
 marx_events.4.f:0 "[SCOPE.sCharacter('name_a_scope').GetFirstNameNoFormatting]は家主の本棚に目を走らせて、蔵書の題名と著者名を確認した。そこに並んでいたのは、おなじみの顔ぶれ――ルソー、フォイエルバッハ、ハインリヒ・ハイネ、スミス、シュトラウス、そしてシラーだった。一番端には茶色い革で装丁された分厚い本があり、その真新しい背表紙の中央には見覚えのある名前が輝いていた。\n\n「$marx_last$?は読んだか？」と彼はようやく机の向かい側にいる男に向き直って尋ねた。\n\n「もちろんだ」と[SCOPE.sCharacter('name_b_scope').GetFirstNameNoFormatting]は穏やかな表情で答えた。「君は読んだか？賃金が最低限の生活水準へと戻っていく傾向についての主張には、私もすっかり納得させられたよ…その気になれば、それについて論文を発表することもできる」"
 marx_events.4.a:0 "新たな武器が労働者の手に渡った。"
 marx_events.4.b:0 "#italic コモディティ#!とは？"
 marx_events.4.c:0 "[ROOT.GetCountry.GetNameNoFormatting]では役に立たない。"
