 rus_upgrade_secret_police:0 "秘密警察を再編"
 rus_upgrade_secret_police_desc:0 "[GetLawType('law_third_section').GetName]の旧態依然とした組織体制では、もはや帝国に迫る脅威に十分対処することはできない。この組織は解体し、代わってより近代的な機関を設立しなければならない。"
 modifier_formed_okhrana_positive:0 "オフラーナの設立"
 modifier_formed_okhrana_negative:0 "$modifier_formed_okhrana_positive$"
 reform_or_revolution_possible_tt:0 "活動中の#v $movement_socialist$#!または#v $party_socialist$#!を有する[Concept('concept_country','$concept_countries|q$')]が、世界の[Concept('concept_gdp','$concept_gdp_short|q$')]の#v 25%#!以上を支配している (現在[GetGlobalVariable('reform_or_revolution_countries_percent').GetValue|v%0]) "
 je_reform_or_revolution:0 "改革か革命か"
 je_reform_or_revolution_reason:0 "[GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName]の政治的権利が拡大したことで、国際的な#b $movement_socialist$#!が隆盛を迎えている。工業化された世界各地では、大衆的な#b 社会主義政党#!が出現し、生産手段の公有、民主的自由、搾取と社会的不平等の終焉といった、社会の抜本的変革を唱えている。\n\nこの運動は国際的な存在感を急速に高めたものの、その核心にはなお深い分裂が残っている。労働者階級が民主主義を勝ち取っていくなかで、この運動が持つ#bold 革命#!の伝統は、議会を通じた#bold 改革#!の可能性によって問い直されつつある。#b 社会主義#!は現状を漸進的に改善する道を示すのか、それとも現状を革命によって打倒する道を示すのか？\n\n@warning! 関与している[Concept('concept_country','$concept_countries|q$')]のうち、[GetPlayer.MakeScope.ScriptValue('reform_or_revolution_war_threshold')|0%v]を超える国々の間で[concept_war]が勃発すると、この[concept_journal_entry]は優勢な結果へ向けて#b 急速に進行#!する。"
 socialist_party_loc_present:0 "The [GetGlobalVariable('paramount_socialist_party_country_var').GetCountry.GetFlagTextIcon][GetGlobalVariable('paramount_socialist_party_var').GetParty.GetName] is the world's most influential #b $party_socialist$#!"
