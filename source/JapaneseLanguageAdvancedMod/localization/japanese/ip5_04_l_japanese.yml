 factory_councils.2.t:0 "[SCOPE.sCountry('commune_enemy_country').GetNameNoFormatting]での内戦"
 factory_councils.2.t_1:0 "労働者の[SCOPE.sState('commune_state').GetCityHubName]"
 factory_councils.2.t_2:0 "[SCOPE.sState('commune_state').GetStateRegion.GetNameNoFormatting]での内戦"
 factory_councils.2.d:0 "[SCOPE.sState('commune_state').GetCityHubName]で起こった労働者革命は、世界中の革命的社会主義者たちの大きな感心を呼んだ。[SCOPE.sCharacter('paris_commune_author').GetFullName]はこの革命についての著作を発表し、それを世界初の労働者階級による政治体制だとして称賛した。"
 factory_councils.2.f:0 "「労働者階級は、コミューンに奇跡を期待していたわけではない。彼らは、#italic 人民の布告によって#!導入すべき既成のユートピアなど持ち合わせていない。彼らは自らの解放、そして現在の社会が経済的な発展の中で必然的に向かいつつある、より高次の社会形態の実現には、長い闘争と歴史的な過程を経なければならないことを理解している。その過程では、社会の状況も人間自身も変化していくのである。彼らは実現すべき理想を持っているわけではない。彼らが解放すべきなのは、崩壊しつつある旧ブルジョア社会そのものが内包している、新たな社会の諸要素である。歴史における自らの使命を十分に自覚し、それを果たすために行動するという英雄的な決意をもって、労働者階級は、ペンを手にした紳士階級の取り巻きによる粗野な中傷や、善意を装ったブルジョア的教条主義者たちの教訓めいた後見人気取りを、笑って退けることができる。彼らは、科学的に正しいかのような口調で、無知な決まり文句や党派的な偏った主張をまき散らしているのである」\n\n―カール・マルクス、『#italic フランスの内乱#!』"
 factory_councils.2.a:0 "新たな社会が姿を現す。"
 factory_councils.2.b:0 "暗殺者と放火犯からなる無知な政権だ。"
