l_japanese:
 je_tsarpoints_master:0 "皇帝にして専制君主"
 je_tsarpoints_title:0 "[ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]の統治"
 je_tsarpoints_title_fallback:0 "皇帝にして専制君主"
 je_tsarpoints_master_reason:0 "#bold @tsarpoints![concept_tsarpoints] : \n#![concept_tsarpoints]は、#b $je_group_tsarpoints$#!および#b $je_group_russia_expansion$#!の[concept_journal_entry]グループや、数々の#tooltippable;tooltip:je_tsarpoints_additional_goals 重要なイベント#!によって#g 増加#!または#r 減少#!する。\n[concept_tsarpoints]は恒常的な#g ボーナス#!をもたらし、強力な[Concept('concept_ukaz','$concept_ukase|q$')]の制定を可能にする。ただし、[ROOT.GetCountry.GetName]が[Concept('concept_election','$concept_election_voting_franchise|q$')]を採用した場合、[Concept('concept_ukaz','$concept_ukase|q$')]の効果は大幅に低下する。\n\n[ROOT.GetCountry.GetCustom('tsarpoints_tsar_quote')]\n\n多くの者にとって、[ROOT.GetCountry.GetName]と[GetLawType('law_monarchy').GetName]は表裏一体の存在である。ツァーリは何世紀にもわたってこの国を統治してきた――はじめはモスクワから、そしてのちにはサンクトペテルブルクから。しかし、帝国体制の細部が絶えず変化してきたにもかかわらず、その根本にある一つの事実は変わらない。\n\n[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の権威は絶対であり、[ROOT.GetCountry.GetRuler.GetHerHis]の意志は必ず成し遂げられる。"
 je_tsarpoints_additional_goals:0 "以下のイベントにより、@tsarpoints![concept_tsarpoints]が#g 増加#!する : \n • #g 20#! : [GetStateRegion('STATE_EASTERN_THRACE').GetName]の都市、#b コンスタンティノープル#!を占領する\n • #g 10#! : #v $je_caucasian_war$#!で#b 勝利#!する\n\n以下のイベントにより、@tsarpoints![concept_tsarpoints]が#r 減少#!する : \n • #r 10#! : #v $je_caucasian_war$#!で#b 敗北#!する"
 tsarpoints_quote_nicholas_i:0 "「#italic 君主への愛と王位への献身が国民に根付いており、祖国の法律と確固たる行政が存在する国家においては、悪意ある者のあらゆる努力は無に帰するであろう#!」\n\n― ニコライ1世、『#italic 犯罪者を裁く最高刑事裁判所の設立に関する勅令#!』"
 tsarpoints_quote_alexander_ii:0 "「#italic 農奴制が下から自らを廃するのを待つよりも、上からこれを廃するほうがよい#!」\n\n― アレクサンドル2世、#italic モスクワ貴族への演説#!"
 tsarpoints_quote_nixa:0 "「#italic だが私は、我々の未来はすべてこれからなのだという思いに慰めを見いだしている。ここヨーロッパは夏だ。一方、ロシアはいまだ春であり、あらゆる混乱を抱えながらも、そこには希望があり、目覚めゆく命の最初の芽吹きがある。すべての仕事は、まだこれからなのだ#!」\n\n― ツァレーヴィチ・ニコライ・アレクサンドロヴィチの#italic 私信#!"
 tsarpoints_quote_alexander_iii:0 "「#italic だが、我らの深き悲しみのただ中にあっても、神の声は我らに命じている。神の摂理を信じ、専制権威の力と正しさを信じて、統治の務めに揺るぎなく立て、と。我らは民の幸福のため、この権威を肯定し、あらゆる侵害から守らねばならない#!」\n\n― アレクサンドル3世、『#italic 揺るぎなき専制政治に関する勅令#!』"
 tsarpoints_quote_nicholas_ii:0 "「#italic 私とロシア全土は、これからどうなってしまうのだろうか？私にはツァーリとなる備えができていない。そうなりたいと思ったことも一度もなかった。統治という務めについて、私は何一つ知らないのだ#!」\n\n― ニコライ2世の#italic 私信#!"
 tsarpoints_quote_alexei_ii:0 "「#italic ほかの子たちは何でも持っているのに、どうして僕には何もないの？#!」\n\n―アレクセイ2世"
 tsarpoints_quote_fallback:0 "#italic 至高の権力こそが「ロシア国家」という理念の守り手にして、ロシアの力と統一を体現するものである。ロシアが存続しうるとすれば、それはただ、ロシアをひとつに紡ぎ合わせ、崩壊から守ってきたこの権威を、すべての息子たちが心を合わせて守り抜こうとする不断の努力によってのみ可能となる。#!\n\n―ピョートル・ストルイピン"
 je_tsarpoints_status_loc:0 "@tsarpoints![concept_tsarpoints][JournalEntry.GetCountry.MakeScope.Var('tsarpoints_var').GetValue|v0]"
 modifier_tsarpoints:0 "皇帝の恩寵"
 je_tsarpoints_ruler_not_tsar_tt:0 "新たな[concept_character]が[ROOT.GetCountry.GetName]の[concept_ruler]になった"
 je_tsarpoints_subjecthood_abolished_tt:0 "[GetLawType('law_subjecthood').GetName]が存在#b しない#!"
 je_tsarpoints_citizenship_law_improved_tt:0 "[SCOPE.sLawType('tp_citizenship_law_current').GetName]よりも包摂的な[GetLawGroup('lawgroup_citizenship').GetName]の[concept_law]を制定している"
 notification_je_tp_mission_failed_name:0 "「[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]」を放棄"
 notification_je_tp_mission_failed_desc:0 "国内情勢の変化を受け、「#b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#!」で掲げられた方針は撤回されました。その結果、[concept_tsarpoints]が[GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]#r 減少#!しました。"
 notification_je_tp_mission_failed_favorite_died_name:0 "「[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]」を放棄"
 notification_je_tp_mission_failed_favorite_died_desc:0 "[concept_ruler]の寵臣が、「#b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#!」で掲げられた目標が達成される前に死去しました。その結果、[concept_tsarpoints]が[GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]#r 減少#!しました。"
 notification_je_tp_mission_failed_favorite_dismissed_name:0 "「[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]」を放棄"
 notification_je_tp_mission_failed_favorite_dismissed_desc:0 "[concept_ruler]の寵臣が、「#b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#!」で掲げられた目標が達成される前に君主の信頼を失いました。その結果、[concept_tsarpoints]が[GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]#r 減少#!しました。"
 notification_je_tp_mission_failed_new_ruler_name:0 "「[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]」を放棄"
 notification_je_tp_mission_failed_new_ruler_desc:0 "[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetCountry.GetName]の先代[concept_ruler]は、「#b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#!」で掲げた目標を達成できないまま退任しました。その結果、[concept_tsarpoints]が[GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]#r 減少#!しました。"
 notification_je_tp_rasputin_mission_failed_name:0 "「[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]」に失敗"
 notification_je_tp_rasputin_mission_failed_desc:0 "[SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetCountry.GetName]の[concept_ruler]は、「#b [SCOPE.sJournalEntry('je_tp_failed_mission_scope').GetName]#!」で掲げた目標を達成できませんでした。その結果、[concept_tsarpoints]が[GetPlayer.MakeScope.ScriptValue('tsarpoints_value_low')|v0]#r 減少#!しました。"
 notification_je_tp_mission_partial_completed_name:0 "[SCOPE.sJournalEntry('je_tp_partial_mission_scope').GetName]を一部完了"
 notification_je_tp_mission_partial_completed_desc:0 "[SCOPE.sJournalEntry('je_tp_partial_mission_scope').GetCountry.GetName]の先代の[concept_ruler]は、#b [SCOPE.sJournalEntry('je_tp_partial_mission_scope').GetName]#!という自らの課題を最後まで果たせなかったものの、一定の進展は遂げました。それにより、@tsarpoints![concept_tsarpoints]を#v [SCOPE.sJournalEntry('je_tp_partial_mission_scope').MakeScope.Var('tp_partial_reward_var').GetValue|0]#!獲得しました。"
 notification_je_tp_mission_completed_name:0 "[SCOPE.GetRootScope.GetJournalEntry.GetName]完了"
 notification_je_tp_mission_completed_desc:0 "[SCOPE.GetRootScope.GetJournalEntry.GetCountry.GetName]が#b [SCOPE.GetRootScope.GetJournalEntry.GetName]#!の課題を完了し、@tsarpoints![concept_tsarpoints]を#v [SCOPE.GetRootScope.GetJournalEntry.GetCountry.MakeScope.Var('tp_last_mission_reward').GetValue|0]#!獲得しました。"
 notification_je_tp_war_mission_completed_name:0 "「#b $je_tp_fav_war_concluded$#!」を完了"
 notification_je_tp_war_mission_completed_desc:0 "[SCOPE.GetRootScope.GetJournalEntry.GetCountry.GetName]は、「#b $je_tp_fav_war_concluded$#!」で掲げた目標を達成し、#v [SCOPE.GetRootScope.GetJournalEntry.GetCountry.MakeScope.Var('tp_last_mission_reward').GetValue|0]#!@tsarpoints![concept_tsarpoints]を獲得しました。"
 notification_je_tp_greek_joined_name:0 "[SCOPE.sCountry('greek_target_country_scope').GetName]がエノシスを受諾"
 notification_je_tp_greek_joined_desc:0 "皇帝の呼びかけに応じ、[SCOPE.sCountry('greek_target_country_scope').GetName]は自国の領土を#b $dyn_c_empire_of_the_hellenes$#!に加えることに同意しました。"
 notification_je_tp_greek_refused_name:0 "[SCOPE.sCountry('greek_target_country_scope').GetName]がエノシスを拒否"
 notification_je_tp_greek_refused_desc:0 "[SCOPE.sCountry('greek_target_country_scope').GetName]は愚かにも#b $dyn_c_empire_of_the_hellenes$#!への参加を拒みました。"
