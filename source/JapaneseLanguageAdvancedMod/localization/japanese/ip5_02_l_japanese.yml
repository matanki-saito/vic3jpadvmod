 je_tp_pool_build_navy:0 "海軍力の強化"
 je_tp_pool_build_navy_reason:0 "[ROOT.GetCountry.GetName]が世界的大国となるには、自国周辺の海域を越えて軍事力を展開できなければならない。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、世界の海軍大国に肩を並べるべく、大規模な近代化と造船計画を推し進めようとしている。その構想では、自らの威信を象徴する先進的な艦艇が[ROOT.GetCountry.GetAdjectiveNoFormatting]海軍の主力を担うことになる。"
 je_tp_pool_build_navy_goal:0 "海軍の[concept_power_projection]を[ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_build_navy_power_projection_increase_value')|v0%]増加させた"
 russia_has_at_least_x_states_tt:0 "[GetPlayer.GetName]がこの[concept_strategic_region]で[GetPlayer.MakeScope.ScriptValue('tsarpoints_build_army_min_states_per_region_value')|v0]以上の[Concept('concept_state','$concept_states|q$')]を所有"
 je_tp_fav_finance:0 "経済の自由化"
 je_tp_fav_finance_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]の現在の[concept_favorite]、[SCOPE.sCharacter('fav_character_scope').GetFullName]は、確固たる経済自由主義者であり、国家による[ROOT.GetCountry.GetAdjective]経済の掌握が企業活動を妨げていると考えている。そのため、[SCOPE.sCharacter('fav_character_scope').GetCustom('getGospodinGospozha')]・[SCOPE.sCharacter('fav_character_scope').GetLastName]は、多くの国営企業を民間に売却し、自由主義的な経済法を成立させるべきだと主張している。"
 je_tp_fav_finance_privatise_tt:0 "[ROOT.GetCountry.GetName]の民営化可能な施設のうち、少なくとも[ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_privatised_buildings_percent_value')|v0%]以上が#b 民間所有#!となっている (現在 : [ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_privatized_buildings_current_value')|v0%]) "
