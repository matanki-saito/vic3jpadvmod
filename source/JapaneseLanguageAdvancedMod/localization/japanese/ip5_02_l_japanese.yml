 springtime_liberal_country_expanded_tt:0 "[concept_country]が自由主義の[Concept('concept_revolution','$concept_revolutionary|q$')]政府を擁するための条件 : \n$EFFECT_LIST_BULLET$ #v $je_springtime_of_the_peoples$#!で#b 保守派#!が勝利したことが#b ない#!\n$EFFECT_LIST_BULLET$ #v $je_red_summer$#!で#b 反革命派#!が勝利したことが#b ない#!\n$EFFECT_LIST_BULLET$以下のいずれかを満たしている : #indent_newline:3 \n$EFFECT_LIST_BULLET$ [concept_revolution]に成功したことがある\n$EFFECT_LIST_BULLET$ #v $je_red_summer$#!の[concept_journal_entry]が有効である\n$EFFECT_LIST_BULLET$ #v $je_red_summer$#!で#b 自由主義#!または#b 急進主義#!が勝利したことがある\n$EFFECT_LIST_BULLET$以下のすべてを満たしている : #indent_newline:3 \n$EFFECT_LIST_BULLET$最近[concept_revolution]または[concept_coup]が起きた\n$EFFECT_LIST_BULLET$ $has_census_voting_or_universal_suffrage_tt$\n$EFFECT_LIST_BULLET$ $has_national_guard_or_guaranteed_liberties_tt$\n$EFFECT_LIST_BULLET$ $has_right_of_assembly_or_protected_speech_tt$#!#!\n\n#tooltippable;tooltip:[GetPlayer.GetTooltipTag],springtime_revolutionary_countries_list_tt 現時点で自由主義の[Concept('concept_revolution','$concept_revolutionary|q$')]政府を擁する[Concept('concept_country','$concept_countries|q$')]#!"
