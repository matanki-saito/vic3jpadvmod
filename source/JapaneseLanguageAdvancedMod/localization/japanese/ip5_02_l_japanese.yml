 je_tp_fav_worldwide_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]の現在の[concept_favorite]、[SCOPE.sCharacter('fav_character_scope').GetFullName]は、[SCOPE.sPoliticalLobby('favourite_lobby').GetName]を熱心に支持している。[SCOPE.sCharacter('fav_character_scope').GetSheHe|U]は[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]に対し、[SCOPE.sCharacter('fav_character_scope').GetHerHis]の望む外交政策の利点を説き、それこそが世界の舞台における[ROOT.GetCountry.GetAdjective]の威信と影響力を確保する最善の道だと主張している。"
 je_tp_fav_war:0 "[SelectLocalization(SCOPE.sCountry('war_target_scope').IsValid,Concatenate3(SCOPE.sCountry('war_target_scope').GetAdjectiveNoFormatting,' ',SCOPE.sCountry('war_target_scope').GetRuler.GetPrimaryRoleTitle),'je_tp_fav_war_enemy')]を屈服させる"
 je_tp_fav_war_concluded:0 "敵を屈服させる"
 je_tp_fav_war_enemy:0 "敵"
 je_tp_fav_war_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]の現在の[concept_favorite]、[SCOPE.sCharacter('fav_character_scope').GetFullName]は、[SCOPE.sCountry('war_target_scope').GetName]を[ROOT.GetCountry.GetAdjective]の利益に対する明白な脅威と見なしており、[concept_battle]では彼らと戦う部隊を自らが率いると[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]に申し出るまでに至っている。"
 je_tp_fav_war_complete_tt:0 "[ROOT.GetCountry.GetName]が[SCOPE.sCountry('war_target_scope').GetName]に対する[concept_war_goal]を達成した"
 je_tp_fav_war_personal_victory_tt:0 "[SCOPE.sCharacter('fav_character_scope').GetFullName]が自ら部隊を率いて[SCOPE.sCountry('war_target_scope').GetName]との[concept_battle]に勝利したため : "
 je_tp_fav_war_no_personal_victory_tt:0 "さらに、[SCOPE.sCharacter('fav_character_scope').GetSheHe]が自ら部隊を率いて[SCOPE.sCountry('war_target_scope').GetName]との[concept_battle]に勝利した場合 : "
