 gospozha_loc:0 "ゴスポジャ"
 je_tp_tsar_button_advance_agenda_tt:0 "この[concept_journal_entry]の#b 完了した課題#!を#v 1#!進める"
 je_tp_tsar_gendarme_of_europe_button_1_name:0 "神聖同盟を強化"
 je_tp_tsar_gendarme_of_europe_button_1_desc:0 "#b 神聖同盟#!はナポレオン戦争後に成立した保守的な同盟であり、その目的は自由主義的・革命的な思想や運動の発展を阻止することにあった。\n\n[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、この保守的な同盟網を[GetGeographicRegion('geographic_region_europe').GetName]における政治的安定を維持するための重要な要素とみなし、革命によるあらゆる騒乱を鎮圧するために利用しようとしている。"
 je_tp_tsar_gendarme_of_europe_button_2_name:0 "反体制的な分子への対処"
 je_tp_tsar_gendarme_of_europe_button_2_desc:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、自由主義者を自称するクーデター主義者や[GetCulture('polish').GetName]の反乱者と対峙した経験から、もともと自由主義に対して否定的だった自身の考えをさらに強め、反体制分子に対して偏執的ともいえる恐怖を抱くようになった。首謀者が実在するかどうかにかかわらず、その者たちが銃殺されるか投獄されるまで、安らぐことはできない。"
 je_tp_tsar_gendarme_of_europe_button_3_name:0 "正教の擁護"
 je_tp_tsar_gendarme_of_europe_button_3_desc:0 "「正教・専制・国籍」の中で、第一に掲げられるのは[GetReligion('orthodox').GetName]である。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、いまだ支配の及ばない極東での宣教活動や、西方のキリスト教諸派から正教への改宗を進めることで、帝国辺境における正教の基盤を強化したいと考えている。"
 je_tp_tsar_gendarme_of_europe_button_4_name:0 "ロシアの影響力を拡大"
 je_tp_tsar_gendarme_of_europe_button_4_desc:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、ヨーロッパにおける安定とウィーン会議後の現状の維持に尽力している一方で、[ROOT.GetCountry.GetName]の南部および東部国境に対してはより柔軟な姿勢を取っている。"
 je_tp_tsar_unshakable_autocracy_button_1_name:0 "専制権力の強化"
 je_tp_tsar_unshakable_autocracy_button_1_desc:0 "先代が持っていた改革派の気質は、息子である[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]には受け継がれなかった。[ROOT.GetCountry.GetRuler.GetFirstNameNoFormatting]は、自由主義へのあらゆる譲歩を[ROOT.GetCountry.GetAdjective]君主制をむしばむ毒であるとみなし、伝統的な秩序を脅かすものをすべて排除しようとしている。"
 je_tp_tsar_unshakable_autocracy_button_2_name:0 "ロシア民族主義の受容"
 je_tp_tsar_unshakable_autocracy_button_2_desc:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]である[ROOT.GetCountry.GetRuler.GetFirstName]はロシア民族主義の理念を体現し、深く傾倒しており、髭をたくわえて、西洋の影響を受けた宮廷儀礼を退けている。[ROOT.GetCountry.GetRuler.GetSheHe|U]は正教徒のロシア人による正教のロシアを望み、ユダヤ人、ポーランド人、その他の民族を警戒している。"
 je_tp_tsar_unshakable_autocracy_button_3_name:0 "鉄の道"
 je_tp_tsar_unshakable_autocracy_button_3_desc:0 "鉄道は、国家の力を行き渡らせる手段としてその価値を証明している。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]である[ROOT.GetCountry.GetRuler.GetFirstName]は[ROOT.GetCountry.GetName]の鉄道網を支えるために必要な産業を育成し、外国の産業品への依存を減らそうとしている。"
 je_tp_tsar_unshakable_autocracy_button_4_name:0 "武力による平和"
 je_tp_tsar_unshakable_autocracy_button_4_desc:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、陸軍で過ごした経験から、戦争における腐敗と惨禍を強く嫌悪している。[ROOT.GetCountry.GetRuler.GetSheHe|U]は十分な軍備によって平和を維持する政策を追求し、[ROOT.GetCountry.GetAdjective]の目的を達成するために外交的手段を重視している。"
