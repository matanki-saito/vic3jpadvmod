 je_tp_fav_rasputin_reason:0 "#italic 「神はあなたの涙をご覧になり、祈りを聞き届けられた。悲しまなくていい。坊やは死なないから。医者たちがあまり坊やを煩わせないようにしなさい」―グリゴリー・ラスプーチン#!\n\n [SCOPE.sCharacter('fav_character_scope').GetFullName]は、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]である[ROOT.GetCountry.GetRuler.GetFirstName]の現在の[concept_favorite]である。宮廷医たちにも救えなかった[SCOPE.sCharacter('alexei_scope').GetFullNameWithTitle]を死の淵から救い出したことで、[ROOT.GetCountry.GetCustom('get_rus_consort_title')]から篤い崇敬を寄せられている。[SCOPE.sCharacter('fav_character_scope').GetLastNameNoFormatting]の療法はひどく風変わりだが、この祈祷師の手に委ねられてから、[SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting]の容体は目に見えて好転した。[ROOT.GetCountry.GetCapital.GetCityHubName]で[SCOPE.sCharacter('fav_character_scope').GetLastNameNoFormatting]の影響力が増すにつれ、多くの者が[SCOPE.sCharacter('fav_character_scope').GetHerHis]の解任を求めるようになった。だが、[ROOT.GetCountry.GetCustom('get_rus_consort_title')]は頑として譲らない。[SCOPE.sCharacter('fav_character_scope').GetFullNameNoFormatting]を手放してはならない――[SCOPE.sCharacter('fav_character_scope').GetHerHis|U]の癒やしなくして、[SCOPE.sCharacter('alexei_scope').GetFirstNameNoFormatting]が生き延びる道はないのだ。[SCOPE.sCharacter('fav_character_scope').GetLastNameNoFormatting]を遠ざければ、幼き[SCOPE.sCharacter('alexei_scope').GetPrimaryRoleTitle]の悲運は決定的なものとなるだろう。"
