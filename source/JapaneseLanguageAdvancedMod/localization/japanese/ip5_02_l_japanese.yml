 je_tp_pool_build_army:0 "陸軍の強化"
 je_tp_pool_build_army_reason:0 "偉大なる[ROOT.GetCountry.GetAdjective]陸軍は、帝国の誇りであり、国家の中核であり、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の意思を実行するための手段である。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、愛する陸軍がヨーロッパで比類なき軍事力であり続け、[ROOT.GetCountry.GetNameNoFormatting]のあらゆる国境を防衛できるようにすることを望んでいる。"
