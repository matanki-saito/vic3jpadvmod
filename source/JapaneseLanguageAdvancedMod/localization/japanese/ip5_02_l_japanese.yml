 je_tsarpoints_button_1_name:0 "皇帝大権を行使"
 je_tsarpoints_button_1_desc:0 "[ROOT.GetCountry.GetName]のために法案を起草・施行するには、#b 国家評議会#!や#b 第二部#!の法学者との協議を含む、しばしば骨の折れる過程を経なければならない。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]がある案件を特に重要であると判断した場合、[ROOT.GetCountry.GetRuler.GetSheHe]は[concept_tsarpoints]を行使し、[ROOT.GetCountry.GetRuler.GetHerselfHimself]または[ROOT.GetCountry.GetRuler.GetHerHis]の[concept_favorite]が支持する[concept_law]の[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')]を早めることができる。"
 je_tsarpoints_button_1_short_desc:0 "我が意志により、この法の制定を速やかに進めよ。何人たりともこれを遅らせることを許さぬ…"
 je_tsarpoints_button_1_desc_tt:0 "[ROOT.GetCountry.GetNameNoFlag]で現在制定中の法律の[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')]が#v 2#![Concept('concept_enactment_phase','$concept_enactment_phases_short|q$')]進行する"
 currently_enacting_law_favored_by_tsar_tt:0 "[concept_ruler]は、[ROOT.GetCountry.GetLawBeingEnacted.GetName]の[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')]を[Concept('concept_endorse_oppose','$concept_endorsed|q$')]している"
 currently_enacting_law_favored_by_favorite_tt:0 "[concept_favorite]は、[ROOT.GetCountry.GetLawBeingEnacted.GetName]の[Concept('concept_enactment_of_laws','$concept_enactment_of_laws_enactment|q$')]を[Concept('concept_endorse_oppose','$concept_endorsed|q$')]している"
 je_tsarpoints_button_2_name:0 "地方文化を抑圧"
 je_tsarpoints_button_2_desc:0 "帝国の西部辺境に近づくにつれ、[GetCulture('russian').GetName]語の優勢は薄れ、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]政府が逸脱した方言群とみなす言語へと次第に移り変わっていく。#b $language_east_slavic$#!または#b $language_west_slavic$#![concept_culture]の[concept_fervor]が高まり、脅威となった場合、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は[concept_tsarpoints]を行使し、その言語による出版、上演、教育を抑圧できる。"
 je_tsarpoints_button_2_short_desc:0 "分離主義者とポーランド系勢力の危険な活動を抑え込むためだ…"
 je_tsarpoints_button_2_name_tt_1:0 "選択した#b $language_east_slavic$#!または#b $language_west_slavic$#![concept_culture]の[concept_fervor]を即座に#v 5#!低下させ、さらに$concept_fervor$に#v -10#!の比例補正を追加する"
 je_tsarpoints_button_2_name_tt_2:0 "選択した[concept_culture]に属する[GetPopType('academics').GetName][Concept('concept_pop','$concept_pops|q$')]のうち、[GetPlayer.MakeScope.ScriptValue('large_radicals')|-=1%]がより[concept_radical]に傾く"
 je_tsarpoints_can_suppress_any_slavic_culture_tt:0 "[ROOT.GetCountry.GetNameNoFlag]またはその[Concept('concept_subject','$concept_subjects|q$')]のいずれかが、[GetCulture('russian').GetName]以外の#b $language_east_slavic$#!または#b $language_west_slavic$#![concept_culture]に属する[concept_homeland][concept_state]を領有しており、その文化はまだ抑圧されていない"
 je_tsarpoints_culture_not_suppressed_tt:0 "この[concept_culture]はまだ抑圧されていない"
 je_tsarpoints_button_3_name:0 "宗主権を強化"
 je_tsarpoints_button_3_desc:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は、自らの臣民ひとりひとりを単独で統治しているわけではない。多様な帝国辺境においてロシアの支配を維持するには、小君主たちの協力が欠かせない。公、カーン、アガ＝スルタン、シャムハル――いかなる称号を帯びていようとも、[concept_tsarpoints]を行使すれば、彼らに[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]への忠誠を思い起こさせることができる。"
 je_tsarpoints_button_3_short_desc:0 "我はこれらの領地を統べる、世襲の主権者にして支配者…"
 modifier_tsarpoints_liberty_desire_boost:0 "見守る父"
 modifier_tsarpoints_ig_boost:0 "帝国の経済的援助"
 je_tsarpoints_button_4_name:0 "政府への信任を表明"
 je_tsarpoints_button_4_desc:0 "民衆が[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]に向ける崇敬は、[ROOT.GetCountry.GetRuler.GetHerHis]の閣僚たちにまで及ぶとは限らない。善良な[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]を悪しき助言者が惑わしているという構図は、帝国の農民なら誰もが知っている。[GetPlayer.GetCustom('country_legislature_name')]の取り組みが大小さまざまな勢力に妨げられているなら、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は自らの[concept_tsarpoints]を用い、[ROOT.GetCountry.GetRuler.GetHerHis]の閣僚たちが変わらず[ROOT.GetCountry.GetRuler.GetHerHis]の信任を得ていること、そして不安を覚える必要などないことを、民衆に示すことができる。"
 je_tsarpoints_button_4_short_desc:0 "[GetPlayer.GetCustom('country_legislature_name')|U]は、然るべき手配を遺漏なく整えてくれるだろう…"
 modifier_tsarpoints_legitimacy_boost:0 "皇帝の信任を付与"
 je_tsarpoints_button_5_name:0 "利益集団を後援"
 je_tsarpoints_button_5_desc:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の真の権力は、[ROOT.GetCountry.GetRuler.GetHerHis]の意のままに、ある有力な勢力を別の勢力よりも高く引き上げる能力に由来する。[GetPlayer.GetCustom('country_legislature_name')]内の特定の人物を支持して[ROOT.GetCountry.GetRuler.GetHerHis]の[concept_tsarpoints]を行使することで、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は、その人物と結びついた勢力が持つ[concept_clout]を高めることができる。"
 je_tsarpoints_button_5_short_desc:0 "栄えある大臣の称賛すべき功績に耳目を集めよう…"
 je_tsarpoints_button_6_name:0 "細かな勅令の執行を強化"
 je_tsarpoints_button_6_desc:0 "広大な帝国を統治するため、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は地方のさまざまな取り組みや懸案に関する意思決定に、膨大な時間を費やさなければならない。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]が望むなら、[ROOT.GetCountry.GetRuler.GetSheHe]は[concept_tsarpoints]を用い、細かな決定が迅速かつ効果的に実行されるよう、より多くの資源を投じることができる。"
 je_tsarpoints_button_6_short_desc:0 "我らは、これらの要請にただちに応える揺るぎなき決意をもって…"
 je_tsarpoints_button_7_name:0 "意に沿う支配者を据える"
 je_tsarpoints_button_7_desc:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]には野心ある息子たちがあふれ、その周辺の小規模な宮廷にも忠実な工作員が多数潜んでいる。女帝エカチェリーナがポーランド王位に傀儡の王を据えたように、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]も自らの[concept_tsarpoints]を行使し、[ROOT.GetCountry.GetName]の従属国の支配者を、より友好的な候補者にすげ替えることができる。[ROOT.GetCountry.GetAdjectiveNoFormatting]宮廷の息子たち、バルトから来た[GetCulture('east_german').GetName]人の冒険者、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]に忠実な現地の権利主張者は、いずれも皆、友好的な候補者となりうる。"
 je_tsarpoints_button_7_short_desc:0 "この者の失態はもはや誰の目にも明らかであり、その王座は実質すでに空位となった…"
 enables_install_ruler_action_tt:0 "[concept_diplomatic_action]「#b $da_tsarpoints_install_subject_ruler_action_name$#!」が#v 1#!回使用可能になる"
 da_tsarpoints_install_subject_ruler:0 "意に沿う支配者を据える"
 da_tsarpoints_install_subject_ruler_desc:0 "我々の[Concept('concept_subject','$concept_subjects|q$')]のいずれかの王座に、我々自身が選んだ支配者を据える。この措置は#b $je_tsarpoints_button_7_name$#![concept_ukaz]により認められる。各[concept_ukaz]につき、任命は1回限りである。"
 tsarpoints_install_ruler_requires_ukaz_tt:0 "#b $je_tsarpoints_button_7_name$#![concept_ukaz]が発布されている"
