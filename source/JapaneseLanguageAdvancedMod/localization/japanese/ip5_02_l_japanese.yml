 decree_encourage_resource_industry_tsarpoints:0 "地方採取業の振興"
 decree_encourage_resource_industry_tsarpoints_desc:0 "管区内の資源部門の生産量を高めるため、奨励策を実施する。"
 decree_greener_grass_campaign_tsarpoints:0 "再定住の助成"
