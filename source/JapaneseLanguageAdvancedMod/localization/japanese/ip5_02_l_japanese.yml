 je_tp_fav_bootlicker_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]の現在の[concept_favorite]、[SCOPE.sCharacter('fav_character_scope').GetFullName]は、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]が個人的に支持を表明している[Concept('concept_law','$concept_laws|q$')]を推進することで、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]にとって欠かせない存在になろうとしている。加えて、[SCOPE.sCharacter('fav_character_scope').GetCustom('getGospodinGospozha')|l]・[SCOPE.sCharacter('fav_character_scope').GetLastName]は、[SCOPE.sCharacter('fav_character_scope').GetSheHe]と対立してきた一部の人物を、政治的な影響力の座から排除することを主張している。"
