 je_tp_tsar_crown_of_perfection_button_1_name:0 "知識人への経済的援助"
 je_tp_tsar_crown_of_perfection_button_1_desc:0 "幼少期から、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は[ROOT.GetCountry.GetAdjective]の[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]と親しく交わってきた。[ROOT.GetCountry.GetRuler.GetSheHe|U]は、ヨーロッパで最も洗練された自由主義的な宮廷から、[ROOT.GetCountry.GetAdjectiveNoFormatting]の知的思想が再び花開くことを望んでいる。"
 je_tp_tsar_crown_of_perfection_button_2_name:0 "大改革の仕上げ"
 je_tp_tsar_crown_of_perfection_button_2_desc:0 "ツァーリ・アレクサンドル2世の大改革は大きな成功を収めたが、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、その施策がいまだ未完了であり、不完全なものだと考えている。[ROOT.GetCountry.GetRuler.GetSheHe|U]は自分の父が道半ばで残した事業を受け継ぎ、その成果をさらに発展させ、過ちを正そうとしている。"
 je_tp_tsar_crown_of_perfection_button_3_name:0 "市民社会の醸成"
 je_tp_tsar_crown_of_perfection_button_3_desc:0 "数世紀にわたり、[ROOT.GetCountry.GetName]の市民社会は警察国家によって抑え込まれてきた。その結果、国民は統治者に忠実でありながら、代表制統治を担う備えが整わないままでいる。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、中産階級を拡大し、繁栄させ、政治にも関与する層へと育て上げることで、いつの日か、[ROOT.GetCountry.GetNameNoFormatting]が王権を緩めるための下地を整えたいと考えている。"
 je_tp_tsar_crown_of_perfection_button_4_name:0 "帝国の合理化"
 je_tp_tsar_crown_of_perfection_button_4_desc:0 "[ROOT.GetCountry.GetAdjective]は広大な帝国である。その拡大の過程で取り込まれたグベールニヤ、オーブラスチ、旧封建領が複雑に入り混じり、各地にはそれぞれ異なる特権が残されている。民法と国家法を学んだ経験に触発された[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、継ぎはぎだらけの帝国行政を標準化し、バルト海から太平洋に至るまで、単一の法典のもとに置きたいと考えている。"
