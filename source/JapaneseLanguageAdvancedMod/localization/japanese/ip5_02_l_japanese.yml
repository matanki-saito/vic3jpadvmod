 da_tsarpoints_install_subject_ruler_action_name:0 "意に沿う支配者を据える"
 da_tsarpoints_install_subject_ruler_action_notification_name:0 "[INITIATOR_COUNTRY.GetName]が[TARGET_COUNTRY.GetName]に支配者を据える"
 da_tsarpoints_install_subject_ruler_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName]の[INITIATOR_COUNTRY.GetRuler.GetPrimaryRoleTitle][INITIATOR_COUNTRY.GetRuler.GetFirstName]は、[TARGET_COUNTRY.GetName]の[TARGET_COUNTRY.GetRuler.GetPrimaryRoleTitle]を、宮廷が任命した人物にすげ替えるよう命じた。"
 da_tsarpoints_install_subject_ruler_action_notification_third_party_name:0 "[TARGET_COUNTRY.GetName]が宮廷の任命者を迎える"
 da_tsarpoints_install_subject_ruler_action_notification_third_party_desc:0 "[INITIATOR_COUNTRY.GetName]の[INITIATOR_COUNTRY.GetRuler.GetPrimaryRoleTitle][INITIATOR_COUNTRY.GetRuler.GetFirstName]は、[concept_subject]である[TARGET_COUNTRY.GetName]の王座に、宮廷が任命した人物を据えた。"
 je_tsarpoints_button_8_name:0 "ポーロツク教会会議を招集する"
 je_tsarpoints_button_8_desc:0 "#b 1596#!年、#b ポーランド・リトアニア共和国#!において#b ブレスト合同#!が成立し、#b ルテニア#!の[GetReligion('orthodox').GetName]は、東方典礼を維持しつつ教皇の権威を受け入れることとなった。こうして生まれた#b ルテニア・[GetReligion('catholic').GetName]教会#!は、#b 第二次#!および#b 第三次ポーランド分割#!の後にこれらの地が[ROOT.GetCountry.GetName]の領土となってからも、現地で大きな影響力を保ち続けてきた。\n\n#b エカチェリーナ大帝#!の治世に、[GetCulture('ukrainian').GetName]人に対する#b ユニエイト#!の影響力はほぼ断たれたものの、この教会は、より徹底してポーランド化された[GetCulture('byelorussian').GetName]の[Concept('concept_homeland','$concept_homelands|q$')]に今なお深く根を下ろしている。\n\n現在、#b ルテニア・[GetReligion('catholic').GetName]教会#!内部の親ロシア派は、モスクワおよびキエフの[GetReligion('orthodox').GetName]府主教の支持を受け、再合同と#b ブレスト合同#!の解消を訴えている。"
 je_tsarpoints_button_8_short_desc:0 "ユニエイトを全ロシア正教会へと再統合するために…"
 je_tsarpoints_button_9_name:0 "反革命を支援する"
 je_tsarpoints_button_9_desc:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]である[ROOT.GetCountry.GetRuler.GetFirstName]の反動的な姿勢により、[ROOT.GetCountry.GetName]は西側の報道機関から「ヨーロッパの憲兵」と呼ばれるようになった。[glossary_revolutions_of_1830]のさなか、[ROOT.GetCountry.GetRuler.GetSheHe]はロシア軍を用いて#b ベルギー#!とフランスの#b 七月王政#!を粉砕するようウィーンに請願したが、フリードリヒ・ヴィルヘルム王とメッテルニヒ宰相に拒絶された。[ROOT.GetCountry.GetRuler.GetHerHis|U]が自制した結果、ポーランドでは血塗られた11月蜂起が勃発し、革命は遠く#b ミンスク#!と#b ポドリア#!にまで波及した。\n\nいま、反乱と無法が[GetGeographicRegion('geographic_region_europe').GetName]全土に広がるなか、[ROOT.GetCountry.GetRuler.GetSheHe]は[concept_tsarpoints]を用いて、押しつけられた憲法によって囚われの身となった正統なる君主たちへ、再び[ROOT.GetCountry.GetRuler.GetHerHis]の軍勢を提供することができる。"
 je_tsarpoints_button_9_short_desc:0 "聞け、諸国の民よ。そして従え。神は我らと共にあり！"
 je_tsarpoints_button_9_any_target_tt:0 "[GetGeographicRegion('geographic_region_europe').GetName]の[concept_country]のうち、少なくとも1か国が#v $je_red_summer$#!の[concept_journal_entry]を有しており、かつ[GetPlayer.GetAdjective]の外交官を追放していない"
 je_tsarpoints_button_9_effect_tt:0 "#v $je_red_summer$#!の[concept_journal_entry]を有する[GetGeographicRegion('geographic_region_europe').GetName]のすべての[concept_country]が[GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_duration_years_value')|v0]年の間、#b 反革命#!の進捗を毎月[GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_value')|+v0]獲得する"
 je_tsarpoints_button_9_effect_subject_tt:0 "#v $je_red_summer$#!の[concept_journal_entry]を有する[ROOT.GetCountry.GetAdjective]の全[concept_subject]が[GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_duration_years_value')|v0]年の間、#b 反革命#!の進捗を毎月[GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_subject_value')|+v0]獲得する"
 je_tsarpoints_button_9_effect_immune_tt:0 "@information! [GetPlayer.GetAdjective]の外交官を追放した[Concept('concept_country','$concept_countries|q$')]は影響を受けない"
 je_tsarpoints_button_9_effect_relations_conservative_tt:0 "#b 保守主義#!の政府を持つ[GetGeographicRegion('geographic_region_europe').GetName]のすべての[concept_country]との[concept_relations]が#v [GetPlayer.MakeScope.ScriptValue('tsarpoints_counter_revolution_ukaz_relations_value')|v0]#!改善する"
