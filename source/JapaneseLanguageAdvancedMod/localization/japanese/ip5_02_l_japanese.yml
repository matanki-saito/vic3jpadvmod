 je_tp_fav_parochial_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]の現在の[concept_favorite]、[SCOPE.sCharacter('fav_character_scope').GetFullName]は、自らの故郷である[SCOPE.sState('fav_home_region_scope').GetName]の開発に関心を示しており、同地を発展させることで、他地域の模範となる県を作り上げられると主張している。"
