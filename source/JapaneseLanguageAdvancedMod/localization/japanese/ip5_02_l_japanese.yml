 notification_je_tp_counter_revolution_ukaz_name:0 "[SCOPE.sCountry('counter_revolution_sponsor_scope').GetName]が反革命を扇動"
 notification_je_tp_counter_revolution_ukaz_desc:0 "[SCOPE.sCountry('counter_revolution_sponsor_scope').GetRuler.GetPrimaryRoleTitle]の命により、[SCOPE.sCountry('counter_revolution_sponsor_scope').GetAdjective]の工作員が[SCOPE.sCountry('counter_revolution_target_scope').GetName]の#b 反革命#!勢力と接触し、#v $je_red_summer$#!の[concept_journal_entry]における#b 反革命#!の進捗を[SCOPE.sCountry('counter_revolution_target_scope').MakeScope.Var('tp_counter_revolution_ukaz_var').GetValue|v0]増加させました\n\n@information! この効果は[concept_diplomatic_action]「[GetDiplomaticActionType('expel_diplomats').GetName]」によって除去できます"
