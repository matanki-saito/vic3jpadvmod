 je_tp_fav_industry_assign_tt:0 "[ROOT.GetCountry.GetName]のジャーナルに「#v $je_tp_fav_industry_concluded$#!」が追加される"
 je_tp_fav_social_justice_assign_tt:0 "[ROOT.GetCountry.GetName]のジャーナルに「#v $je_tp_fav_social_justice$#!」が追加される"
 je_tp_fav_bootlicker_assign_tt:0 "[ROOT.GetCountry.GetName]のジャーナルに「#v $je_tp_fav_bootlicker_concluded$#!」が追加される"
 je_tp_fav_rasputin_assign_tt:0 "[ROOT.GetCountry.GetName]のジャーナルに「#v $je_tp_fav_rasputin$#!」が追加される"
 je_tp_fav_worldwide_assign_tt:0 "[ROOT.GetCountry.GetName]のジャーナルに「#v $je_tp_fav_worldwide$#!」が追加される"
