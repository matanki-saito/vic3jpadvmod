 je_tp_fav_industry:0 "[ROOT.GetCountry.MakeScope.Var('tp_fav_industry_group').GetBuildingGroup.GetNameNoFormatting]の拡大"
 je_tp_fav_industry_concluded:0 "望まれる産業の拡大"
 je_tp_fav_industry_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]である[ROOT.GetCountry.GetRuler.GetFirstName]の現在の[concept_favorite]、[SCOPE.sCharacter('fav_character_scope').GetFullName]は、[ROOT.GetCountry.GetName]全土での[ROOT.GetCountry.MakeScope.Var('tp_fav_industry_group').GetBuildingGroup.GetName]の拡大を、絶えず主張している。\n\n[SCOPE.sCharacter('fav_character_scope').GetCustom('getGospodinGospozha')]・[SCOPE.sCharacter('fav_character_scope').GetLastName]は、この投資によって[SCOPE.sCharacter('fav_character_scope').GetHerHim]自身や[SCOPE.sCharacter('fav_character_scope').GetHerHis]の知人が私的な利益を得るとしても、それは[ROOT.GetCountry.GetName]全体にもたらされる利益に比べれば二次的なものにすぎないと強調している。"
 modifier_completed_industry_objective:0 "産業開発への支援"
 je_tp_fav_social_justice:0 "望まれる法律の制定"
 je_tp_fav_social_justice_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]の現在の[concept_favorite]、[SCOPE.sCharacter('fav_character_scope').GetFullName]は、[SCOPE.sLaw('fav_desired_law_scope_1').GetName]と[SCOPE.sLaw('fav_desired_law_scope_2').GetName]の双方の利点を繰り返し説いており、これらを制定すれば、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の統治は強化され、[ROOT.GetCountry.GetRuler.GetSheHe]が治める臣民にも益がもたらされると主張している。"
 modifier_completed_law_objective:0 "立法への影響力"
