 je_tp_ukaz_publish_button:0 "勅令を公布する"
 je_tp_tsar_gendarme_of_europe:0 "ヨーロッパの憲兵"
 je_tp_tsar_gendarme_of_europe_reason:0 "#b 1833年#!に#b セルゲイ・ウヴァーロフ#!が提唱した#b 「正教・専制・国籍」#!の理念は、[SCOPE.sCharacter('nicholas_i_scope').GetPrimaryRoleTitle]である[SCOPE.sCharacter('nicholas_i_scope').GetFullName]の個人的・政治的な世界観を端的に示している。\n\n熱烈な反動保守主義者である[SCOPE.sCharacter('nicholas_i_scope').GetPrimaryRoleTitle]は、国内外を問わず秩序と専制の原則を重視しており、[Glossary('glossary_decembrists','デカブリスト')]や[GetCulture('polish').GetName]の蜂起が再び起こることを防ぐためには、強硬手段に訴えることもためらわない。"
 je_tp_tsar_great_reform:0 "大改革論者"
 je_tp_tsar_great_reform_reason:0 "$je_great_reformer_reason$"
 je_tp_tsar_crown_of_perfection:0 "完全なる王権"
 je_tp_tsar_crown_of_perfection_reason:0 "幼少期から、[SCOPE.sCharacter('nixa_scope').GetFullName]は家庭教師たちに神童だともてはやされ、いずれは世界で最も啓蒙的な統治者になる宿命にあると称えられてきた。[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]は彼の即位を、新たなピョートル大帝の到来として歓迎している。\n\n生涯にわたって$ig_intelligentsia$の期待を一身に受けてきた[SCOPE.sCharacter('nixa_scope').GetPrimaryRoleTitle]の[SCOPE.sCharacter('nixa_scope').GetFirstNameNoFormatting]は今や自らを、父の事業を受け継ぎ、後進的な[ROOT.GetCountry.GetName]をヨーロッパの最前列へと導く使命を帯びた、啓蒙的な家長であるとみなすようになった。[SCOPE.sCharacter('nixa_scope').GetHerHis]の慈悲深い導きのもと、農民の帝国は近代国家へと生まれ変わり、[ROOT.GetCountry.GetCapital.GetCityHubName]の宮廷は世界を照らす灯台となるだろう。"
 je_tp_tsar_unshakable_autocracy:0 "揺るぎなき専制政治"
 je_tp_tsar_unshakable_autocracy_reason:0 "厳格な風貌、豊かな顎髭、そして並外れた巨躯を持つ[SCOPE.sCharacter('alexander_iii_scope').GetFullName]は、改革志向の父のもと、大公としてありふれた軍歴を歩むはずだった。だが、そうはならなかった。兄が早逝したことで、まだ何の備えもできていない彼の双肩に、統治の責務が突然のしかかったのである。\n\n[SCOPE.sCharacter('alexander_iii_scope').GetPrimaryRoleTitle]となった[SCOPE.sCharacter('alexander_iii_scope').GetFirstNameNoFormatting]は、ロシア軍人らしい粗野で国粋主義的な気質をもって統治に臨んできた。反動的な顧問たちに囲まれた彼は、自由主義へのいかなる譲歩も、帝国にとって致命的な脅威であるとみなしている。彼にとって専制とは、[SCOPE.sCharacter('alexander_iii_scope').GetPrimaryRoleTitle]と臣民を結ぶ神聖な信託であり、それを否定することは、神そのものを否定するに等しいのだ。"
 je_tp_tsar_heir_of_alexander:0 "不本意な専制君主"
 je_tp_tsar_heir_of_alexander_reason:0 "若き日の[SCOPE.sCharacter('nicholas_ii_scope').GetFullName]は、玉座に就くことを望んでいなかった。愛する父と反動的な家庭教師たちによる厳格な教育は、[SCOPE.sCharacter('nicholas_ii_scope').GetHerHim]を疑う余地なき専制君主へと鍛え上げたが、生来の優柔不断さと、誰からもよく思われたいという願望は消えなかった。\n\nこのような教育が[SCOPE.sCharacter('nicholas_ii_scope').GetSheHe]にもたらしたのは、奇妙な矛盾であった。すべての権力を自らに集中させようとしながらも、それを行使する能力には乏しい統治者が生まれたのである。独自の構想を持たない[SCOPE.sCharacter('nicholas_ii_scope').GetPrimaryRoleTitle]の[SCOPE.sCharacter('nicholas_ii_scope').GetFirstNameNoFormatting]は、父の統治手法をそのまま踏襲しようとしている――敬虔な信仰と、神が自らに授けたと信じる統治権の維持を、常に心の中心に据えながら。"
 je_tp_pool_establish_duma:0 "[GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')]の招集"
 je_tp_pool_establish_duma_concluded:0 "ドゥーマの招集"
 je_tp_pool_establish_duma_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]ひとりだけでは統治できないことが明らかとなった。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は顧問団を拡大し、ますます複雑化する帝国統治に民衆を関与させる必要性を認めた。これを実現するため、[ROOT.GetCountry.GetRuler.GetSheHe]は[GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')][GetPlayer.GetCustom('rus_duma_or_zemsky_sobor_2')]の招集を望んでいる。"
 je_tp_pool_bureaucratic_reform:0 "官僚制改革の開始"
 je_tp_pool_bureaucratic_reform_reason:0 "[ROOT.GetCountry.GetAdjective]の官僚制度の欠陥は、それを目の当たりにする者には明らかである。ヨーロッパ諸国ほどの大きさを持つ県が、わずかな官僚と小規模な軍の駐屯部隊によって管理されており、シベリアの森林には反体制派の共同体が野放しになっている。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、自らの手で帝国内のあらゆる村落にまで国家機構の影響力を及ぼし、広大な領土を統治可能な状態にすることを決意した。"
 je_tp_pool_educational_reform:0 "教育改革の開始"
 je_tp_pool_educational_reform_reason:0 "[ROOT.GetCountry.GetAdjective]国家は読み書きができない農民だらけの社会の上に成り立っており、その末端まで統制が及ばないということは少なくない。識字率の低さは、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]が望む経済政策を脅かし、うわべだけの急進主義の拡大を助長している。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は、科学への投資、民衆の教育、そしてロシア人教育者階級の形成を望んでいる。"
 je_tp_pool_citizenship_reform:0 "市民権改革の開始"
 je_tp_pool_citizenship_reform_reason:0 "[ROOT.GetCountry.GetName]の領土には非常に多くの民族が暮らしており、広大な地域の中には、ロシア語を話すのが高級官僚だけという場所もある。これらの共同体を疎外することは、国家の統治能力にとって致命的である。そのため[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、帝国内に市民権の枠組みを確立し、少数派の共同体の権利を拡大することを望んでいる。"
 je_tp_pool_decrease_landowner_influence:0 "ジェントリの弱体化"
 je_tp_pool_decrease_landowner_influence_reason:0 "ロシアのジェントリは、古くから旧態依然とした生産方式に固執し、宮廷クーデターにも関与してきたため、あらゆる改革に立ちはだかる脅威となっている。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、彼らの政治的影響力を弱め、改革に理解を示す知識人や官僚機構、生産階級の発言力を高めようとしている。"
 landowners_ideology_close_enough_tt:0 "[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]の[concept_leader] ([GetInterestGroupVariant('ig_landowners',GetPlayer).GetLeader.GetIdeology.GetName]) の[concept_ideology]は、[concept_ruler] ([ROOT.GetCountry.GetRuler.GetIdeology.GetName]) のものと親和性がある"
 legislature_zemsky_sobor_followup:0 "、帝政ロシアの伝統ある議会"
 legislature_duma_followup:0 " 、国家評議会の幅広い選挙で選ばれる下院"
 je_tp_pool_abolish_duma:0 "[GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')]の解散"
 je_tp_pool_abolish_duma_concluded:0 "ドゥーマの解散"
 je_tp_pool_abolish_duma_reason:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]である[ROOT.GetCountry.GetRuler.GetFirstName]は、[GetPlayer.GetCustom('rus_duma_or_zemsky_sobor')]の招集を帝国の存続に対する致命的な脅威とみなしている。政治家たちの策謀は[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]とその一族の威信を脅かし、革命家たちは、議会の特権を利用して議場で反逆を唱えている。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]はこの組織の解散と、本来あるべき専制権力の回復を望んでいる。"
 je_tp_pool_secret_police:0 "治安の強化"
 je_tp_pool_secret_police_reason:0 "革命のギロチンによって西欧の絶対主義が迎えた結末は、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]に、暗殺者や革命家があらゆる場所に潜んでいることを知らしめた。治安機関が扇動者を$geographic_region_siberia$へ追放したところで、彼らの手の届かぬ農村の村々、郊外の地下室、スイスのホテルにはその10倍の数の扇動者が潜伏しているのだ。\n\nこうした脅威に対抗するため、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は[GetLawType('law_secret_police').GetName]の創設を求めている。[ROOT.GetCountry.GetName]のあらゆる場所を監視下に置き、革命家たちが[ROOT.GetCountry.GetRuler.GetHerHim]に対抗するための隠れ場所を残さないためである。[ROOT.GetCountry.GetCustom('getOkhranaInstructions')]"
 je_tp_pool_suppress_revolts:0 "政治的反対意見の抑圧"
 je_tp_pool_suppress_revolts_reason:0 "ツァーリたちは、宮廷のクーデターと農民の反乱という二重の脅威を1世紀にわたって恐れてきた。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、プガチョフの乱がもたらした惨禍とエカチェリーナの後継者たちの悲運を十分に認識しており、オレンブルクの地から、あるいは冬宮殿の広間から、[ROOT.GetCountry.GetRuler.GetHerHis]の統治を脅かすいかなる陰謀によっても玉座を追われることがないよう望んでいる。"
 je_tp_pool_suppress_revolts_goal:0 "[ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_goal_duration_years_value')|v0]年間、[concept_insurrection]または[concept_coup]が一度も起こっていない"
 je_tp_pool_develop_capital:0 "首都の発展"
 je_tp_pool_develop_capital_reason:0 "[ROOT.GetCountry.GetCapital.GetCityHubName]は、[ROOT.GetCountry.GetAdjective][ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]と宮廷貴族の都であり、すでにヨーロッパ有数の都市として知られている。この都市の地位をロシア専制の威信を示すものと考える[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、文化、繁栄、安寧を兼ね備えた理想的な帝都として、パリやロンドンに匹敵する都市へ発展させたいと考えている。"
 je_tp_pool_cultural_dominance:0 "ロシアの支配の維持"
 je_tp_pool_cultural_dominance_reason:0 "ニコライ1世の教育大臣であった#b セルゲイ・ウヴァーロフ#!伯爵の思想は、[GetCulture('russian').GetName]の民族的アイデンティティを帝国の三本柱の一つとして確立した。$russian$の民族性を固く信奉する[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、[GetCulture('russian').GetName]文化こそが至上であり、少数民族や外国文化がその優位性を脅かすことを防がなければならないと考えている。"
 je_tp_pool_cultural_dominance_goal:0 "[concept_political_strength]において[GetCulture('russian').GetName][concept_culture]の占める割合が、[ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_goal_duration_years_value')|v0]年にわたり[ROOT.GetCountry.MakeScope.ScriptValue('tsarpoints_cultural_dominance_polstr_share_value')|v0%]超を維持している"
