 je_tp_great_reform_zemstvos_button_desc:0 "[ROOT.GetCountry.GetName]の広大な大地は、[ROOT.GetCountry.GetCapital.GetCityHubName]だけで統治できるものではない。その地域に何が必要かを中央機関よりもよく理解しているのは住民であるという考えに基づき、ツァーリの顧問たちは地方住民による自治の拡大を提案した。この改革では、各州に管轄区域内の経済活動を担う[Glossary('glossary_zemstvo','zemstvos')]を設置するとともに、都市政府の権限を拡大する。"
