 tsarpoints_events.13.t:0 "帝国$concept_ukaz$第[ROOT.Var('ukaz_no_var').GetValue]号"
 tsarpoints_events.13.d:0 "[SCOPE.sCountry('relevant_country_scope').GetName]の[SCOPE.sCharacter('old_ruler_scope').GetPrimaryRoleTitle]の失政は、もはや見過ごせないほど深刻になっている。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は、[SCOPE.sCountry('relevant_country_scope').GetAdjectiveNoFormatting]宮廷内にいる[ROOT.GetCountry.GetRuler.GetHerHis]の工作員に対し、その[SCOPE.sCharacter('old_ruler_scope').GetPrimaryRoleTitle]をより友好的な候補者にすげ替えるよう、勅令を発布した。"
 tsarpoints_events.13.f:0 "「あの子は昔、玩具の兵隊をよく並べていたものです」と、老いた皇太后は物思いにふけりながら言った。「一番のお気に入りから、そうでないものへと…順にね。不思議なもので、あの子がよく遊んでいたのはお気に入りのほうなのに、いつも決まって、真っ先になくなって替えが必要になるのは、気に入られていないほうの兵隊だったのですよ」\n\n彼女はため息をついた。\n\n「今も、さして変わってはいないのかもしれませんね」"
 tsarpoints_events.13.a:0 "バルト・ドイツ人貴族から候補者を招こう。"
 tsarpoints_events.13.b:0 "[ROOT.GetCountry.GetAdjectiveNoFormatting]宮廷の子息を任命しよう。"
 tsarpoints_events.13.c:0 "[SCOPE.sCharacter('local_puppet_ruler_scope').GetFullName]という、現地の高貴な候補者がいる。"
 install_baltic_german_noble_tt:0 "[SCOPE.sCharacter('tsar_scope').GetInterestGroup.GetTextIcon][SCOPE.sCharacter('tsar_scope').GetIdeology.GetName]の[GetCulture('east_german').GetName]人貴族が、[SCOPE.sCountry('relevant_country_scope').GetName]の[SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle]となる"
 install_russian_noble_tt:0 "[SCOPE.sCharacter('tsar_scope').GetInterestGroup.GetTextIcon][SCOPE.sCharacter('tsar_scope').GetIdeology.GetName]の[GetCulture('russian').GetName]人貴族が、[SCOPE.sCountry('relevant_country_scope').GetName]の[SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle]となる"
 install_local_noble_tt:0 "[SCOPE.sCharacter('tsar_scope').GetInterestGroup.GetTextIcon][SCOPE.sCharacter('local_puppet_ruler_scope').GetIdeology.GetName]の[SCOPE.sCharacter('local_puppet_ruler_scope').GetCulture.GetName]人貴族である[SCOPE.sCharacter('local_puppet_ruler_scope').GetFullName]が、[SCOPE.sCountry('relevant_country_scope').GetName]の[SCOPE.sCountry('relevant_country_scope').GetRuler.GetPrimaryRoleTitle]となる"
 tsarpoints_events.14.t:0 "皇帝たちの統治"
 tsarpoints_events.14.d:0 "300年以上にわたる専制支配の重みを背負う[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は、鉄腕をもって[ROOT.GetCountry.GetName]を統治している。ナポレオン戦争を生き延びた専制政治は、自らが背を向けてきた世界と向き合わねばならない。"
 tsarpoints_events.14.f:0 "最後に、全能の神への熱き祈りをともに捧げてくれるよう、我が忠実なる臣民に呼びかける。願わくば、神の摂理により、我らに課された重荷に耐えぬく力を授けたまわんことを。願わくば、愛する祖国のためだけに生き、我らがいま悼む君主の歩みを受け継ぐ決意を、我らの内に宿し続けたまわんことを。\n\n我らの治世が、先帝の治世を謙虚に受け継ぐものとならんことを。そして、先帝の胸に宿っていた、ロシアの幸福を希求する想いを、我らがことごとく叶えんことを。先帝の聖なる記憶は、天の祝福と民の愛に値する者たらんとする努力と希望を、我らの内に残し続けるであろう。\n\n#italic 皇帝ニコライ1世の即位宣言#!"
 tsarpoints_events.14.a:0 "神よツァーリを護り給え"
 tsarpoints_events.14.b:0 "いつの日か、[ROOT.GetCountry.GetAdjective]の民がそのくびきから解き放たれんことを。"
 tsarpoints_events.14.tt_1:0 "あなたは[ROOT.GetCountry.GetName]の[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]として、@tsarpoints![concept_tsarpoints]を使用できる。[concept_tsarpoints]は#b $je_tsarpoints_master$#!の[concept_journal_entry]で確認可能"
 tsarpoints_events.14.tt_2:0 "[concept_ruler]および[concept_favorite]の#b 課題#!を完了して[concept_tsarpoints]を#g 獲得#!し、それを#g 消費#!して強力な[Concept('concept_ukaz','$concept_ukase|q$')]を発令できる"
 tsarpoints_events.15.t:0 "帝国$concept_ukaz$第[ROOT.Var('ukaz_no_var').GetValue]号"
 tsarpoints_events.15.d:0 "ヨーロッパ各地で革命が勃発したことを受け、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は行動に出た。西欧各国の[ROOT.GetCountry.GetAdjective]大使館に、危機に瀕した諸君主国を支援するよう指示を発し、陸軍には戦争への備えを命じた。"
 tsarpoints_events.15.f:0 "扉が勢いよく開き、冷たい外気、外套、どかどかと鳴る長靴が、つむじ風のようになだれ込んできた。部屋じゅうの視線が、一斉に音のほうへ向けられた。\n\n「セルゲイ・アレクサンドロヴィチから知らせだ！」駆け込んできた男が、あえぎながら言った。「あいつが軍曹から聞いて、軍曹は宮殿の衛兵から聞いたって話なんだが、その衛兵が言うには、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]陛下が、舞踏会で、しゅ、出席者の…前で…」息も絶え絶えの報告は、激しい咳き込みでかき消えた。男は寝台の枠に手をつき、肩で息をしている。\n\n寝台にいた男のひとりが、ボタンを磨く手を止めたまま声を上げた。「陛下は何と仰ったんだ？なあ、おい！」\n\n「衛兵が言うには…陛下は…『諸君、馬に鞍を置け！フランスが共和国となった！』と仰ったそうだ…」"
 tsarpoints_events.15.a:0 "乱れたヨーロッパは、[ROOT.GetCountry.GetAdjectiveNoFormatting]軍の手で正される。"
 russia_monarchy.12.t:0 "[SCOPE.sCharacter('tsar_scope').GetFirstNameNoFormatting]の即位"
 russia_monarchy.12.d:0 "[SCOPE.sCharacter('tsar_scope').GetFullName]が[ROOT.GetCountry.GetName]の王位に就いた。"
