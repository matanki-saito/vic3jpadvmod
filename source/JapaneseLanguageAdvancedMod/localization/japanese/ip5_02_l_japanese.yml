 rf_leader_not_liberal_progressive_or_socialist_tt:0 "[GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName]の[concept_leader] ([GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetLeader.GetIdeology.GetName]) が、#tooltippable;tooltip:[GetPlayer.GetTooltipTag],liberal_ideologies_list_tt 自由主義#!、#tooltippable;tooltip:[GetPlayer.GetTooltipTag],progressive_ideologies_list_tt 進歩主義#!、#tooltippable;tooltip:[GetPlayer.GetTooltipTag],socialist_ideologies_list_tt 社会主義#!のいずれの[concept_ideology]も有して#b いない#!"
