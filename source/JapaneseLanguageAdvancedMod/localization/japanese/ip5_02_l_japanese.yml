 decree_promote_social_mobility_tsarpoints:0 "模範教育の推進"
 decree_promote_social_mobility_tsarpoints_desc:0 "管区内の学校において、省の定める厳格なカリキュラムを推進し、より高度な学習と、より大きな出世の機会を提供する。"
 decree_promote_national_values_tsarpoints:0 "公的な愛国主義の推進"
 decree_promote_national_values_tsarpoints_desc:0 "$russian$以外の文化を抑圧することにより、管区内で文化的同化と改宗を促す"
 decree_encourage_manufacturing_industry_tsarpoints:0 "地方製造業の振興"
