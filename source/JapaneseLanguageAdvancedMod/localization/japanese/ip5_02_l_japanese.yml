 tsarpoints_events.1.t:0 "第三のローマへの挽歌"
 tsarpoints_events.1.d:0 "$RUS_ADJ$のツァーリによる支配は、かつて考えられもしなかった終焉を迎え、今や[ROOT.GetCountry.GetGovernment.GetName]が[ROOT.GetCountry.GetCapital.GetCityHubName]から国を治めている。革命家たちは「ヨーロッパの憲兵」の死に歓喜し、一方で王朝の忠臣たちは第三のローマの崩壊を嘆いている。"
 tsarpoints_events.1.f:0 "「亡命中、私は『#italic ポスレードニエ・ノーヴォスチ#!』で、銃殺や遺体の焼却などについての記述を読んだ。このうちどれほどが真実で、どれほどが作り話なのか、私にはまったく見当もつかない。というのも、私は判決が#italic どのように#!執行されたかに興味を持ったことがないし、率直に言って、そうした好奇心を理解することもできないからだ」\n\n―レフ・トロツキー、『#italic 亡命日記#!』"
 tsarpoints_events.1.a:0 "これで[ROOT.GetCountry.GetName]も、近代世界の仲間入りを果たせたわけだ。"
 tsarpoints_events.1.b:0 "神はもはや、我らと共におられないのか…？"
 notify_upgraded_decrees_removed_tt:0 "\n@information! [Concept('concept_ukaz','$concept_ukase|q$')]によって強化されたすべての[Concept('concept_decree','$concept_decrees|q$')]が通常の状態に戻った"
 tsarpoints_events.2.t:0 "帝国$concept_ukaz$第[ROOT.Var('ukaz_no_var').GetValue]号"
 tsarpoints_events.2.d:0 "[SCOPE.sLaw('current_law_scope').GetName]の制定に格別の関心を寄せている[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は、この法律を帝国全土で速やかに施行するよう命じる勅令を発布した。"
 tsarpoints_events.2.f:0 "「[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は私の見識を買って、[GetPlayer.GetCustom('country_legislature_name')]の議員に任じてくださったのです！この改革には、まだ多くの疑問が残っています！」\n\n「ええ、そうでしょうとも。ですが今は、疑問を呈するよりも、そのご見識を行動に生かしていただきたい。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]も、その違いを心得ていると信じておられますよ」"
 tsarpoints_events.2.a:0 "勅令どおりに執り行われるだろう。"
 tsarpoints_events.3.t:0 "帝国$concept_ukaz$第[ROOT.Var('ukaz_no_var').GetValue]号"
 tsarpoints_events.3.d:0 "帝国の少数民族の間で民族意識が高まっていることに危機感を抱いた[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は、少数派言語によるあらゆる出版と上演を禁じる勅令を発布した。"
 tsarpoints_events.3.f:0 "「ああ、聞いたことがある曲だ！でも違和感がある…前に聞いたときは、たしか歌があったはずだ。歌詞も覚えている」\n\n彼の友人は微笑んだ。それは奇妙な微笑みだった。悲しげでありながら、同時に勝ち誇ってもいるような。\n\n「覚えているなら、心の中で歌えばいい。私たちは皆、そうしてるんだ」"
 tsarpoints_events.3.a:0 "独立した[GetCulture('ukrainian').GetName]文化を主張する者など存在しない。"
 tsarpoints_events.3.b:0 "[GetCulture('byelorussian').GetName]の方言など、ポーランド人が作り上げた扇動的な代物にすぎない。"
 tsarpoints_events.3.c:0 "革命を起こそうなどという[GetCulture('polish').GetName]人の陰謀は、ひとつ残らず踏みつぶさねばならない。"
 tsarpoints_events.3.e:0 "[GetCulture('czech').GetName]語は、救いようがないほどドイツ化されている。"
 tsarpoints_events.3.g:0 "[GetCulture('slovak').GetName]語は、マジャール化した方言として禁止せよ。"
 tsarpoints_events.3.h:0 "[GetCulture('sorb').GetName]人など存在しない。それは単に、ロシアの西端部に住んでいるロシア人でしかない。"
 tsarpoints_events.4.t:0 "帝国$concept_ukaz$第[ROOT.Var('ukaz_no_var').GetValue]号"
 tsarpoints_events.4.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は、[ROOT.GetCountry.GetRuler.GetHerHis]の「諸民族の主権者」としての役割を強調する勅令を発布し、[ROOT.GetCountry.GetName]の従属国の支配者たちの忠誠に、さらなる監視の目を向けた。"
 tsarpoints_events.4.f:0 "「我々は、現実主義が弱さと取り違えられることを、断じて許してはならない。地方の統治者たちに、地方の問題を解決する権限が主権と等しいものだと信じさせてしまったがために、どれほど多くの帝国が崩れ去ったことか。最も穏やかな民衆でさえ民族主義に染まりかねないこの危うい時代、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]のもとで統治にあたる者たちは、自らを[ROOT.GetCountry.GetRuler.GetHerHis]の手の延長と見なさねばならない。[ROOT.GetCountry.GetRuler.GetHerHim]に対して振り上げられる手では、決してないのだ」"
 tsarpoints_events.4.a:0 "勅令どおりに執り行われるだろう。"
 tsarpoints_events.5.t:0 "帝国$concept_ukaz$第[ROOT.Var('ukaz_no_var').GetValue]号"
 tsarpoints_events.5.d:0 "[GetPlayer.GetCustom('country_legislature_name')]への信頼を保つため、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は、[ROOT.GetCountry.GetRuler.GetHerHis]の思い描く帝国の姿を実現すべく尽力した閣僚たちを称える勅令を発布した。"
 tsarpoints_events.5.f:0 "「ずいぶん大げさな賛辞だな。私の知るかぎり、そのご立派な仕事を担う連中は、ほとんどの時間、国家予算の細部をめぐって言い争っているようだが」\n\n「ええ、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は確かな見識をお持ちです。盤石に見える治世が崩れはじめるとすれば、まさに国家予算の細部からでしょうから」"
 tsarpoints_events.5.a:0 "勅令どおりに執り行われるだろう。"
 tsarpoints_events.6.t:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の耳元で囁く者"
 tsarpoints_events.6.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]の信任を得た新たな寵臣、[SCOPE.sCharacter('favourite_scope').GetFullName]は、[SCOPE.sCharacter('favourite_scope').GetHerHis]自身の思惑を実現するため、帝国の行政機構を動員すべきだと[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]に進言した。"
 tsarpoints_events.6.f:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]が布告の文面を読み上げると、部屋にいた者たちは居心地悪そうに視線を交わしはじめた。\n\nそこには[ROOT.GetCountry.GetRuler.GetFirstName]らしい美辞麗句もいくらか盛り込まれていたが、肝心の中身はまったく別人の声で語られていた。\n\nその声の主が明らかになるにつれ、この部屋に[SCOPE.sCharacter('favourite_scope').GetFullName]の姿がないことが、ほとんど意図的なものであるかのように感じられはじめた。"
 tsarpoints_events.6.a:0 "[SCOPE.sCharacter('favourite_scope').GetCustom('getGospodinGospozha')|l]・[SCOPE.sCharacter('favourite_scope').GetLastName]の言葉にも一理ある。"
 tsarpoints_events.6.b:0 "我々には、善良なる[SCOPE.sCharacter('favourite_scope').GetCustom('getGospodinGospozha')|l]が[SCOPE.sCharacter('favourite_scope').GetHerselfHimself]自身の立場を忘れているように思える。"
 modifier_favorite_rebuffed:0 "面目を失う拒絶"
 tsarpoints_events.7.t:0 "コンスタンティノスの都にて"
 tsarpoints_events.7.d:0 "[ROOT.GetCountry.GetAdjective]によるコンスタンティノープル征服により、この都市における4世紀にわたるトルコの軛はついに断ち切られた。長年の宿願が果たされた今、[ROOT.GetCountry.GetCapital.GetCityHubName]はローマの衣鉢を完全に継ぐ構えを見せている。"
 tsarpoints_events.7.f:0 "戦禍で荒れ果ててはいるが、古の美の輝きは失われていない。馬に跨り、街路をゆく[ROOT.GetCountry.GetRuler.GetFirstName]はそう思った。だが、この街は今以上の苦難に見舞われたこともある。この先、さらに大きな苦難が訪れることはない――などと考えるのは、思い上がりなのかもしれない。\n\n「本来なら、あのコンスタンチン・パヴロヴィチが担うべき役目だった」と、[ROOT.GetCountry.GetRuler.GetSheHe]は心中で呟いた。「だが、私がやらなければ」"
 tsarpoints_events.7.a:0 "今再び、十字架がアヤソフィアのドームを飾る。"
 tsarpoints_events.7.b:0 "我らの手で、エカチェリーナの夢を実現しなければ。"
 tsarpoints_events.7.c:0 "大理石の王が、長き眠りから目覚めるのだ。"
 tsarpoints_events.7.tt_1:0 "#b 全地総主教庁#!と#b ロシア正教会#!の関係を定める[concept_decision]が使用可能になる"
 tsarpoints_events.7.tt_2:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]が#b ギリシャの皇帝#!を称し、#b コンスタンティノープル#!を首都とする[GetCulture('greek').GetName]国家が、[ROOT.GetCountry.GetName]との[concept_personal_union]のもとに成立する"
 tsarpoints_events.7.tt_3:0 "我々または我々の[Concept('concept_subject','$concept_subjects|q$')]が所有する[GetCulture('greek').GetName]のすべての[concept_homeland][Concept('concept_state','$concept_states|q$')]が新国家へ移譲される"
 tsarpoints_events.7.tt_4:0 "すべての[GetCulture('greek').GetName][Concept('concept_country','$concept_countries|q$')]は、[concept_subject]であるか#b 独立国#!であるかを問わず、この新国家への#g 参加#!を打診される : "
 tsarpoints_events.7.tt_5:0 "プレイヤーのアクティブ操作国を[ROOT.GetCountry.GetName]から#b $dyn_c_empire_of_the_hellenes$#!に変更する"
 modifier_true_heir_of_rome:0 "現代のコンスタンティノス"
 modifier_restoration_of_second_rome:0 "第二のローマの再興"
 modifier_orthodox_messianism:0 "救世主待望の熱狂"
 modifier_the_restorer:0 "再興者"
 tsarpoints_events.8.t:0 "ロシア、コンスタンティノープルとの統合を提案"
 tsarpoints_events.8.d:0 "先日コンスタンティノープルを征服し、自国の庇護下に新たな[GetCulture('greek').GetName]帝国の成立を宣言した[SCOPE.sCountry('russia_scope').GetName]は、我が国をその帝国へ加えることを提案してきた。"
 tsarpoints_events.8.f:0 "なんと幸いなることか、そう彼らは叫ぶ、ああ天よ！\n今日、我らが英雄たちは、来たりしロシア人の中に生きている！\n我らにはかくも慎ましく、トルコ人にはかくも恐ろしき彼らよ！\n戦に備えし、アルゴスとナフプリオの民、\n恐れるなかれ、コリントスの者たちよ――\nレオニダスはスパルタにあり。\n\n―V. P.ペトロフ、『#italic モレアの戦勝に寄せて#!』"
 tsarpoints_events.8.a:0 "大理石の王は目覚め、世界は震撼する。"
 tsarpoints_events.8.b:0 "これほどの栄誉と引き換えであろうと、我らは自由を売り渡しはしない。"
 tsarpoints_events.9.t:0 "ポーロツク教会会議"
 tsarpoints_events.9.d:0 "ポーロツクの聖ソフィア大聖堂に集められ、コサックの厳重な警備下に置かれたルテニア[GetReligion('catholic').GetName]教会の[GetPopType('clergymen').GetName]たちは、ブレスト合同の解消について議論している。"
 tsarpoints_events.9.f:0 "若き司祭は顔を上げ、部屋の向こうを見渡した。親ロシア派の代表団は、実に雑多な聖職者たちの集まりであった。彼らの多くがモスクワの給与名簿に名を連ねていることは疑いようもなかったが、その中に真の信念を持つ者が少なからずいることも確かだった。\n\n票決に持ち込みさえすれば、親ロシア派を退けることはできるはずだ――彼はそう見積もっていた。だが、衛兵所のほうへ一瞬視線をやると、ドン・コサック連隊の男が、見せつけるようにシャシュカを研いでいる。その光景は、彼の見積りの甘さを象徴していた。投票は、彼の望む結果にはならないだろう。それでも、古の殉教者たちのように、彼は自らの信念を曲げるつもりはなかった。結果がどうなろうとも。"
 tsarpoints_events.9.a:0 "暴力によって引き裂かれ、愛によって再び結ばれる。合同は廃止された。"
 tsarpoints_events.9.tt_1:0 "[GetReligion('catholic').GetName]を信仰するすべての[GetCulture('ukrainian').GetName]および[GetCulture('byelorussian').GetName]の[Concept('concept_pop','$concept_pops|q$')]が、[GetReligion('orthodox').GetName]の[concept_religion]に改宗する"
 tsarpoints_events.9.tt_2:0 "[GetReligion('catholic').GetName]を信仰する[GetCulture('ukrainian').GetName]または[GetCulture('byelorussian').GetName]の[concept_pop]が存在する、[ROOT.GetCountry.GetAdjective]のすべての[Concept('concept_state','$concept_states|q$')]に以下が適用される : "
 tsarpoints_events.9.tt_3:0 "[GetReligion('catholic').GetName]の[GetPopType('clergymen').GetName]のうち、[GetReligion('orthodox').GetName]への参加を拒む者は、国内流刑または死に直面する"
 modifier_uniate_dioceses_converted:0 "ユニエイト教区の集団改宗"
 modifier_crypto_catholic_communities:0 "隠れユニエイト共同体"
 tsarpoints_events.11.t:0 "帝国$concept_ukaz$第[ROOT.Var('ukaz_no_var').GetValue]号"
 tsarpoints_events.11.d:0 "[ROOT.GetCountry.GetRuler.GetHerHis]の政府における勢力の均衡を、自らの意に沿う利益集団へと傾けるべく、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は、[GetPlayer.GetCustom('country_legislature_name')|U]における彼らの代表者に位階と特権を授ける勅令を発布した。"
 tsarpoints_events.11.f:0 "「真の[ROOT.GetCountry.GetName]の忠臣とは、彼らのことだ！自分の利益より帝国の利益を優先するだけではない。彼らにとって、ふたつの利益は同じものなのだ。これほど我らの信頼に値する者が他にいようか？我らの意志を遂行するのに、これほどふさわしい者が他にいようか？」"
 tsarpoints_events.11.a:0 "我々は、[GetInterestGroupVariant('ig_armed_forces',GetPlayer).GetName]の武勇を称える。"
 tsarpoints_events.11.b:0 "我々は、[GetInterestGroupVariant('ig_devout',GetPlayer).GetName]の働きを称える。"
 tsarpoints_events.11.c:0 "[GetInterestGroupVariant('ig_landowners',GetPlayer).GetName]は、今なお我々の絶大な信頼を得ている。"
 tsarpoints_events.11.e:0 "[GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName]の尽力は、我々の目に留まった。"
 tsarpoints_events.11.g:0 "我々は、[GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName]の功績を認める。"
 tsarpoints_events.11.h:0 "我々は、善き模範となった[GetInterestGroupVariant('ig_petty_bourgeoisie',GetPlayer).GetName]を称える。"
 tsarpoints_events.11.i:0 "我々は、[GetInterestGroupVariant('ig_rural_folk',GetPlayer).GetName]の純粋な忠誠を称える。"
 tsarpoints_events.11.j:0 "我々は、[GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName]の誠実な労苦を称える。"
 tsarpoints_events.12.t:0 "帝国$concept_ukaz$第[ROOT.Var('ukaz_no_var').GetValue]号"
 tsarpoints_events.12.d:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle][ROOT.GetCountry.GetRuler.GetFirstName]は、地方行政に関する新たな規定を盛り込んだ勅令を発布した。[ROOT.GetCountry.GetRuler.GetSheHe|U]は、今後の勅令遵守における新たな基準を打ち立てようとしている。"
 tsarpoints_events.12.f:0 "「では、私の読み違いでなければ、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]は今後、我々がこれらの手順を一字一句違えず、そのまま守ることを期待しておられる…ということですかな？」\n\n「そう読むこともできますな。別の読み方をするなら、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]が期待しておられるのは、一定の成果を出せということです。だとすれば、これらの手順はどれひとつ、一字一句そのまま守ることなどできはしません」"
 tsarpoints_events.12.a:0 "$decree_promote_social_mobility_tsarpoints$。"
 tsarpoints_events.12.b:0 "$decree_promote_national_values_tsarpoints$。"
 tsarpoints_events.12.c:0 "$decree_encourage_manufacturing_industry_tsarpoints$。"
 tsarpoints_events.12.e:0 "$decree_encourage_agricultural_industry_tsarpoints$。"
