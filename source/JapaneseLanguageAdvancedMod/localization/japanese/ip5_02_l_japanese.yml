 je_tp_tsar_heir_of_alexander_button_1_name:0 "大アジア計画"
 je_tp_tsar_heir_of_alexander_button_1_desc:0 "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、幼少期からロシアこそが野蛮な東方におけるヨーロッパ文明の砦であると確信してきた。[ROOT.GetCountry.GetRuler.GetSheHe|U]は$RUS$をアジアにおける支配的勢力とし、既存の極東領を強化して、近代化した中国と日本がもたらす「黄禍」に対抗したいと考えている。"
 je_tp_tsar_heir_of_alexander_button_2_name:0 "国外投資の開放"
 je_tp_tsar_heir_of_alexander_button_2_desc:0 "父の政策を引き継いだ[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、[ROOT.GetCountry.GetName]に産業をもたらす必要性を確信している。[ROOT.GetCountry.GetRuler.GetHerHis|U]の顧問たちは、国外投資に門戸を開くことで工業化を進める政策を支持しており、完成品に課す関税と、資本豊かな西洋列強との有利な取引を活用して、[ROOT.GetCountry.GetNameNoFormatting]国内に産業基盤を築くべきだと考えている。"
 je_tp_tsar_heir_of_alexander_button_2b_name:0 "資源輸出の拡大"
 je_tp_tsar_heir_of_alexander_button_2b_desc:0 "父の政策を引き継いだ[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、[ROOT.GetCountry.GetName]に産業をもたらす必要性を確信している。[ROOT.GetCountry.GetRuler.GetHerHis|U]の顧問たちは、帝国の豊かな鉱物資源と石油資源を活用し、輸出を増やして産業基盤を築くことに活路を見出している。"
 je_tp_tsar_heir_of_alexander_button_3_name:0 "動員計画の近代化"
 je_tp_tsar_heir_of_alexander_button_3_desc:0 "[ROOT.GetCountry.GetAdjective]皇帝家の伝統に倣い、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は軍を何よりも重んじており、軍こそが専制政治を支える忠実な基盤であると考えている。彼は、近代戦の要求に応えられる陸軍を作り上げようとする幕僚の取り組みを支援したいと考えている。"
 je_tp_tsar_heir_of_alexander_button_4_name:0 "アグレアリアン問題への回答"
 je_tp_tsar_heir_of_alexander_button_4_desc:0 "都市住民の不満が高まりつつあるなか、[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、素朴で信心深く、忠誠心の厚い[ROOT.GetCountry.GetAdjectiveNoFormatting]の農民たちから父のように慕われていると信じ、それを心の支えにしている。しかし、君主が農民の忠誠を当然のものと考える一方、側近たちはそれを実際に勝ち取るための計画を進言した。君主制の恩恵によって、農村に新たな中産階級を生み出そうというのだ。"
