 je_tsarpoints_add_very_high_tt:0 "[SelectLocalization(ROOT.GetCountry.IsValid,ROOT.GetCountry.GetName,'rus_adj_display')]の[concept_tsarpoints]が[GetPlayer.MakeScope.ScriptValue('tsarpoints_value_very_high')|v0]#g 増加#!する"
