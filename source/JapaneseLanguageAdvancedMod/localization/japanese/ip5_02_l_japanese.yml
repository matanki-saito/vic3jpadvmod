 je_tp_pool_develop_frontier:0 "辺境の開拓"
 je_tp_pool_develop_frontier_reason:0 "[ROOT.GetCountry.GetName]を特徴づけるのは、なんと言ってもその広大な辺境と、その地への絶え間ない入植である。[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]の[ROOT.GetCountry.GetRuler.GetFirstName]は、東部および南部の辺境の開拓を、ロマンあふれる事業であると同時に、帝国の安全保障に不可欠なものと見なしている。[ROOT.GetCountry.GetRuler.GetSheHe|U]はコサックや農民入植者をロシア辺境へ送り込んでその地に定着させるとともに、[GetGeographicRegion('geographic_region_siberia').GetName]の豊かな資源を開発したいと考えている。"
