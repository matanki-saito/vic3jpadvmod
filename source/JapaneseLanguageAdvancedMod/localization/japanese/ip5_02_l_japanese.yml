 je_tp_tsar_gendarme_of_europe_button_2_rev_prestige_tt:0 "#tooltippable;tooltip:[GetPlayer.GetTooltipTag],springtime_liberal_country_expanded_tt 自由主義の[Concept('concept_revolution','$concept_revolutionary|q$')]政府#!を擁する[Concept('concept_country','$concept_countries|q$')]の[concept_prestige]の合計が、[GetGeographicRegion('geographic_region_europe').GetName]の総[concept_prestige]の[ROOT.GetCountry.MakeScope.ScriptValue('je_tp_tsar_gendarme_of_europe_button_2_rev_prestige_requirement')|v0%]未満である#tooltippable;tooltip:[GetPlayer.GetTooltipTag],springtime_revolutionary_countries_list_tt  (現在[ROOT.Var('je_tp_tsar_gendarme_of_europe_button_2_cached_rev_prestige_ratio').GetValue|v0%]) #!"
