l_japanese:
 je_ukraine_cultural_renaissance:0 "ウクライナのルネサンス"
 je_ukraine_cultural_renaissance_reason:0 "ハイダマーカの蜂起を鎮圧した後、独立したウクライナ国家という夢は、これまでになく遠のいたように思われる。しかし、剣が失敗に終わった一方で、ウクライナの大義を擁護する者たちはペンを研ぎ澄ましている。自由主義的な時代精神に鼓舞された作家、詩人、ジャーナリストたちは、その夢を生かし続けるためなら投獄や追放の危険もいとわない。もしかすると、彼らならば再びその炎に火を灯すことができるのかもしれない。"
 je_ukraine_cultural_renaissance_hromada_info:0 "@information! このジャーナル記事が有効なあいだ、[ROOT.GetCountry.GetName]国内の[GetCulture('ukrainian').GetName]の[Concept('concept_homeland','$concept_homelands|q$')]に、[concept_hromada]結社が出現します。"
