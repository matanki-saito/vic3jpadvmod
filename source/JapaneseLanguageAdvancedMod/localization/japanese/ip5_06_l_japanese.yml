 culture_suppressed:0 "文化の抑圧"
 modifier_scaled_by_progress_bar:0 "補正の効果は、期限を迎えた時点の進捗ゲージの値に応じて決まる"
 je_belarus_cultural_renaissance:0 "ベラルーシのルネサンス"
 je_belarus_cultural_renaissance_reason:0 "かつてはポーランド・リトアニア共和国の臣民であり、のちにロシア帝国の臣民となった、「白ルーシ」と呼ばれる地の住民たちは、自らの文化的アイデンティティが脅かされていることを自覚している。だが、この激動の時代から、新しき何かが――自分たちの国を築かんとする野望が――生まれ出るかもしれない。"
 je_belarus_cultural_renaissance_trigger_poland:0 "#v $je_congress_poland$#!の[concept_journal_entry]は、#b 赤派#!の勝利で終結した"
 je_belarus_cultural_renaissance_map_fervor:0 "[GetCulture('byelorussian').GetName]の[concept_fervor] : [GetCulture('byelorussian').GetCurrentFervor|v0]"
 je_belarus_cultural_renaissance_map_homeland:0 "[ROOT.GetState.GetName]は[GetCulture('byelorussian').GetName]の[concept_homeland]である"
 je_belarus_cultural_renaissance_map_culture_percent:0 "[ROOT.GetState.GetName]の[Concept('concept_pop','$concept_pops|q$')]の[SCOPE.GetValue('byelorussian_culture_percent')|v0%]が[GetCulture('byelorussian').GetName]である"
 cultural_renaissances_events.1.t:0 "ルテニア最高評議会"
 cultural_renaissances_events.1.d:0 "[SCOPE.sState('src_state').GetCityHubName]において、[ROOT.GetCountry.GetName]内のウクライナ諸領地の統一と、ウクライナ語の使用および教育の拡大を推進する政治組織が結成された。"
 cultural_renaissances_events.1.f:0 "「この評議会が旗の色を発表してから一週間と経たぬうちに、市庁舎の塔に黄と青の旗が翻っているときた。奴らがこの件に無関係だなどと、本気で我々が信じると思っているのか？」\n\n「信じようと信じまいと、連中にはどうでもいいのだろう。奴らが我々に知らしめたいのは見てのとおり、奴らは今や黄と青の旗を持っているという事実なのだ」"
 cultural_renaissances_events.1.a:0 "彼らの要求を受け入れる。"
 cultural_renaissances_events.1.bb:0 "彼らの代表者と協力する。"
 cultural_renaissances_events.1.c:0 "これ以上の分離主義者など、我々には必要ない。"
 supreme_ruthenian_council:0 "ルテニア最高評議会"
 ruthenian_representatives:0 "ルテニア代表"
 cultural_renaissances_events.2.t:0 "聖キリル・メトディウス同胞団"
 cultural_renaissances_events.2.d:0 "キリル文字の創案者にちなんで名づけられた政治結社が、 [SCOPE.sState('boscam_state').GetCityHubName]で結成された。彼らは自由主義的改革、大衆教育、そして対等な関係に基づいた汎スラブ連合の一員としての独立ウクライナ国家を推進している。"
 cultural_renaissances_events.2.f:0 "「安らかなる大地、愛しの祖国、\nおお、我がウクライナよ！\n母なる国よ、なぜ奪われてしまったのか？\nなぜ、あなたは衰えゆくのか？」\n\n―タラス・シェフチェンコ、『#italic 暴かれた墓#!』"
 cultural_renaissances_events.2.a:0 "汎スラブ連合という構想は、検討に値する。"
 cultural_renaissances_events.2.b:0 "詩人の間に秘密はいらない！"
 cultural_renaissances_events.2.c:0 "彼らを逮捕し、ついでに彼らが読むものを書いた者も逮捕する。"
 cultural_renaissances_events.2.e:0 "そのような考えは撲滅しなければ。"
 brotherhood_of_saints_cyril_and_methodius:0 "聖キリル・メトディウス同胞団"
 ukrainophile_intelligentsia:0 "ウクライナ派知識人"
 cultural_renaissances_events.3.t:0 "フロマーダ"
 cultural_renaissances_events.3.d:0 "「フロマーダ」という社会団体のネットワークが[SCOPE.sState('hromada_state').GetCityHubName]で形成され、ウクライナ語の普及に取り組むほか、民俗や詩の研究も行っている。彼らは文化的な催しを開き、農民に学びのための教材を広めている。"
 cultural_renaissances_events.3.f:0 "「ウクライナの栄光と自由はいまだ滅びず、\n我らウクライナ人に、運命は再び微笑むだろう。\n我らの敵は、陽光の下の露のごとく消え去るだろう。\nおお、兄弟たちよ、我らもまた自らの祖国を治めるだろう」\n\n―パヴロ・チュビンスキー、『#italic ウクライナの栄光と自由はいまだ滅びず#!』"
 cultural_renaissances_events.3.a:0 "農民たちを彼らの言語で教育させろ。"
 cultural_renaissances_events.3.b:0 "不穏な反体制活動の疑いがある。監視しておけ。"
 cultural_renaissances_events.3.c:0 "奴らは明らかに法律を犯している！逮捕せよ。"
 cultural_renaissances_events.3.tt:0 "他のフロマーダも現れ、同じ扱いを受けることになる"
 hromada:0 "フロマーダ"
 cultural_renaissances_events.4.t:0 "プロスヴィタ"
 cultural_renaissances_events.4.d:0 "「プロスヴィタ」という教育組織が[SCOPE.sState('prosvita_state').GetCityHubName]で設立された。この組織は教育および経済面での支援を提供し、ウクライナ語と文化の普及を後押ししている。"
 cultural_renaissances_events.4.f:0 "「本を読みにここへ来て、仲間を見つける者もいる。仲間を求めてここへ来て、実は読書が性に合うと気づく者もいる。我々の目的はそのどちらか一方ではない。ここで我々が築いているものには、その両方が必要なのだ」"
 cultural_renaissances_events.4.a:0 "こうした取り組みこそ[ROOT.GetCountry.GetName]が支援すべきものだ！"
 cultural_renaissances_events.4.b:0 "彼らが資金を確保できるなら、我々はその取り組みを歓迎する。"
 cultural_renaissances_events.4.c:0 "この分離主義の温床を早急に排除しなければならない。"
 cultural_renaissances_events.4.tt:0 "他のプロスヴィタも現れ、同じ扱いを受けることになる"
 government_funded_prosvita:0 "政府の資金援助を受けるプロスヴィタ"
 self_funded_prosvita:0 "自主資金によるプロスヴィタ"
 cultural_renaissances_events.5.t:0 "農民礼賛"
 cultural_renaissances_events.5.d:0 "ポーランドとウクライナの知識人の間で、農民の文化や生活様式への関心が急速に高まっている。彼らはとりわけウクライナの農民と交流し、その文化を称賛している。"
 cultural_renaissances_events.5.f:0 "「人民！誰もが人民を愛し、人民に奉仕し、人民を代弁すると公言する。だが、実際にその只中へ出向き、彼らとともに生きようとする者はほとんどいない。旧来の知識人の多くは、農民と口をきいたことすらない。我々は違う。我々は素朴な人々とともに、素朴な暮らしを送る。我々は、人民を愛しているなどと口にする必要はない。人民の方が、そう語ってくれるのだから」"
 cultural_renaissances_events.5.a:0 "若者たちが文化や歴史に興味を持つようになったのは実に喜ばしい！"
 cultural_renaissances_events.5.b:0 "次は何だ？農民一揆でも再現するつもりか？"
 encouraged_chlopomania:0 "農民礼賛を奨励"
 discouraged_chlopomania:0 "農民礼賛を抑制"
 cultural_renaissances_events.6.t:0 "$peasants_truth$"
 cultural_renaissances_events.6.d:0 "[SCOPE.sCharacter('kalinowski_scope').GetFullName]は、ベラルーシ語で書かれた初の新聞を発行し始めた。反ツァーリの立場を取りながら、地元農民の窮状を訴えるものである。"
 cultural_renaissances_events.6.f:0 "「言語を選択すること自体がひとつのメッセージであり、それを印刷するために用いるラテン文字の選択もまたメッセージだ。それらが自ずと物語る以上、中身について言葉を濁す理由はない――善きツァーリの出現を願って農民が祈る時代は終わったのだ。そうだ、善きツァーリなど存在しえない。神は農民の側におられるのだから」"
 cultural_renaissances_events.6.a:0 "文字も読めぬ農民のために書くだと？憂慮するに及ばない。"
 cultural_renaissances_events.6.b:0 "この革命家どもを逮捕し、流刑に処せ。"
 cultural_renaissances_events.6.c:0 "この罪と過去の罪に対する罰は、死しかない。"
 peasants_truth:0 "農民の真実"
 cultural_renaissances_events.7.t:0 "$letters_from_gallows$"
 cultural_renaissances_events.7.d:0 "処刑を待つ身となったカストゥーシュ・カリノーウスキは、ベラルーシの民族主義者たちに[ROOT.GetCountry.GetAdjective]の支配へ抵抗するよう訴える、最後の2通の手紙を書き残した。その手紙は[SCOPE.sCountry('letters_publishing_country').GetCapital.GetCityHubName]で刊行され、故郷の支持者たちのもとに届いた。"
 cultural_renaissances_events.7.f:0 "「我が民よ、この最後の言葉を真心をもって聞いてほしい。死にゆく私が、ただ諸君のためを思い記したのだから。我が兄弟たちよ、人間は、その頭脳に理解と学識を備えるまで、地上で幸福に至ることは決してない。それらを得たときこそ、人は平等となり、豊かに暮らすことができる。そしてそのときにこそ、神の真理を祈り求め、天国に値する者となれる。己の知性と心を豊かにしてこそ、人は真に祖国を愛することができるのだ」\n\n―カストゥーシュ・カリノーウスキ、『#italic 絞首台の下からの手紙#!』"
 cultural_renaissances_events.7.a:0 "[SCOPE.sCountry('letters_publishing_country').GetName]から流入する刊行物には、より慎重にならねばならない。"
 cultural_renaissances_events.7.b:0 "これらの手紙を所持する者を逮捕せよ。"
 cultural_renaissances_events.7.c:0 "死人の言葉だ。その反響もすぐに消え去る。"
 letters_from_gallows:0 "絞首台の下からの手紙"
 cultural_renaissances_events.8.t:0 "ラチンカ"
 cultural_renaissances_events.8.d:0 "ベラルーシ語による文学作品の出版が増えるなか、一部の詩人や作家は、キリル文字ではなくラテン文字でベラルーシ語を書くようになっている。"
 cultural_renaissances_events.8.f:0 "「ルテニア語は何世紀にもわたり、ラテン文字で書かれてきました。私はただ、新たな標準の確立を手助けしようとしているだけです」\n\n「ほかの言語で作品を発表したことは？」\n\n「それ、何か関係があるんですか？」\n\n「質問に答えてください」\n\n「ポーランド語でなら」\n\n将校はメモを取った。"
 cultural_renaissances_events.8.a:0 "どちらの文字で記そうと、同じ言語だろう。"
 cultural_renaissances_events.8.b:0 "ラテン文字など政治的扇動の道具でしかない。禁止せよ。"
 latin_alphabet_permitted:0 "ラテン文字の使用を許可"
 latin_alphabet_banned:0 "ラテン文字の使用を禁止"
 cultural_renaissances_events.9.t:0 "ベラルーシ地方語辞典"
 cultural_renaissances_events.9.d:0 "[SCOPE.sState('belarusian_dictionary_state').GetCityHubName]大学の民族誌研究者が、現代ベラルーシ語の語彙と表現をまとめた辞典を出版した。この著作は、ロシア語の方言を記録する目的で作られたものだったが、ベラルーシ語が独自の言語と文化であることを示す例として掲げられるようになっている。"
 cultural_renaissances_events.9.f:0 "「死んだ言語の研究は、安全に進めていくこともできよう。だが、生きた言語の研究はそうはいかない。生き物が皆そうであるように、それは動き回り、研究者の思惑に従うことを拒む。そしてまた、生き物が皆そうであるように、そこには、失われてしまう何かがあるのだ」"
 cultural_renaissances_events.9.a:0 "[ROOT.GetCountry.GetName]各地の地方言語について、さらに研究を進めなければ！"
 cultural_renaissances_events.9.b:0 "研究者は、自らの結論をより慎重に表明しなければならない。"
 local_linguistics_research:0 "地方言語研究"
 restricted_linguistics_research:0 "言語研究の制限"
 cultural_renaissances_events.10.t:0 "$homan$"
 cultural_renaissances_events.10.d:0 "[SCOPE.sState('homan_state').GetCityHubName]に、ベラルーシ分離主義と革命的社会主義を掲げる新たな政治集団が現れた。その構成員たちは、自らの主張を唱える新聞をヘクトグラフを用いて密かに印刷し、配布している。"
 cultural_renaissances_events.10.f:0 "「とんだ誤解です。私は民話の収集家です。これらの作品が没収される原因になったという社会風刺なるものは、私にはさっぱり分かりません」\n\n「では、そのヘクトグラフは？」\n\n「民話をもっと印刷するためです。それだけですよ」"
 cultural_renaissances_events.10.a:0 "ベラルーシの独立に、革命は必要ない。"
 cultural_renaissances_events.10.b:0 "奴らの出版物と印刷機材を没収せよ。"
 cultural_renaissances_events.10.c:0 "奴らを全員見つけ出し、逮捕せよ！"
