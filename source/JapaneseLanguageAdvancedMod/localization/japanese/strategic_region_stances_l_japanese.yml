 stance_conquer_region_desc:0 "この$concept_strategic_region_stance_short$をとる[concept_country]は、この[Concept('concept_strategic_region','$concept_strategic_region_short|q$')]に領土的野心を抱き、勢力圏を広げようとします。"
 stance_protect_region_desc:0 "この$concept_strategic_region_stance_short$をとる[concept_country]は、[Concept('concept_strategic_region','$concept_strategic_region_short|q$')]の現状を維持し、[Concept('concept_local_country','$concept_local_countries|q$')]を[Concept('concept_rivalry','$concept_rivals|q$')]から守ります。"
 stance_colonize_region_desc:0 "この$concept_strategic_region_stance_short$をとる[concept_country]は、すでに存在する[Concept('concept_local_country','$concept_local_countries|q$')]を顧みず、この[Concept('concept_strategic_region','$concept_strategic_region_short|q$')]で植民地化を進めようとします。"
 stance_none_behavior:0 "$EFFECT_LIST_BULLET$[STRATEGIC_REGION.GetName]に特別な関心は示さない"
 stance_conquer_region_behavior:0 "$EFFECT_LIST_BULLET$[STRATEGIC_REGION.GetName]の[Concept('concept_local_country','$concept_local_countries|q$')]に野心の矛先を向ける\n$EFFECT_LIST_BULLET$[Concept('concept_local_country','$concept_local_countries|q$')]に対する[concept_attitude]が敵対的になる"
 stance_protect_region_behavior:0 "$EFFECT_LIST_BULLET$[STRATEGIC_REGION.GetName]の友好的な[Concept('concept_local_country','$concept_local_countries|q$')]に味方する\n$EFFECT_LIST_BULLET$[Concept('concept_local_country','$concept_local_countries|q$')]に対する[concept_attitude]がより好意的になる\n$EFFECT_LIST_BULLET$その地域で征服に乗り出そうとする[Concept('concept_rivalry','$concept_rivals|q$')]に対抗する"
 stance_colonize_region_behavior:0 "$EFFECT_LIST_BULLET$[STRATEGIC_REGION.GetName]の領有権が主張されていない土地に入植する\n$EFFECT_LIST_BULLET$その地域の[Concept('concept_unrecognized_power','$concept_unrecognized_power_short|q$')]である[Concept('concept_local_country','$concept_local_countries|q$')]に対して勢力拡大を図る"
