 russia_liberal_ideologies_list_tt:0 "#bold 自由主義#!の[Concept('concept_ideology','$concept_ideologies|q$')]には以下が含まれる : \n • [GetIdeology('ideology_republican_leader').GetName]\n • [GetIdeology('ideology_radical').GetName]\n • [GetIdeology('ideology_reformer').GetName]\n • [GetIdeology('ideology_abolitionist').GetName]\n • [GetIdeology('ideology_market_liberal').GetName]\n • [GetIdeology('ideology_liberal_leader').GetName]\n • [GetIdeology('ideology_feminist').GetName]\n • [GetIdeology('ideology_state_socialist').GetName]\n • [GetIdeology('ideology_humanitarian').GetName]\n • [GetIdeology('ideology_humanitarian_royalist').GetName]"
