 russian_government_popular_opposition:0 "革命派の反発"
 ip5_revolutions.1.t:0 "決起せよ！"
 ip5_revolutions.1.d:0 "妥協の道を探る最後の機会も、顧みられぬまま失われた。革命勢力は[ROOT.GetCountry.GetCapital.GetCityHubName]を掌握し、[SCOPE.sCharacter('deposed_tsar').GetFullName]は自らの側近たちに拘束された。[ROOT.GetCountry.GetName]全土では、軍の部隊や地方長官が相次いで革命側につくことを表明している。"
 ip5_revolutions.1.f:0 "「陛下も貴殿も、ここで何が起きているのかを理解しておられないのは明らかです。極めて恐ろしい革命が勃発したのであり、これを鎮めるのは容易ではないでしょう…国民を納得させうる譲歩が直ちになされないかぎりは…民衆の感情はもはや抑えることなどほぼ不可能なほどに燃え上がり、兵は完全に士気を失っています。命令に背くばかりか、自らの将校たちを殺しているのです…お伝えしておかねばなりませんが、お考えになっていた方策ではもはや足りず、王朝の存廃そのものが正面から問われる事態に至っているのです」\n\n―ミハイル・ロジャンコ"
 ip5_revolutions.1.a:0 "幾世紀もの積み重ねが、音を立てて崩れ落ちる…"
 ip5_revolutions.2.t:0 "革命の亡霊"
 ip5_revolutions.2.d:0 "巷にひとつの言葉が流れている。声高に、あるいは密やかに囁かれる言葉。それを耳にすれば、最も打ちひしがれた者の胸にさえ希望の火花を灯す言葉――#italic 革命#!。"
 ip5_revolutions.2.f:0 "革命は、人によって様々な意味を持つ。赤い旗を翻しながら現れることもあれば、王冠を戴いて現れることもある。だが、革命を突き動かす信条が何であれ、絶対に変わらぬことがひとつある――革命とは、権力の手綱を握る者に抗う闘いなのだ。[ROOT.GetCountry.GetNameNoFormatting]がいかなる国であろうと、[ROOT.GetCountry.GetNameNoFormatting]が自らをどう形づくろうと、それに敵対する革命は必ず現れる。"
 ip5_revolutions.2.a:0 "革命だと？よりにもよって、この#italic [ROOT.GetCountry.GetNameNoFormatting]#!で？"
 russian_revolution_radicalism:0 "革命の囁き"
 russian_revolution_radicalism_tt:0 "ロシアの統治イデオロギーの#bold 定着度#!が高まるほど、主要な対立勢力への支持と活動が強まる。"
 rcw.102.t:0 "旧体制の終焉"
 rcw.102.d:0 "旧政権が一掃された今、[SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetName]も時代遅れの組織として解体すべきだという声が高まっている。もっとも、将来新たな勢力ブロックを結成することになっても、これまでの経験を活かせば、そうした組織を築くのははるかに容易になるだろう。"
 rcw.102.f:0 "「過去と決別し、新たな体制を築こうというのに、なぜ[SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetNameNoFormatting]を存続させる必要がある？確かに、一部の加盟国との関係は維持したほうが得策だ。だが、旧体制の名残をいつまでも抱えておくつもりはない」"
 rcw.102.a:0 "[SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetName]は解体すべきだ。"
 refund_mandates_tooltip:0 "権限の一部が戻り、次に勢力ブロックを結成する際に再利用できる。"
 russian_mandates_refund:0 "旧体制で得た経験"
 rcw.102.b:0 "何を言う！今ほど[SCOPE.GetRootScope.GetCountry.GetPowerBloc.GetName]が必要なときはない！"
 provisional_government_name_tt:0 "#v $je_russia_provisional_government$#!の[concept_journal_entry]が進行しているあいだ、#v $RUS$#!の国名は#v $dyn_c_russian_provisional_government$#!となる"
 provisional_government_popular_opposition:0 "民衆の反発"
