l_japanese:
 je_russian_revolution:0 "ロシア革命"
 je_russian_revolution_reason:0 "幾世紀ものあいだ、[ROOT.GetCountry.GetName]の統治者たちは#b 革命#!の影に怯え続けてきた。彼らが容赦なく推し進めてきた弾圧は、[ROOT.GetCountry.GetAdjectiveNoFormatting]社会の隅々にまで凄まじい圧力を蓄積させることとなった。ひとたびその抑圧のたがが外れ、[ROOT.GetCountry.GetNameNoFormatting]で#b 革命#!が勃発すれば、解き放たれた力は、かつて誰も想像しえなかったほどの大破局をもたらすかもしれない。\n\n@information! [concept_revolution]は常に国家の[concept_ideology]に対抗する。国家のイデオロギーは、その[Concept('concept_country','$concept_country_possessive|q$')]の現在の政治情勢、[concept_ruler]のイデオロギー、そして歴代[Concept('concept_government','$concept_governments|q$')]が積み重ねてきた$concept_ideologies$によって決定される。たとえ現在の$concept_government$が性質を急激に変えたとしても、革命家たちの記憶には、かつてのイデオロギーが慣性のように残り続ける。\n\n革命家たちは常に、[ROOT.GetCountry.GetName]およびその$concept_government$の$concept_ideology$ではない、最も強力なイデオロギーの陣営に属する。革命家たちと立場を同じくする[concept_political_movement]のいずれかが全面的な反乱へと発展したとき、その$concept_revolution$こそが#italic 真の#!革命となるのだ。"
 je_russian_revolution_revolution_header:0 "#title 以下の場合、革命家たちは政府を打倒する : \n#!"
 je_russian_revolution_revolution_conclusion_desc:0 "この$concept_journal_entry$は、#b 革命家たち#!が政府を打倒して幕を閉じた"
 russia_is_conservative:0 "ロシアが#tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_conservative_ideologies_list_tt 保守主義#!である$russian_alignment_shares$。\n定着度によって[SelectLocalization(ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').IsSet,ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').GetPoliticalMovement.GetName,'主要な対立勢力の活動')]が#tooltippable;tooltip:[GetPlayer.GetTooltipTag],russian_conservative_inertia_tt [ROOT.GetCountry.MakeScope.ScriptValue('russian_revolution_radicalism_value')|%0v]#!強化される。"
 russia_is_liberal:0 "ロシアが#tooltippable;tooltip:[GetPlayer.GetTooltipTag],russia_liberal_ideologies_list_tt 自由主義#!である$russian_alignment_shares$。\n定着度によって[SelectLocalization(ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').IsSet,ROOT.GetCountry.MakeScope.Var('russian_government_popular_opposition_var').GetPoliticalMovement.GetName,'主要な対立勢力の活動')]が#tooltippable;tooltip:[GetPlayer.GetTooltipTag],russian_liberal_inertia_tt [ROOT.GetCountry.MakeScope.ScriptValue('russian_revolution_radicalism_value')|%0v]#!強化される。"
